# feedbin - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  feedbin:
    image: alpine:3.20
    container_name: feedbin
    restart: unless-stopped
    ports:
      - "20067:20067"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20067 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=feedbin"
    #   - "homepage.description=Web-based feed reader; social features and excellent filtering capabilities."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=feedbin.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20067"
    #   - "homepage.server=localhost"

networks:
  default:
    name: feedbin_net
