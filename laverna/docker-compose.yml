# laverna - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  laverna:
    image: alpine:3.20
    container_name: laverna
    restart: unless-stopped
    ports:
      - "20137:20137"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20137 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=laverna"
    #   - "homepage.description=Open source alternative to Evernote; JavaScript-based note app."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=laverna.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20137"
    #   - "homepage.server=localhost"

networks:
  default:
    name: laverna_net
