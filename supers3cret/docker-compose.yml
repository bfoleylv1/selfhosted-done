# supers3cret - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  supers3cret:
    image: alpine:3.20
    container_name: supers3cret
    restart: unless-stopped
    ports:
      - "20311:20311"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20311 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=supers3cret"
    #   - "homepage.description=Self-hosted service."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=supers3cret.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20311"
    #   - "homepage.server=localhost"

networks:
  default:
    name: supers3cret_net
