# alfresco - docker compose (single host)
# image verified to exist at generation time: alfresco/alfresco-content-repository-community:latest

services:
  alfresco:
    image: alfresco/alfresco-content-repository-community:latest
    container_name: alfresco
    restart: unless-stopped
    ports:
      - "20408:20408"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20408 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=alfresco"
    #   - "homepage.description=Alfresco self-hosted service."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=alfresco.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20408"
    #   - "homepage.server=localhost"

networks:
  default:
    name: alfresco_net
