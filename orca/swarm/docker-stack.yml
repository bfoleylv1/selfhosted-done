# orca - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml orca
# image verified to exist at generation time: orca/os:latest

services:
  orca:
    # image: orca/os:latest  # UNVERIFIED
    ports:
      - target: 20490
        published: 20490
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - orca_config:/config
      - orca_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20490 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=orca"
    #   - "homepage.description=orca self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=orca.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20490"
    #   - "homepage.server=localhost"

volumes:
  orca_config:
  orca_data:

networks:
  default:
    name: orca_net
    driver: overlay
    attachable: true
