# zk-cloudserver - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  zk-cloudserver:
    image: alpine:3.20
    container_name: zk-cloudserver
    restart: unless-stopped
    ports:
      - "20388:20388"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20388 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zk-cloudserver"
    #   - "homepage.description=Self-hosted service."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zk-cloudserver.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20388"
    #   - "homepage.server=localhost"

networks:
  default:
    name: zk-cloudserver_net
