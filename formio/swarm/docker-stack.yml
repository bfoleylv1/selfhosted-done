# formio - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml formio
# image verified to exist at generation time: formio/formio:latest

services:
  formio:
    image: formio/formio:latest
    ports:
      - target: 3001
        published: 3001
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - formio_config:/config
      - formio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=formio"
    #   - "homepage.description=Form and API platform for building data-driven forms and apps.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=formio.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:3001"
    #   - "homepage.server=localhost"

volumes:
  formio_config:
  formio_data:

networks:
  default:
    name: formio_net
    driver: overlay
    attachable: true
