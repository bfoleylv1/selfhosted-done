# formio - docker compose (single host)
# image verified to exist at generation time: formio/formio:latest

services:
  formio:
    image: formio/formio:latest
    container_name: formio
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=formio"
    #   - "homepage.description=Form and API platform for building data-driven forms and apps."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=formio.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:3001"
    #   - "homepage.server=localhost"

networks:
  default:
    name: formio_net
