# 92five - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  92five:
    image: php:8.2-apache
    container_name: 92five
    restart: unless-stopped
    ports:
      - "20393:20393"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20393 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=92five"
    #   - "homepage.description=Self-hosted project management and collaboration tool."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=92five.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20393"
    #   - "homepage.server=localhost"

networks:
  default:
    name: 92five_net
