# 92five - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml 92five
# image verified to exist at generation time: php:8.2-apache

services:
  92five:
    image: php:8.2-apache
    ports:
      - target: 20393
        published: 20393
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - 92five_config:/config
      - 92five_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20393 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=92five"
    #   - "homepage.description=Self-hosted project management and collaboration tool.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=92five.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20393"
    #   - "homepage.server=localhost"

volumes:
  92five_config:
  92five_data:

networks:
  default:
    name: 92five_net
    driver: overlay
    attachable: true
