# oidc-proxy - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml oidc-proxy
# image verified to exist at generation time: quay.io/oauth2-proxy/oauth2-proxy:latest

services:
  oidc-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    ports:
      - target: 4180
        published: 4180
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - oidc-proxy_config:/config
      - oidc-proxy_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4180 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=oidc-proxy"
    #   - "homepage.description=Single sign-on solution for legacy applications using OAuth2/OIDC."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=oidc-proxy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:4180"
    #   - "homepage.server=localhost"

volumes:
  oidc-proxy_config:
  oidc-proxy_data:

networks:
  default:
    name: oidc-proxy_net
    driver: overlay
    attachable: true
