# syncthing - docker compose (single host)
# image verified to exist at generation time: linuxserver/syncthing:latest

services:
  syncthing:
    image: linuxserver/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    ports:
      - "8384:8384"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8384/ || wget -qO- http://127.0.0.1:8384/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=syncthing"
    #   - "homepage.description=Continuous file synchronization; peer-to-peer sync without central server.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=syncthing.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8384"
    #   - "homepage.server=localhost"

networks:
  default:
    name: syncthing_net
