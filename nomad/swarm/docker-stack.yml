# nomad - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml nomad
# image verified to exist at generation time: hashicorp/nomad:latest

services:
  nomad:
    image: hashicorp/nomad:latest
    ports:
      - target: 4646
        published: 4646
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - nomad_config:/config
      - nomad_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4646/v1/agent/health || wget -qO- http://127.0.0.1:4646/v1/agent/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=nomad"
    #   - "homepage.description=Workload orchestrator; schedule and run containers and VMs.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=nomad.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:4646"
    #   - "homepage.server=localhost"

volumes:
  nomad_config:
  nomad_data:

networks:
  default:
    name: nomad_net
    driver: overlay
    attachable: true
