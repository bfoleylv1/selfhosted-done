# nomad - docker compose (single host)
# image verified to exist at generation time: hashicorp/nomad:latest

services:
  nomad:
    image: hashicorp/nomad:latest
    container_name: nomad
    restart: unless-stopped
    ports:
      - "4646:4646"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4646/v1/agent/health || wget -qO- http://127.0.0.1:4646/v1/agent/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=nomad"
    #   - "homepage.description=Workload orchestrator; schedule and run containers and VMs."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=nomad.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:4646"
    #   - "homepage.server=localhost"

networks:
  default:
    name: nomad_net
