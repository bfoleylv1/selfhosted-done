# joomla - docker compose (single host)
# image verified to exist at generation time: joomla:latest

services:
  joomla:
    image: joomla:latest
    container_name: joomla
    restart: unless-stopped
    ports:
      - "20120:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=joomla"
    #   - "homepage.description=Open-source CMS; easy to use with extensions.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=joomla.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20120"
    #   - "homepage.server=localhost"

networks:
  default:
    name: joomla_net
