services:
  affine-ce:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine-ce
    restart: unless-stopped
    ports:
    - 20407:20407
    environment:
    - TZ=${TZ:-America/Los_Angeles}
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    volumes:
    - ./config:/config
    - ./data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 20407 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
networks:
  default:
    name: affine-ce_net
