# umami - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml umami
# image verified to exist at generation time: ghcr.io/umami-software/umami:postgresql-latest

services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - target: 3000
        published: 20342
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - umami_config:/config
      - umami_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=umami"
    #   - "homepage.description=umami self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=umami.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20342"
    #   - "homepage.server=localhost"

volumes:
  umami_config:
  umami_data:

networks:
  default:
    name: umami_net
    driver: overlay
    attachable: true
