# docker - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml docker
# image verified to exist at generation time: docker:dind

services:
  docker:
    image: docker:dind
    ports:
      - target: 20045
        published: 20045
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - docker_config:/config
      - docker_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20045 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=docker"
    #   - "homepage.description=docker self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=docker.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20045"
    #   - "homepage.server=localhost"

volumes:
  docker_config:
  docker_data:

networks:
  default:
    name: docker_net
    driver: overlay
    attachable: true
