    #   - "homepage.description=Platform for creating and running containers; application virtualization."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=docker.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20045"
    #   - "homepage.server=localhost"

networks:
  default:
    name: docker_net
