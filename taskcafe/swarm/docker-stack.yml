# taskcafe - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml taskcafe
# image verified to exist at generation time: taskcafe/taskcafe:latest

services:
  taskcafe:
    image: taskcafe/taskcafe:latest
    ports:
      - target: 3333
        published: 3333
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - taskcafe_config:/config
      - taskcafe_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3333 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=taskcafe"
    #   - "homepage.description=taskcafe self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=taskcafe.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:3333"
    #   - "homepage.server=localhost"

volumes:
  taskcafe_config:
  taskcafe_data:

networks:
  default:
    name: taskcafe_net
    driver: overlay
    attachable: true
