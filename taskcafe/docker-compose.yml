# taskcafe - docker compose (single host)
# image verified to exist at generation time: taskcafe/taskcafe:latest

services:
  taskcafe:
    image: taskcafe/taskcafe:latest
    container_name: taskcafe
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3333 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=taskcafe"
    #   - "homepage.description=Self-hosted task management; simple and easy to use."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=taskcafe.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:3333"
    #   - "homepage.server=localhost"

networks:
  default:
    name: taskcafe_net
