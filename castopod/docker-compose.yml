# castopod - docker compose (single host)
# image verified to exist at generation time: castopod/castopod:latest

services:
  castopod:
    image: castopod/castopod:latest
    container_name: castopod
    restart: unless-stopped
    ports:
      - "20024:8000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - NVIDIA_DRIVER_CAPABILITIES=all
      # - LIBVA_DRIVER_NAME=iHD            # Intel iGPU VAAPI/QSV
      # - VAAPI_DRIVER=iHD
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ || wget -qO- http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - render
    #   - video
    # runtime: nvidia
    # labels:
    #   - "homepage.group=Self Hosted"
