# castopod - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml castopod
# image verified to exist at generation time: castopod/castopod:latest

services:
  castopod:
    image: castopod/castopod:latest
    ports:
      - target: 8000
        published: 20024
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - NVIDIA_DRIVER_CAPABILITIES=all
      # - LIBVA_DRIVER_NAME=iHD            # Intel iGPU VAAPI/QSV
      # - VAAPI_DRIVER=iHD
    volumes:
      - castopod_config:/config
      - castopod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ || wget -qO- http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
          # - node.role == manager
          # GPU: add node-generic-resources to daemon.json and:
          #   - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
      # GPU: swarm ignores `devices:`/`runtime:`. Declare in
      #   /etc/docker/daemon.json: "node-generic-resources": ["gpu=1"]
      #   then use deploy.resources.reservations.generic_resources.
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=castopod"
    #   - "homepage.description=Self-hosted podcast hosting platform with ActivityPub federation."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=castopod.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20024"
    #   - "homepage.server=localhost"

volumes:
  castopod_config:
  castopod_data:

networks:
  default:
    name: castopod_net
    driver: overlay
    attachable: true
