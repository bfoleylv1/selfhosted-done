# gitea - docker compose (single host)
# image verified to exist at generation time: gitea/gitea:latest

services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    ports:
      - "20090:3000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=gitea"
    #   - "homepage.description=Lightweight Git service; alternative to GitHub/GitLab."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=gitea.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20090"
    #   - "homepage.server=localhost"

networks:
  default:
    name: gitea_net
