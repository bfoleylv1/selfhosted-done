# speed-test - docker compose (single host)
# image verified to exist at generation time: openspeedtest/latest:latest

services:
  speed-test:
    image: openspeedtest/latest:latest
    container_name: speed-test
    restart: unless-stopped
    ports:
      - "20291:20291"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20291 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=speed-test"
    #   - "homepage.description=Self-hosted network speed-test server.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=speed-test.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20291"
    #   - "homepage.server=localhost"

networks:
  default:
    name: speed-test_net
