# writer-computer - docker compose (single host)
# image verified to exist at generation time: writer-computer/writer:latest

services:
  writer-computer:
    # image: writer-computer/writer:latest  # UNVERIFIED
    container_name: writer-computer
    restart: unless-stopped
    ports:
      - "20524:20524"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20524 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=writer-computer"
    #   - "homepage.description=writer-computer self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=writer-computer.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20524"
    #   - "homepage.server=localhost"

networks:
  default:
    name: writer-computer_net
