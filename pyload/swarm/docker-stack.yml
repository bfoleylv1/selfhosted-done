# pyload - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml pyload
# image verified to exist at generation time: linuxserver/pyload:latest

services:
  pyload:
    image: linuxserver/pyload:latest
    ports:
      - target: 20497
        published: 20497
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - pyload_config:/config
      - pyload_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20497 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pyload"
    #   - "homepage.description=pyload self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pyload.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20497"
    #   - "homepage.server=localhost"

volumes:
  pyload_config:
  pyload_data:

networks:
  default:
    name: pyload_net
    driver: overlay
    attachable: true
