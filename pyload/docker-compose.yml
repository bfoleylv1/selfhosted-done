# pyload - docker compose (single host)
# image verified to exist at generation time: linuxserver/pyload:latest

services:
  pyload:
    image: linuxserver/pyload:latest
    container_name: pyload
    restart: unless-stopped
    ports:
      - "20497:20497"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20497 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pyload"
    #   - "homepage.description=pyload self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pyload.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20497"
    #   - "homepage.server=localhost"

networks:
  default:
    name: pyload_net
