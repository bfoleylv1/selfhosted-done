# tiramisu - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml tiramisu
# image verified to exist at generation time: tira/tira:latest

services:
  tiramisu:
    # image: tira/tira:latest  # UNVERIFIED
    ports:
      - target: 20549
        published: 20549
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - tiramisu_config:/config
      - tiramisu_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20549 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tiramisu"
    #   - "homepage.description=tiramisu self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tiramisu.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20549"
    #   - "homepage.server=localhost"

volumes:
  tiramisu_config:
  tiramisu_data:

networks:
  default:
    name: tiramisu_net
    driver: overlay
    attachable: true
