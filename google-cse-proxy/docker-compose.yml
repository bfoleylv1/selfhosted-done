# google-cse-proxy - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  google-cse-proxy:
    image: node:20-alpine
    container_name: google-cse-proxy
    restart: unless-stopped
    ports:
      - "20100:20100"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20100 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=google-cse-proxy"
    #   - "homepage.description=google-cse-proxy self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=google-cse-proxy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20100"
    #   - "homepage.server=localhost"

networks:
  default:
    name: google-cse-proxy_net
