# conduit - docker compose (single host)
# image verified to exist at generation time: matrixconduit/matrix-conduit:latest

services:
  conduit:
    image: matrixconduit/matrix-conduit:latest
    container_name: conduit
    restart: unless-stopped
    ports:
      - "6167:6167"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6167 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=conduit"
    #   - "homepage.description=conduit self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=conduit.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:6167"
    #   - "homepage.server=localhost"

networks:
  default:
    name: conduit_net
