# conduit - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml conduit
# image verified to exist at generation time: matrixconduit/matrix-conduit:latest

services:
  conduit:
    image: matrixconduit/matrix-conduit:latest
    ports:
      - target: 6167
        published: 6167
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - conduit_config:/config
      - conduit_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6167 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=conduit"
    #   - "homepage.description=conduit self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=conduit.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:6167"
    #   - "homepage.server=localhost"

volumes:
  conduit_config:
  conduit_data:

networks:
  default:
    name: conduit_net
    driver: overlay
    attachable: true
