# streamlink - docker compose (single host)
# image verified to exist at generation time: python:3.11-slim

services:
  streamlink:
    image: python:3.11-slim
    container_name: streamlink
    restart: unless-stopped
    ports:
      - "20305:20305"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20305 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=streamlink"
    #   - "homepage.description=Command-line utility to extract streams from various services."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=streamlink.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20305"
    #   - "homepage.server=localhost"

networks:
  default:
    name: streamlink_net
