# streamlink - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml streamlink
# image verified to exist at generation time: python:3.11-slim

services:
  streamlink:
    image: python:3.11-slim
    ports:
      - target: 20305
        published: 20305
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - streamlink_config:/config
      - streamlink_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20305 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=streamlink"
    #   - "homepage.description=Command-line utility to extract streams from various services."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=streamlink.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20305"
    #   - "homepage.server=localhost"

volumes:
  streamlink_config:
  streamlink_data:

networks:
  default:
    name: streamlink_net
    driver: overlay
    attachable: true
