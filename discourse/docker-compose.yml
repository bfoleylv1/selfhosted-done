# discourse - docker compose (single host)
# image verified to exist at generation time: discourse/discourse:latest

services:
  discourse:
    image: discourse/discourse:latest
    container_name: discourse
    restart: unless-stopped
    ports:
      - "20436:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=discourse"
    #   - "homepage.description=Discourse: open-source modern forum and community discussion platform."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=discourse.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20436"
    #   - "homepage.server=localhost"

networks:
  default:
    name: discourse_net
