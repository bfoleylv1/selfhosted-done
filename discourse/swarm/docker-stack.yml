# discourse - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml discourse
# image verified to exist at generation time: discourse/discourse:latest

services:
  discourse:
    image: discourse/discourse:latest
    ports:
      - target: 80
        published: 20436
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - discourse_config:/config
      - discourse_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=discourse"
    #   - "homepage.description=Discourse: open-source modern forum and community discussion platform."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=discourse.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20436"
    #   - "homepage.server=localhost"

volumes:
  discourse_config:
  discourse_data:

networks:
  default:
    name: discourse_net
    driver: overlay
    attachable: true
