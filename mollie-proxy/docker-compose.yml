# mollie-proxy - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  mollie-proxy:
    image: node:20-alpine
    container_name: mollie-proxy
    restart: unless-stopped
    ports:
      - "20160:20160"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20160 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mollie-proxy"
    #   - "homepage.description=mollie-proxy self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mollie-proxy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20160"
    #   - "homepage.server=localhost"

networks:
  default:
    name: mollie-proxy_net
