# semantic-scholar - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml semantic-scholar
# image verified to exist at generation time: python:3.11-slim

services:
  semantic-scholar:
    image: python:3.11-slim
    ports:
      - target: 20269
        published: 20269
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - semantic-scholar_config:/config
      - semantic-scholar_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20269 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=semantic-scholar"
    #   - "homepage.description=AI-powered research tool; academic paper search."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=semantic-scholar.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20269"
    #   - "homepage.server=localhost"

volumes:
  semantic-scholar_config:
  semantic-scholar_data:

networks:
  default:
    name: semantic-scholar_net
    driver: overlay
    attachable: true
