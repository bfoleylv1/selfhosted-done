# semantic-scholar - docker compose (single host)
# image verified to exist at generation time: python:3.11-slim

services:
  semantic-scholar:
    image: python:3.11-slim
    container_name: semantic-scholar
    restart: unless-stopped
    ports:
      - "20269:20269"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20269 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=semantic-scholar"
    #   - "homepage.description=AI-powered research tool; academic paper search.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=semantic-scholar.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20269"
    #   - "homepage.server=localhost"

networks:
  default:
    name: semantic-scholar_net
