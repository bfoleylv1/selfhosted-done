# xwiki - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: xwiki:stable-mariadb-tomcat
    container_name: app-xwiki
    depends_on:
      db:
        condition: service_started
    environment:
    - XWIKI_VERSION=18.2.1
    - DB_USER=xwiki
    - DB_PASSWORD=xwiki
    - DB_DATABASE=xwiki
    - DB_HOST=db-xwiki
    volumes:
    - ./xwiki-data/xwiki:/usr/local/xwiki
    restart: always
    ports:
    - 20616:80
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  db:
    image: mariadb:12
    container_name: db-xwiki
    volumes:
    - ./xwiki-data/mariadb:/var/lib/mysql
    - type: bind
      source: ./init.sql
      target: /docker-entrypoint-initdb.d/init.sql
    environment:
    - MARIADB_ROOT_PASSWORD=xwiki
    - MARIADB_USER=xwiki
    - MARIADB_PASSWORD=xwiki
    - MARIADB_DATABASE=xwiki
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_bin
    - --explicit-defaults-for-timestamp=1
    restart: always
