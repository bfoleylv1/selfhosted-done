# actual-budget - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: docker.io/actualbudget/actual-server:latest
    container_name: app-actual-budget
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - ./actual-budget-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - node src/scripts/health-check.js
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
    ports:
    - 5006:5006
