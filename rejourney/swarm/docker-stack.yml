# rejourney - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml rejourney
# image verified to exist at generation time: rejourney/rejourney:latest

services:
  rejourney:
    # image: rejourney/rejourney:latest  # UNVERIFIED
    ports:
      - target: 20545
        published: 20545
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - rejourney_config:/config
      - rejourney_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20545 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rejourney"
    #   - "homepage.description=rejourney self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rejourney.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20545"
    #   - "homepage.server=localhost"

volumes:
  rejourney_config:
  rejourney_data:

networks:
  default:
    name: rejourney_net
    driver: overlay
    attachable: true
