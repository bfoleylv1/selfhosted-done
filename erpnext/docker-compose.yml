# erpnext - docker compose (single host)
# image verified to exist at generation time: frappe/erpnext:latest

services:
  erpnext:
    image: frappe/erpnext:latest
    container_name: erpnext
    restart: unless-stopped
    ports:
      - "20063:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=erpnext"
    #   - "homepage.description=Open source ERP; built on Frappe framework for business management."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=erpnext.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20063"
    #   - "homepage.server=localhost"

networks:
  default:
    name: erpnext_net
