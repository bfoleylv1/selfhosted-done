# erpnext - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml erpnext
# image verified to exist at generation time: frappe/erpnext:latest

services:
  erpnext:
    image: frappe/erpnext:latest
    ports:
      - target: 80
        published: 20063
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - erpnext_config:/config
      - erpnext_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=erpnext"
    #   - "homepage.description=Open source ERP; built on Frappe framework for business management."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=erpnext.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20063"
    #   - "homepage.server=localhost"

volumes:
  erpnext_config:
  erpnext_data:

networks:
  default:
    name: erpnext_net
    driver: overlay
    attachable: true
