# gokapi - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: f0rc3/gokapi:latest
    container_name: app-gokapi
    environment:
    - TZ=America/Los_Angeles
    volumes:
    - ./gokapi-data/gokapi-data:/app/data
    - ./gokapi-data/gokapi-config:/app/config
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - gokapi
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 53842:53842
