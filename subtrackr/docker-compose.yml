# subtrackr - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: ghcr.io/bscott/subtrackr:latest
    container_name: app-subtrackr
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    - GIN_MODE=release
    - DATABASE_PATH=/app/data/subtrackr.db
    volumes:
    - ./subtrackr-data/data:/app/data
    restart: always
    ports:
    - 20610:8080
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/ || wget -qO- http://127.0.0.1:8080/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
