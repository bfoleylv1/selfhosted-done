# subtrackr - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml subtrackr
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: ghcr.io/bscott/subtrackr:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    - GIN_MODE=release
    - DATABASE_PATH=/app/data/subtrackr.db
    volumes:
    - subtrackr_subtrackr_data_data:/app/data
    ports:
    - target: 8080
      published: 20610
      protocol: tcp
      mode: ingress
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/ || wget -qO- http://127.0.0.1:8080/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=subtrackr"
    #   - "homepage.description=subtrackr self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=subtrackr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20610"
    #   - "homepage.server=localhost"
volumes:
  subtrackr_subtrackr_data_data: null
networks:
  default:
    name: subtrackr_net
    driver: overlay
    attachable: true
