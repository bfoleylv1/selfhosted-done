# zerotier - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml zerotier
# image verified to exist at generation time: zerotier/zerotier:latest

services:
  zerotier:
    image: zerotier/zerotier:latest
    ports:
      - target: 9993
        published: 9993
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - zerotier_config:/config
      - zerotier_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9993 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zerotier"
    #   - "homepage.description=Smart networking platform; SD-WAN and SDN capabilities."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zerotier.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9993"
    #   - "homepage.server=localhost"

volumes:
  zerotier_config:
  zerotier_data:

networks:
  default:
    name: zerotier_net
    driver: overlay
    attachable: true
