# zerotier - docker compose (single host)
# image verified to exist at generation time: zerotier/zerotier:latest

services:
  zerotier:
    image: zerotier/zerotier:latest
    container_name: zerotier
    restart: unless-stopped
    ports:
      - "9993:9993"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9993 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zerotier"
    #   - "homepage.description=Smart networking platform; SD-WAN and SDN capabilities."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zerotier.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9993"
    #   - "homepage.server=localhost"

networks:
  default:
    name: zerotier_net
