# certbot - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml certbot
# image verified to exist at generation time: certbot/certbot:latest

services:
  certbot:
    image: certbot/certbot:latest
    ports:
      - target: 20026
        published: 20026
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - certbot_config:/config
      - certbot_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20026 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=certbot"
    #   - "homepage.description=Let's Encrypt client; automatic certificate management."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=certbot.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20026"
    #   - "homepage.server=localhost"

volumes:
  certbot_config:
  certbot_data:

networks:
  default:
    name: certbot_net
    driver: overlay
    attachable: true
