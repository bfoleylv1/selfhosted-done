# certbot - docker compose (single host)
# image verified to exist at generation time: certbot/certbot:latest

services:
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped
    ports:
      - "20026:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Security"
    #   - "homepage.name=certbot"
    #   - "homepage.description=Let's Encrypt client; automatic certificate management."
    #   - "homepage.tags=Security,Encryption"
    #   - "homepage.icon=certbot.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20026"
    #   - "homepage.server=localhost"

networks:
  default:
    name: certbot_net
