# browserstack-turboscale - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  browserstack-turboscale:
    image: alpine:3.20
    container_name: browserstack-turboscale
    restart: unless-stopped
    ports:
      - "20019:20019"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20019 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=browserstack-turboscale"
    #   - "homepage.description=BrowserStack TurboScale - self-hosted device testing infrastructure (commercial)."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=browserstack-turboscale.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20019"
    #   - "homepage.server=localhost"

networks:
  default:
    name: browserstack-turboscale_net
