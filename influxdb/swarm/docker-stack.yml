# influxdb - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml influxdb
# image verified to exist at generation time: influxdb:2

services:
  influxdb:
    image: influxdb:2
    ports:
      - target: 8086
        published: 8086
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - influxdb_config:/config
      - influxdb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8086/health || wget -qO- http://127.0.0.1:8086/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=influxdb"
    #   - "homepage.description=Time-series database optimized for metrics, events, and real-time analytics."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=influxdb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8086"
    #   - "homepage.server=localhost"

volumes:
  influxdb_config:
  influxdb_data:

networks:
  default:
    name: influxdb_net
    driver: overlay
    attachable: true
