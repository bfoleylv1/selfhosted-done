# lesspass - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml lesspass
# image verified to exist at generation time: node:20-alpine

services:
  lesspass:
    image: node:20-alpine
    ports:
      - target: 20138
        published: 20138
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - lesspass_config:/config
      - lesspass_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20138 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=lesspass"
    #   - "homepage.description=Generate passwords from master password; deterministic password generator."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=lesspass.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20138"
    #   - "homepage.server=localhost"

volumes:
  lesspass_config:
  lesspass_data:

networks:
  default:
    name: lesspass_net
    driver: overlay
    attachable: true
