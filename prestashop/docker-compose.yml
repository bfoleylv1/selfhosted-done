# prestashop - docker compose (single host)
# image verified to exist at generation time: prestashop/prestashop:latest

services:
  prestashop:
    image: prestashop/prestashop:latest
    container_name: prestashop
    restart: unless-stopped
    ports:
      - "20218:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=prestashop"
    #   - "homepage.description=Free open-source e-commerce solution; customizable online store."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=prestashop.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20218"
    #   - "homepage.server=localhost"

networks:
  default:
    name: prestashop_net
