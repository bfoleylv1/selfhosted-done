# phorge - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  phorge:
    image: php:8.2-apache
    container_name: phorge
    restart: unless-stopped
    ports:
      - "20202:20202"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20202 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=phorge"
    #   - "homepage.description=Open-source project management and collaboration platform (Phabricator fork).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=phorge.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20202"
    #   - "homepage.server=localhost"

networks:
  default:
    name: phorge_net
