# phorge - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml phorge
# image verified to exist at generation time: php:8.2-apache

services:
  phorge:
    image: php:8.2-apache
    ports:
      - target: 20202
        published: 20202
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - phorge_config:/config
      - phorge_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20202 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=phorge"
    #   - "homepage.description=Open-source project management and collaboration platform (Phabricator fork).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=phorge.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20202"
    #   - "homepage.server=localhost"

volumes:
  phorge_config:
  phorge_data:

networks:
  default:
    name: phorge_net
    driver: overlay
    attachable: true
