# sabre-dav - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml sabre-dav
# image verified to exist at generation time: php:8.2-apache

services:
  sabre-dav:
    image: php:8.2-apache
    ports:
      - target: 20260
        published: 20260
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - sabre-dav_config:/config
      - sabre-dav_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20260 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sabre-dav"
    #   - "homepage.description=WebDAV, CalDAV and CardDAV server library/framework."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sabre-dav.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20260"
    #   - "homepage.server=localhost"

volumes:
  sabre-dav_config:
  sabre-dav_data:

networks:
  default:
    name: sabre-dav_net
    driver: overlay
    attachable: true
