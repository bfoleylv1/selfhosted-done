# sabre-dav - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  sabre-dav:
    image: php:8.2-apache
    container_name: sabre-dav
    restart: unless-stopped
    ports:
      - "20260:20260"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20260 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
