# routr - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml routr
# image verified to exist at generation time: fonoster/routr:latest

services:
  routr:
    image: fonoster/routr:latest
    ports:
      - target: 20252
        published: 20252
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - routr_config:/config
      - routr_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20252 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=routr"
    #   - "homepage.description=SIP server for VoIP and telephony routing.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=routr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20252"
    #   - "homepage.server=localhost"

volumes:
  routr_config:
  routr_data:

networks:
  default:
    name: routr_net
    driver: overlay
    attachable: true
