# routr - docker compose (single host)
# image verified to exist at generation time: fonoster/routr:latest

services:
  routr:
    image: fonoster/routr:latest
    container_name: routr
    restart: unless-stopped
    ports:
      - "20252:20252"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20252 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=routr"
    #   - "homepage.description=SIP server for VoIP and telephony routing."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=routr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20252"
    #   - "homepage.server=localhost"

networks:
  default:
    name: routr_net
