# davis - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml davis
# image verified to exist at generation time: ghcr.io/tchapi/davis:latest

services:
  davis:
    image: ghcr.io/tchapi/davis:latest
    ports:
      - target: 20042
        published: 20042
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - davis_config:/config
      - davis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20042 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=davis"
    #   - "homepage.description=Self-hosted CalDAV/CardDAV server (PHP).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=davis.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20042"
    #   - "homepage.server=localhost"

volumes:
  davis_config:
  davis_data:

networks:
  default:
    name: davis_net
    driver: overlay
    attachable: true
