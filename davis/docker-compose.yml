# davis - docker compose (single host)
# image verified to exist at generation time: ghcr.io/tchapi/davis:latest

services:
  davis:
    image: ghcr.io/tchapi/davis:latest
    container_name: davis
    restart: unless-stopped
    ports:
      - "20042:20042"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20042 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=davis"
    #   - "homepage.description=Self-hosted CalDAV/CardDAV server (PHP)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=davis.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20042"
    #   - "homepage.server=localhost"

networks:
  default:
    name: davis_net
