# ipfs - docker compose (single host)
# image verified to exist at generation time: ipfs/kubo:latest

services:
  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ipfs"
    #   - "homepage.description=Protocol for decentralized file sharing; distributed content addressing.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ipfs.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5001"
    #   - "homepage.server=localhost"

networks:
  default:
    name: ipfs_net
