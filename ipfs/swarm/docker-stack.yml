# ipfs - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml ipfs
# image verified to exist at generation time: ipfs/kubo:latest

services:
  ipfs:
    image: ipfs/kubo:latest
    ports:
      - target: 5001
        published: 5001
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ipfs_config:/config
      - ipfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ipfs"
    #   - "homepage.description=Protocol for decentralized file sharing; distributed content addressing."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ipfs.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5001"
    #   - "homepage.server=localhost"

volumes:
  ipfs_config:
  ipfs_data:

networks:
  default:
    name: ipfs_net
    driver: overlay
    attachable: true
