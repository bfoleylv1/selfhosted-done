# cloudron - docker compose (single host)
# image verified to exist at generation time: ubuntu:24.04

services:
  cloudron:
    image: ubuntu:24.04
    container_name: cloudron
    restart: unless-stopped
    ports:
      - "20033:20033"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20033 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cloudron"
    #   - "homepage.description=Self-hosted PaaS for installing and managing web apps."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cloudron.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20033"
    #   - "homepage.server=localhost"

networks:
  default:
    name: cloudron_net
