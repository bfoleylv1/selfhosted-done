# cloudron - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml cloudron
# image verified to exist at generation time: ubuntu:24.04

services:
  cloudron:
    image: ubuntu:24.04
    ports:
      - target: 8080
        published: 20033
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - cloudron_config:/config
      - cloudron_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosting Solutions"
    #   - "homepage.name=cloudron"
    #   - "homepage.description=cloudron self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cloudron.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20033"
    #   - "homepage.server=localhost"

volumes:
  cloudron_config:
  cloudron_data:

networks:
  default:
    name: cloudron_net
    driver: overlay
    attachable: true
