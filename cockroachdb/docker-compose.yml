# cockroachdb - docker compose (single host)
# image verified to exist at generation time: cockroachdb/cockroach:latest

services:
  cockroachdb:
    image: cockroachdb/cockroach:latest
    container_name: cockroachdb
    restart: unless-stopped
    ports:
      - "20035:26257"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 26257 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cockroachdb"
    #   - "homepage.description=cockroachdb self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cockroachdb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20035"
    #   - "homepage.server=localhost"

networks:
  default:
    name: cockroachdb_net
