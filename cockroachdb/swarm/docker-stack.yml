# cockroachdb - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml cockroachdb
# image verified to exist at generation time: cockroachdb/cockroach:latest

services:
  cockroachdb:
    image: cockroachdb/cockroach:latest
    ports:
      - target: 8080
        published: 20035
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - cockroachdb_config:/config
      - cockroachdb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Database Tools"
    #   - "homepage.name=cockroachdb"
    #   - "homepage.description=Cloud-native relational database; distributed SQL database."
    #   - "homepage.tags=Database Tools"
    #   - "homepage.icon=cockroachdb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20035"
    #   - "homepage.server=localhost"

volumes:
  cockroachdb_config:
  cockroachdb_data:

networks:
  default:
    name: cockroachdb_net
    driver: overlay
    attachable: true
