# umbraco - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml umbraco
# image verified to exist at generation time: mcr.microsoft.com/dotnet/aspnet:8.0

services:
  umbraco:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    ports:
      - target: 20343
        published: 20343
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - umbraco_config:/config
      - umbraco_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20343 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=umbraco"
    #   - "homepage.description=Open-source CMS; built on .NET and ASP.NET."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=umbraco.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20343"
    #   - "homepage.server=localhost"

volumes:
  umbraco_config:
  umbraco_data:

networks:
  default:
    name: umbraco_net
    driver: overlay
    attachable: true
