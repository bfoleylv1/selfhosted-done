# umbraco - docker compose (single host)
# image verified to exist at generation time: mcr.microsoft.com/dotnet/aspnet:8.0

services:
  umbraco:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: umbraco
    restart: unless-stopped
    ports:
      - "20343:20343"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20343 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=umbraco"
    #   - "homepage.description=Open-source CMS; built on .NET and ASP.NET."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=umbraco.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20343"
    #   - "homepage.server=localhost"

networks:
  default:
    name: umbraco_net
