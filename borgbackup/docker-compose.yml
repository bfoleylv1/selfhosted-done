# borgbackup - docker compose (single host)
# image verified to exist at generation time: ghcr.io/borgmatic-collective/borgmatic:latest

services:
  borgbackup:
    image: ghcr.io/borgmatic-collective/borgmatic:latest
    container_name: borgbackup
    restart: unless-stopped
    ports:
      - "20017:20017"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20017 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=borgbackup"
    #   - "homepage.description=Deduplicating backup program; efficient storage for backups."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=borgbackup.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20017"
    #   - "homepage.server=localhost"

networks:
  default:
    name: borgbackup_net
