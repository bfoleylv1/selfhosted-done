# borgbackup - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml borgbackup
# image verified to exist at generation time: ghcr.io/borgmatic-collective/borgmatic:latest

services:
  borgbackup:
    image: ghcr.io/borgmatic-collective/borgmatic:latest
    ports:
      - target: 20017
        published: 20017
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - borgbackup_config:/config
      - borgbackup_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20017 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=borgbackup"
    #   - "homepage.description=Deduplicating backup program; efficient storage for backups."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=borgbackup.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20017"
    #   - "homepage.server=localhost"

volumes:
  borgbackup_config:
  borgbackup_data:

networks:
  default:
    name: borgbackup_net
    driver: overlay
    attachable: true
