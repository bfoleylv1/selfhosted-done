# akkoma - docker compose (single host)
# image verified to exist at generation time: akkoma/akkoma:latest

services:
  akkoma:
    image: akkoma/akkoma:latest
    container_name: akkoma
    restart: unless-stopped
    ports:
      - "20400:20400"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20400 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=akkoma"
    #   - "homepage.description=Lightweight federated microblogging server (ActivityPub, Mastodon-compatible).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=akkoma.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20400"
    #   - "homepage.server=localhost"

networks:
  default:
    name: akkoma_net
