# akkoma - docker compose (single host)
# image verified to exist at generation time: akkoma/akkoma:latest

services:
  akkoma:
    image: akkoma/akkoma:latest
    container_name: akkoma
    restart: unless-stopped
    ports:
      - "20404:4000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/ || wget -qO- http://127.0.0.1:4000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosting Solutions"
    #   - "homepage.name=akkoma"
    #   - "homepage.description=akkoma self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=akkoma.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20404"
    #   - "homepage.server=localhost"

networks:
  default:
    name: akkoma_net
