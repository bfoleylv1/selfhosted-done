# akkoma - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml akkoma
# image verified to exist at generation time: akkoma/akkoma:latest

services:
  akkoma:
    image: akkoma/akkoma:latest
    ports:
      - target: 4000
        published: 20404
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - akkoma_config:/config
      - akkoma_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/ || wget -qO- http://127.0.0.1:4000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosting Solutions"
    #   - "homepage.name=akkoma"
    #   - "homepage.description=akkoma self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=akkoma.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20404"
    #   - "homepage.server=localhost"

volumes:
  akkoma_config:
  akkoma_data:

networks:
  default:
    name: akkoma_net
    driver: overlay
    attachable: true
