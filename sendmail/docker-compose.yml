# sendmail - docker compose (single host)
# image verified to exist at generation time: debian:12-slim

services:
  sendmail:
    image: debian:12-slim
    container_name: sendmail
    restart: unless-stopped
    ports:
      - "20270:20270"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20270 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sendmail"
    #   - "homepage.description=Most widely used Unix mail transfer agent."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sendmail.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20270"
    #   - "homepage.server=localhost"

networks:
  default:
    name: sendmail_net
