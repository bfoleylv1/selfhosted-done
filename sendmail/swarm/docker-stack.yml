# sendmail - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml sendmail
# image verified to exist at generation time: debian:12-slim

services:
  sendmail:
    image: debian:12-slim
    ports:
      - target: 20270
        published: 20270
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - sendmail_config:/config
      - sendmail_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20270 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sendmail"
    #   - "homepage.description=sendmail self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sendmail.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20270"
    #   - "homepage.server=localhost"

volumes:
  sendmail_config:
  sendmail_data:

networks:
  default:
    name: sendmail_net
    driver: overlay
    attachable: true
