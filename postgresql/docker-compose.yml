# postgresql - docker compose (single host)
# image verified to exist at generation time: postgres:16-alpine

services:
  postgresql:
    image: postgres:16-alpine
    container_name: postgresql
    restart: unless-stopped
    ports:
      - "20217:5432"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=postgresql"
    #   - "homepage.description=postgresql self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=postgresql.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20217"
    #   - "homepage.server=localhost"

networks:
  default:
    name: postgresql_net
