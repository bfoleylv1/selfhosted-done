# postgresql - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml postgresql
# image verified to exist at generation time: postgres:16-alpine

services:
  postgresql:
    image: postgres:16-alpine
    ports:
      - target: 5432
        published: 20217
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - postgresql_config:/config
      - postgresql_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=postgresql"
    #   - "homepage.description=Powerful open-source relational database; extensible, ACID-compliant with JSONB support."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=postgresql.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20217"
    #   - "homepage.server=localhost"

volumes:
  postgresql_config:
  postgresql_data:

networks:
  default:
    name: postgresql_net
    driver: overlay
    attachable: true
