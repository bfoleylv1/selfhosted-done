# commentario - docker compose (single host)
# image verified to exist at generation time: registry.gitlab.com/comentario/comentario:latest

services:
  commentario:
    image: registry.gitlab.com/comentario/comentario:latest
    container_name: commentario
    restart: unless-stopped
    ports:
      - "20036:20036"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20036 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=commentario"
    #   - "homepage.description=commentario self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=commentario.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20036"
    #   - "homepage.server=localhost"

networks:
  default:
    name: commentario_net
