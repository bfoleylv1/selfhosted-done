# commentario - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml commentario
# image verified to exist at generation time: registry.gitlab.com/comentario/comentario:latest

services:
  commentario:
    image: registry.gitlab.com/comentario/comentario:latest
    ports:
      - target: 8080
        published: 20036
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - commentario_config:/config
      - commentario_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosting Solutions"
    #   - "homepage.name=commentario"
    #   - "homepage.description=commentario self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=commentario.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20036"
    #   - "homepage.server=localhost"

volumes:
  commentario_config:
  commentario_data:

networks:
  default:
    name: commentario_net
    driver: overlay
    attachable: true
