# loki - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml loki
# image verified to exist at generation time: grafana/loki:latest

services:
  loki:
    image: grafana/loki:latest
    ports:
      - target: 3100
        published: 3100
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - loki_config:/config
      - loki_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/ready || wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=loki"
    #   - "homepage.description=Log aggregation system; designed to be cost-effective and easily run."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=loki.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:3100"
    #   - "homepage.server=localhost"

volumes:
  loki_config:
  loki_data:

networks:
  default:
    name: loki_net
    driver: overlay
    attachable: true
