# loki - docker compose (single host)
# image verified to exist at generation time: grafana/loki:latest

services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/ready || wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=loki"
    #   - "homepage.description=Log aggregation system; designed to be cost-effective and easily run."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=loki.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:3100"
    #   - "homepage.server=localhost"

networks:
  default:
    name: loki_net
