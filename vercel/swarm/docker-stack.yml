# vercel - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml vercel
# image verified to exist at generation time: node:20-alpine

services:
  vercel:
    image: node:20-alpine
    ports:
      - target: 20348
        published: 20348
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - vercel_config:/config
      - vercel_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20348 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=vercel"
    #   - "homepage.description=Platform for frontend deployment (open-core).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=vercel.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20348"
    #   - "homepage.server=localhost"

volumes:
  vercel_config:
  vercel_data:

networks:
  default:
    name: vercel_net
    driver: overlay
    attachable: true
