# vercel - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  vercel:
    image: node:20-alpine
    container_name: vercel
    restart: unless-stopped
    ports:
      - "20348:20348"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20348 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=vercel"
    #   - "homepage.description=Platform for frontend deployment (open-core)."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=vercel.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20348"
    #   - "homepage.server=localhost"

networks:
  default:
    name: vercel_net
