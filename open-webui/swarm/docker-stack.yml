# open-webui - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml open-webui
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: ghcr.io/open-webui/open-webui:main
    environment:
    - OLLAMA_BASE_URL=http://host.docker.internal:11434
    - WEBUI_SECRET_KEY=TTqmUm5E_P4C89oUvgf8cvK3lQuG-qWe
    - TZ=America/Los_Angeles
    volumes:
    - open-webui_open_webui_data:/app/backend/data
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - open-webui
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 8080
      published: 20597
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=open-webui"
    #   - "homepage.description=open-webui self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=open-webui.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20597"
    #   - "homepage.server=localhost"
volumes:
  open-webui_open_webui_data: null
networks:
  default:
    name: open-webui_net
    driver: overlay
    attachable: true
