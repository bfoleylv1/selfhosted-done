# otherswrite - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml otherswrite
# image verified to exist at generation time: otherswrite/otherswrite:latest

services:
  otherswrite:
    # image: otherswrite/otherswrite:latest  # UNVERIFIED
    ports:
      - target: 20554
        published: 20554
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - otherswrite_config:/config
      - otherswrite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20554 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=otherswrite"
    #   - "homepage.description=otherswrite self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=otherswrite.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20554"
    #   - "homepage.server=localhost"

volumes:
  otherswrite_config:
  otherswrite_data:

networks:
  default:
    name: otherswrite_net
    driver: overlay
    attachable: true
