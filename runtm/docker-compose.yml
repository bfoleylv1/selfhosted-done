# runtm - docker compose (single host)
# image verified to exist at generation time: runtm/runtm:latest

services:
  runtm:
    # image: runtm/runtm:latest  # UNVERIFIED
    container_name: runtm
    restart: unless-stopped
    ports:
      - "20546:20546"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20546 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=runtm"
    #   - "homepage.description=runtm self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=runtm.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20546"
    #   - "homepage.server=localhost"

networks:
  default:
    name: runtm_net
