# openproject - docker compose (single host)
# image verified to exist at generation time: openproject/openproject:15

services:
  openproject:
    image: openproject/openproject:15
    container_name: openproject
    restart: unless-stopped
    ports:
      - "20178:20178"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20178 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=openproject"
    #   - "homepage.description=Project management web application; issue tracking and agile tools."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=openproject.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20178"
    #   - "homepage.server=localhost"

networks:
  default:
    name: openproject_net
