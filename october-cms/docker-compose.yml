# october-cms - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  october-cms:
    image: php:8.2-apache
    container_name: october-cms
    restart: unless-stopped
    ports:
      - "20171:20171"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20171 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=october-cms"
    #   - "homepage.description=Content management system; simple and extensible.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=october-cms.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20171"
    #   - "homepage.server=localhost"

networks:
  default:
    name: october-cms_net
