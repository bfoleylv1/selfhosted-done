# october-cms - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml october-cms
# image verified to exist at generation time: php:8.2-apache

services:
  october-cms:
    image: php:8.2-apache
    ports:
      - target: 20171
        published: 20171
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - october-cms_config:/config
      - october-cms_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20171 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=october-cms"
    #   - "homepage.description=Content management system; simple and extensible."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=october-cms.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20171"
    #   - "homepage.server=localhost"

volumes:
  october-cms_config:
  october-cms_data:

networks:
  default:
    name: october-cms_net
    driver: overlay
    attachable: true
