# gathio - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml gathio
# image verified to exist at generation time: ghcr.io/lowercasename/gathio:latest

services:
  gathio:
    image: ghcr.io/lowercasename/gathio:latest
    ports:
      - target: 20087
        published: 20087
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - gathio_config:/config
      - gathio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20087 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=gathio"
    #   - "homepage.description=Self-hosted event page and RSVP host."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=gathio.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20087"
    #   - "homepage.server=localhost"

volumes:
  gathio_config:
  gathio_data:

networks:
  default:
    name: gathio_net
    driver: overlay
    attachable: true
