# linkace - docker compose (single host)
# image verified to exist at generation time: linkace/linkace:simple

services:
  linkace:
    image: linkace/linkace:simple
    container_name: linkace
    restart: unless-stopped
    ports:
      - "20141:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=linkace"
    #   - "homepage.description=Link shortener and bookmark manager; save and share URLs.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=linkace.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20141"
    #   - "homepage.server=localhost"

networks:
  default:
    name: linkace_net
