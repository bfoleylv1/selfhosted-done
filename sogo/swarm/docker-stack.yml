# sogo - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml sogo
# image verified to exist at generation time: debian:12-slim

services:
  sogo:
    image: debian:12-slim
    ports:
      - target: 20000
        published: 20000
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - sogo_config:/config
      - sogo_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sogo"
    #   - "homepage.description=Web access to IMAP and CalDAV; groupware solution.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sogo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20000"
    #   - "homepage.server=localhost"

volumes:
  sogo_config:
  sogo_data:

networks:
  default:
    name: sogo_net
    driver: overlay
    attachable: true
