# sogo - docker compose (single host)
# image verified to exist at generation time: debian:12-slim

services:
  sogo:
    image: debian:12-slim
    container_name: sogo
    restart: unless-stopped
    ports:
      - "20000:20000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sogo"
    #   - "homepage.description=sogo self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sogo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20000"
    #   - "homepage.server=localhost"

networks:
  default:
    name: sogo_net
