# cfssl - docker compose (single host)
# image verified to exist at generation time: cfssl/cfssl:latest

services:
  cfssl:
    image: cfssl/cfssl:latest
    container_name: cfssl
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8888 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cfssl"
    #   - "homepage.description=cfssl self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cfssl.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8888"
    #   - "homepage.server=localhost"

networks:
  default:
    name: cfssl_net
