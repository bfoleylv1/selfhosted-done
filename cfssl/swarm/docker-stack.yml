# cfssl - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml cfssl
# image verified to exist at generation time: cfssl/cfssl:latest

services:
  cfssl:
    image: cfssl/cfssl:latest
    ports:
      - target: 8888
        published: 8888
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - cfssl_config:/config
      - cfssl_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8888 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cfssl"
    #   - "homepage.description=CloudFlare's PKI toolkit; certificate authority and tools."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cfssl.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8888"
    #   - "homepage.server=localhost"

volumes:
  cfssl_config:
  cfssl_data:

networks:
  default:
    name: cfssl_net
    driver: overlay
    attachable: true
