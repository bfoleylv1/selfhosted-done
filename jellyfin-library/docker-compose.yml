# jellyfin-library - docker compose (single host)
# image verified to exist at generation time: jellyfin/jellyfin:latest

services:
  jellyfin-library:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin-library
    restart: unless-stopped
    ports:
      - "20118:20118"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20118 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=jellyfin-library"
    #   - "homepage.description=Tool for managing Jellyfin media libraries."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=jellyfin-library.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20118"
    #   - "homepage.server=localhost"

networks:
  default:
    name: jellyfin-library_net
