# jellyfin-library - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml jellyfin-library
# image verified to exist at generation time: jellyfin/jellyfin:latest

services:
  jellyfin-library:
    image: jellyfin/jellyfin:latest
    ports:
      - target: 20118
        published: 20118
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - jellyfin-library_config:/config
      - jellyfin-library_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20118 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=jellyfin-library"
    #   - "homepage.description=jellyfin-library self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=jellyfin-library.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20118"
    #   - "homepage.server=localhost"

volumes:
  jellyfin-library_config:
  jellyfin-library_data:

networks:
  default:
    name: jellyfin-library_net
    driver: overlay
    attachable: true
