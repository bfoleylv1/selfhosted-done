# portracker - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml portracker
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: mostafawahied/portracker:latest
    volumes:
    - portracker_portracker_data_data:/data
    - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
    - DATABASE_PATH=/data/portracker.db
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - index.js
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 4999
      published: 4999
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=portracker"
    #   - "homepage.description=portracker self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=portracker.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:4999"
    #   - "homepage.server=localhost"
volumes:
  portracker_portracker_data_data: null
networks:
  default:
    name: portracker_net
    driver: overlay
    attachable: true
