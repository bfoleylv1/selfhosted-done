# drupal - docker compose (single host)
# image verified to exist at generation time: drupal:latest

services:
  drupal:
    image: drupal:latest
    container_name: drupal
    restart: unless-stopped
    ports:
      - "20054:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=drupal"
    #   - "homepage.description=Open-source CMS; flexible and extensible content management.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=drupal.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20054"
    #   - "homepage.server=localhost"

networks:
  default:
    name: drupal_net
