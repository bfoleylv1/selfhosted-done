# surge - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml surge
# image verified to exist at generation time: node:20-alpine

services:
  surge:
    image: node:20-alpine
    ports:
      - target: 20314
        published: 20314
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - surge_config:/config
      - surge_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20314 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=surge"
    #   - "homepage.description=Self-hosted service.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=surge.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20314"
    #   - "homepage.server=localhost"

volumes:
  surge_config:
  surge_data:

networks:
  default:
    name: surge_net
    driver: overlay
    attachable: true
