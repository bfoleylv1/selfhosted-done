# prisma - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml prisma
# image verified to exist at generation time: node:20-alpine

services:
  prisma:
    image: node:20-alpine
    ports:
      - target: 80
        published: 5555
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - prisma_config:/config
      - prisma_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=prisma"
    #   - "homepage.description=Database toolkit; type-safe ORM with migrations.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=prisma.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5555"
    #   - "homepage.server=localhost"

volumes:
  prisma_config:
  prisma_data:

networks:
  default:
    name: prisma_net
    driver: overlay
    attachable: true
