# prisma - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  prisma:
    image: node:20-alpine
    container_name: prisma
    restart: unless-stopped
    ports:
      - "5555:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=prisma"
    #   - "homepage.description=Database toolkit; type-safe ORM with migrations."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=prisma.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5555"
    #   - "homepage.server=localhost"

networks:
  default:
    name: prisma_net
