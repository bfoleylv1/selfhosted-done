# glitchtip - docker compose (single host)
# image verified to exist at generation time: glitchtip/glitchtip:latest

services:
  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip
    restart: unless-stopped
    ports:
      - "20095:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=glitchtip"
    #   - "homepage.description=glitchtip self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=glitchtip.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20095"
    #   - "homepage.server=localhost"

networks:
  default:
    name: glitchtip_net
