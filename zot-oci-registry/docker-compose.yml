# zot-oci-registry - docker compose (single host)
# image verified to exist at generation time: ghcr.io/project-zot/zot-linux-amd64:latest

services:
  zot-oci-registry:
    image: ghcr.io/project-zot/zot-linux-amd64:latest
    container_name: zot-oci-registry
    restart: unless-stopped
    ports:
      - "20390:20390"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20390 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zot-oci-registry"
    #   - "homepage.description=zot-oci-registry self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zot-oci-registry.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20390"
    #   - "homepage.server=localhost"

networks:
  default:
    name: zot-oci-registry_net
