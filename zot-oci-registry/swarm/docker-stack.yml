# zot-oci-registry - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml zot-oci-registry
# image verified to exist at generation time: ghcr.io/project-zot/zot-linux-amd64:latest

services:
  zot-oci-registry:
    image: ghcr.io/project-zot/zot-linux-amd64:latest
    ports:
      - target: 20390
        published: 20390
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - zot-oci-registry_config:/config
      - zot-oci-registry_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20390 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zot-oci-registry"
    #   - "homepage.description=OCI container image registry (Zot).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zot-oci-registry.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20390"
    #   - "homepage.server=localhost"

volumes:
  zot-oci-registry_config:
  zot-oci-registry_data:

networks:
  default:
    name: zot-oci-registry_net
    driver: overlay
    attachable: true
