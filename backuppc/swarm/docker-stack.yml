# backuppc - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml backuppc
# image verified to exist at generation time: adferrand/backuppc:latest

services:
  backuppc:
    image: adferrand/backuppc:latest
    ports:
      - target: 80
        published: 20007
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - backuppc_config:/config
      - backuppc_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Backup"
    #   - "homepage.name=backuppc"
    #   - "homepage.description=High-performance clientless backup system; server and desktop backup."
    #   - "homepage.tags=Backup,Archiving"
    #   - "homepage.icon=backuppc.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20007"
    #   - "homepage.server=localhost"

volumes:
  backuppc_config:
  backuppc_data:

networks:
  default:
    name: backuppc_net
    driver: overlay
    attachable: true
