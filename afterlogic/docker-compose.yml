# afterlogic - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  afterlogic:
    image: php:8.2-apache
    container_name: afterlogic
    restart: unless-stopped
    ports:
      - "20397:20397"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20397 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=afterlogic"
    #   - "homepage.description=Webmail program; modern webmail with calendar."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=afterlogic.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20397"
    #   - "homepage.server=localhost"

networks:
  default:
    name: afterlogic_net
