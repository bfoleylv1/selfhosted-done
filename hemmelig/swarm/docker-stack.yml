# hemmelig - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml hemmelig
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: hemmeligapp/hemmelig:v7
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    - DATABASE_URL=file:/app/database/hemmelig.db
    - BETTER_AUTH_SECRET=change-this-to-a-secure-secret-min-32-chars
    - BETTER_AUTH_URL=https://secrets.example.com
    - NODE_ENV=production
    - HEMMELIG_BASE_URL=https://secrets.example.com
    volumes:
    - hemmelig_hemmelig_data_database:/app/database
    - hemmelig_hemmelig_data_uploads:/app/uploads
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3000/api/healthz
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 3000
      published: 20580
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=hemmelig"
    #   - "homepage.description=hemmelig self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=hemmelig.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20580"
    #   - "homepage.server=localhost"
volumes:
  hemmelig_hemmelig_data_database: null
  hemmelig_hemmelig_data_uploads: null
networks:
  default:
    name: hemmelig_net
    driver: overlay
    attachable: true
