# hemmelig - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: hemmeligapp/hemmelig:v7
    container_name: app-hemmelig
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    - DATABASE_URL=file:/app/database/hemmelig.db
    - BETTER_AUTH_SECRET=change-this-to-a-secure-secret-min-32-chars
    - BETTER_AUTH_URL=https://secrets.example.com
    - NODE_ENV=production
    - HEMMELIG_BASE_URL=https://secrets.example.com
    volumes:
    - ./hemmelig-data/database:/app/database
    - ./hemmelig-data/uploads:/app/uploads
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3000/api/healthz
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 20580:3000
