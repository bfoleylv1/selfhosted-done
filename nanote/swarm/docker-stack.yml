# nanote - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml nanote
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: omarmir/nanote:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    - NOTES_PATH=/notes
    - SECRET_KEY=<yourkey>
    volumes:
    - nanote_nanote_data:/notes
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000/api/health
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 3000
      published: 20592
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=nanote"
    #   - "homepage.description=nanote self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=nanote.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20592"
    #   - "homepage.server=localhost"
volumes:
  nanote_nanote_data: null
networks:
  default:
    name: nanote_net
    driver: overlay
    attachable: true
