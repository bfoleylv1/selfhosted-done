# nanote - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: omarmir/nanote:latest
    container_name: app-nanote
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    - NOTES_PATH=/notes
    - SECRET_KEY=<yourkey>
    volumes:
    - ./nanote-data:/notes
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000/api/health
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 20592:3000
