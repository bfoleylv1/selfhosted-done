# pushbits - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml pushbits
# image verified to exist at generation time: ghcr.io/pushbits/server:latest

services:
  pushbits:
    image: ghcr.io/pushbits/server:latest
    ports:
      - target: 20225
        published: 20225
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - pushbits_config:/config
      - pushbits_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20225 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pushbits"
    #   - "homepage.description=Self-hosted push notification relay for Android/iOS.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pushbits.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20225"
    #   - "homepage.server=localhost"

volumes:
  pushbits_config:
  pushbits_data:

networks:
  default:
    name: pushbits_net
    driver: overlay
    attachable: true
