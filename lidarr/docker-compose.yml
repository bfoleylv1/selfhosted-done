# lidarr - docker compose (single host)
# image verified to exist at generation time: lscr.io/linuxserver/lidarr:latest

services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    ports:
      - "8686:8686"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8686/ || wget -qO- http://127.0.0.1:8686/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=lidarr"
    #   - "homepage.description=PVR for music; automatically downloads and organizes music albums.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=lidarr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8686"
    #   - "homepage.server=localhost"

networks:
  default:
    name: lidarr_net
