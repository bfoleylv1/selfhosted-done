# lidarr - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml lidarr
# image verified to exist at generation time: lscr.io/linuxserver/lidarr:latest

services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    ports:
      - target: 8686
        published: 8686
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - lidarr_config:/config
      - lidarr_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8686/ || wget -qO- http://127.0.0.1:8686/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=lidarr"
    #   - "homepage.description=PVR for music; automatically downloads and organizes music albums."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=lidarr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8686"
    #   - "homepage.server=localhost"

volumes:
  lidarr_config:
  lidarr_data:

networks:
  default:
    name: lidarr_net
    driver: overlay
    attachable: true
