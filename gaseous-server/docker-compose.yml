# gaseous-server - docker compose (single host)
# image verified to exist at generation time: gaseousgames/gaseousserver:latest

services:
  gaseous-server:
    image: gaseousgames/gaseousserver:latest
    container_name: gaseous-server
    restart: unless-stopped
    ports:
      - "5198:5198"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5198 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=gaseous-server"
    #   - "homepage.description=Self-hosted video game collection / ROM manager."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=gaseous-server.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5198"
    #   - "homepage.server=localhost"

networks:
  default:
    name: gaseous-server_net
