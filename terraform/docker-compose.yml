# terraform - docker compose (single host)
# image verified to exist at generation time: hashicorp/terraform:latest

services:
  terraform:
    image: hashicorp/terraform:latest
    container_name: terraform
    restart: unless-stopped
    ports:
      - "20322:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - LIBVA_DRIVER_NAME=iHD
      # - INTEL_GPU=1
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # devices:
    #   - /dev/kvm:/dev/kvm
    #   - /dev/dri:/dev/dri
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=terraform"
    #   - "homepage.description=Infrastructure as code tool; provision and manage cloud resources."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=terraform.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20322"
    #   - "homepage.server=localhost"

networks:
  default:
    name: terraform_net
