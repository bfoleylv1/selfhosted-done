# graylog - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml graylog
# image verified to exist at generation time: graylog/graylog:6.1

services:
  graylog:
    image: graylog/graylog:6.1
    ports:
      - target: 9000
        published: 20106
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - graylog_config:/config
      - graylog_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/health || wget -qO- http://127.0.0.1:9000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=graylog"
    #   - "homepage.description=Open source log management platform; centralized log management.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=graylog.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20106"
    #   - "homepage.server=localhost"

volumes:
  graylog_config:
  graylog_data:

networks:
  default:
    name: graylog_net
    driver: overlay
    attachable: true
