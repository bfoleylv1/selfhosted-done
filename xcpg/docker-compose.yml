    #   - "homepage.description=Self-hosted service."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=xcpg.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20373"
    #   - "homepage.server=localhost"

networks:
  default:
    name: xcpg_net
