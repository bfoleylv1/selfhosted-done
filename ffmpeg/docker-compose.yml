    #   - "homepage.description=Command-line video/audio processing; convert and edit media files."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ffmpeg.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20068"
    #   - "homepage.server=localhost"

networks:
  default:
    name: ffmpeg_net
