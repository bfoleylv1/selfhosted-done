services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    ports:
    - target: 3000
      published: 20461
      protocol: tcp
      mode: ingress
    environment:
    - TZ=${TZ:-America/Los_Angeles}
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    volumes:
    - karakeep_config:/config
    - karakeep_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:3000/api/health || wget -qO- http://127.0.0.1:3000/api/health
        || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
volumes:
  karakeep_config: null
  karakeep_data: null
networks:
  default:
    name: karakeep_net
    driver: overlay
    attachable: true
