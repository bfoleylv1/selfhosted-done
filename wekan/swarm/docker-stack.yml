# wekan - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml wekan
# image verified to exist at generation time: wekanteam/wekan:latest

services:
  wekan:
    image: wekanteam/wekan:latest
    ports:
      - target: 80
        published: 20361
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - wekan_config:/config
      - wekan_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wekan"
    #   - "homepage.description=Open source Trello alternative; Kanban-style task management.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wekan.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20361"
    #   - "homepage.server=localhost"

volumes:
  wekan_config:
  wekan_data:

networks:
  default:
    name: wekan_net
    driver: overlay
    attachable: true
