# wekan - docker compose (single host)
# image verified to exist at generation time: wekanteam/wekan:latest

services:
  wekan:
    image: wekanteam/wekan:latest
    container_name: wekan
    restart: unless-stopped
    ports:
      - "20361:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wekan"
    #   - "homepage.description=Open source Trello alternative; Kanban-style task management."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wekan.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20361"
    #   - "homepage.server=localhost"

networks:
  default:
    name: wekan_net
