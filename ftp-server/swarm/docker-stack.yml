# ftp-server - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml ftp-server
# image verified to exist at generation time: delfer/alpine-ftp-server:latest

services:
  ftp-server:
    image: delfer/alpine-ftp-server:latest
    ports:
      - target: 20082
        published: 20082
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ftp-server_config:/config
      - ftp-server_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20082 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ftp-server"
    #   - "homepage.description=File Transfer Protocol server; traditional file access."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ftp-server.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20082"
    #   - "homepage.server=localhost"

volumes:
  ftp-server_config:
  ftp-server_data:

networks:
  default:
    name: ftp-server_net
    driver: overlay
    attachable: true
