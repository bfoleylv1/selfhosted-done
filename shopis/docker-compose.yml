# shopis - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  shopis:
    image: node:20-alpine
    container_name: shopis
    restart: unless-stopped
    ports:
      - "20278:20278"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20278 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=shopis"
    #   - "homepage.description=Admin dashboard for Shopify stores; order and inventory management."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=shopis.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20278"
    #   - "homepage.server=localhost"

networks:
  default:
    name: shopis_net
