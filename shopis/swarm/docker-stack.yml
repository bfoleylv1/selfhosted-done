# shopis - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml shopis
# image verified to exist at generation time: node:20-alpine

services:
  shopis:
    image: node:20-alpine
    ports:
      - target: 20278
        published: 20278
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - shopis_config:/config
      - shopis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20278 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=shopis"
    #   - "homepage.description=shopis self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=shopis.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20278"
    #   - "homepage.server=localhost"

volumes:
  shopis_config:
  shopis_data:

networks:
  default:
    name: shopis_net
    driver: overlay
    attachable: true
