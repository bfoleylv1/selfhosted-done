# globaleaks - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml globaleaks
# image verified to exist at generation time: globaleaks/globaleaks:latest

services:
  globaleaks:
    image: globaleaks/globaleaks:latest
    ports:
      - target: 20096
        published: 20096
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - globaleaks_config:/config
      - globaleaks_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20096 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=globaleaks"
    #   - "homepage.description=Open-source whistleblowing / secure submission platform."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=globaleaks.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20096"
    #   - "homepage.server=localhost"

volumes:
  globaleaks_config:
  globaleaks_data:

networks:
  default:
    name: globaleaks_net
    driver: overlay
    attachable: true
