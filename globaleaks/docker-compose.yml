# globaleaks - docker compose (single host)
# image verified to exist at generation time: globaleaks/globaleaks:latest

services:
  globaleaks:
    image: globaleaks/globaleaks:latest
    container_name: globaleaks
    restart: unless-stopped
    ports:
      - "20096:20096"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20096 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=globaleaks"
    #   - "homepage.description=globaleaks self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=globaleaks.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20096"
    #   - "homepage.server=localhost"

networks:
  default:
    name: globaleaks_net
