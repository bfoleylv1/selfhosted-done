# it-tools - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: corentinth/it-tools:latest
    container_name: app-it-tools
    environment:
    - TZ=America/Los_Angeles
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - nginx
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 20584:80
