# it-tools - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml it-tools
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: corentinth/it-tools:latest
    environment:
    - TZ=America/Los_Angeles
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - nginx
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 80
      published: 20584
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=it-tools"
    #   - "homepage.description=it-tools self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=it-tools.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20584"
    #   - "homepage.server=localhost"
networks:
  default:
    name: it-tools_net
    driver: overlay
    attachable: true
