# paperless-ngx - docker compose (single host)
# image verified to exist at generation time: linuxserver/paperless-ngx:latest

services:
  paperless-ngx:
    image: linuxserver/paperless-ngx:latest
    container_name: paperless-ngx
    restart: unless-stopped
    ports:
      - "20189:20189"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20189 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=paperless-ngx"
    #   - "homepage.description=paperless-ngx self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=paperless-ngx.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20189"
    #   - "homepage.server=localhost"

networks:
  default:
    name: paperless-ngx_net
