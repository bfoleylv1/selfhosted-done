# appwrite - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml appwrite
# image verified to exist at generation time: appwrite/appwrite:1.6.0

services:
  appwrite:
    image: appwrite/appwrite:1.6.0
    ports:
      - target: 80
        published: 20003
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - appwrite_config:/config
      - appwrite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/v1/health || wget -qO- http://127.0.0.1:80/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=appwrite"
    #   - "homepage.description=Open-source backend-as-a-service (BaaS) for web and mobile apps."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=appwrite.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20003"
    #   - "homepage.server=localhost"

volumes:
  appwrite_config:
  appwrite_data:

networks:
  default:
    name: appwrite_net
    driver: overlay
    attachable: true
