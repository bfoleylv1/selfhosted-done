# payment-js - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml payment-js
# image verified to exist at generation time: node:20-alpine

services:
  payment-js:
    image: node:20-alpine
    ports:
      - target: 20195
        published: 20195
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - payment-js_config:/config
      - payment-js_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20195 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=payment-js"
    #   - "homepage.description=Simple payment processing; handle credit cards and payments.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=payment-js.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20195"
    #   - "homepage.server=localhost"

volumes:
  payment-js_config:
  payment-js_data:

networks:
  default:
    name: payment-js_net
    driver: overlay
    attachable: true
