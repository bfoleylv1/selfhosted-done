# urbackup - docker compose (single host)
# image verified to exist at generation time: uroni/urbackup-server:latest

services:
  urbackup:
    image: uroni/urbackup-server:latest
    container_name: urbackup
    restart: unless-stopped
    ports:
      - "55414:55414"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 55414 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=urbackup"
    #   - "homepage.description=Client/server backup solution; efficient backup and recovery."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=urbackup.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:55414"
    #   - "homepage.server=localhost"

networks:
  default:
    name: urbackup_net
