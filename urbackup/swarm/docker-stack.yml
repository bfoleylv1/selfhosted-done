# urbackup - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml urbackup
# image verified to exist at generation time: uroni/urbackup-server:latest

services:
  urbackup:
    image: uroni/urbackup-server:latest
    ports:
      - target: 55414
        published: 55414
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - urbackup_config:/config
      - urbackup_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 55414 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=urbackup"
    #   - "homepage.description=urbackup self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=urbackup.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:55414"
    #   - "homepage.server=localhost"

volumes:
  urbackup_config:
  urbackup_data:

networks:
  default:
    name: urbackup_net
    driver: overlay
    attachable: true
