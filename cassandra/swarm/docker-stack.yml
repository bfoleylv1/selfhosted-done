# cassandra - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml cassandra
# image verified to exist at generation time: cassandra:5

services:
  cassandra:
    image: cassandra:5
    ports:
      - target: 9042
        published: 9042
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - cassandra_config:/config
      - cassandra_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9042 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cassandra"
    #   - "homepage.description=Highly scalable NoSQL database; column-family store designed for large datasets."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cassandra.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9042"
    #   - "homepage.server=localhost"

volumes:
  cassandra_config:
  cassandra_data:

networks:
  default:
    name: cassandra_net
    driver: overlay
    attachable: true
