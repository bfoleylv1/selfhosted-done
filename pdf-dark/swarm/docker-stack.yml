# pdf-dark - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml pdf-dark
# image verified to exist at generation time: pdf-dark/pdf-dark:latest

services:
  pdf-dark:
    # image: pdf-dark/pdf-dark:latest  # UNVERIFIED
    ports:
      - target: 20544
        published: 20544
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - pdf-dark_config:/config
      - pdf-dark_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20544 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pdf-dark"
    #   - "homepage.description=pdf-dark self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pdf-dark.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20544"
    #   - "homepage.server=localhost"

volumes:
  pdf-dark_config:
  pdf-dark_data:

networks:
  default:
    name: pdf-dark_net
    driver: overlay
    attachable: true
