# turtl - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  turtl:
    image: alpine:3.20
    container_name: turtl
    restart: unless-stopped
    ports:
      - "20337:20337"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20337 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=turtl"
    #   - "homepage.description=Open source Evernote alternative; encrypted note-sync platform."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=turtl.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20337"
    #   - "homepage.server=localhost"

networks:
  default:
    name: turtl_net
