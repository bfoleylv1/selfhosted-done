# pass - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml pass
# image verified to exist at generation time: alpine:3.20

services:
  pass:
    image: alpine:3.20
    ports:
      - target: 20192
        published: 20192
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - pass_config:/config
      - pass_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20192 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pass"
    #   - "homepage.description=Simple password management; command-line password store."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pass.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20192"
    #   - "homepage.server=localhost"

volumes:
  pass_config:
  pass_data:

networks:
  default:
    name: pass_net
    driver: overlay
    attachable: true
