# pass - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  pass:
    image: alpine:3.20
    container_name: pass
    restart: unless-stopped
    ports:
      - "20192:20192"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20192 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pass"
    #   - "homepage.description=Simple password management; command-line password store."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pass.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20192"
    #   - "homepage.server=localhost"

networks:
  default:
    name: pass_net
