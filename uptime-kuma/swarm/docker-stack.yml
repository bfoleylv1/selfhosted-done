# uptime-kuma - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml uptime-kuma
# image verified to exist at generation time: louislam/uptime-kuma:1

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    ports:
      - target: 20344
        published: 20344
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - uptime-kuma_config:/config
      - uptime-kuma_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20344 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=uptime-kuma"
    #   - "homepage.description=Self-hosting status page; monitor websites and services."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=uptime-kuma.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20344"
    #   - "homepage.server=localhost"

volumes:
  uptime-kuma_config:
  uptime-kuma_data:

networks:
  default:
    name: uptime-kuma_net
    driver: overlay
    attachable: true
