# uptime-kuma - docker compose (single host)
# image verified to exist at generation time: louislam/uptime-kuma:1

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "20344:20344"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20344 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=uptime-kuma"
    #   - "homepage.description=Self-hosting status page; monitor websites and services."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=uptime-kuma.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20344"
    #   - "homepage.server=localhost"

networks:
  default:
    name: uptime-kuma_net
