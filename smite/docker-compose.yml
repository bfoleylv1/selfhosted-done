# smite - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  smite:
    image: alpine:3.20
    container_name: smite
    restart: unless-stopped
    ports:
      - "20285:20285"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20285 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=smite"
    #   - "homepage.description=Self-hosted service.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=smite.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20285"
    #   - "homepage.server=localhost"

networks:
  default:
    name: smite_net
