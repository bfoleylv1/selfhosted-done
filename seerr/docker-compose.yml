# seerr - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: app-seerr
    init: true
    environment:
    - LOG_LEVEL=debug
    - TZ=America/Los_Angeles
    - PORT=5055
    volumes:
    - ./seerr-data/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 5055:5055
