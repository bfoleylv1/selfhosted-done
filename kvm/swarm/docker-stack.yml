# kvm - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml kvm
# image verified to exist at generation time: qemux/qemu:latest

services:
  kvm:
    image: qemux/qemu:latest
    ports:
      - target: 20136
        published: 20136
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - LIBVA_DRIVER_NAME=iHD
      # - INTEL_GPU=1
    volumes:
      - kvm_config:/config
      - kvm_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20136 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
          # - node.role == manager
          # GPU: add node-generic-resources to daemon.json and:
          #   - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
      # GPU: swarm ignores `devices:`/`runtime:`. Declare in
      #   /etc/docker/daemon.json: "node-generic-resources": ["gpu=1"]
      #   then use deploy.resources.reservations.generic_resources.
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=kvm"
    #   - "homepage.description=Full virtualization for Linux; kernel-based virtual machine."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=kvm.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20136"
    #   - "homepage.server=localhost"

volumes:
  kvm_config:
  kvm_data:

networks:
  default:
    name: kvm_net
    driver: overlay
    attachable: true
