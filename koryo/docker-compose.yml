# koryo - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  koryo:
    image: alpine:3.20
    container_name: koryo
    restart: unless-stopped
    ports:
      - "20134:20134"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20134 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=koryo"
    #   - "homepage.description=Simple API gateway; lightweight and fast reverse proxy."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=koryo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20134"
    #   - "homepage.server=localhost"

networks:
  default:
    name: koryo_net
