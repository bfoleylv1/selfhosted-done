# gitsave - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml gitsave
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: timwitzdam/gitsave:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    - JWT_SECRET=${JWT_SECRET:?error}
    - DISABLE_AUTH=${DISABLE_AUTH:?error}
    - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:?error}
    volumes:
    - gitsave_gitsave_data_gitsave:/app/data
    - gitsave_gitsave_data_backups:/app/backups
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - gitsave
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 3000
      published: 20577
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=gitsave"
    #   - "homepage.description=gitsave self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=gitsave.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20577"
    #   - "homepage.server=localhost"
volumes:
  gitsave_gitsave_data_gitsave: null
  gitsave_gitsave_data_backups: null
networks:
  default:
    name: gitsave_net
    driver: overlay
    attachable: true
