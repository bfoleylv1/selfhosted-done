# restyaboard - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml restyaboard
# image verified to exist at generation time: php:8.2-apache

services:
  restyaboard:
    image: php:8.2-apache
    ports:
      - target: 20245
        published: 20245
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - restyaboard_config:/config
      - restyaboard_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20245 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=restyaboard"
    #   - "homepage.description=Open source Trello alternative; project management and task board."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=restyaboard.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20245"
    #   - "homepage.server=localhost"

volumes:
  restyaboard_config:
  restyaboard_data:

networks:
  default:
    name: restyaboard_net
    driver: overlay
    attachable: true
