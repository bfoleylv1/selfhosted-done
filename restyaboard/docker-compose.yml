# restyaboard - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  restyaboard:
    image: php:8.2-apache
    container_name: restyaboard
    restart: unless-stopped
    ports:
      - "20245:20245"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20245 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=restyaboard"
    #   - "homepage.description=restyaboard self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=restyaboard.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20245"
    #   - "homepage.server=localhost"

networks:
  default:
    name: restyaboard_net
