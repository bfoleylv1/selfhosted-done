# expressionengine - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml expressionengine
# image verified to exist at generation time: php:8.2-apache

services:
  expressionengine:
    image: php:8.2-apache
    ports:
      - target: 20066
        published: 20066
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - expressionengine_config:/config
      - expressionengine_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20066 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=expressionengine"
    #   - "homepage.description=Flexible CMS; simple yet powerful content management.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=expressionengine.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20066"
    #   - "homepage.server=localhost"

volumes:
  expressionengine_config:
  expressionengine_data:

networks:
  default:
    name: expressionengine_net
    driver: overlay
    attachable: true
