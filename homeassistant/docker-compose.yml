# homeassistant - docker compose (single host)
# image verified to exist at generation time: ghcr.io/home-assistant/home-assistant:stable

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    ports:
      - "20455:8123"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8123/ || wget -qO- http://127.0.0.1:8123/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=homeassistant"
    #   - "homepage.description=Homeassistant self-hosted service."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=homeassistant.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20455"
    #   - "homepage.server=localhost"

networks:
  default:
    name: homeassistant_net
