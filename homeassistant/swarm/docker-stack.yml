# homeassistant - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml homeassistant
# image verified to exist at generation time: ghcr.io/home-assistant/home-assistant:stable

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - target: 8123
        published: 20455
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - homeassistant_config:/config
      - homeassistant_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8123/ || wget -qO- http://127.0.0.1:8123/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=homeassistant"
    #   - "homepage.description=homeassistant self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=homeassistant.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20455"
    #   - "homepage.server=localhost"

volumes:
  homeassistant_config:
  homeassistant_data:

networks:
  default:
    name: homeassistant_net
    driver: overlay
    attachable: true
