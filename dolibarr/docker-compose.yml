# dolibarr - docker compose (single host)
# image verified to exist at generation time: dolibarr/dolibarr:latest

services:
  dolibarr:
    image: dolibarr/dolibarr:latest
    container_name: dolibarr
    restart: unless-stopped
    ports:
      - "20048:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=dolibarr"
    #   - "homepage.description=Web app to manage business activities; ERP/CRM for small companies."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=dolibarr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20048"
    #   - "homepage.server=localhost"

networks:
  default:
    name: dolibarr_net
