# dolibarr - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml dolibarr
# image verified to exist at generation time: dolibarr/dolibarr:latest

services:
  dolibarr:
    image: dolibarr/dolibarr:latest
    ports:
      - target: 80
        published: 20048
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - dolibarr_config:/config
      - dolibarr_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=dolibarr"
    #   - "homepage.description=Web app to manage business activities; ERP/CRM for small companies."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=dolibarr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20048"
    #   - "homepage.server=localhost"

volumes:
  dolibarr_config:
  dolibarr_data:

networks:
  default:
    name: dolibarr_net
    driver: overlay
    attachable: true
