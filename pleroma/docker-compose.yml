# pleroma - docker compose (single host)
# image verified to exist at generation time: elixir:1.16-alpine

services:
  pleroma:
    image: elixir:1.16-alpine
    container_name: pleroma
    restart: unless-stopped
    ports:
      - "20210:20210"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20210 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pleroma"
    #   - "homepage.description=Lightweight federated social network; alternative to Mastodon."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pleroma.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20210"
    #   - "homepage.server=localhost"

networks:
  default:
    name: pleroma_net
