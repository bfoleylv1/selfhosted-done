# vault - docker compose (single host)
# image verified to exist at generation time: hashicorp/vault:latest

services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    restart: unless-stopped
    ports:
      - "20346:8200"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8200/v1/sys/health || wget -qO- http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=vault"
    #   - "homepage.description=Secrets management platform; secure storage for sensitive data."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=vault.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20346"
    #   - "homepage.server=localhost"

networks:
  default:
    name: vault_net
