# vault - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml vault
# image verified to exist at generation time: hashicorp/vault:latest

services:
  vault:
    image: hashicorp/vault:latest
    ports:
      - target: 8200
        published: 20346
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - vault_config:/config
      - vault_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8200/v1/sys/health || wget -qO- http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=vault"
    #   - "homepage.description=Secrets management platform; secure storage for sensitive data."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=vault.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20346"
    #   - "homepage.server=localhost"

volumes:
  vault_config:
  vault_data:

networks:
  default:
    name: vault_net
    driver: overlay
    attachable: true
