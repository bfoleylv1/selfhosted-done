# stalwart-mail - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml stalwart-mail
# image verified to exist at generation time: stalwartlabs/stalwart:latest

services:
  stalwart-mail:
    image: stalwartlabs/stalwart:latest
    ports:
      - target: 20299
        published: 20299
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - stalwart-mail_config:/config
      - stalwart-mail_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20299 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=stalwart-mail"
    #   - "homepage.description=stalwart-mail self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=stalwart-mail.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20299"
    #   - "homepage.server=localhost"

volumes:
  stalwart-mail_config:
  stalwart-mail_data:

networks:
  default:
    name: stalwart-mail_net
    driver: overlay
    attachable: true
