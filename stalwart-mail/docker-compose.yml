# stalwart-mail - docker compose (single host)
# image verified to exist at generation time: stalwartlabs/stalwart:latest

services:
  stalwart-mail:
    image: stalwartlabs/stalwart:latest
    container_name: stalwart-mail
    restart: unless-stopped
    ports:
      - "20299:20299"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20299 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=stalwart-mail"
    #   - "homepage.description=All-in-one mail server (SMTP/IMAP/JMAP) written in Rust."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=stalwart-mail.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20299"
    #   - "homepage.server=localhost"

networks:
  default:
    name: stalwart-mail_net
