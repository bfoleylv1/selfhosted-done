# kong - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml kong
# image verified to exist at generation time: kong/kong:latest

services:
  kong:
    image: kong/kong:latest
    ports:
      - target: 20133
        published: 20133
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - kong_config:/config
      - kong_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20133 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=kong"
    #   - "homepage.description=Kong Gateway; cloud-native API, LLM, and MCP gateway solution."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=kong.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20133"
    #   - "homepage.server=localhost"

volumes:
  kong_config:
  kong_data:

networks:
  default:
    name: kong_net
    driver: overlay
    attachable: true
