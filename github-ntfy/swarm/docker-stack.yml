# github-ntfy - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml github-ntfy
# image verified to exist at generation time: binwiederhier/ntfy:latest

services:
  github-ntfy:
    image: binwiederhier/ntfy:latest
    ports:
      - target: 20091
        published: 20091
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - github-ntfy_config:/config
      - github-ntfy_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20091 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=github-ntfy"
    #   - "homepage.description=ntfy push notifications for GitHub events."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=github-ntfy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20091"
    #   - "homepage.server=localhost"

volumes:
  github-ntfy_config:
  github-ntfy_data:

networks:
  default:
    name: github-ntfy_net
    driver: overlay
    attachable: true
