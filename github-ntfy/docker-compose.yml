# github-ntfy - docker compose (single host)
# image verified to exist at generation time: binwiederhier/ntfy:latest

services:
  github-ntfy:
    image: binwiederhier/ntfy:latest
    container_name: github-ntfy
    restart: unless-stopped
    ports:
      - "20091:20091"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20091 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=github-ntfy"
    #   - "homepage.description=github-ntfy self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=github-ntfy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20091"
    #   - "homepage.server=localhost"

networks:
  default:
    name: github-ntfy_net
