# omnipay - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml omnipay
# image verified to exist at generation time: php:8.2-fpm

services:
  omnipay:
    image: php:8.2-fpm
    ports:
      - target: 20172
        published: 20172
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - omnipay_config:/config
      - omnipay_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20172 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=omnipay"
    #   - "homepage.description=Multi-gateway payment processing library for PHP."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=omnipay.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20172"
    #   - "homepage.server=localhost"

volumes:
  omnipay_config:
  omnipay_data:

networks:
  default:
    name: omnipay_net
    driver: overlay
    attachable: true
