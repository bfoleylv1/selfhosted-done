# daisy - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  daisy:
    image: alpine:3.20
    container_name: daisy
    restart: unless-stopped
    ports:
      - "20040:20040"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20040 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=daisy"
    #   - "homepage.description=Self-hosted service.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=daisy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20040"
    #   - "homepage.server=localhost"

networks:
  default:
    name: daisy_net
