# shopware - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml shopware
# image verified to exist at generation time: dockware/dev:latest

services:
  shopware:
    image: dockware/dev:latest
    ports:
      - target: 80
        published: 20279
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - shopware_config:/config
      - shopware_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=shopware"
    #   - "homepage.description=E-commerce platform; open source and enterprise editions available.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=shopware.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20279"
    #   - "homepage.server=localhost"

volumes:
  shopware_config:
  shopware_data:

networks:
  default:
    name: shopware_net
    driver: overlay
    attachable: true
