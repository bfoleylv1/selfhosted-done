# zincsearch - docker compose (single host)
# image verified to exist at generation time: public.ecr.aws/zinclabs/zincsearch:latest

services:
  zincsearch:
    image: public.ecr.aws/zinclabs/zincsearch:latest
    container_name: zincsearch
    restart: unless-stopped
    ports:
      - "4080:4080"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zincsearch"
    #   - "homepage.description=Lightweight search engine (Elasticsearch alternative)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zincsearch.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:4080"
    #   - "homepage.server=localhost"

networks:
  default:
    name: zincsearch_net
