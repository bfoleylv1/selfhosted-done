# yaade - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml yaade
# image verified to exist at generation time: yaade/yaade:latest

services:
  yaade:
    # image: yaade/yaade:latest  # UNVERIFIED
    ports:
      - target: 20520
        published: 20520
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - yaade_config:/config
      - yaade_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20520 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=yaade"
    #   - "homepage.description=yaade self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=yaade.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20520"
    #   - "homepage.server=localhost"

volumes:
  yaade_config:
  yaade_data:

networks:
  default:
    name: yaade_net
    driver: overlay
    attachable: true
