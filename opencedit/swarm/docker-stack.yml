# opencedit - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml opencedit
# image verified to exist at generation time: opencut/opencut:latest

services:
  opencedit:
    # image: opencut/opencut:latest  # UNVERIFIED
    ports:
      - target: 20487
        published: 20487
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - opencedit_config:/config
      - opencedit_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20487 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=opencedit"
    #   - "homepage.description=opencedit self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=opencedit.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20487"
    #   - "homepage.server=localhost"

volumes:
  opencedit_config:
  opencedit_data:

networks:
  default:
    name: opencedit_net
    driver: overlay
    attachable: true
