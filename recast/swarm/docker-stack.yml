# recast - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml recast
# image verified to exist at generation time: alpine:3.20

services:
  recast:
    image: alpine:3.20
    ports:
      - target: 20237
        published: 20237
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - recast_config:/config
      - recast_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20237 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=recast"
    #   - "homepage.description=Media server with transcoding; organize and watch your TV shows/movies.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=recast.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20237"
    #   - "homepage.server=localhost"

volumes:
  recast_config:
  recast_data:

networks:
  default:
    name: recast_net
    driver: overlay
    attachable: true
