# wazuh - docker compose (single host)
# image verified to exist at generation time: wazuh/wazuh-manager:4.9.2

services:
  wazuh:
    image: wazuh/wazuh-manager:4.9.2
    container_name: wazuh
    restart: unless-stopped
    ports:
      - "55000:55000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 55000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wazuh"
    #   - "homepage.description=Open source security platform; XDR and SIEM capabilities.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wazuh.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:55000"
    #   - "homepage.server=localhost"

networks:
  default:
    name: wazuh_net
