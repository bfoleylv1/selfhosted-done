# espocrm - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  database:
    image: mariadb:12.2
    container_name: db-espocrm
    environment:
    - MARIADB_ROOT_PASSWORD=password
    - MARIADB_DATABASE=espocrm
    - MARIADB_USER=espocrm
    - MARIADB_PASSWORD=password
    volumes:
    - ./espocrm-db:/var/lib/mysql
    restart: always
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 1m
      start_period: 30s
      timeout: 10s
      retries: 3
  application:
    image: espocrm/espocrm:latest
    container_name: app-espocrm
    environment:
    - ESPOCRM_DATABASE_PLATFORM=Mysql
    - ESPOCRM_DATABASE_HOST=espocrm-db
    - ESPOCRM_DATABASE_USER=espocrm
    - ESPOCRM_DATABASE_PASSWORD=password
    - ESPOCRM_ADMIN_USERNAME=admin
    - ESPOCRM_ADMIN_PASSWORD=password
    - ESPOCRM_SITE_URL=http://localhost:20573
    - ESPOCRM_DEFAULT_CURRENCY=EUR
    volumes:
    - ./espocrm-data:/var/www/html
    restart: always
    depends_on:
      database:
        condition: service_started
    ports:
    - 20573:80
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
