# graphite - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml graphite
# image verified to exist at generation time: graphiteapp/graphite-statsd:latest

services:
  graphite:
    image: graphiteapp/graphite-statsd:latest
    ports:
      - target: 20105
        published: 20105
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - graphite_config:/config
      - graphite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20105 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=graphite"
    #   - "homepage.description=graphite self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=graphite.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20105"
    #   - "homepage.server=localhost"

volumes:
  graphite_config:
  graphite_data:

networks:
  default:
    name: graphite_net
    driver: overlay
    attachable: true
