# graphite - docker compose (single host)
# image verified to exist at generation time: graphiteapp/graphite-statsd:latest

services:
  graphite:
    image: graphiteapp/graphite-statsd:latest
    container_name: graphite
    restart: unless-stopped
    ports:
      - "20105:20105"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20105 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=graphite"
    #   - "homepage.description=Enterprise monitoring and time-series database; monitoring graphs."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=graphite.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20105"
    #   - "homepage.server=localhost"

networks:
  default:
    name: graphite_net
