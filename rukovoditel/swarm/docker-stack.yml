# rukovoditel - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml rukovoditel
# image verified to exist at generation time: php:8.2-apache

services:
  rukovoditel:
    image: php:8.2-apache
    ports:
      - target: 20259
        published: 20259
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - rukovoditel_config:/config
      - rukovoditel_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20259 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rukovoditel"
    #   - "homepage.description=Free web-based project management and CRM."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rukovoditel.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20259"
    #   - "homepage.server=localhost"

volumes:
  rukovoditel_config:
  rukovoditel_data:

networks:
  default:
    name: rukovoditel_net
    driver: overlay
    attachable: true
