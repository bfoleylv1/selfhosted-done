# synapse - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml synapse
# image verified to exist at generation time: matrixdotorg/synapse:latest

services:
  synapse:
    image: matrixdotorg/synapse:latest
    ports:
      - target: 8008
        published: 20318
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - synapse_config:/config
      - synapse_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8008/health || wget -qO- http://127.0.0.1:8008/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=synapse"
    #   - "homepage.description=Reference Matrix homeserver for federated chat."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=synapse.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20318"
    #   - "homepage.server=localhost"

volumes:
  synapse_config:
  synapse_data:

networks:
  default:
    name: synapse_net
    driver: overlay
    attachable: true
