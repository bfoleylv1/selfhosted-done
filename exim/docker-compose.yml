# exim - docker compose (single host)
# image verified to exist at generation time: debian:12-slim

services:
  exim:
    image: debian:12-slim
    container_name: exim
    restart: unless-stopped
    ports:
      - "20065:20065"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20065 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=exim"
    #   - "homepage.description=Mail transfer agent; configurable message transfer agent."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=exim.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20065"
    #   - "homepage.server=localhost"

networks:
  default:
    name: exim_net
