# exim - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml exim
# image verified to exist at generation time: debian:12-slim

services:
  exim:
    image: debian:12-slim
    ports:
      - target: 20065
        published: 20065
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - exim_config:/config
      - exim_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20065 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=exim"
    #   - "homepage.description=Mail transfer agent; configurable message transfer agent."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=exim.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20065"
    #   - "homepage.server=localhost"

volumes:
  exim_config:
  exim_data:

networks:
  default:
    name: exim_net
    driver: overlay
    attachable: true
