# raindrop-io - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  raindrop-io:
    image: alpine:3.20
    container_name: raindrop-io
    restart: unless-stopped
    ports:
      - "20231:20231"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20231 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=raindrop-io"
    #   - "homepage.description=Bookmarking service; save and organize bookmarks.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=raindrop-io.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20231"
    #   - "homepage.server=localhost"

networks:
  default:
    name: raindrop-io_net
