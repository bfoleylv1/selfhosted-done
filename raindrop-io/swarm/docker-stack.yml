# raindrop-io - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml raindrop-io
# image verified to exist at generation time: alpine:3.20

services:
  raindrop-io:
    image: alpine:3.20
    ports:
      - target: 20231
        published: 20231
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - raindrop-io_config:/config
      - raindrop-io_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20231 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=raindrop-io"
    #   - "homepage.description=Bookmarking service; save and organize bookmarks.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=raindrop-io.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20231"
    #   - "homepage.server=localhost"

volumes:
  raindrop-io_config:
  raindrop-io_data:

networks:
  default:
    name: raindrop-io_net
    driver: overlay
    attachable: true
