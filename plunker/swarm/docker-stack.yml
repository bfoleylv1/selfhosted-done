# plunker - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml plunker
# image verified to exist at generation time: node:20-alpine

services:
  plunker:
    image: node:20-alpine
    ports:
      - target: 20211
        published: 20211
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - plunker_config:/config
      - plunker_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20211 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=plunker"
    #   - "homepage.description=Online code editor / playground for web development."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=plunker.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20211"
    #   - "homepage.server=localhost"

volumes:
  plunker_config:
  plunker_data:

networks:
  default:
    name: plunker_net
    driver: overlay
    attachable: true
