# easypanel - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml easypanel
# image verified to exist at generation time: easypanel/easypanel:latest

services:
  easypanel:
    image: easypanel/easypanel:latest
    ports:
      - target: 3000
        published: 20056
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - easypanel_config:/config
      - easypanel_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=easypanel"
    #   - "homepage.description=Modern self-hosted PaaS control panel for Docker apps."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=easypanel.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20056"
    #   - "homepage.server=localhost"

volumes:
  easypanel_config:
  easypanel_data:

networks:
  default:
    name: easypanel_net
    driver: overlay
    attachable: true
