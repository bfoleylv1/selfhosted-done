# ollama - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml ollama
# image verified to exist at generation time: ollama/ollama:latest

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - target: 11434
        published: 11434
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - NVIDIA_DRIVER_CAPABILITIES=all
      # - NVIDIA_VISIBLE_DEVICES=all
      # - ONEAPI_DEVICE_SELECTOR=*        # Intel iGPU/Arc OpenVINO
      # - ZES_ENABLE_SYSMAN=1
    volumes:
      - ollama_config:/config
      - ollama_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11434/api/tags || wget -qO- http://127.0.0.1:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
          # - node.role == manager
          # GPU: add node-generic-resources to daemon.json and:
          #   - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
      # GPU: swarm ignores `devices:`/`runtime:`. Declare in
      #   /etc/docker/daemon.json: "node-generic-resources": ["gpu=1"]
      #   then use deploy.resources.reservations.generic_resources.
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ollama"
    #   - "homepage.description=Get started with Llama, Gemma, and other language models locally."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ollama.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:11434"
    #   - "homepage.server=localhost"

volumes:
  ollama_config:
  ollama_data:

networks:
  default:
    name: ollama_net
    driver: overlay
    attachable: true
