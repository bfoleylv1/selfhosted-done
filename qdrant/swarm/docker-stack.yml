# qdrant - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml qdrant
# image verified to exist at generation time: qdrant/qdrant:latest

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - target: 6333
        published: 20227
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - NVIDIA_DRIVER_CAPABILITIES=all
      # - NVIDIA_VISIBLE_DEVICES=all
      # - ONEAPI_DEVICE_SELECTOR=*        # Intel iGPU/Arc OpenVINO
      # - ZES_ENABLE_SYSMAN=1
    volumes:
      - qdrant_config:/config
      - qdrant_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6333/ || wget -qO- http://127.0.0.1:6333/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
          # - node.role == manager
          # GPU: add node-generic-resources to daemon.json and:
          #   - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
      # GPU: swarm ignores `devices:`/`runtime:`. Declare in
      #   /etc/docker/daemon.json: "node-generic-resources": ["gpu=1"]
      #   then use deploy.resources.reservations.generic_resources.
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=qdrant"
    #   - "homepage.description=Fast and privacy-friendly vector search engine with an easy-to-use gRPC API."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=qdrant.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20227"
    #   - "homepage.server=localhost"

volumes:
  qdrant_config:
  qdrant_data:

networks:
  default:
    name: qdrant_net
    driver: overlay
    attachable: true
