# libvirt - docker compose (single host)
# image verified to exist at generation time: ubuntu:24.04

services:
  libvirt:
    image: ubuntu:24.04
    container_name: libvirt
    restart: unless-stopped
    ports:
      - "16509:16509"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - LIBVA_DRIVER_NAME=iHD
      # - INTEL_GPU=1
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 16509 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # devices:
    #   - /dev/kvm:/dev/kvm
    #   - /dev/dri:/dev/dri
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=libvirt"
    #   - "homepage.description=Open source virtualization API; manage VMs and containers.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=libvirt.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:16509"
    #   - "homepage.server=localhost"

networks:
  default:
    name: libvirt_net
