# libvirt - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml libvirt
# image verified to exist at generation time: ubuntu:24.04

services:
  libvirt:
    image: ubuntu:24.04
    ports:
      - target: 16509
        published: 16509
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - LIBVA_DRIVER_NAME=iHD
      # - INTEL_GPU=1
    volumes:
      - libvirt_config:/config
      - libvirt_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 16509 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
          # - node.role == manager
          # GPU: add node-generic-resources to daemon.json and:
          #   - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
      # GPU: swarm ignores `devices:`/`runtime:`. Declare in
      #   /etc/docker/daemon.json: "node-generic-resources": ["gpu=1"]
      #   then use deploy.resources.reservations.generic_resources.
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=libvirt"
    #   - "homepage.description=Open source virtualization API; manage VMs and containers."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=libvirt.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:16509"
    #   - "homepage.server=localhost"

volumes:
  libvirt_config:
  libvirt_data:

networks:
  default:
    name: libvirt_net
    driver: overlay
    attachable: true
