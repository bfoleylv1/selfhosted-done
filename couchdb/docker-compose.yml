# couchdb - docker compose (single host)
# image verified to exist at generation time: couchdb:3

services:
  couchdb:
    image: couchdb:3
    container_name: couchdb
    restart: unless-stopped
    ports:
      - "5984:5984"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5984 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=couchdb"
    #   - "homepage.description=ouchdb-style JSON document database with MVCC and multi-master replication."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=couchdb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5984"
    #   - "homepage.server=localhost"

networks:
  default:
    name: couchdb_net
