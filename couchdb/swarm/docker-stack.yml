# couchdb - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml couchdb
# image verified to exist at generation time: couchdb:3

services:
  couchdb:
    image: couchdb:3
    ports:
      - target: 5984
        published: 5984
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - couchdb_config:/config
      - couchdb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5984 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=couchdb"
    #   - "homepage.description=ouchdb-style JSON document database with MVCC and multi-master replication."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=couchdb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5984"
    #   - "homepage.server=localhost"

volumes:
  couchdb_config:
  couchdb_data:

networks:
  default:
    name: couchdb_net
    driver: overlay
    attachable: true
