# consul - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml consul
# image verified to exist at generation time: hashicorp/consul:latest

services:
  consul:
    image: hashicorp/consul:latest
    ports:
      - target: 8500
        published: 8500
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - consul_config:/config
      - consul_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8500/v1/status/leader || wget -qO- http://127.0.0.1:8500/v1/status/leader || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Automation"
    #   - "homepage.name=consul"
    #   - "homepage.description=Service mesh solution; service discovery and configuration."
    #   - "homepage.tags=Automation,Infrastructure"
    #   - "homepage.icon=consul.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8500"
    #   - "homepage.server=localhost"

volumes:
  consul_config:
  consul_data:

networks:
  default:
    name: consul_net
    driver: overlay
    attachable: true
