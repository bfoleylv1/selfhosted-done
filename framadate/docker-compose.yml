# framadate - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  framadate:
    image: php:8.2-apache
    container_name: framadate
    restart: unless-stopped
    ports:
      - "20076:20076"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20076 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=framadate"
    #   - "homepage.description=Self-hosted poll and meeting-scheduling tool.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=framadate.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20076"
    #   - "homepage.server=localhost"

networks:
  default:
    name: framadate_net
