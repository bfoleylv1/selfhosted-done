# framadate - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml framadate
# image verified to exist at generation time: php:8.2-apache

services:
  framadate:
    image: php:8.2-apache
    ports:
      - target: 20076
        published: 20076
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - framadate_config:/config
      - framadate_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20076 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=framadate"
    #   - "homepage.description=Self-hosted poll and meeting-scheduling tool."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=framadate.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20076"
    #   - "homepage.server=localhost"

volumes:
  framadate_config:
  framadate_data:

networks:
  default:
    name: framadate_net
    driver: overlay
    attachable: true
