# workadventure - docker compose (single host)
# image verified to exist at generation time: thecodingmachine/workadventure-play:master

services:
  workadventure:
    image: thecodingmachine/workadventure-play:master
    container_name: workadventure
    restart: unless-stopped
    ports:
      - "20370:20370"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20370 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=workadventure"
    #   - "homepage.description=workadventure self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=workadventure.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20370"
    #   - "homepage.server=localhost"

networks:
  default:
    name: workadventure_net
