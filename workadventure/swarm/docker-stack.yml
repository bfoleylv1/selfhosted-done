# workadventure - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml workadventure
# image verified to exist at generation time: thecodingmachine/workadventure-play:master

services:
  workadventure:
    image: thecodingmachine/workadventure-play:master
    ports:
      - target: 20370
        published: 20370
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - workadventure_config:/config
      - workadventure_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20370 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=workadventure"
    #   - "homepage.description=Collaborative virtual office / worlds (MMORPG-style).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=workadventure.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20370"
    #   - "homepage.server=localhost"

volumes:
  workadventure_config:
  workadventure_data:

networks:
  default:
    name: workadventure_net
    driver: overlay
    attachable: true
