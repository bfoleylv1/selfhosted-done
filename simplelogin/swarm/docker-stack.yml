# simplelogin - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml simplelogin
# image verified to exist at generation time: simplelogin/app:latest

services:
  simplelogin:
    image: simplelogin/app:latest
    ports:
      - target: 20505
        published: 20505
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - simplelogin_config:/config
      - simplelogin_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20505 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=simplelogin"
    #   - "homepage.description=simplelogin self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=simplelogin.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20505"
    #   - "homepage.server=localhost"

volumes:
  simplelogin_config:
  simplelogin_data:

networks:
  default:
    name: simplelogin_net
    driver: overlay
    attachable: true
