# simplelogin - docker compose (single host)
# image verified to exist at generation time: simplelogin/app:latest

services:
  simplelogin:
    image: simplelogin/app:latest
    container_name: simplelogin
    restart: unless-stopped
    ports:
      - "20505:20505"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20505 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=simplelogin"
    #   - "homepage.description=SimpleLogin: open-source email alias/forwarding service for protecting your real email address."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=simplelogin.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20505"
    #   - "homepage.server=localhost"

networks:
  default:
    name: simplelogin_net
