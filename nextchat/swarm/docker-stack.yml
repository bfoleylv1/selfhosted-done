# nextchat - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml nextchat
# image verified to exist at generation time: yidadaa/chatgpt-next-web:latest

services:
  nextchat:
    image: yidadaa/chatgpt-next-web:latest
    ports:
      - target: 20164
        published: 20164
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - nextchat_config:/config
      - nextchat_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20164 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=nextchat"
    #   - "homepage.description=Next-generation web UI for ChatGPT and other LLMs.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=nextchat.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20164"
    #   - "homepage.server=localhost"

volumes:
  nextchat_config:
  nextchat_data:

networks:
  default:
    name: nextchat_net
    driver: overlay
    attachable: true
