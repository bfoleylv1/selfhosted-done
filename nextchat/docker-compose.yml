# nextchat - docker compose (single host)
# image verified to exist at generation time: yidadaa/chatgpt-next-web:latest

services:
  nextchat:
    image: yidadaa/chatgpt-next-web:latest
    container_name: nextchat
    restart: unless-stopped
    ports:
      - "20164:20164"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20164 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=nextchat"
    #   - "homepage.description=Next-generation web UI for ChatGPT and other LLMs."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=nextchat.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20164"
    #   - "homepage.server=localhost"

networks:
  default:
    name: nextchat_net
