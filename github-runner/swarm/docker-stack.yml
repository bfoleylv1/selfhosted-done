# github-runner - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml github-runner
# image verified to exist at generation time: myoung34/github-runner:latest

services:
  github-runner:
    image: myoung34/github-runner:latest
    ports:
      - target: 20092
        published: 20092
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - github-runner_config:/config
      - github-runner_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=github-runner"
    #   - "homepage.description=Self-hosted GitHub Actions runner.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=github-runner.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20092"
    #   - "homepage.server=localhost"

volumes:
  github-runner_config:
  github-runner_data:

networks:
  default:
    name: github-runner_net
    driver: overlay
    attachable: true
