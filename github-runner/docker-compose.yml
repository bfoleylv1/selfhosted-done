# github-runner - docker compose (single host)
# image verified to exist at generation time: myoung34/github-runner:latest

services:
  github-runner:
    image: myoung34/github-runner:latest
    container_name: github-runner
    restart: unless-stopped
    ports:
      - "20092:20092"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=github-runner"
    #   - "homepage.description=Self-hosted GitHub Actions runner.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=github-runner.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20092"
    #   - "homepage.server=localhost"

networks:
  default:
    name: github-runner_net
