# zim - docker compose (single host)
# image verified to exist at generation time: ghcr.io/openzim/zim-tools:latest

services:
  zim:
    image: ghcr.io/openzim/zim-tools:latest
    container_name: zim
    restart: unless-stopped
    ports:
      - "20385:20385"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20385 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zim"
    #   - "homepage.description=File format for offline Wikipedia and other Wikimedia content."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zim.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20385"
    #   - "homepage.server=localhost"

networks:
  default:
    name: zim_net
