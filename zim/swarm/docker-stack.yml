# zim - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml zim
# image verified to exist at generation time: ghcr.io/openzim/zim-tools:latest

services:
  zim:
    image: ghcr.io/openzim/zim-tools:latest
    ports:
      - target: 20385
        published: 20385
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - zim_config:/config
      - zim_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20385 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zim"
    #   - "homepage.description=zim self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zim.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20385"
    #   - "homepage.server=localhost"

volumes:
  zim_config:
  zim_data:

networks:
  default:
    name: zim_net
    driver: overlay
    attachable: true
