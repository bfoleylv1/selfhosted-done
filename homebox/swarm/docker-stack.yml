# homebox - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml homebox
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: ghcr.io/sysadminsmedia/homebox:latest
    user: 65532:65532
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - homebox_homebox_data:/data
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - api
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 7745
      published: 7745
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=homebox"
    #   - "homepage.description=homebox self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=homebox.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:7745"
    #   - "homepage.server=localhost"
volumes:
  homebox_homebox_data: null
networks:
  default:
    name: homebox_net
    driver: overlay
    attachable: true
