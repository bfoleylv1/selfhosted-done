# homebox - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: ghcr.io/sysadminsmedia/homebox:latest
    container_name: app-homebox
    user: 65532:65532
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - ./homebox-data:/data
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - api
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 7745:7745
