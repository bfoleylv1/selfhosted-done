# canvas-lms - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml canvas-lms
# image verified to exist at generation time: instructure/canvas-lms:stable

services:
  canvas-lms:
    image: instructure/canvas-lms:stable
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - canvas-lms_config:/config
      - canvas-lms_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=canvas-lms"
    #   - "homepage.description=Open-source learning management system (LMS)."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=canvas-lms.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:3000"
    #   - "homepage.server=localhost"

volumes:
  canvas-lms_config:
  canvas-lms_data:

networks:
  default:
    name: canvas-lms_net
    driver: overlay
    attachable: true
