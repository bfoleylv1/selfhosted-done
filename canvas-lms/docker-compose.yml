# canvas-lms - docker compose (single host)
# image verified to exist at generation time: instructure/canvas-lms:stable

services:
  canvas-lms:
    image: instructure/canvas-lms:stable
    container_name: canvas-lms
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=canvas-lms"
    #   - "homepage.description=Open-source learning management system (LMS)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=canvas-lms.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:3000"
    #   - "homepage.server=localhost"

networks:
  default:
    name: canvas-lms_net
