# thelia - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml thelia
# image verified to exist at generation time: php:8.2-apache

services:
  thelia:
    image: php:8.2-apache
    ports:
      - target: 20325
        published: 20325
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - thelia_config:/config
      - thelia_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20325 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=thelia"
    #   - "homepage.description=thelia self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=thelia.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20325"
    #   - "homepage.server=localhost"

volumes:
  thelia_config:
  thelia_data:

networks:
  default:
    name: thelia_net
    driver: overlay
    attachable: true
