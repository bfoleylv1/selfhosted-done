# thanos - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml thanos
# image verified to exist at generation time: quay.io/thanos/thanos:v0.37.2

services:
  thanos:
    image: quay.io/thanos/thanos:v0.37.2
    ports:
      - target: 10901
        published: 10902
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - thanos_config:/config
      - thanos_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10901/metrics || wget -qO- http://127.0.0.1:10901/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=thanos"
    #   - "homepage.description=Highly available Prometheus; long-term storage solution."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=thanos.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:10902"
    #   - "homepage.server=localhost"

volumes:
  thanos_config:
  thanos_data:

networks:
  default:
    name: thanos_net
    driver: overlay
    attachable: true
