# wallos - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml wallos
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: bellamy/wallos:latest
    environment:
    - TZ=America/Los_Angeles
    volumes:
    - wallos_wallos_data_db:/var/www/html/db
    - wallos_wallos_data_logos:/var/www/html/images/uploads/logos
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - nginx
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 80
      published: 20615
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wallos"
    #   - "homepage.description=wallos self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wallos.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20615"
    #   - "homepage.server=localhost"
volumes:
  wallos_wallos_data_db: null
  wallos_wallos_data_logos: null
networks:
  default:
    name: wallos_net
    driver: overlay
    attachable: true
