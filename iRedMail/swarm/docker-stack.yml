# iRedMail - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml iRedMail
# image verified to exist at generation time: ubuntu:24.04

services:
  iRedMail:
    image: ubuntu:24.04
    ports:
      - target: 20114
        published: 20114
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - iRedMail_config:/config
      - iRedMail_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20114 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=iRedMail"
    #   - "homepage.description=iRedMail self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=iRedMail.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20114"
    #   - "homepage.server=localhost"

volumes:
  iRedMail_config:
  iRedMail_data:

networks:
  default:
    name: iRedMail_net
    driver: overlay
    attachable: true
