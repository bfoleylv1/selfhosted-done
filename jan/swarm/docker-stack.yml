# jan - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml jan
# image verified to exist at generation time: python:3.11-slim

services:
  jan:
    image: python:3.11-slim
    ports:
      - target: 1337
        published: 1337
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - NVIDIA_DRIVER_CAPABILITIES=all
      # - NVIDIA_VISIBLE_DEVICES=all
      # - ONEAPI_DEVICE_SELECTOR=*        # Intel iGPU/Arc OpenVINO
      # - ZES_ENABLE_SYSMAN=1
    volumes:
      - jan_config:/config
      - jan_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1337/ || wget -qO- http://127.0.0.1:1337/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
          # - node.role == manager
          # GPU: add node-generic-resources to daemon.json and:
          #   - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
      # GPU: swarm ignores `devices:`/`runtime:`. Declare in
      #   /etc/docker/daemon.json: "node-generic-resources": ["gpu=1"]
      #   then use deploy.resources.reservations.generic_resources.
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=jan"
    #   - "homepage.description=Desktop app for running open-source models locally with GPU acceleration."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=jan.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:1337"
    #   - "homepage.server=localhost"

volumes:
  jan_config:
  jan_data:

networks:
  default:
    name: jan_net
    driver: overlay
    attachable: true
