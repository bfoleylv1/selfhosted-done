# redirect - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  redirect:
    image: alpine:3.20
    container_name: redirect
    restart: unless-stopped
    ports:
      - "20238:20238"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20238 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=redirect"
    #   - "homepage.description=redirect self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=redirect.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20238"
    #   - "homepage.server=localhost"

networks:
  default:
    name: redirect_net
