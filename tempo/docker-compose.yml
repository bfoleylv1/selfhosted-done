# tempo - docker compose (single host)
# image verified to exist at generation time: grafana/tempo:latest

services:
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3200/ready || wget -qO- http://127.0.0.1:3200/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tempo"
    #   - "homepage.description=Distributed tracing platform; end-to-end telemetry collection."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tempo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:3200"
    #   - "homepage.server=localhost"

networks:
  default:
    name: tempo_net
