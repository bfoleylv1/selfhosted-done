# resilio-sync - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: linuxserver/resilio-sync:latest
    container_name: app-resilio-sync
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - ./resilio-sync-data/config:/config
    - ./resilio-sync-data/downloads:/downloads
    - ./resilio-sync-data/data:/sync
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - rslsync
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 20605:8888
