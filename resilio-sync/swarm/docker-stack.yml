# resilio-sync - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml resilio-sync
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: linuxserver/resilio-sync:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - resilio-sync_resilio_sync_data_config:/config
    - resilio-sync_resilio_sync_data_downloads:/downloads
    - resilio-sync_resilio_sync_data_data:/sync
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - rslsync
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 8888
      published: 20605
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=resilio-sync"
    #   - "homepage.description=resilio-sync self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=resilio-sync.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20605"
    #   - "homepage.server=localhost"
volumes:
  resilio-sync_resilio_sync_data_config: null
  resilio-sync_resilio_sync_data_downloads: null
  resilio-sync_resilio_sync_data_data: null
networks:
  default:
    name: resilio-sync_net
    driver: overlay
    attachable: true
