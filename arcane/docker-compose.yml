# arcane - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: ghcr.io/getarcaneapp/arcane:latest
    container_name: app-arcane
    environment:
    - APP_URL=http://localhost:3552
    - PUID=1000
    - PGID=1000
    - ENCRYPTION_KEY=verysecretkeythatshouldbereplaced
    - JWT_SECRET=verysecretkeythatshouldbereplaced
    - LOG_LEVEL=info
    - LOG_JSON=false
    - OIDC_ENABLED=false
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./arcane-data:/app/data
    - ./opt/dockerdata:/app/data/projects
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3552/
      - -s
      - -o
      - /dev/null
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 3552:3552
