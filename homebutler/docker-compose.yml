# homebutler - docker compose (single host)
# image verified to exist at generation time: homebutler/homebutler:latest

services:
  homebutler:
    # image: homebutler/homebutler:latest  # UNVERIFIED
    container_name: homebutler
    restart: unless-stopped
    ports:
      - "20536:20536"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20536 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=homebutler"
    #   - "homepage.description=homebutler self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=homebutler.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20536"
    #   - "homepage.server=localhost"

networks:
  default:
    name: homebutler_net
