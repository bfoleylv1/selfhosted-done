# homebutler - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml homebutler
# image verified to exist at generation time: homebutler/homebutler:latest

services:
  homebutler:
    # image: homebutler/homebutler:latest  # UNVERIFIED
    ports:
      - target: 20536
        published: 20536
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - homebutler_config:/config
      - homebutler_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20536 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=homebutler"
    #   - "homepage.description=homebutler self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=homebutler.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20536"
    #   - "homepage.server=localhost"

volumes:
  homebutler_config:
  homebutler_data:

networks:
  default:
    name: homebutler_net
    driver: overlay
    attachable: true
