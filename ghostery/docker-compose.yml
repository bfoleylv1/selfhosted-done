# ghostery - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  ghostery:
    image: alpine:3.20
    container_name: ghostery
    restart: unless-stopped
    ports:
      - "20089:20089"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20089 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ghostery"
    #   - "homepage.description=Privacy / tracker-blocking browser extension (commercial)."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ghostery.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20089"
    #   - "homepage.server=localhost"

networks:
  default:
    name: ghostery_net
