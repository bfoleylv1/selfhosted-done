# netbox - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  netbox:
    image: docker.io/netboxcommunity/netbox:latest
    container_name: netbox
    environment:
    - TZ=America/Los_Angeles
    volumes:
    - ./config:/etc/netbox/config:z,ro
    - ./netbox/media:/opt/netbox/netbox/media
    - ./netbox/reports:/opt/netbox/netbox/reports
    - ./netbox/scripts:/opt/netbox/netbox/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8080/login/ || exit 1
      start_period: 90s
      timeout: 3s
      interval: 15s
    restart: always
    ports:
    - 20593:8080
  netbox-worker:
    image: docker.io/netboxcommunity/netbox:latest
    container_name: worker-netbox
    environment:
    - TZ=America/Los_Angeles
    volumes:
    - ./config:/etc/netbox/config:z,ro
    - ./netbox/media:/opt/netbox/netbox/media
    - ./netbox/reports:/opt/netbox/netbox/reports
    - ./netbox/scripts:/opt/netbox/netbox/scripts
    depends_on:
      netbox:
        condition: service_healthy
    healthcheck:
      test: ps -aux | grep -v grep | grep -q rqworker || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
    restart: always
    command:
    - /opt/netbox/venv/bin/python
    - /opt/netbox/netbox/manage.py
    - rqworker
  postgres:
    image: docker.io/postgres:17-alpine
    container_name: netbox-postgres
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    volumes:
    - ./netbox/postgres/data:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    container_name: netbox-redis
    image: docker.io/valkey/valkey:8.1-alpine
    command:
    - sh
    - -c
    - valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD
    healthcheck:
      test: '[ $$(valkey-cli --pass "$${SUPER_SECRET}REDIS" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    volumes:
    - ./netbox/redis/data:/data
    restart: unless-stopped
  redis-cache:
    container_name: netbox-rediscache
    image: docker.io/valkey/valkey:8.1-alpine
    command:
    - sh
    - -c
    - valkey-server --requirepass $$REDIS_PASSWORD
    healthcheck:
      test: '[ $$(valkey-cli --pass "$${SUPER_SECRET}REDIS" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    volumes:
    - ./netbox/redis/cache:/data
    restart: unless-stopped
