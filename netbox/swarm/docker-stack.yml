# netbox - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml netbox
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  netbox:
    image: docker.io/netboxcommunity/netbox:latest
    environment:
    - TZ=America/Los_Angeles
    volumes:
    - netbox_config:/etc/netbox/config:z,ro
    - netbox_netbox_media:/opt/netbox/netbox/media
    - netbox_netbox_reports:/opt/netbox/netbox/reports
    - netbox_netbox_scripts:/opt/netbox/netbox/scripts
    healthcheck:
      test: curl -f http://localhost:8080/login/ || exit 1
      start_period: 90s
      timeout: 3s
      interval: 15s
    ports:
    - target: 8080
      published: 20593
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
  netbox-worker:
    image: docker.io/netboxcommunity/netbox:latest
    environment:
    - TZ=America/Los_Angeles
    volumes:
    - netbox_config:/etc/netbox/config:z,ro
    - netbox_netbox_media:/opt/netbox/netbox/media
    - netbox_netbox_reports:/opt/netbox/netbox/reports
    - netbox_netbox_scripts:/opt/netbox/netbox/scripts
    healthcheck:
      test: ps -aux | grep -v grep | grep -q rqworker || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
    command:
    - /opt/netbox/venv/bin/python
    - /opt/netbox/netbox/manage.py
    - rqworker
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
  postgres:
    image: docker.io/postgres:17-alpine
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    volumes:
    - netbox_netbox_postgres_data:/var/lib/postgresql/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
  redis:
    image: docker.io/valkey/valkey:8.1-alpine
    command:
    - sh
    - -c
    - valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD
    healthcheck:
      test: '[ $$(valkey-cli --pass "$${SUPER_SECRET}REDIS" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    volumes:
    - netbox_netbox_redis_data:/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
  redis-cache:
    image: docker.io/valkey/valkey:8.1-alpine
    command:
    - sh
    - -c
    - valkey-server --requirepass $$REDIS_PASSWORD
    healthcheck:
      test: '[ $$(valkey-cli --pass "$${SUPER_SECRET}REDIS" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    volumes:
    - netbox_netbox_redis_cache:/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=netbox"
    #   - "homepage.description=netbox self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=netbox.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20593"
    #   - "homepage.server=localhost"
volumes:
  netbox_config: null
  netbox_netbox_media: null
  netbox_netbox_reports: null
  netbox_netbox_scripts: null
  netbox_netbox_postgres_data: null
  netbox_netbox_redis_data: null
  netbox_netbox_redis_cache: null
networks:
  default:
    name: netbox_net
    driver: overlay
    attachable: true
