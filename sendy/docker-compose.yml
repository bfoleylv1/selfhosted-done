# sendy - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  sendy:
    image: php:8.2-apache
    container_name: sendy
    restart: unless-stopped
    ports:
      - "20271:20271"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20271 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sendy"
    #   - "homepage.description=sendy self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sendy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20271"
    #   - "homepage.server=localhost"

networks:
  default:
    name: sendy_net
