# elk - docker compose (single host)
# image verified to exist at generation time: sebp/elk:latest

services:
  elk:
    image: sebp/elk:latest
    container_name: elk
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5601 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
