# rustdesk-server - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: rustdesk/rustdesk-server:latest
    container_name: app-rustdesk-server-hbbs
    command: hbbs
    volumes:
    - ./rustdesk-server-data/hbbs:/root
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    - ALWAYS_USE_RELAY=N
    depends_on:
      hbbr:
        condition: service_started
    restart: always
    ports:
    - 20606:80
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: app-rustdesk-server-hbbr
    command: hbbr
    volumes:
    - ./rustdesk-server-data/hbbr:/root
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    restart: always
