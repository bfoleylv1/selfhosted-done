# gotify - docker compose (single host)
# image verified to exist at generation time: gotify/server:latest

services:
  gotify:
    image: gotify/server:latest
    container_name: gotify
    restart: unless-stopped
    ports:
      - "20448:20448"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20448 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=gotify"
    #   - "homepage.description=Gotify self-hosted service."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=gotify.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20448"
    #   - "homepage.server=localhost"

networks:
  default:
    name: gotify_net
