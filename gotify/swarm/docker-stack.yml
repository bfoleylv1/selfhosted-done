# gotify - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml gotify
# image verified to exist at generation time: gotify/server:latest

services:
  gotify:
    image: gotify/server:latest
    ports:
      - target: 20448
        published: 20448
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - gotify_config:/config
      - gotify_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20448 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=gotify"
    #   - "homepage.description=Gotify: simple self-hosted push notification server (Android/iOS/desktop)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=gotify.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20448"
    #   - "homepage.server=localhost"

volumes:
  gotify_config:
  gotify_data:

networks:
  default:
    name: gotify_net
    driver: overlay
    attachable: true
