# para - docker compose (single host)
# image verified to exist at generation time: eclipse-temurin:17-jre

services:
  para:
    image: eclipse-temurin:17-jre
    container_name: para
    restart: unless-stopped
    ports:
      - "20190:20190"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20190 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=para"
    #   - "homepage.description=Flexible open-source backend framework / object storage."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=para.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20190"
    #   - "homepage.server=localhost"

networks:
  default:
    name: para_net
