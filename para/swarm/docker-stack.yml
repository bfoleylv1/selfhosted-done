# para - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml para
# image verified to exist at generation time: eclipse-temurin:17-jre

services:
  para:
    image: eclipse-temurin:17-jre
    ports:
      - target: 20190
        published: 20190
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - para_config:/config
      - para_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20190 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=para"
    #   - "homepage.description=Flexible open-source backend framework / object storage."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=para.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20190"
    #   - "homepage.server=localhost"

volumes:
  para_config:
  para_data:

networks:
  default:
    name: para_net
    driver: overlay
    attachable: true
