# ejabberd - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml ejabberd
# image verified to exist at generation time: ejabberd/ecs:latest

services:
  ejabberd:
    image: ejabberd/ecs:latest
    ports:
      - target: 5280
        published: 5280
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ejabberd_config:/config
      - ejabberd_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5280 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ejabberd"
    #   - "homepage.description=Robust XMPP / Jabber messaging server."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ejabberd.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5280"
    #   - "homepage.server=localhost"

volumes:
  ejabberd_config:
  ejabberd_data:

networks:
  default:
    name: ejabberd_net
    driver: overlay
    attachable: true
