# ejabberd - docker compose (single host)
# image verified to exist at generation time: ejabberd/ecs:latest

services:
  ejabberd:
    image: ejabberd/ecs:latest
    container_name: ejabberd
    restart: unless-stopped
    ports:
      - "5280:5280"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5280 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ejabberd"
    #   - "homepage.description=ejabberd self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ejabberd.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5280"
    #   - "homepage.server=localhost"

networks:
  default:
    name: ejabberd_net
