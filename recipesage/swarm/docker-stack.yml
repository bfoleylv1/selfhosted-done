# recipesage - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml recipesage
# image verified to exist at generation time: recipesage/recipesage:latest

services:
  recipesage:
    # image: recipesage/recipesage:latest  # UNVERIFIED
    ports:
      - target: 20500
        published: 20500
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - recipesage_config:/config
      - recipesage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20500 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=recipesage"
    #   - "homepage.description=recipesage self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=recipesage.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20500"
    #   - "homepage.server=localhost"

volumes:
  recipesage_config:
  recipesage_data:

networks:
  default:
    name: recipesage_net
    driver: overlay
    attachable: true
