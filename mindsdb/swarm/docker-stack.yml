# mindsdb - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml mindsdb
# image verified to exist at generation time: mindsdb/mindsdb:latest

services:
  mindsdb:
    image: mindsdb/mindsdb:latest
    ports:
      - target: 20476
        published: 20476
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - mindsdb_config:/config
      - mindsdb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20476 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mindsdb"
    #   - "homepage.description=MindsDB: open-source machine learning platform that brings ML to your database."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mindsdb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20476"
    #   - "homepage.server=localhost"

volumes:
  mindsdb_config:
  mindsdb_data:

networks:
  default:
    name: mindsdb_net
    driver: overlay
    attachable: true
