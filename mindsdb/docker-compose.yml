# mindsdb - docker compose (single host)
# image verified to exist at generation time: mindsdb/mindsdb:latest

services:
  mindsdb:
    image: mindsdb/mindsdb:latest
    container_name: mindsdb
    restart: unless-stopped
    ports:
      - "20476:20476"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20476 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mindsdb"
    #   - "homepage.description=mindsdb self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mindsdb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20476"
    #   - "homepage.server=localhost"

networks:
  default:
    name: mindsdb_net
