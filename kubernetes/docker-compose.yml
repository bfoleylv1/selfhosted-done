# kubernetes - docker compose (single host)
# image verified to exist at generation time: registry.k8s.io/kube-apiserver:v1.31.0

services:
  kubernetes:
    image: registry.k8s.io/kube-apiserver:v1.31.0
    container_name: kubernetes
    restart: unless-stopped
    ports:
      - "20135:6443"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - LIBVA_DRIVER_NAME=iHD
      # - INTEL_GPU=1
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6443/healthz || wget -qO- http://127.0.0.1:6443/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # devices:
    #   - /dev/kvm:/dev/kvm
    #   - /dev/dri:/dev/dri
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=kubernetes"
    #   - "homepage.description=System for automating deployment, scaling, and management."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=kubernetes.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20135"
    #   - "homepage.server=localhost"

networks:
  default:
    name: kubernetes_net
