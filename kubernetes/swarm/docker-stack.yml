# kubernetes - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml kubernetes
# image verified to exist at generation time: registry.k8s.io/kube-apiserver:v1.31.0

services:
  kubernetes:
    image: registry.k8s.io/kube-apiserver:v1.31.0
    ports:
      - target: 6443
        published: 20135
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - LIBVA_DRIVER_NAME=iHD
      # - INTEL_GPU=1
    volumes:
      - kubernetes_config:/config
      - kubernetes_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6443/healthz || wget -qO- http://127.0.0.1:6443/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
          # - node.role == manager
          # GPU: add node-generic-resources to daemon.json and:
          #   - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
      # GPU: swarm ignores `devices:`/`runtime:`. Declare in
      #   /etc/docker/daemon.json: "node-generic-resources": ["gpu=1"]
      #   then use deploy.resources.reservations.generic_resources.
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=kubernetes"
    #   - "homepage.description=System for automating deployment, scaling, and management."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=kubernetes.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20135"
    #   - "homepage.server=localhost"

volumes:
  kubernetes_config:
  kubernetes_data:

networks:
  default:
    name: kubernetes_net
    driver: overlay
    attachable: true
