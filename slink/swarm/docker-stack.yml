# slink - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml slink
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: anirdev/slink:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    - ORIGIN=https://your-domain.com
    - USER_APPROVAL_REQUIRED=true
    - USER_PASSWORD_MIN_LENGTH=8
    - USER_PASSWORD_REQUIREMENTS=15
    - IMAGE_MAX_SIZE=15M
    - STORAGE_PROVIDER=local
    volumes:
    - slink_slink_data_var_data:/app/var/data
    - slink_slink_data_images:/app/slink/images
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - slink
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 3000
      published: 20607
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=slink"
    #   - "homepage.description=slink self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=slink.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20607"
    #   - "homepage.server=localhost"
volumes:
  slink_slink_data_var_data: null
  slink_slink_data_images: null
networks:
  default:
    name: slink_net
    driver: overlay
    attachable: true
