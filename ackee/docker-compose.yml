# ackee - docker compose (single host)
# image verified to exist at generation time: electerious/ackee:latest

services:
  ackee:
    image: electerious/ackee:latest
    container_name: ackee
    restart: unless-stopped
    ports:
      - "20398:3000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Analytics"
    #   - "homepage.name=ackee"
    #   - "homepage.description=Lightweight anonymised web analytics; self-hosted solution."
    #   - "homepage.tags=Analytics,Monitoring"
    #   - "homepage.icon=ackee.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20398"
    #   - "homepage.server=localhost"

networks:
  default:
    name: ackee_net
