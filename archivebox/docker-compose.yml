# archivebox - docker compose (single host)
# image verified to exist at generation time: ghcr.io/archivebox/archivebox:latest

services:
  archivebox:
    image: ghcr.io/archivebox/archivebox:latest
    container_name: archivebox
    restart: unless-stopped
    ports:
      - "20413:8000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ || wget -qO- http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=archivebox"
    #   - "homepage.description=Archivebox self-hosted service."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=archivebox.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20413"
    #   - "homepage.server=localhost"

networks:
  default:
    name: archivebox_net
