# archivebox - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml archivebox
# image verified to exist at generation time: ghcr.io/archivebox/archivebox:latest

services:
  archivebox:
    image: ghcr.io/archivebox/archivebox:latest
    ports:
      - target: 8000
        published: 20413
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - archivebox_config:/config
      - archivebox_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ || wget -qO- http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=archivebox"
    #   - "homepage.description=ArchiveBox: open-source self-hosted internet archive (saves snapshots of websites)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=archivebox.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20413"
    #   - "homepage.server=localhost"

volumes:
  archivebox_config:
  archivebox_data:

networks:
  default:
    name: archivebox_net
    driver: overlay
    attachable: true
