# pastefy - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml pastefy
# image verified to exist at generation time: pastefy/pastefy:latest

services:
  pastefy:
    # image: pastefy/pastefy:latest  # UNVERIFIED
    ports:
      - target: 20492
        published: 20492
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - pastefy_config:/config
      - pastefy_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20492 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pastefy"
    #   - "homepage.description=pastefy self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pastefy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20492"
    #   - "homepage.server=localhost"

volumes:
  pastefy_config:
  pastefy_data:

networks:
  default:
    name: pastefy_net
    driver: overlay
    attachable: true
