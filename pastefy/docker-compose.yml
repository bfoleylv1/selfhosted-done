# pastefy - docker compose (single host)
# image verified to exist at generation time: pastefy/pastefy:latest

services:
  pastefy:
    # image: pastefy/pastefy:latest  # UNVERIFIED
    container_name: pastefy
    restart: unless-stopped
    ports:
      - "20492:20492"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20492 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pastefy"
    #   - "homepage.description=pastefy self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pastefy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20492"
    #   - "homepage.server=localhost"

networks:
  default:
    name: pastefy_net
