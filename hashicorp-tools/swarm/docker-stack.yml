# hashicorp-tools - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml hashicorp-tools
# image verified to exist at generation time: hashicorp/terraform:latest

services:
  hashicorp-tools:
    image: hashicorp/terraform:latest
    ports:
      - target: 20108
        published: 20108
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - hashicorp-tools_config:/config
      - hashicorp-tools_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20108 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=hashicorp-tools"
    #   - "homepage.description=Suite of infrastructure tools: Terraform, Vault, Consul, Nomad."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=hashicorp-tools.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20108"
    #   - "homepage.server=localhost"

volumes:
  hashicorp-tools_config:
  hashicorp-tools_data:

networks:
  default:
    name: hashicorp-tools_net
    driver: overlay
    attachable: true
