# hashicorp-tools - docker compose (single host)
# image verified to exist at generation time: hashicorp/terraform:latest

services:
  hashicorp-tools:
    image: hashicorp/terraform:latest
    container_name: hashicorp-tools
    restart: unless-stopped
    ports:
      - "20108:20108"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20108 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=hashicorp-tools"
    #   - "homepage.description=Suite of infrastructure tools: Terraform, Vault, Consul, Nomad."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=hashicorp-tools.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20108"
    #   - "homepage.server=localhost"

networks:
  default:
    name: hashicorp-tools_net
