# authelia - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml authelia
# image verified to exist at generation time: authelia/authelia:latest

services:
  authelia:
    image: authelia/authelia:latest
    ports:
      - target: 9091
        published: 9091
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - authelia_config:/config
      - authelia_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9091/api/health || wget -qO- http://127.0.0.1:9091/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=authelia"
    #   - "homepage.description=Identity and Access Proxy providing 2FA, SSO, and access controls for services."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=authelia.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9091"
    #   - "homepage.server=localhost"

volumes:
  authelia_config:
  authelia_data:

networks:
  default:
    name: authelia_net
    driver: overlay
    attachable: true
