# authelia - docker compose (single host)
# image verified to exist at generation time: authelia/authelia:latest

services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    ports:
      - "9091:9091"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9091/api/health || wget -qO- http://127.0.0.1:9091/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Authentication"
    #   - "homepage.name=authelia"
    #   - "homepage.description=Identity and Access Proxy providing 2FA, SSO, and access controls for services."
    #   - "homepage.tags=Authentication,User Management"
    #   - "homepage.icon=authelia.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9091"
    #   - "homepage.server=localhost"

networks:
  default:
    name: authelia_net
