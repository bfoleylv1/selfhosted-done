# tailchat - docker compose (single host)
# image verified to exist at generation time: tailhook/tailchat:latest

services:
  tailchat:
    # image: tailhook/tailchat:latest  # UNVERIFIED
    container_name: tailchat
    restart: unless-stopped
    ports:
      - "20514:20514"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20514 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tailchat"
    #   - "homepage.description=tailchat self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tailchat.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20514"
    #   - "homepage.server=localhost"

networks:
  default:
    name: tailchat_net
