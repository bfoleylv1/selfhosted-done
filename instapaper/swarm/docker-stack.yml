# instapaper - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml instapaper
# image verified to exist at generation time: alpine:3.20

services:
  instapaper:
    image: alpine:3.20
    ports:
      - target: 20116
        published: 20116
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - instapaper_config:/config
      - instapaper_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20116 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=instapaper"
    #   - "homepage.description=Web article saver; read later and save content.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=instapaper.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20116"
    #   - "homepage.server=localhost"

volumes:
  instapaper_config:
  instapaper_data:

networks:
  default:
    name: instapaper_net
    driver: overlay
    attachable: true
