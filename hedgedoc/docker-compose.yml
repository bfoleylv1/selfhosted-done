# hedgedoc - docker compose (single host)
# image verified to exist at generation time: quay.io/hedgedoc/hedgedoc:latest

services:
  hedgedoc:
    image: quay.io/hedgedoc/hedgedoc:latest
    container_name: hedgedoc
    restart: unless-stopped
    ports:
      - "20111:3000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=hedgedoc"
    #   - "homepage.description=hedgedoc self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=hedgedoc.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20111"
    #   - "homepage.server=localhost"

networks:
  default:
    name: hedgedoc_net
