# solr - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml solr
# image verified to exist at generation time: solr:9

services:
  solr:
    image: solr:9
    ports:
      - target: 8983
        published: 8983
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - solr_config:/config
      - solr_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8983/solr/ || wget -qO- http://127.0.0.1:8983/solr/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=solr"
    #   - "homepage.description=Enterprise search platform built on Apache Lucene; powerful full-text search capabilities."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=solr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8983"
    #   - "homepage.server=localhost"

volumes:
  solr_config:
  solr_data:

networks:
  default:
    name: solr_net
    driver: overlay
    attachable: true
