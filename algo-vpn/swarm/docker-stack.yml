# algo-vpn - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml algo-vpn
# image verified to exist at generation time: ubuntu:24.04

services:
  algo-vpn:
    image: ubuntu:24.04
    ports:
      - target: 8080
        published: 20401
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - algo-vpn_config:/config
      - algo-vpn_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Vpn"
    #   - "homepage.name=algo-vpn"
    #   - "homepage.description=VPN servers; deploy IPsec VPN on popular cloud providers."
    #   - "homepage.tags=Vpn,Networking"
    #   - "homepage.icon=algo-vpn.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20401"
    #   - "homepage.server=localhost"

volumes:
  algo-vpn_config:
  algo-vpn_data:

networks:
  default:
    name: algo-vpn_net
    driver: overlay
    attachable: true
