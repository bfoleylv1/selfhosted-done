# algo-vpn - docker compose (single host)
# image verified to exist at generation time: ubuntu:24.04

services:
  algo-vpn:
    image: ubuntu:24.04
    container_name: algo-vpn
    restart: unless-stopped
    ports:
      - "20401:20401"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20401 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=algo-vpn"
    #   - "homepage.description=VPN servers; deploy IPsec VPN on popular cloud providers.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=algo-vpn.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20401"
    #   - "homepage.server=localhost"

networks:
  default:
    name: algo-vpn_net
