# keepassxc - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml keepassxc
# image verified to exist at generation time: lscr.io/linuxserver/keepassxc:latest

services:
  keepassxc:
    image: lscr.io/linuxserver/keepassxc:latest
    ports:
      - target: 80
        published: 20123
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - keepassxc_config:/config
      - keepassxc_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=keepassxc"
    #   - "homepage.description=Password manager; store your passwords safely and access everywhere."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=keepassxc.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20123"
    #   - "homepage.server=localhost"

volumes:
  keepassxc_config:
  keepassxc_data:

networks:
  default:
    name: keepassxc_net
    driver: overlay
    attachable: true
