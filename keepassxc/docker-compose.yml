# keepassxc - docker compose (single host)
# image verified to exist at generation time: lscr.io/linuxserver/keepassxc:latest

services:
  keepassxc:
    image: lscr.io/linuxserver/keepassxc:latest
    container_name: keepassxc
    restart: unless-stopped
    ports:
      - "20123:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=keepassxc"
    #   - "homepage.description=Password manager; store your passwords safely and access everywhere.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=keepassxc.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20123"
    #   - "homepage.server=localhost"

networks:
  default:
    name: keepassxc_net
