# opensearch - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml opensearch
# image verified to exist at generation time: opensearchproject/opensearch:latest

services:
  opensearch:
    image: opensearchproject/opensearch:latest
    ports:
      - target: 9200
        published: 20180
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - opensearch_config:/config
      - opensearch_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/ || wget -qO- http://127.0.0.1:9200/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=opensearch"
    #   - "homepage.description=Fork of Elasticsearch; community-supported search and analytics suite."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=opensearch.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20180"
    #   - "homepage.server=localhost"

volumes:
  opensearch_config:
  opensearch_data:

networks:
  default:
    name: opensearch_net
    driver: overlay
    attachable: true
