# strava - docker compose (single host)
# image verified to exist at generation time: dreeve/strava:latest

services:
  strava:
    # image: dreeve/strava:latest  # UNVERIFIED
    container_name: strava
    restart: unless-stopped
    ports:
      - "20513:20513"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20513 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=strava"
    #   - "homepage.description=strava self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=strava.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20513"
    #   - "homepage.server=localhost"

networks:
  default:
    name: strava_net
