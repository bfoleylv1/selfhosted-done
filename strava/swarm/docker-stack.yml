# strava - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml strava
# image verified to exist at generation time: dreeve/strava:latest

services:
  strava:
    # image: dreeve/strava:latest  # UNVERIFIED
    ports:
      - target: 20513
        published: 20513
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - strava_config:/config
      - strava_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20513 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=strava"
    #   - "homepage.description=strava self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=strava.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20513"
    #   - "homepage.server=localhost"

volumes:
  strava_config:
  strava_data:

networks:
  default:
    name: strava_net
    driver: overlay
    attachable: true
