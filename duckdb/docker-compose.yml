# duckdb - docker compose (single host)
# image verified to exist at generation time: davidgasquez/duckdb:latest

services:
  duckdb:
    image: davidgasquez/duckdb:latest
    container_name: duckdb
    restart: unless-stopped
    ports:
      - "20055:20055"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20055 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=duckdb"
    #   - "homepage.description=In-process SQL OLAP database similar to SQLite but for analytics."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=duckdb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20055"
    #   - "homepage.server=localhost"

networks:
  default:
    name: duckdb_net
