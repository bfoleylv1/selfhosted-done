# snipe-it - docker compose (single host)
# image verified to exist at generation time: snipe/snipe-it:latest

services:
  snipe-it:
    image: snipe/snipe-it:latest
    container_name: snipe-it
    restart: unless-stopped
    ports:
      - "20286:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=snipe-it"
    #   - "homepage.description=Asset management solution; manage your IT assets and equipment."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=snipe-it.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20286"
    #   - "homepage.server=localhost"

networks:
  default:
    name: snipe-it_net
