# tailscale - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml tailscale
# image verified to exist at generation time: tailscale/tailscale:latest

services:
  tailscale:
    image: tailscale/tailscale:latest
    ports:
      - target: 41641
        published: 41641
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - tailscale_config:/config
      - tailscale_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 41641 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tailscale"
    #   - "homepage.description=WireGuard-based mesh VPN; zero-config networking."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tailscale.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:41641"
    #   - "homepage.server=localhost"

volumes:
  tailscale_config:
  tailscale_data:

networks:
  default:
    name: tailscale_net
    driver: overlay
    attachable: true
