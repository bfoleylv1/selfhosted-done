# habitica - docker compose (single host)
# image verified to exist at generation time: habitica/habitica:latest

services:
  habitica:
    image: habitica/habitica:latest
    container_name: habitica
    restart: unless-stopped
    ports:
      - "20451:20451"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20451 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=habitica"
    #   - "homepage.description=Habitica: open-source habit tracker and RPG-style productivity app."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=habitica.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20451"
    #   - "homepage.server=localhost"

networks:
  default:
    name: habitica_net
