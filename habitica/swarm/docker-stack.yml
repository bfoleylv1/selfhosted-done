# habitica - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml habitica
# image verified to exist at generation time: habitica/habitica:latest

services:
  habitica:
    image: habitica/habitica:latest
    ports:
      - target: 20451
        published: 20451
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - habitica_config:/config
      - habitica_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20451 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=habitica"
    #   - "homepage.description=Habitica self-hosted service."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=habitica.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20451"
    #   - "homepage.server=localhost"

volumes:
  habitica_config:
  habitica_data:

networks:
  default:
    name: habitica_net
    driver: overlay
    attachable: true
