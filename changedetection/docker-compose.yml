# changedetection - docker compose (single host)
# image verified to exist at generation time: dgtlmoon/changedetection.io:latest

services:
  changedetection:
    image: dgtlmoon/changedetection.io:latest
    container_name: changedetection
    restart: unless-stopped
    ports:
      - "20422:20422"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20422 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=changedetection"
    #   - "homepage.description=changedetection.io: self-hosted website change monitoring and notification service."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=changedetection.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20422"
    #   - "homepage.server=localhost"

networks:
  default:
    name: changedetection_net
