# changedetection - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml changedetection
# image verified to exist at generation time: dgtlmoon/changedetection.io:latest

services:
  changedetection:
    image: dgtlmoon/changedetection.io:latest
    ports:
      - target: 20422
        published: 20422
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - changedetection_config:/config
      - changedetection_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20422 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=changedetection"
    #   - "homepage.description=Changedetection self-hosted service."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=changedetection.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20422"
    #   - "homepage.server=localhost"

volumes:
  changedetection_config:
  changedetection_data:

networks:
  default:
    name: changedetection_net
    driver: overlay
    attachable: true
