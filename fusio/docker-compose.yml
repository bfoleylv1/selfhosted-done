# fusio - docker compose (single host)
# image verified to exist at generation time: fusio/fusio:latest

services:
  fusio:
    image: fusio/fusio:latest
    container_name: fusio
    restart: unless-stopped
    ports:
      - "20085:20085"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20085 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=fusio"
    #   - "homepage.description=Open-source API management platform."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=fusio.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20085"
    #   - "homepage.server=localhost"

networks:
  default:
    name: fusio_net
