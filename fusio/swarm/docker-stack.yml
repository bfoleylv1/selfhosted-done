# fusio - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml fusio
# image verified to exist at generation time: fusio/fusio:latest

services:
  fusio:
    image: fusio/fusio:latest
    ports:
      - target: 20085
        published: 20085
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - fusio_config:/config
      - fusio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20085 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=fusio"
    #   - "homepage.description=Open-source API management platform."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=fusio.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20085"
    #   - "homepage.server=localhost"

volumes:
  fusio_config:
  fusio_data:

networks:
  default:
    name: fusio_net
    driver: overlay
    attachable: true
