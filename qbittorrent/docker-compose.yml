# qbittorrent - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: app-qbittorrent
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    - WEBUI_PORT=8080
    volumes:
    - ./qbittorrent-data/config:/config
    - ./qbittorrent-data/downloads:/downloads
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - qbittorrent
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 20603:8080
