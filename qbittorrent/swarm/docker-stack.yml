# qbittorrent - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml qbittorrent
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    - WEBUI_PORT=8080
    volumes:
    - qbittorrent_qbittorrent_data_config:/config
    - qbittorrent_qbittorrent_data_downloads:/downloads
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - qbittorrent
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 8080
      published: 20603
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=qbittorrent"
    #   - "homepage.description=qbittorrent self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=qbittorrent.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20603"
    #   - "homepage.server=localhost"
volumes:
  qbittorrent_qbittorrent_data_config: null
  qbittorrent_qbittorrent_data_downloads: null
networks:
  default:
    name: qbittorrent_net
    driver: overlay
    attachable: true
