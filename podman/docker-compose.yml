# podman - docker compose (single host)
# image verified to exist at generation time: quay.io/podman/stable:latest

services:
  podman:
    image: quay.io/podman/stable:latest
    container_name: podman
    restart: unless-stopped
    ports:
      - "20213:20213"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20213 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=podman"
    #   - "homepage.description=Daemonless container engine; drop-in replacement for Docker."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=podman.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20213"
    #   - "homepage.server=localhost"

networks:
  default:
    name: podman_net
