# podman - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml podman
# image verified to exist at generation time: quay.io/podman/stable:latest

services:
  podman:
    image: quay.io/podman/stable:latest
    ports:
      - target: 20213
        published: 20213
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - podman_config:/config
      - podman_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20213 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=podman"
    #   - "homepage.description=podman self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=podman.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20213"
    #   - "homepage.server=localhost"

volumes:
  podman_config:
  podman_data:

networks:
  default:
    name: podman_net
    driver: overlay
    attachable: true
