# minecraft - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: itzg/minecraft-server:latest
    container_name: app-minecraft
    environment:
    - EULA=TRUE
    - TYPE=VANILLA
    - VERSION=LATEST
    - DIFFICULTY=normal
    - MAX_PLAYERS=10
    - MOTD=A Minecraft Server on Tailscale
    - MEMORY=2G
    - ONLINE_MODE=true
    - TZ=America/Los_Angeles
    volumes:
    - ./minecraft-data:/data
    restart: always
    ports:
    - 25565:25565
    healthcheck:
      test:
      - CMD-SHELL
      - mc-monitor status --host 127.0.0.1 --port 25565
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
