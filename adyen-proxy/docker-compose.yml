# adyen-proxy - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  adyen-proxy:
    image: node:20-alpine
    container_name: adyen-proxy
    restart: unless-stopped
    ports:
      - "20400:3000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosting Solutions"
    #   - "homepage.name=adyen-proxy"
    #   - "homepage.description=adyen-proxy self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=adyen-proxy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20400"
    #   - "homepage.server=localhost"

networks:
  default:
    name: adyen-proxy_net
