# keypass - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml keypass
# image verified to exist at generation time: alpine:3.20

services:
  keypass:
    image: alpine:3.20
    ports:
      - target: 20126
        published: 20126
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - keypass_config:/config
      - keypass_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20126 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=keypass"
    #   - "homepage.description=keypass self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=keypass.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20126"
    #   - "homepage.server=localhost"

volumes:
  keypass_config:
  keypass_data:

networks:
  default:
    name: keypass_net
    driver: overlay
    attachable: true
