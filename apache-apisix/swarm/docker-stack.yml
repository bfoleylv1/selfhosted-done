# apache-apisix - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml apache-apisix
# image verified to exist at generation time: apache/apisix:latest

services:
  apache-apisix:
    image: apache/apisix:latest
    ports:
      - target: 9080
        published: 9080
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - apache-apisix_config:/config
      - apache-apisix_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=apache-apisix"
    #   - "homepage.description=Real-time API gateway; built on etcd and Lua."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=apache-apisix.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9080"
    #   - "homepage.server=localhost"

volumes:
  apache-apisix_config:
  apache-apisix_data:

networks:
  default:
    name: apache-apisix_net
    driver: overlay
    attachable: true
