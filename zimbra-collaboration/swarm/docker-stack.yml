# zimbra-collaboration - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml zimbra-collaboration
# image verified to exist at generation time: ubuntu:24.04

services:
  zimbra-collaboration:
    image: ubuntu:24.04
    ports:
      - target: 20387
        published: 20387
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - zimbra-collaboration_config:/config
      - zimbra-collaboration_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20387 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zimbra-collaboration"
    #   - "homepage.description=Open-source email and collaboration suite.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zimbra-collaboration.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20387"
    #   - "homepage.server=localhost"

volumes:
  zimbra-collaboration_config:
  zimbra-collaboration_data:

networks:
  default:
    name: zimbra-collaboration_net
    driver: overlay
    attachable: true
