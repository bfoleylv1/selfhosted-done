# bleve - docker compose (single host)
# image verified to exist at generation time: golang:1.23-alpine

services:
  bleve:
    image: golang:1.23-alpine
    container_name: bleve
    restart: unless-stopped
    ports:
      - "20015:8080"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Search Engines (Specialized)"
    #   - "homepage.name=bleve"
    #   - "homepage.description=Modern text search and analytics; Go full-text search library."
    #   - "homepage.tags=Search Engines (Specialized)"
    #   - "homepage.icon=bleve.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20015"
    #   - "homepage.server=localhost"

networks:
  default:
    name: bleve_net
