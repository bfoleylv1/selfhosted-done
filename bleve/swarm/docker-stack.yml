# bleve - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml bleve
# image verified to exist at generation time: golang:1.23-alpine

services:
  bleve:
    image: golang:1.23-alpine
    ports:
      - target: 20015
        published: 20015
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - bleve_config:/config
      - bleve_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20015 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=bleve"
    #   - "homepage.description=Modern text search and analytics; Go full-text search library.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=bleve.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20015"
    #   - "homepage.server=localhost"

volumes:
  bleve_config:
  bleve_data:

networks:
  default:
    name: bleve_net
    driver: overlay
    attachable: true
