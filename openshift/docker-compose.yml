# openshift - docker compose (single host)
# image verified to exist at generation time: quay.io/openshift/origin-cli:latest

services:
  openshift:
    image: quay.io/openshift/origin-cli:latest
    container_name: openshift
    restart: unless-stopped
    ports:
      - "20181:20181"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20181 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=openshift"
    #   - "homepage.description=Kubernetes platform; enterprise container application platform."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=openshift.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20181"
    #   - "homepage.server=localhost"

networks:
  default:
    name: openshift_net
