# aliasvault - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml aliasvault
# image verified to exist at generation time: ghcr.io/aliasvault/aliasvault:latest

services:
  aliasvault:
    image: ghcr.io/aliasvault/aliasvault:latest
    ports:
      - target: 20409
        published: 20409
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - aliasvault_config:/config
      - aliasvault_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20409 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=aliasvault"
    #   - "homepage.description=AliasVault: open-source password and alias manager with end-to-end encryption."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=aliasvault.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20409"
    #   - "homepage.server=localhost"

volumes:
  aliasvault_config:
  aliasvault_data:

networks:
  default:
    name: aliasvault_net
    driver: overlay
    attachable: true
