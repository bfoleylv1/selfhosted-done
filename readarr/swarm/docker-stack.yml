# readarr - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml readarr
# image verified to exist at generation time: lscr.io/linuxserver/readarr:develop

services:
  readarr:
    image: lscr.io/linuxserver/readarr:develop
    ports:
      - target: 8787
        published: 20235
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - readarr_config:/config
      - readarr_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/ || wget -qO- http://127.0.0.1:8787/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=readarr"
    #   - "homepage.description=Book/PDF/EPUB/MOBI/AZW3 article librarian; manages book torrents and Usenet."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=readarr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20235"
    #   - "homepage.server=localhost"

volumes:
  readarr_config:
  readarr_data:

networks:
  default:
    name: readarr_net
    driver: overlay
    attachable: true
