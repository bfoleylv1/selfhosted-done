# pinecone - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml pinecone
# image verified to exist at generation time: qdrant/qdrant:latest

services:
  pinecone:
    image: qdrant/qdrant:latest
    ports:
      - target: 6333
        published: 6333
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - pinecone_config:/config
      - pinecone_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6333 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pinecone"
    #   - "homepage.description=Fully managed vector database alternative; private cloud deployment available."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pinecone.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:6333"
    #   - "homepage.server=localhost"

volumes:
  pinecone_config:
  pinecone_data:

networks:
  default:
    name: pinecone_net
    driver: overlay
    attachable: true
