# zeit - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  zeit:
    image: node:20-alpine
    container_name: zeit
    restart: unless-stopped
    ports:
      - "20383:20383"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20383 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
