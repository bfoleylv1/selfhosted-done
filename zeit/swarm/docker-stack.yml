# zeit - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml zeit
# image verified to exist at generation time: node:20-alpine

services:
  zeit:
    image: node:20-alpine
    ports:
      - target: 20383
        published: 20383
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - zeit_config:/config
      - zeit_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20383 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zeit"
    #   - "homepage.description=Self-hosted service."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zeit.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20383"
    #   - "homepage.server=localhost"

volumes:
  zeit_config:
  zeit_data:

networks:
  default:
    name: zeit_net
    driver: overlay
    attachable: true
