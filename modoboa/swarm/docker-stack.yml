# modoboa - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml modoboa
# image verified to exist at generation time: python:3.11-slim

services:
  modoboa:
    image: python:3.11-slim
    ports:
      - target: 80
        published: 20159
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - modoboa_config:/config
      - modoboa_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=modoboa"
    #   - "homepage.description=Mail hosting application; complete mail server suite."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=modoboa.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20159"
    #   - "homepage.server=localhost"

volumes:
  modoboa_config:
  modoboa_data:

networks:
  default:
    name: modoboa_net
    driver: overlay
    attachable: true
