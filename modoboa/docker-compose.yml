# modoboa - docker compose (single host)
# image verified to exist at generation time: python:3.11-slim

services:
  modoboa:
    image: python:3.11-slim
    container_name: modoboa
    restart: unless-stopped
    ports:
      - "20159:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=modoboa"
    #   - "homepage.description=Mail hosting application; complete mail server suite."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=modoboa.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20159"
    #   - "homepage.server=localhost"

networks:
  default:
    name: modoboa_net
