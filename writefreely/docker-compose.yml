# writefreely - docker compose (single host)
# image verified to exist at generation time: writeas/writefreely:latest

services:
  writefreely:
    image: writeas/writefreely:latest
    container_name: writefreely
    restart: unless-stopped
    ports:
      - "20371:20371"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20371 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=writefreely"
    #   - "homepage.description=writefreely self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=writefreely.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20371"
    #   - "homepage.server=localhost"

networks:
  default:
    name: writefreely_net
