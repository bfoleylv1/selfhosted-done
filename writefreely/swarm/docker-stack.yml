# writefreely - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml writefreely
# image verified to exist at generation time: writeas/writefreely:latest

services:
  writefreely:
    image: writeas/writefreely:latest
    ports:
      - target: 20371
        published: 20371
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - writefreely_config:/config
      - writefreely_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20371 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=writefreely"
    #   - "homepage.description=writefreely self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=writefreely.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20371"
    #   - "homepage.server=localhost"

volumes:
  writefreely_config:
  writefreely_data:

networks:
  default:
    name: writefreely_net
    driver: overlay
    attachable: true
