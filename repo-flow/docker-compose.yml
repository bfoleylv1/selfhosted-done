# repo-flow - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  repo-flow:
    image: alpine:3.20
    container_name: repo-flow
    restart: unless-stopped
    ports:
      - "20240:20240"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20240 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
