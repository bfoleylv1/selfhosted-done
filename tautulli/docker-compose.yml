    #   - "homepage.description=tautulli self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tautulli.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8181"
    #   - "homepage.server=localhost"

networks:
  default:
    name: tautulli_net
