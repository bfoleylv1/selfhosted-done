# hoppscotch - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml hoppscotch
# image verified to exist at generation time: hoppscotch/hoppscotch:latest

services:
  hoppscotch:
    image: hoppscotch/hoppscotch:latest
    ports:
      - target: 20456
        published: 20456
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - hoppscotch_config:/config
      - hoppscotch_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20456 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=hoppscotch"
    #   - "homepage.description=Hoppscotch Community Edition: open-source API development ecosystem (requests, testing, collaboration)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=hoppscotch.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20456"
    #   - "homepage.server=localhost"

volumes:
  hoppscotch_config:
  hoppscotch_data:

networks:
  default:
    name: hoppscotch_net
    driver: overlay
    attachable: true
