# hoppscotch - docker compose (single host)
# image verified to exist at generation time: hoppscotch/hoppscotch:latest

services:
  hoppscotch:
    image: hoppscotch/hoppscotch:latest
    container_name: hoppscotch
    restart: unless-stopped
    ports:
      - "20456:20456"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20456 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=hoppscotch"
    #   - "homepage.description=Hoppscotch Community Edition: open-source API development ecosystem (requests, testing, collaboration)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=hoppscotch.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20456"
    #   - "homepage.server=localhost"

networks:
  default:
    name: hoppscotch_net
