# cloudflare-argo - docker compose (single host)
# image verified to exist at generation time: cloudflare/cloudflared:latest

services:
  cloudflare-argo:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-argo
    restart: unless-stopped
    ports:
      - "2000:2000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cloudflare-argo"
    #   - "homepage.description=Cloudflare's smart routing; secure and fast connections."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cloudflare-argo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:2000"
    #   - "homepage.server=localhost"

networks:
  default:
    name: cloudflare-argo_net
