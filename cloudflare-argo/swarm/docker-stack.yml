# cloudflare-argo - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml cloudflare-argo
# image verified to exist at generation time: cloudflare/cloudflared:latest

services:
  cloudflare-argo:
    image: cloudflare/cloudflared:latest
    ports:
      - target: 2000
        published: 2000
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - cloudflare-argo_config:/config
      - cloudflare-argo_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cloudflare-argo"
    #   - "homepage.description=Cloudflare's smart routing; secure and fast connections."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cloudflare-argo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:2000"
    #   - "homepage.server=localhost"

volumes:
  cloudflare-argo_config:
  cloudflare-argo_data:

networks:
  default:
    name: cloudflare-argo_net
    driver: overlay
    attachable: true
