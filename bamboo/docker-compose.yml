# bamboo - docker compose (single host)
# image verified to exist at generation time: atlassian/bamboo:latest

services:
  bamboo:
    image: atlassian/bamboo:latest
    container_name: bamboo
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8085 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=bamboo"
    #   - "homepage.description=Atlassian continuous integration and deployment server (commercial)."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=bamboo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8085"
    #   - "homepage.server=localhost"

networks:
  default:
    name: bamboo_net
