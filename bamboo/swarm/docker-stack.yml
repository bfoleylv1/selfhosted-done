# bamboo - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml bamboo
# image verified to exist at generation time: atlassian/bamboo:latest

services:
  bamboo:
    image: atlassian/bamboo:latest
    ports:
      - target: 8085
        published: 8085
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - bamboo_config:/config
      - bamboo_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8085 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=bamboo"
    #   - "homepage.description=Atlassian continuous integration and deployment server (commercial)."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=bamboo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8085"
    #   - "homepage.server=localhost"

volumes:
  bamboo_config:
  bamboo_data:

networks:
  default:
    name: bamboo_net
    driver: overlay
    attachable: true
