# opencart - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  opencart:
    image: php:8.2-apache
    container_name: opencart
    restart: unless-stopped
    ports:
      - "20174:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=opencart"
    #   - "homepage.description=Responsive e-commerce solution; ready-to-use online store platform."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=opencart.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20174"
    #   - "homepage.server=localhost"

networks:
  default:
    name: opencart_net
