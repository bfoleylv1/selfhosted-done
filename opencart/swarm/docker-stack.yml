# opencart - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml opencart
# image verified to exist at generation time: php:8.2-apache

services:
  opencart:
    image: php:8.2-apache
    ports:
      - target: 80
        published: 20174
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - opencart_config:/config
      - opencart_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=opencart"
    #   - "homepage.description=opencart self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=opencart.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20174"
    #   - "homepage.server=localhost"

volumes:
  opencart_config:
  opencart_data:

networks:
  default:
    name: opencart_net
    driver: overlay
    attachable: true
