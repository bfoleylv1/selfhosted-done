# puppet - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml puppet
# image verified to exist at generation time: puppet/puppetserver:latest

services:
  puppet:
    image: puppet/puppetserver:latest
    ports:
      - target: 20224
        published: 20224
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - puppet_config:/config
      - puppet_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20224 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=puppet"
    #   - "homepage.description=puppet self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=puppet.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20224"
    #   - "homepage.server=localhost"

volumes:
  puppet_config:
  puppet_data:

networks:
  default:
    name: puppet_net
    driver: overlay
    attachable: true
