    #   - "homepage.description=Configuration management tool; declarative infrastructure automation."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=puppet.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20224"
    #   - "homepage.server=localhost"

networks:
  default:
    name: puppet_net
