# puppet - docker compose (single host)
# image verified to exist at generation time: puppet/puppetserver:latest

services:
  puppet:
    image: puppet/puppetserver:latest
    container_name: puppet
    restart: unless-stopped
    ports:
      - "20224:20224"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20224 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
