# sip3 - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml sip3
# image verified to exist at generation time: alpine:3.20

services:
  sip3:
    image: alpine:3.20
    ports:
      - target: 20282
        published: 20282
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - sip3_config:/config
      - sip3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20282 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sip3"
    #   - "homepage.description=sip3 self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sip3.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20282"
    #   - "homepage.server=localhost"

volumes:
  sip3_config:
  sip3_data:

networks:
  default:
    name: sip3_net
    driver: overlay
    attachable: true
