# sip3 - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  sip3:
    image: alpine:3.20
    container_name: sip3
    restart: unless-stopped
    ports:
      - "20282:20282"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20282 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sip3"
    #   - "homepage.description=VoIP / SIP monitoring and analysis."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sip3.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20282"
    #   - "homepage.server=localhost"

networks:
  default:
    name: sip3_net
