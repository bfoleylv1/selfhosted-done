# client-management - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  client-management:
    image: php:8.2-apache
    container_name: client-management
    restart: unless-stopped
    ports:
      - "20030:20030"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20030 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=client-management"
    #   - "homepage.description=Invoice, quotes, and client management for freelancers and agencies."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=client-management.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20030"
    #   - "homepage.server=localhost"

networks:
  default:
    name: client-management_net
