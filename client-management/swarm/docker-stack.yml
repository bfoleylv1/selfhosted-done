# client-management - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml client-management
# image verified to exist at generation time: php:8.2-apache

services:
  client-management:
    image: php:8.2-apache
    ports:
      - target: 8080
        published: 20030
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - client-management_config:/config
      - client-management_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Crm"
    #   - "homepage.name=client-management"
    #   - "homepage.description=Invoice, quotes, and client management for freelancers and agencies."
    #   - "homepage.tags=Crm,Business Tools"
    #   - "homepage.icon=client-management.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20030"
    #   - "homepage.server=localhost"

volumes:
  client-management_config:
  client-management_data:

networks:
  default:
    name: client-management_net
    driver: overlay
    attachable: true
