# nodebb - docker compose (single host)
# image verified to exist at generation time: ghcr.io/nodebb/nodebb:latest

services:
  nodebb:
    image: ghcr.io/nodebb/nodebb:latest
    container_name: nodebb
    restart: unless-stopped
    ports:
      - "20482:20482"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20482 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=nodebb"
    #   - "homepage.description=NodeBB: open-source Node.js based forum software."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=nodebb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20482"
    #   - "homepage.server=localhost"

networks:
  default:
    name: nodebb_net
