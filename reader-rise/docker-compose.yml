# reader-rise - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  reader-rise:
    image: alpine:3.20
    container_name: reader-rise
    restart: unless-stopped
    ports:
      - "20236:20236"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20236 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=reader-rise"
    #   - "homepage.description=Self-hosted Feedbin alternative; clean UI with OPML import/export.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=reader-rise.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20236"
    #   - "homepage.server=localhost"

networks:
  default:
    name: reader-rise_net
