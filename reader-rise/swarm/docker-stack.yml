# reader-rise - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml reader-rise
# image verified to exist at generation time: alpine:3.20

services:
  reader-rise:
    image: alpine:3.20
    ports:
      - target: 20236
        published: 20236
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - reader-rise_config:/config
      - reader-rise_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20236 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=reader-rise"
    #   - "homepage.description=Self-hosted Feedbin alternative; clean UI with OPML import/export.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=reader-rise.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20236"
    #   - "homepage.server=localhost"

volumes:
  reader-rise_config:
  reader-rise_data:

networks:
  default:
    name: reader-rise_net
    driver: overlay
    attachable: true
