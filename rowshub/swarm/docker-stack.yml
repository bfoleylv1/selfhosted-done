# rowshub - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml rowshub
# image verified to exist at generation time: nocodb/nocodb:latest

services:
  rowshub:
    image: nocodb/nocodb:latest
    ports:
      - target: 20253
        published: 20253
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - rowshub_config:/config
      - rowshub_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20253 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rowshub"
    #   - "homepage.description=Collaborative spreadsheet platform; Airtable alternative."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rowshub.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20253"
    #   - "homepage.server=localhost"

volumes:
  rowshub_config:
  rowshub_data:

networks:
  default:
    name: rowshub_net
    driver: overlay
    attachable: true
