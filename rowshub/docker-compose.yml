# rowshub - docker compose (single host)
# image verified to exist at generation time: nocodb/nocodb:latest

services:
  rowshub:
    image: nocodb/nocodb:latest
    container_name: rowshub
    restart: unless-stopped
    ports:
      - "20253:20253"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20253 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rowshub"
    #   - "homepage.description=Collaborative spreadsheet platform; Airtable alternative.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rowshub.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20253"
    #   - "homepage.server=localhost"

networks:
  default:
    name: rowshub_net
