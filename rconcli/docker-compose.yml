# rconcli - docker compose (single host)
# image verified to exist at generation time: rconcli/rconcli:latest

services:
  rconcli:
    # image: rconcli/rconcli:latest  # UNVERIFIED
    container_name: rconcli
    restart: unless-stopped
    ports:
      - "20499:20499"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20499 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rconcli"
    #   - "homepage.description=rconcli self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rconcli.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20499"
    #   - "homepage.server=localhost"

networks:
  default:
    name: rconcli_net
