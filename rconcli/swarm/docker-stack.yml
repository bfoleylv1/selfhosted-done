# rconcli - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml rconcli
# image verified to exist at generation time: rconcli/rconcli:latest

services:
  rconcli:
    # image: rconcli/rconcli:latest  # UNVERIFIED
    ports:
      - target: 20499
        published: 20499
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - rconcli_config:/config
      - rconcli_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20499 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rconcli"
    #   - "homepage.description=rconcli self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rconcli.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20499"
    #   - "homepage.server=localhost"

volumes:
  rconcli_config:
  rconcli_data:

networks:
  default:
    name: rconcli_net
    driver: overlay
    attachable: true
