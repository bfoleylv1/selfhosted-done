# sessions - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  sessions:
    image: alpine:3.20
    container_name: sessions
    restart: unless-stopped
    ports:
      - "20274:20274"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20274 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sessions"
    #   - "homepage.description=Encrypted messaging app; decentralized and privacy-focused."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sessions.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20274"
    #   - "homepage.server=localhost"

networks:
  default:
    name: sessions_net
