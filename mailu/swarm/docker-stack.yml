# mailu - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml mailu
# image verified to exist at generation time: ghcr.io/mailu/admin:2.0

services:
  mailu:
    image: ghcr.io/mailu/admin:2.0
    ports:
      - target: 20148
        published: 20148
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - mailu_config:/config
      - mailu_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20148 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mailu"
    #   - "homepage.description=Open source email suite; complete mail server stack."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mailu.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20148"
    #   - "homepage.server=localhost"

volumes:
  mailu_config:
  mailu_data:

networks:
  default:
    name: mailu_net
    driver: overlay
    attachable: true
