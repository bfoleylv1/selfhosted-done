# simplex-chat - docker compose (single host)
# image verified to exist at generation time: simplexchat/simplex-chat:latest

services:
  simplex-chat:
    # image: simplexchat/simplex-chat:latest  # UNVERIFIED
    container_name: simplex-chat
    restart: unless-stopped
    ports:
      - "20507:20507"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20507 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=simplex-chat"
    #   - "homepage.description=simplex-chat self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=simplex-chat.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20507"
    #   - "homepage.server=localhost"

networks:
  default:
    name: simplex-chat_net
