# simplex-chat - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml simplex-chat
# image verified to exist at generation time: simplexchat/simplex-chat:latest

services:
  simplex-chat:
    # image: simplexchat/simplex-chat:latest  # UNVERIFIED
    ports:
      - target: 20507
        published: 20507
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - simplex-chat_config:/config
      - simplex-chat_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20507 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=simplex-chat"
    #   - "homepage.description=simplex-chat self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=simplex-chat.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20507"
    #   - "homepage.server=localhost"

volumes:
  simplex-chat_config:
  simplex-chat_data:

networks:
  default:
    name: simplex-chat_net
    driver: overlay
    attachable: true
