# jenkins - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml jenkins
# image verified to exist at generation time: jenkins/jenkins:lts

services:
  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - target: 8080
        published: 20119
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - jenkins_config:/config
      - jenkins_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=jenkins"
    #   - "homepage.description=Open source automation server; CI/CD for builds and tests."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=jenkins.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20119"
    #   - "homepage.server=localhost"

volumes:
  jenkins_config:
  jenkins_data:

networks:
  default:
    name: jenkins_net
    driver: overlay
    attachable: true
