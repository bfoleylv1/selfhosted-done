# jenkins - docker compose (single host)
# image verified to exist at generation time: jenkins/jenkins:lts

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "20119:8080"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=jenkins"
    #   - "homepage.description=Open source automation server; CI/CD for builds and tests."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=jenkins.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20119"
    #   - "homepage.server=localhost"

networks:
  default:
    name: jenkins_net
