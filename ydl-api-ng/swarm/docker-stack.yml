# ydl-api-ng - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml ydl-api-ng
# image verified to exist at generation time: python:3.11-slim

services:
  ydl-api-ng:
    image: python:3.11-slim
    ports:
      - target: 20376
        published: 20376
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ydl-api-ng_config:/config
      - ydl-api-ng_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20376 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ydl-api-ng"
    #   - "homepage.description=REST API wrapper for youtube-dl / yt-dlp downloads.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ydl-api-ng.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20376"
    #   - "homepage.server=localhost"

volumes:
  ydl-api-ng_config:
  ydl-api-ng_data:

networks:
  default:
    name: ydl-api-ng_net
    driver: overlay
    attachable: true
