# ydl-api-ng - docker compose (single host)
# image verified to exist at generation time: python:3.11-slim

services:
  ydl-api-ng:
    image: python:3.11-slim
    container_name: ydl-api-ng
    restart: unless-stopped
    ports:
      - "20376:20376"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20376 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ydl-api-ng"
    #   - "homepage.description=REST API wrapper for youtube-dl / yt-dlp downloads."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ydl-api-ng.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20376"
    #   - "homepage.server=localhost"

networks:
  default:
    name: ydl-api-ng_net
