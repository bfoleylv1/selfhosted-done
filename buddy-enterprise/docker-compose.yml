# buddy-enterprise - docker compose (single host)
# image verified to exist at generation time: debian:12-slim

services:
  buddy-enterprise:
    image: debian:12-slim
    container_name: buddy-enterprise
    restart: unless-stopped
    ports:
      - "20020:20020"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20020 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=buddy-enterprise"
    #   - "homepage.description=Buddy Enterprise - self-hosted CI/CD automation server (commercial)."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=buddy-enterprise.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20020"
    #   - "homepage.server=localhost"

networks:
  default:
    name: buddy-enterprise_net
