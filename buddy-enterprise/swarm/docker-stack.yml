# buddy-enterprise - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml buddy-enterprise
# image verified to exist at generation time: debian:12-slim

services:
  buddy-enterprise:
    image: debian:12-slim
    ports:
      - target: 20020
        published: 20020
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - buddy-enterprise_config:/config
      - buddy-enterprise_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20020 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=buddy-enterprise"
    #   - "homepage.description=Buddy Enterprise - self-hosted CI/CD automation server (commercial)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=buddy-enterprise.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20020"
    #   - "homepage.server=localhost"

volumes:
  buddy-enterprise_config:
  buddy-enterprise_data:

networks:
  default:
    name: buddy-enterprise_net
    driver: overlay
    attachable: true
