# eigenfocus - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml eigenfocus
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: eigenfocus/eigenfocus:0.8.0
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    - DEFAULT_HOST_URL=http://127.0.0.1:3000
    volumes:
    - eigenfocus_eigenfocus_data:/eigenfocus-app/app-data
    ports:
    - target: 3000
      published: 20572
      protocol: tcp
      mode: ingress
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:3000/ || wget -qO- http://127.0.0.1:3000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=eigenfocus"
    #   - "homepage.description=eigenfocus self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=eigenfocus.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20572"
    #   - "homepage.server=localhost"
volumes:
  eigenfocus_eigenfocus_data: null
networks:
  default:
    name: eigenfocus_net
    driver: overlay
    attachable: true
