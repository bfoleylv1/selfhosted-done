# element-web-app - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml element-web-app
# image verified to exist at generation time: vectorim/element-web:latest

services:
  element-web-app:
    image: vectorim/element-web:latest
    ports:
      - target: 20059
        published: 20059
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - element-web-app_config:/config
      - element-web-app_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20059 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=element-web-app"
    #   - "homepage.description=Matrix client for secure decentralized communication.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=element-web-app.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20059"
    #   - "homepage.server=localhost"

volumes:
  element-web-app_config:
  element-web-app_data:

networks:
  default:
    name: element-web-app_net
    driver: overlay
    attachable: true
