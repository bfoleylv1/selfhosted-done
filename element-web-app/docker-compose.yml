# element-web-app - docker compose (single host)
# image verified to exist at generation time: vectorim/element-web:latest

services:
  element-web-app:
    image: vectorim/element-web:latest
    container_name: element-web-app
    restart: unless-stopped
    ports:
      - "20059:20059"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20059 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=element-web-app"
    #   - "homepage.description=Matrix client for secure decentralized communication."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=element-web-app.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20059"
    #   - "homepage.server=localhost"

networks:
  default:
    name: element-web-app_net
