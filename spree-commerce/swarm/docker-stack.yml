# spree-commerce - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml spree-commerce
# image verified to exist at generation time: ruby:3.3-alpine

services:
  spree-commerce:
    image: ruby:3.3-alpine
    ports:
      - target: 20294
        published: 20294
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - spree-commerce_config:/config
      - spree-commerce_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20294 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=spree-commerce"
    #   - "homepage.description=Complete online store platform; Ruby on Rails based."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=spree-commerce.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20294"
    #   - "homepage.server=localhost"

volumes:
  spree-commerce_config:
  spree-commerce_data:

networks:
  default:
    name: spree-commerce_net
    driver: overlay
    attachable: true
