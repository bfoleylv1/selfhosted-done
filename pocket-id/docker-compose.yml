# pocket-id - docker compose (single host)
# image verified to exist at generation time: ghcr.io/pocket-id/pocket-id:latest

services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    container_name: pocket-id
    restart: unless-stopped
    ports:
      - "1411:1411"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1411 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pocket-id"
    #   - "homepage.description=Simple SSO identity provider with passkey support.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pocket-id.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:1411"
    #   - "homepage.server=localhost"

networks:
  default:
    name: pocket-id_net
