# pocket-id - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml pocket-id
# image verified to exist at generation time: ghcr.io/pocket-id/pocket-id:latest

services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    ports:
      - target: 1411
        published: 1411
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - pocket-id_config:/config
      - pocket-id_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1411 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pocket-id"
    #   - "homepage.description=Simple SSO identity provider with passkey support."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pocket-id.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:1411"
    #   - "homepage.server=localhost"

volumes:
  pocket-id_config:
  pocket-id_data:

networks:
  default:
    name: pocket-id_net
    driver: overlay
    attachable: true
