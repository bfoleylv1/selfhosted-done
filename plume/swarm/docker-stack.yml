# plume - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml plume
# image verified to exist at generation time: plumeorg/plume:latest

services:
  plume:
    image: plumeorg/plume:latest
    ports:
      - target: 7878
        published: 7878
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - plume_config:/config
      - plume_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7878 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=plume"
    #   - "homepage.description=Federation-friendly blogging platform; ActivityPub enabled."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=plume.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:7878"
    #   - "homepage.server=localhost"

volumes:
  plume_config:
  plume_data:

networks:
  default:
    name: plume_net
    driver: overlay
    attachable: true
