    - RECAPTCHA_SITE_KEY=fb_wQIN6F7Xws3-j7n4kRIFEeWmen2ao
    - RECAPTCHA_SECRET_KEY=Kx_jutPQe6dLWZX9Rahf4Tq6j41DyF1I
    - GITHUB_ID=
    - GITHUB_SECRET=bBys31jDn3AiTd3uaN39MMg0fK1FaSDt
    - GOOGLE_CLIENT_ID=
    - GOOGLE_CLIENT_SECRET=A84ZeWZX1mGpP4U_yAw2xlmM-PVHUx0L
    - AZUREAD_CLIENT_ID=
    - AZUREAD_CLIENT_SECRET=I8VJL2TN5SjsHvkxudHh27dPaPSffpVR
    - AZUREAD_TENANT_ID=
