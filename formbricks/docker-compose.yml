# formbricks - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  postgres:
    restart: always
    image: pgvector/pgvector:pg17
    volumes:
    - ./formbricks-data/postgres:/var/lib/postgresql/data
    environment:
    - POSTGRES_PASSWORD=postgres
  redis:
    restart: always
    image: valkey/valkey@sha256:12ba4f45a7c3e1d0f076acd616cb230834e75a77e8516dde382720af32832d6d
    command: valkey-server --appendonly yes
    volumes:
    - ./formbricks-data/redis:/data
  formbricks:
    image: ghcr.io/formbricks/formbricks:latest
    container_name: app-formbricks
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    - WEBAPP_URL=http://localhost:3000
    - NEXTAUTH_URL=http://localhost:20575
    - DATABASE_URL="postgresql://postgres:postgres@postgres:5432/formbricks?schema=public"
    - NEXTAUTH_SECRET="7b62c37371798cf96dc019f3d4f712a27d1b05d0755ffcf96481b8504697f532"
    - ENCRYPTION_KEY="i1e284266e3f7ace4772e329e0494aa1d6110fba48db06bd9652e7a9fdd167281"
    - CRON_SECRET="b5af3d39789e7730004a01bb84922914ea0b478fe67784ce3fa8e4c35096d6b4"
    - REDIS_URL="redis://redis:6379"
    - LOG_LEVEL="info"
    - ENTERPRISE_LICENSE_KEY=UvWDYALqJfURp_aL9ZDQhCUJrjXa2UJ4
    - MAIL_FROM="from@some.host"
    - MAIL_FROM_NAME="from host"
    - SMTP_HOST="some.host"
    - SMTP_PORT="587"
    - SMTP_USER="SMTPUser"
    - SMTP_PASSWORD="SMTPPassword"
    - SMTP_AUTHENTICATED="1"
    - SMTP_SECURE_ENABLED="0"
    - SMTP_REJECT_UNAUTHORIZED_TLS="1"
    - EMAIL_VERIFICATION_DISABLED="1"
    - PASSWORD_RESET_DISABLED="1"
    - EMAIL_AUTH_DISABLED="0"
    - INVITE_DISABLED="0"
    - ASSET_PREFIX_URL=
    - UNSPLASH_ACCESS_KEY=bpA3Q7pi6l0aZPxdWIJ_l5kxxjfcBw6Y
    - PUBLIC_URL=http://localhost:20575
    - SENTRY_DSN=
    - SENTRY_AUTH_TOKEN=-SNzBtG0_nrv1MuhUZMCQ1-pMk3lBquE
    - SENTRY_ENVIRONMENT=
    - S3_ACCESS_KEY=${S3_ACCESS_KEY}
    - S3_SECRET_KEY=${S3_SECRET_KEY}
    - S3_REGION=${S3_REGION}
    - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
    - S3_FORCE_PATH_STYLE="0"
    - TURNSTILE_SITE_KEY=AyeOp4qYeAKGjqWqpwJQn6RjG2zpr5K9
