    - GOOGLE_SHEETS_CLIENT_SECRET=rntrl3PFeEfl9PaBR73AvodWuFMe_GoJ
    - GOOGLE_SHEETS_REDIRECT_URL=
    - AIRTABLE_CLIENT_ID=
    - SLACK_CLIENT_ID=
    - SLACK_CLIENT_SECRET=gCYzTTOO4EAOcexi1mbG2Cz1WqxUqEfe
    - PRIVACY_URL=
    - TERMS_URL=
    - IMPRINT_URL=
    - IMPRINT_ADDRESS=
    - RATE_LIMITING_DISABLED="1"
    - AUDIT_LOG_ENABLED="1"
    - AUDIT_LOG_GET_USER_IP="1"
    - AUTH_SKIP_INVITE_FOR_SSO="0"
    - AUTH_SSO_DEFAULT_TEAM_ID=
    - USER_MANAGEMENT_MINIMUM_ROLE="manager"
    - SESSION_MAX_AGE="86400"
    volumes:
    - ./formbricks-data/app/config:/config
    - ./formbricks-data/saml-connection:/home/nextjs/apps/web/saml-connection
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: always
    ports:
    - 20575:3000
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:3000/ || wget -qO- http://127.0.0.1:3000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
