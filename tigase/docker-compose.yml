# tigase - docker compose (single host)
# image verified to exist at generation time: tigase/tigase-xmpp-server:latest

services:
  tigase:
    image: tigase/tigase-xmpp-server:latest
    container_name: tigase
    restart: unless-stopped
    ports:
      - "20327:20327"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20327 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tigase"
    #   - "homepage.description=High-performance XMPP / Jabber server."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tigase.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20327"
    #   - "homepage.server=localhost"

networks:
  default:
    name: tigase_net
