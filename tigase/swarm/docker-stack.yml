# tigase - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml tigase
# image verified to exist at generation time: tigase/tigase-xmpp-server:latest

services:
  tigase:
    image: tigase/tigase-xmpp-server:latest
    ports:
      - target: 20327
        published: 20327
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - tigase_config:/config
      - tigase_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20327 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tigase"
    #   - "homepage.description=High-performance XMPP / Jabber server.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tigase.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20327"
    #   - "homepage.server=localhost"

volumes:
  tigase_config:
  tigase_data:

networks:
  default:
    name: tigase_net
    driver: overlay
    attachable: true
