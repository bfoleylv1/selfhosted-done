# datasette - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml datasette
# image verified to exist at generation time: datasetteproject/datasette:latest

services:
  datasette:
    image: datasetteproject/datasette:latest
    ports:
      - target: 8001
        published: 8001
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - datasette_config:/config
      - datasette_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=datasette"
    #   - "homepage.description=Explore and publish SQLite databases as JSON APIs and dashboards."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=datasette.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8001"
    #   - "homepage.server=localhost"

volumes:
  datasette_config:
  datasette_data:

networks:
  default:
    name: datasette_net
    driver: overlay
    attachable: true
