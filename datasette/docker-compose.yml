# datasette - docker compose (single host)
# image verified to exist at generation time: datasetteproject/datasette:latest

services:
  datasette:
    image: datasetteproject/datasette:latest
    container_name: datasette
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=datasette"
    #   - "homepage.description=Explore and publish SQLite databases as JSON APIs and dashboards."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=datasette.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8001"
    #   - "homepage.server=localhost"

networks:
  default:
    name: datasette_net
