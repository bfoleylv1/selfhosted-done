# full-help - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  full-help:
    image: alpine:3.20
    container_name: full-help
    restart: unless-stopped
    ports:
      - "20083:20083"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20083 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=full-help"
    #   - "homepage.description=Self-hosted service."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=full-help.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20083"
    #   - "homepage.server=localhost"

networks:
  default:
    name: full-help_net
