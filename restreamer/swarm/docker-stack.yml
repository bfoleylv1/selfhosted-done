# restreamer - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml restreamer
# image verified to exist at generation time: datarhei/restreamer:latest

services:
  restreamer:
    image: datarhei/restreamer:latest
    ports:
      - target: 20244
        published: 20244
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - NVIDIA_DRIVER_CAPABILITIES=all
      # - LIBVA_DRIVER_NAME=iHD            # Intel iGPU VAAPI/QSV
      # - VAAPI_DRIVER=iHD
    volumes:
      - restreamer_config:/config
      - restreamer_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20244 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
          # - node.role == manager
          # GPU: add node-generic-resources to daemon.json and:
          #   - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
      # GPU: swarm ignores `devices:`/`runtime:`. Declare in
      #   /etc/docker/daemon.json: "node-generic-resources": ["gpu=1"]
      #   then use deploy.resources.reservations.generic_resources.
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=restreamer"
    #   - "homepage.description=Live video streaming server (RTSP/RTMP restreaming)."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=restreamer.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20244"
    #   - "homepage.server=localhost"

volumes:
  restreamer_config:
  restreamer_data:

networks:
  default:
    name: restreamer_net
    driver: overlay
    attachable: true
