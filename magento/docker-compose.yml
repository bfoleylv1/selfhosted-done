# magento - docker compose (single host)
# image verified to exist at generation time: alexcheng/magento2:latest

services:
  magento:
    image: alexcheng/magento2:latest
    container_name: magento
    restart: unless-stopped
    ports:
      - "20146:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=magento"
    #   - "homepage.description=Open-source e-commerce platform; Adobe Commerce predecessor.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=magento.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20146"
    #   - "homepage.server=localhost"

networks:
  default:
    name: magento_net
