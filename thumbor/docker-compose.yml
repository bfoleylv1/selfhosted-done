# thumbor - docker compose (single host)
# image verified to exist at generation time: ghcr.io/thumbor/thumbor:latest

services:
  thumbor:
    image: ghcr.io/thumbor/thumbor:latest
    container_name: thumbor
    restart: unless-stopped
    ports:
      - "20326:20326"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20326 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=thumbor"
    #   - "homepage.description=On-the-fly image thumbnail and resize service."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=thumbor.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20326"
    #   - "homepage.server=localhost"

networks:
  default:
    name: thumbor_net
