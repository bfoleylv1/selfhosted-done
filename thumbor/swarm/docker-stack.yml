# thumbor - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml thumbor
# image verified to exist at generation time: ghcr.io/thumbor/thumbor:latest

services:
  thumbor:
    image: ghcr.io/thumbor/thumbor:latest
    ports:
      - target: 20326
        published: 20326
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - thumbor_config:/config
      - thumbor_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20326 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=thumbor"
    #   - "homepage.description=On-the-fly image thumbnail and resize service.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=thumbor.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20326"
    #   - "homepage.server=localhost"

volumes:
  thumbor_config:
  thumbor_data:

networks:
  default:
    name: thumbor_net
    driver: overlay
    attachable: true
