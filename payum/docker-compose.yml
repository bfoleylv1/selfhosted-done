# payum - docker compose (single host)
# image verified to exist at generation time: php:8.2-fpm

services:
  payum:
    image: php:8.2-fpm
    container_name: payum
    restart: unless-stopped
    ports:
      - "20197:20197"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20197 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=payum"
    #   - "homepage.description=payum self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=payum.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20197"
    #   - "homepage.server=localhost"

networks:
  default:
    name: payum_net
