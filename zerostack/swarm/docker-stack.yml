# zerostack - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml zerostack
# image verified to exist at generation time: zerostack/zerostack:latest

services:
  zerostack:
    # image: zerostack/zerostack:latest  # UNVERIFIED
    ports:
      - target: 20522
        published: 20522
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - zerostack_config:/config
      - zerostack_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20522 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zerostack"
    #   - "homepage.description=zerostack self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zerostack.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20522"
    #   - "homepage.server=localhost"

volumes:
  zerostack_config:
  zerostack_data:

networks:
  default:
    name: zerostack_net
    driver: overlay
    attachable: true
