# zerostack - docker compose (single host)
# image verified to exist at generation time: zerostack/zerostack:latest

services:
  zerostack:
    # image: zerostack/zerostack:latest  # UNVERIFIED
    container_name: zerostack
    restart: unless-stopped
    ports:
      - "20522:20522"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20522 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zerostack"
    #   - "homepage.description=zerostack self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zerostack.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20522"
    #   - "homepage.server=localhost"

networks:
  default:
    name: zerostack_net
