# plausible - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml plausible
# image verified to exist at generation time: ghcr.io/plausible/community-edition:v2.1.4

services:
  plausible:
    image: ghcr.io/plausible/community-edition:v2.1.4
    ports:
      - target: 8000
        published: 20208
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - plausible_config:/config
      - plausible_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || wget -qO- http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=plausible"
    #   - "homepage.description=plausible self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=plausible.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20208"
    #   - "homepage.server=localhost"

volumes:
  plausible_config:
  plausible_data:

networks:
  default:
    name: plausible_net
    driver: overlay
    attachable: true
