# dbeaver - docker compose (single host)
# image verified to exist at generation time: dbeaver/cloudbeaver:latest

services:
  dbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: dbeaver
    restart: unless-stopped
    ports:
      - "8978:8978"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8978/ || wget -qO- http://127.0.0.1:8978/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=dbeaver"
    #   - "homepage.description=Universal database tool; supports all major databases."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=dbeaver.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8978"
    #   - "homepage.server=localhost"

networks:
  default:
    name: dbeaver_net
