# dbeaver - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml dbeaver
# image verified to exist at generation time: dbeaver/cloudbeaver:latest

services:
  dbeaver:
    image: dbeaver/cloudbeaver:latest
    ports:
      - target: 8978
        published: 8978
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - dbeaver_config:/config
      - dbeaver_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8978/ || wget -qO- http://127.0.0.1:8978/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=dbeaver"
    #   - "homepage.description=Universal database tool; supports all major databases.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=dbeaver.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8978"
    #   - "homepage.server=localhost"

volumes:
  dbeaver_config:
  dbeaver_data:

networks:
  default:
    name: dbeaver_net
    driver: overlay
    attachable: true
