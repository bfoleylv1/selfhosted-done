# ambassador - docker compose (single host)
# image verified to exist at generation time: docker.io/emissaryingress/emissary:3.9.1

services:
  ambassador:
    image: docker.io/emissaryingress/emissary:3.9.1
    container_name: ambassador
    restart: unless-stopped
    ports:
      - "20403:8080"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Api Management"
    #   - "homepage.name=ambassador"
    #   - "homepage.description=L7 load balancer; Kubernetes-native application delivery controller."
    #   - "homepage.tags=Api Management,Gateways"
    #   - "homepage.icon=ambassador.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20403"
    #   - "homepage.server=localhost"

networks:
  default:
    name: ambassador_net
