# rsync - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml rsync
# image verified to exist at generation time: eeacms/rsync:latest

services:
  rsync:
    image: eeacms/rsync:latest
    ports:
      - target: 20257
        published: 20257
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - rsync_config:/config
      - rsync_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20257 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rsync"
    #   - "homepage.description=Fast and versatile file copying tool; delta sync and backup."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rsync.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20257"
    #   - "homepage.server=localhost"

volumes:
  rsync_config:
  rsync_data:

networks:
  default:
    name: rsync_net
    driver: overlay
    attachable: true
