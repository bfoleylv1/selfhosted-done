# se2eend - docker compose (single host)
# image verified to exist at generation time: se2eend/se2eend:latest

services:
  se2eend:
    # image: se2eend/se2eend:latest  # UNVERIFIED
    container_name: se2eend
    restart: unless-stopped
    ports:
      - "20547:20547"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20547 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=se2eend"
    #   - "homepage.description=se2eend self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=se2eend.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20547"
    #   - "homepage.server=localhost"

networks:
  default:
    name: se2eend_net
