# traefik - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml traefik
# image verified to exist at generation time: traefik:v3.2

services:
  traefik:
    image: traefik:v3.2
    ports:
      - target: 8080
        published: 20332
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - traefik_config:/config
      - traefik_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ping || wget -qO- http://127.0.0.1:8080/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=traefik"
    #   - "homepage.description=Modern reverse proxy; automatic service discovery and routing."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=traefik.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20332"
    #   - "homepage.server=localhost"

volumes:
  traefik_config:
  traefik_data:

networks:
  default:
    name: traefik_net
    driver: overlay
    attachable: true
