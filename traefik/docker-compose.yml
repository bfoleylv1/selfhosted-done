# traefik - docker compose (single host)
# image verified to exist at generation time: traefik:v3.2

services:
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped
    ports:
      - "20332:8080"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ping || wget -qO- http://127.0.0.1:8080/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=traefik"
    #   - "homepage.description=Modern reverse proxy; automatic service discovery and routing."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=traefik.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20332"
    #   - "homepage.server=localhost"

networks:
  default:
    name: traefik_net
