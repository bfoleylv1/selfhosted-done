# url-to-png - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml url-to-png
# image verified to exist at generation time: ghcr.io/browserless/chromium:latest

services:
  url-to-png:
    image: ghcr.io/browserless/chromium:latest
    ports:
      - target: 20345
        published: 20345
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - url-to-png_config:/config
      - url-to-png_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20345 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=url-to-png"
    #   - "homepage.description=Render URLs to PNG screenshots."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=url-to-png.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20345"
    #   - "homepage.server=localhost"

volumes:
  url-to-png_config:
  url-to-png_data:

networks:
  default:
    name: url-to-png_net
    driver: overlay
    attachable: true
