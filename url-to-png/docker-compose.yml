# url-to-png - docker compose (single host)
# image verified to exist at generation time: ghcr.io/browserless/chromium:latest

services:
  url-to-png:
    image: ghcr.io/browserless/chromium:latest
    container_name: url-to-png
    restart: unless-stopped
    ports:
      - "20345:20345"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20345 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=url-to-png"
    #   - "homepage.description=url-to-png self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=url-to-png.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20345"
    #   - "homepage.server=localhost"

networks:
  default:
    name: url-to-png_net
