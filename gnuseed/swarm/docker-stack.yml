# gnuseed - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml gnuseed
# image verified to exist at generation time: alpine:3.20

services:
  gnuseed:
    image: alpine:3.20
    ports:
      - target: 20097
        published: 20097
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - gnuseed_config:/config
      - gnuseed_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20097 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=gnuseed"
    #   - "homepage.description=Distributed social network based on ActivityPub protocol."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=gnuseed.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20097"
    #   - "homepage.server=localhost"

volumes:
  gnuseed_config:
  gnuseed_data:

networks:
  default:
    name: gnuseed_net
    driver: overlay
    attachable: true
