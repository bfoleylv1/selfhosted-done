# gnuseed - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  gnuseed:
    image: alpine:3.20
    container_name: gnuseed
    restart: unless-stopped
    ports:
      - "20097:20097"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20097 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=gnuseed"
    #   - "homepage.description=Distributed social network based on ActivityPub protocol."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=gnuseed.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20097"
    #   - "homepage.server=localhost"

networks:
  default:
    name: gnuseed_net
