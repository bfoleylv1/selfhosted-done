# craftcms - docker compose (single host)
# image verified to exist at generation time: craftcms/nginx:8.2

services:
  craftcms:
    image: craftcms/nginx:8.2
    container_name: craftcms
    restart: unless-stopped
    ports:
      - "20037:20037"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20037 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=craftcms"
    #   - "homepage.description=Flexible content management; developer-friendly CMS."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=craftcms.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20037"
    #   - "homepage.server=localhost"

networks:
  default:
    name: craftcms_net
