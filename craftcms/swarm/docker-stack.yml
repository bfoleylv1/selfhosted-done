# craftcms - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml craftcms
# image verified to exist at generation time: craftcms/nginx:8.2

services:
  craftcms:
    image: craftcms/nginx:8.2
    ports:
      - target: 20037
        published: 20037
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - craftcms_config:/config
      - craftcms_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20037 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=craftcms"
    #   - "homepage.description=Flexible content management; developer-friendly CMS."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=craftcms.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20037"
    #   - "homepage.server=localhost"

volumes:
  craftcms_config:
  craftcms_data:

networks:
  default:
    name: craftcms_net
    driver: overlay
    attachable: true
