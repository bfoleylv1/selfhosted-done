# youtubedl-server - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml youtubedl-server
# image verified to exist at generation time: nbr23/youtube-dl-server:latest

services:
  youtubedl-server:
    image: nbr23/youtube-dl-server:latest
    ports:
      - target: 20380
        published: 20380
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - youtubedl-server_config:/config
      - youtubedl-server_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20380 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=youtubedl-server"
    #   - "homepage.description=Web UI for youtube-dl downloads."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=youtubedl-server.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20380"
    #   - "homepage.server=localhost"

volumes:
  youtubedl-server_config:
  youtubedl-server_data:

networks:
  default:
    name: youtubedl-server_net
    driver: overlay
    attachable: true
