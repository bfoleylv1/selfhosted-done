# claude-code - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml claude-code
# image verified to exist at generation time: anthropics/claude-code:latest

services:
  claude-code:
    image: anthropics/claude-code:latest
    ports:
      - target: 20530
        published: 20530
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - claude-code_config:/config
      - claude-code_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20530 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=claude-code"
    #   - "homepage.description=claude-code self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=claude-code.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20530"
    #   - "homepage.server=localhost"

volumes:
  claude-code_config:
  claude-code_data:

networks:
  default:
    name: claude-code_net
    driver: overlay
    attachable: true
