# claude-code - docker compose (single host)
# image verified to exist at generation time: anthropics/claude-code:latest

services:
  claude-code:
    image: anthropics/claude-code:latest
    container_name: claude-code
    restart: unless-stopped
    ports:
      - "20530:20530"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20530 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=claude-code"
    #   - "homepage.description=Claude Code: Anthropic's agentic CLI for coding tasks (self-hosted wrapper)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=claude-code.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20530"
    #   - "homepage.server=localhost"

networks:
  default:
    name: claude-code_net
