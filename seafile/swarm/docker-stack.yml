# seafile - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml seafile
# image verified to exist at generation time: seafileltd/seafile-mc:latest

services:
  seafile:
    image: seafileltd/seafile-mc:latest
    ports:
      - target: 8000
        published: 20266
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - seafile_config:/config
      - seafile_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ || wget -qO- http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=seafile"
    #   - "homepage.description=Professional file sync and share solution; focuses on efficiency and privacy."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=seafile.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20266"
    #   - "homepage.server=localhost"

volumes:
  seafile_config:
  seafile_data:

networks:
  default:
    name: seafile_net
    driver: overlay
    attachable: true
