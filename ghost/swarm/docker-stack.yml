# ghost - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml ghost
# image verified to exist at generation time: ghost:5-alpine

services:
  ghost:
    image: ghost:5-alpine
    ports:
      - target: 2368
        published: 2368
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ghost_config:/config
      - ghost_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2368/ || wget -qO- http://127.0.0.1:2368/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ghost"
    #   - "homepage.description=ghost self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ghost.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:2368"
    #   - "homepage.server=localhost"

volumes:
  ghost_config:
  ghost_data:

networks:
  default:
    name: ghost_net
    driver: overlay
    attachable: true
