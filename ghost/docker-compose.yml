# ghost - docker compose (single host)
# image verified to exist at generation time: ghost:5-alpine

services:
  ghost:
    image: ghost:5-alpine
    container_name: ghost
    restart: unless-stopped
    ports:
      - "2368:2368"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2368/ || wget -qO- http://127.0.0.1:2368/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ghost"
    #   - "homepage.description=Publishing platform; focused on publishing and journalism."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ghost.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:2368"
    #   - "homepage.server=localhost"

networks:
  default:
    name: ghost_net
