# depay - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  depay:
    image: node:20-alpine
    container_name: depay
    restart: unless-stopped
    ports:
      - "20043:20043"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20043 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=depay"
    #   - "homepage.description=Self-hosted crypto payment processor.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=depay.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20043"
    #   - "homepage.server=localhost"

networks:
  default:
    name: depay_net
