# nodered - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml nodered
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: nodered/node-red:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - nodered_nodered_data_app_config:/data
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - nodered
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 1080
      published: 20596
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=nodered"
    #   - "homepage.description=nodered self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=nodered.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20596"
    #   - "homepage.server=localhost"
volumes:
  nodered_nodered_data_app_config: null
networks:
  default:
    name: nodered_net
    driver: overlay
    attachable: true
