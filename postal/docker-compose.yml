# postal - docker compose (single host)
# image verified to exist at generation time: ghcr.io/postalserver/postal:latest

services:
  postal:
    image: ghcr.io/postalserver/postal:latest
    container_name: postal
    restart: unless-stopped
    ports:
      - "20214:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=postal"
    #   - "homepage.description=Full-featured open-source mail server."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=postal.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20214"
    #   - "homepage.server=localhost"

networks:
  default:
    name: postal_net
