# stirling-pdf - docker compose (single host)
# image verified to exist at generation time: ghcr.io/stirling-tools/stirling-pdf:latest

services:
  stirling-pdf:
    image: ghcr.io/stirling-tools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "20302:20302"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20302 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=stirling-pdf"
    #   - "homepage.description=Local PDF manipulation toolkit (merge, split, convert).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=stirling-pdf.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20302"
    #   - "homepage.server=localhost"

networks:
  default:
    name: stirling-pdf_net
