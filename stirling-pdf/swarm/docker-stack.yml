# stirling-pdf - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml stirling-pdf
# image verified to exist at generation time: ghcr.io/stirling-tools/stirling-pdf:latest

services:
  stirling-pdf:
    image: ghcr.io/stirling-tools/stirling-pdf:latest
    ports:
      - target: 20302
        published: 20302
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - stirling-pdf_config:/config
      - stirling-pdf_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20302 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=stirling-pdf"
    #   - "homepage.description=Local PDF manipulation toolkit (merge, split, convert)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=stirling-pdf.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20302"
    #   - "homepage.server=localhost"

volumes:
  stirling-pdf_config:
  stirling-pdf_data:

networks:
  default:
    name: stirling-pdf_net
    driver: overlay
    attachable: true
