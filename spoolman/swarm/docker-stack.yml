# spoolman - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml spoolman
# image verified to exist at generation time: ghcr.io/donkie/spoolman:latest

services:
  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    ports:
      - target: 20293
        published: 20293
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - spoolman_config:/config
      - spoolman_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20293 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=spoolman"
    #   - "homepage.description=Filament and spool inventory manager for 3D printing.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=spoolman.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20293"
    #   - "homepage.server=localhost"

volumes:
  spoolman_config:
  spoolman_data:

networks:
  default:
    name: spoolman_net
    driver: overlay
    attachable: true
