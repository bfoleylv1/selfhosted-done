# keycloak - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml keycloak
# image verified to exist at generation time: quay.io/keycloak/keycloak:latest

services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - target: 8080
        published: 20125
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - keycloak_config:/config
      - keycloak_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/realms/master || wget -qO- http://127.0.0.1:8080/realms/master || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=keycloak"
    #   - "homepage.description=Open-source Identity and Access Management; OAuth2, OIDC, SAML provider."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=keycloak.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20125"
    #   - "homepage.server=localhost"

volumes:
  keycloak_config:
  keycloak_data:

networks:
  default:
    name: keycloak_net
    driver: overlay
    attachable: true
