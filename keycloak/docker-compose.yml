# keycloak - docker compose (single host)
# image verified to exist at generation time: quay.io/keycloak/keycloak:latest

services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    restart: unless-stopped
    ports:
      - "20125:8080"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/realms/master || wget -qO- http://127.0.0.1:8080/realms/master || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=keycloak"
    #   - "homepage.description=Open-source Identity and Access Management; OAuth2, OIDC, SAML provider."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=keycloak.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20125"
    #   - "homepage.server=localhost"

networks:
  default:
    name: keycloak_net
