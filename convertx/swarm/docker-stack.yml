# convertx - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml convertx
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: ghcr.io/c4illin/convertx:latest
    environment:
    - JWT_SECRET=aLongAndSecretStringUsedToSignTheJSONWebToken1234
    volumes:
    - convertx_convertx_data:/app/data
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - bun
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 3000
      published: 20564
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=convertx"
    #   - "homepage.description=convertx self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=convertx.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20564"
    #   - "homepage.server=localhost"
volumes:
  convertx_convertx_data: null
networks:
  default:
    name: convertx_net
    driver: overlay
    attachable: true
