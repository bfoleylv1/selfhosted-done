# woodpecker-ci - docker compose (single host)
# image verified to exist at generation time: woodpeckerci/woodpecker-server:latest

services:
  woodpecker-ci:
    image: woodpeckerci/woodpecker-server:latest
    container_name: woodpecker-ci
    restart: unless-stopped
    ports:
      - "20368:20368"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20368 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
