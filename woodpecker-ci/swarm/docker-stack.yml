# woodpecker-ci - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml woodpecker-ci
# image verified to exist at generation time: woodpeckerci/woodpecker-server:latest

services:
  woodpecker-ci:
    image: woodpeckerci/woodpecker-server:latest
    ports:
      - target: 20368
        published: 20368
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - woodpecker-ci_config:/config
      - woodpecker-ci_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20368 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=woodpecker-ci"
    #   - "homepage.description=Lightweight CI/CD system; fork of Drone."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=woodpecker-ci.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20368"
    #   - "homepage.server=localhost"

volumes:
  woodpecker-ci_config:
  woodpecker-ci_data:

networks:
  default:
    name: woodpecker-ci_net
    driver: overlay
    attachable: true
