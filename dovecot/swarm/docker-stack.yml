# dovecot - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml dovecot
# image verified to exist at generation time: dovecot/dovecot:latest

services:
  dovecot:
    image: dovecot/dovecot:latest
    ports:
      - target: 143
        published: 20049
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - dovecot_config:/config
      - dovecot_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 143 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=dovecot"
    #   - "homepage.description=dovecot self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=dovecot.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20049"
    #   - "homepage.server=localhost"

volumes:
  dovecot_config:
  dovecot_data:

networks:
  default:
    name: dovecot_net
    driver: overlay
    attachable: true
