# centrifugo - docker compose (single host)
# image verified to exist at generation time: centrifugo/centrifugo:v5

services:
  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: centrifugo
    restart: unless-stopped
    ports:
      - "20025:20025"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20025 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=centrifugo"
    #   - "homepage.description=Real-time messaging server (WebSocket/SSE) for live updates.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=centrifugo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20025"
    #   - "homepage.server=localhost"

networks:
  default:
    name: centrifugo_net
