# centrifugo - docker compose (single host)
# image verified to exist at generation time: centrifugo/centrifugo:v5

services:
  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: centrifugo
    restart: unless-stopped
    ports:
      - "20025:8000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosting Solutions"
    #   - "homepage.name=centrifugo"
    #   - "homepage.description=centrifugo self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=centrifugo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20025"
    #   - "homepage.server=localhost"

networks:
  default:
    name: centrifugo_net
