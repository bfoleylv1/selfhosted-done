# centrifugo - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml centrifugo
# image verified to exist at generation time: centrifugo/centrifugo:v5

services:
  centrifugo:
    image: centrifugo/centrifugo:v5
    ports:
      - target: 20025
        published: 20025
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - centrifugo_config:/config
      - centrifugo_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20025 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=centrifugo"
    #   - "homepage.description=Real-time messaging server (WebSocket/SSE) for live updates.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=centrifugo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20025"
    #   - "homepage.server=localhost"

volumes:
  centrifugo_config:
  centrifugo_data:

networks:
  default:
    name: centrifugo_net
    driver: overlay
    attachable: true
