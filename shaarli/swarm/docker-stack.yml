# shaarli - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml shaarli
# image verified to exist at generation time: ghcr.io/shaarli/shaarli:latest

services:
  shaarli:
    image: ghcr.io/shaarli/shaarli:latest
    ports:
      - target: 20276
        published: 20276
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - shaarli_config:/config
      - shaarli_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20276 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=shaarli"
    #   - "homepage.description=shaarli self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=shaarli.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20276"
    #   - "homepage.server=localhost"

volumes:
  shaarli_config:
  shaarli_data:

networks:
  default:
    name: shaarli_net
    driver: overlay
    attachable: true
