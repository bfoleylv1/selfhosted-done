# shaarli - docker compose (single host)
# image verified to exist at generation time: ghcr.io/shaarli/shaarli:latest

services:
  shaarli:
    image: ghcr.io/shaarli/shaarli:latest
    container_name: shaarli
    restart: unless-stopped
    ports:
      - "20276:20276"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20276 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=shaarli"
    #   - "homepage.description=shaarli self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=shaarli.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20276"
    #   - "homepage.server=localhost"

networks:
  default:
    name: shaarli_net
