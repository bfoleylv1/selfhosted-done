# miniflux - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml miniflux
# image verified to exist at generation time: miniflux/miniflux:latest

services:
  miniflux:
    image: miniflux/miniflux:latest
    ports:
      - target: 8080
        published: 20156
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - miniflux_config:/config
      - miniflux_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthcheck || wget -qO- http://127.0.0.1:8080/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=miniflux"
    #   - "homepage.description=Simple and fast RSS reader; minimalist UI with excellent readability."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=miniflux.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20156"
    #   - "homepage.server=localhost"

volumes:
  miniflux_config:
  miniflux_data:

networks:
  default:
    name: miniflux_net
    driver: overlay
    attachable: true
