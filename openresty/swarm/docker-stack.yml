# openresty - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml openresty
# image verified to exist at generation time: openresty/openresty:alpine

services:
  openresty:
    image: openresty/openresty:alpine
    ports:
      - target: 20179
        published: 20179
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - openresty_config:/config
      - openresty_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20179 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=openresty"
    #   - "homepage.description=NGINX with Lua; high-performance web platform."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=openresty.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20179"
    #   - "homepage.server=localhost"

volumes:
  openresty_config:
  openresty_data:

networks:
  default:
    name: openresty_net
    driver: overlay
    attachable: true
