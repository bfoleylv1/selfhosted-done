# openresty - docker compose (single host)
# image verified to exist at generation time: openresty/openresty:alpine

services:
  openresty:
    image: openresty/openresty:alpine
    container_name: openresty
    restart: unless-stopped
    ports:
      - "20179:20179"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20179 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=openresty"
    #   - "homepage.description=NGINX with Lua; high-performance web platform."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=openresty.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20179"
    #   - "homepage.server=localhost"

networks:
  default:
    name: openresty_net
