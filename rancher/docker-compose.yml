# rancher - docker compose (single host)
# image verified to exist at generation time: rancher/rancher:latest

services:
  rancher:
    image: rancher/rancher:latest
    container_name: rancher
    restart: unless-stopped
    ports:
      - "20233:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - LIBVA_DRIVER_NAME=iHD
      # - INTEL_GPU=1
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # devices:
    #   - /dev/kvm:/dev/kvm
    #   - /dev/dri:/dev/dri
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rancher"
    #   - "homepage.description=Container management platform; multi-cluster Kubernetes management."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rancher.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20233"
    #   - "homepage.server=localhost"

networks:
  default:
    name: rancher_net
