# mimir - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml mimir
# image verified to exist at generation time: grafana/mimir:latest

services:
  mimir:
    image: grafana/mimir:latest
    ports:
      - target: 20155
        published: 20155
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - mimir_config:/config
      - mimir_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20155 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mimir"
    #   - "homepage.description=mimir self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mimir.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20155"
    #   - "homepage.server=localhost"

volumes:
  mimir_config:
  mimir_data:

networks:
  default:
    name: mimir_net
    driver: overlay
    attachable: true
