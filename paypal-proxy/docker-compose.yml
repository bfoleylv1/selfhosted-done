# paypal-proxy - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  paypal-proxy:
    image: node:20-alpine
    container_name: paypal-proxy
    restart: unless-stopped
    ports:
      - "20196:20196"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20196 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=paypal-proxy"
    #   - "homepage.description=Proxy for the PayPal payment API."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=paypal-proxy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20196"
    #   - "homepage.server=localhost"

networks:
  default:
    name: paypal-proxy_net
