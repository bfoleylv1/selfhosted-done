# paypal-proxy - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml paypal-proxy
# image verified to exist at generation time: node:20-alpine

services:
  paypal-proxy:
    image: node:20-alpine
    ports:
      - target: 20196
        published: 20196
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - paypal-proxy_config:/config
      - paypal-proxy_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20196 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=paypal-proxy"
    #   - "homepage.description=Proxy for the PayPal payment API."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=paypal-proxy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20196"
    #   - "homepage.server=localhost"

volumes:
  paypal-proxy_config:
  paypal-proxy_data:

networks:
  default:
    name: paypal-proxy_net
    driver: overlay
    attachable: true
