# yacy - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml yacy
# image verified to exist at generation time: yacy/yacy_search_server:latest

services:
  yacy:
    image: yacy/yacy_search_server:latest
    ports:
      - target: 20374
        published: 20374
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - yacy_config:/config
      - yacy_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20374 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=yacy"
    #   - "homepage.description=Decentralized search engine; peer-to-peer indexing and search network."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=yacy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20374"
    #   - "homepage.server=localhost"

volumes:
  yacy_config:
  yacy_data:

networks:
  default:
    name: yacy_net
    driver: overlay
    attachable: true
