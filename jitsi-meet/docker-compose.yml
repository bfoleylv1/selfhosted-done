services:
  jitsi-meet:
    image: robertoandrade/jitsi-meet:latest
    container_name: jitsi-meet
    restart: unless-stopped
    ports:
    - 8443:8443
    environment:
    - TZ=${TZ:-America/Los_Angeles}
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    volumes:
    - ./config:/config
    - ./data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8443/ || wget -qO- http://127.0.0.1:8443/ || exit
        1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
networks:
  default:
    name: jitsi-meet_net
