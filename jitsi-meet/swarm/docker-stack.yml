services:
  jitsi-meet:
    image: robertoandrade/jitsi-meet:latest
    ports:
    - target: 8443
      published: 8443
      protocol: tcp
      mode: ingress
    environment:
    - TZ=${TZ:-America/Los_Angeles}
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    volumes:
    - jitsi-meet_config:/config
    - jitsi-meet_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8443/ || wget -qO- http://127.0.0.1:8443/ || exit
        1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
volumes:
  jitsi-meet_config: null
  jitsi-meet_data: null
networks:
  default:
    name: jitsi-meet_net
    driver: overlay
    attachable: true
