# libervrt - docker compose (single host)
# image verified to exist at generation time: lscr.io/linuxserver/emby:latest

services:
  libervrt:
    image: lscr.io/linuxserver/emby:latest
    container_name: libervrt
    restart: unless-stopped
    ports:
      - "20139:20139"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20139 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=libervrt"
    #   - "homepage.description=Self-hosted service.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=libervrt.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20139"
    #   - "homepage.server=localhost"

networks:
  default:
    name: libervrt_net
