# kiwix - docker compose (single host)
# image verified to exist at generation time: ghcr.io/kiwix/kiwix-serve:latest

services:
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: kiwix
    restart: unless-stopped
    ports:
      - "20129:20129"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20129 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=kiwix"
    #   - "homepage.description=kiwix self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=kiwix.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20129"
    #   - "homepage.server=localhost"

networks:
  default:
    name: kiwix_net
