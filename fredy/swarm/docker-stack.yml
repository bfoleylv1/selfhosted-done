# fredy - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml fredy
# image verified to exist at generation time: ghcr.io/orangecoding/fredy:latest

services:
  fredy:
    image: ghcr.io/orangecoding/fredy:latest
    ports:
      - target: 9998
        published: 9998
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - fredy_config:/config
      - fredy_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9998 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=fredy"
    #   - "homepage.description=fredy self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=fredy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9998"
    #   - "homepage.server=localhost"

volumes:
  fredy_config:
  fredy_data:

networks:
  default:
    name: fredy_net
    driver: overlay
    attachable: true
