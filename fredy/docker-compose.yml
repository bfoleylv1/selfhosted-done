# fredy - docker compose (single host)
# image verified to exist at generation time: ghcr.io/orangecoding/fredy:latest

services:
  fredy:
    image: ghcr.io/orangecoding/fredy:latest
    container_name: fredy
    restart: unless-stopped
    ports:
      - "9998:9998"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9998 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=fredy"
    #   - "homepage.description=Self-hosted price comparison and shopping tool."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=fredy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9998"
    #   - "homepage.server=localhost"

networks:
  default:
    name: fredy_net
