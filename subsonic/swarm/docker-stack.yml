# subsonic - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml subsonic
# image verified to exist at generation time: lscr.io/linuxserver/airsonic-advanced:latest

services:
  subsonic:
    image: lscr.io/linuxserver/airsonic-advanced:latest
    ports:
      - target: 4040
        published: 4040
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - subsonic_config:/config
      - subsonic_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4040/ || wget -qO- http://127.0.0.1:4040/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=subsonic"
    #   - "homepage.description=subsonic self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=subsonic.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:4040"
    #   - "homepage.server=localhost"

volumes:
  subsonic_config:
  subsonic_data:

networks:
  default:
    name: subsonic_net
    driver: overlay
    attachable: true
