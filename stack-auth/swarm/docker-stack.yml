# stack-auth - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml stack-auth
# image verified to exist at generation time: node:20-alpine

services:
  stack-auth:
    image: node:20-alpine
    ports:
      - target: 20298
        published: 20298
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - stack-auth_config:/config
      - stack-auth_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20298 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=stack-auth"
    #   - "homepage.description=Open-source authentication and user management."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=stack-auth.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20298"
    #   - "homepage.server=localhost"

volumes:
  stack-auth_config:
  stack-auth_data:

networks:
  default:
    name: stack-auth_net
    driver: overlay
    attachable: true
