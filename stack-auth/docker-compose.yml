# stack-auth - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  stack-auth:
    image: node:20-alpine
    container_name: stack-auth
    restart: unless-stopped
    ports:
      - "20298:20298"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20298 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=stack-auth"
    #   - "homepage.description=Open-source authentication and user management."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=stack-auth.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20298"
    #   - "homepage.server=localhost"

networks:
  default:
    name: stack-auth_net
