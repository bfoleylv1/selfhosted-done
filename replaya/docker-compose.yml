# replaya - docker compose (single host)
# image verified to exist at generation time: replaya/replaya:latest

services:
  replaya:
    # image: replaya/replaya:latest  # UNVERIFIED
    container_name: replaya
    restart: unless-stopped
    ports:
      - "20501:20501"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20501 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=replaya"
    #   - "homepage.description=replaya self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=replaya.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20501"
    #   - "homepage.server=localhost"

networks:
  default:
    name: replaya_net
