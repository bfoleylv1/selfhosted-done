# replaya - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml replaya
# image verified to exist at generation time: replaya/replaya:latest

services:
  replaya:
    # image: replaya/replaya:latest  # UNVERIFIED
    ports:
      - target: 20501
        published: 20501
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - replaya_config:/config
      - replaya_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20501 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=replaya"
    #   - "homepage.description=replaya self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=replaya.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20501"
    #   - "homepage.server=localhost"

volumes:
  replaya_config:
  replaya_data:

networks:
  default:
    name: replaya_net
    driver: overlay
    attachable: true
