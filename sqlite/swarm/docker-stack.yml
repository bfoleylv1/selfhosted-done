# sqlite - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml sqlite
# image verified to exist at generation time: keinos/sqlite3:latest

services:
  sqlite:
    image: keinos/sqlite3:latest
    ports:
      - target: 20295
        published: 20295
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - sqlite_config:/config
      - sqlite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20295 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sqlite"
    #   - "homepage.description=sqlite self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sqlite.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20295"
    #   - "homepage.server=localhost"

volumes:
  sqlite_config:
  sqlite_data:

networks:
  default:
    name: sqlite_net
    driver: overlay
    attachable: true
