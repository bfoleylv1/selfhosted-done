# matrix-synapse - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml matrix-synapse
# image verified to exist at generation time: matrixdotorg/synapse:latest

services:
  matrix-synapse:
    image: matrixdotorg/synapse:latest
    ports:
      - target: 8008
        published: 8008
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - matrix-synapse_config:/config
      - matrix-synapse_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8008 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=matrix-synapse"
    #   - "homepage.description=matrix-synapse self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=matrix-synapse.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8008"
    #   - "homepage.server=localhost"

volumes:
  matrix-synapse_config:
  matrix-synapse_data:

networks:
  default:
    name: matrix-synapse_net
    driver: overlay
    attachable: true
