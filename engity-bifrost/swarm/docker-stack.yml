# engity-bifrost - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml engity-bifrost
# image verified to exist at generation time: alpine:3.20

services:
  engity-bifrost:
    image: alpine:3.20
    ports:
      - target: 20061
        published: 20061
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - engity-bifrost_config:/config
      - engity-bifrost_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20061 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=engity-bifrost"
    #   - "homepage.description=Engity Bifrost - identity and SSO gateway."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=engity-bifrost.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20061"
    #   - "homepage.server=localhost"

volumes:
  engity-bifrost_config:
  engity-bifrost_data:

networks:
  default:
    name: engity-bifrost_net
    driver: overlay
    attachable: true
