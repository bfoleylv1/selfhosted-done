# joplin - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml joplin
# image verified to exist at generation time: linuxserver/joplin:latest

services:
  joplin:
    image: linuxserver/joplin:latest
    ports:
      - target: 22300
        published: 22300
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - joplin_config:/config
      - joplin_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22300 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=joplin"
    #   - "homepage.description=Note-taking and to-do application; Markdown support with encryption."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=joplin.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:22300"
    #   - "homepage.server=localhost"

volumes:
  joplin_config:
  joplin_data:

networks:
  default:
    name: joplin_net
    driver: overlay
    attachable: true
