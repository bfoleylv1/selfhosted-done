# tiny-tiny-rss - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml tiny-tiny-rss
# image verified to exist at generation time: php:8.2-fpm

services:
  tiny-tiny-rss:
    image: php:8.2-fpm
    ports:
      - target: 20331
        published: 20331
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - tiny-tiny-rss_config:/config
      - tiny-tiny-rss_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20331 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tiny-tiny-rss"
    #   - "homepage.description=Web-based news reader; customizable and extensible RSS aggregator."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tiny-tiny-rss.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20331"
    #   - "homepage.server=localhost"

volumes:
  tiny-tiny-rss_config:
  tiny-tiny-rss_data:

networks:
  default:
    name: tiny-tiny-rss_net
    driver: overlay
    attachable: true
