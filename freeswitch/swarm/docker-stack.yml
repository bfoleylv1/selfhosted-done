# freeswitch - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml freeswitch
# image verified to exist at generation time: safarov/freeswitch:latest

services:
  freeswitch:
    image: safarov/freeswitch:latest
    ports:
      - target: 20078
        published: 20078
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - freeswitch_config:/config
      - freeswitch_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20078 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=freeswitch"
    #   - "homepage.description=Open-source telephony platform / softswitch (VoIP).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=freeswitch.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20078"
    #   - "homepage.server=localhost"

volumes:
  freeswitch_config:
  freeswitch_data:

networks:
  default:
    name: freeswitch_net
    driver: overlay
    attachable: true
