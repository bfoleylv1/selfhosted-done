# yarn-social - docker compose (single host)
# image verified to exist at generation time: prologic/yarnd:latest

services:
  yarn-social:
    image: prologic/yarnd:latest
    container_name: yarn-social
    restart: unless-stopped
    ports:
      - "20375:20375"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20375 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=yarn-social"
    #   - "homepage.description=Self-hosted microblog (Yarn.social, Gemtext-based)."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=yarn-social.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20375"
    #   - "homepage.server=localhost"

networks:
  default:
    name: yarn-social_net
