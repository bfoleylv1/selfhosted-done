# codiff - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml codiff
# image verified to exist at generation time: codiff/codiff:latest

services:
  codiff:
    # image: codiff/codiff:latest  # UNVERIFIED
    ports:
      - target: 20428
        published: 20428
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - codiff_config:/config
      - codiff_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20428 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=codiff"
    #   - "homepage.description=codiff self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=codiff.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20428"
    #   - "homepage.server=localhost"

volumes:
  codiff_config:
  codiff_data:

networks:
  default:
    name: codiff_net
    driver: overlay
    attachable: true
