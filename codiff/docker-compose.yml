# codiff - docker compose (single host)
# image verified to exist at generation time: codiff/codiff:latest

services:
  codiff:
    # image: codiff/codiff:latest  # UNVERIFIED
    container_name: codiff
    restart: unless-stopped
    ports:
      - "20428:20428"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20428 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=codiff"
    #   - "homepage.description=codiff self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=codiff.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20428"
    #   - "homepage.server=localhost"

networks:
  default:
    name: codiff_net
