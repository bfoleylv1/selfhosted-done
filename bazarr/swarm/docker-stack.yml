# bazarr - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml bazarr
# image verified to exist at generation time: lscr.io/linuxserver/bazarr:latest

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    ports:
      - target: 6767
        published: 6767
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - bazarr_config:/config
      - bazarr_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6767/ || wget -qO- http://127.0.0.1:6767/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=bazarr"
    #   - "homepage.description=Subtitle manager for Sonarr and Radarr; automatic download and management.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=bazarr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:6767"
    #   - "homepage.server=localhost"

volumes:
  bazarr_config:
  bazarr_data:

networks:
  default:
    name: bazarr_net
    driver: overlay
    attachable: true
