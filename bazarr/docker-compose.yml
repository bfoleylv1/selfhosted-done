# bazarr - docker compose (single host)
# image verified to exist at generation time: lscr.io/linuxserver/bazarr:latest

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6767/ || wget -qO- http://127.0.0.1:6767/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=bazarr"
    #   - "homepage.description=bazarr self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=bazarr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:6767"
    #   - "homepage.server=localhost"

networks:
  default:
    name: bazarr_net
