# supabase - docker compose (single host)
# image verified to exist at generation time: supabase/postgres:15.8.1.020

services:
  supabase:
    image: supabase/postgres:15.8.1.020
    container_name: supabase
    restart: unless-stopped
    ports:
      - "20310:8000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=supabase"
    #   - "homepage.description=Firebase alternative; open-source backend for web apps."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=supabase.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20310"
    #   - "homepage.server=localhost"

networks:
  default:
    name: supabase_net
