# supabase - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml supabase
# image verified to exist at generation time: supabase/postgres:15.8.1.020

services:
  supabase:
    image: supabase/postgres:15.8.1.020
    ports:
      - target: 8000
        published: 20310
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - supabase_config:/config
      - supabase_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=supabase"
    #   - "homepage.description=Firebase alternative; open-source backend for web apps."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=supabase.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20310"
    #   - "homepage.server=localhost"

volumes:
  supabase_config:
  supabase_data:

networks:
  default:
    name: supabase_net
    driver: overlay
    attachable: true
