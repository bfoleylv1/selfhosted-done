# nginx-proxy-manager - docker compose (single host)
# image verified to exist at generation time: jc21/nginx-proxy-manager:latest

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "20167:20167"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20167 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
