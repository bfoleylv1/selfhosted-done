# openship - docker compose (single host)
# image verified to exist at generation time: openship/openship:latest

services:
  openship:
    # image: openship/openship:latest  # UNVERIFIED
    container_name: openship
    restart: unless-stopped
    ports:
      - "20542:20542"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20542 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=openship"
    #   - "homepage.description=openship self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=openship.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20542"
    #   - "homepage.server=localhost"

networks:
  default:
    name: openship_net
