# openship - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml openship
# image verified to exist at generation time: openship/openship:latest

services:
  openship:
    # image: openship/openship:latest  # UNVERIFIED
    ports:
      - target: 20542
        published: 20542
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - openship_config:/config
      - openship_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20542 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=openship"
    #   - "homepage.description=openship self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=openship.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20542"
    #   - "homepage.server=localhost"

volumes:
  openship_config:
  openship_data:

networks:
  default:
    name: openship_net
    driver: overlay
    attachable: true
