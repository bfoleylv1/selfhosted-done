# matomo - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml matomo
# image verified to exist at generation time: matomo:latest

services:
  matomo:
    image: matomo:latest
    ports:
      - target: 80
        published: 20152
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - matomo_config:/config
      - matomo_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=matomo"
    #   - "homepage.description=Open-source web analytics platform; full control over your data."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=matomo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20152"
    #   - "homepage.server=localhost"

volumes:
  matomo_config:
  matomo_data:

networks:
  default:
    name: matomo_net
    driver: overlay
    attachable: true
