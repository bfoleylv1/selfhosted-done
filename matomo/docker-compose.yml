# matomo - docker compose (single host)
# image verified to exist at generation time: matomo:latest

services:
  matomo:
    image: matomo:latest
    container_name: matomo
    restart: unless-stopped
    ports:
      - "20152:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=matomo"
    #   - "homepage.description=Open-source web analytics platform; full control over your data.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=matomo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20152"
    #   - "homepage.server=localhost"

networks:
  default:
    name: matomo_net
