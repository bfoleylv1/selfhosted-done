# baikal - docker compose (single host)
# image verified to exist at generation time: ckulka/baikal:nginx

services:
  baikal:
    image: ckulka/baikal:nginx
    container_name: baikal
    restart: unless-stopped
    ports:
      - "20009:20009"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20009 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=baikal"
    #   - "homepage.description=Lightweight CalDAV and CardDAV server."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=baikal.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20009"
    #   - "homepage.server=localhost"

networks:
  default:
    name: baikal_net
