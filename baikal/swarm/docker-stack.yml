# baikal - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml baikal
# image verified to exist at generation time: ckulka/baikal:nginx

services:
  baikal:
    image: ckulka/baikal:nginx
    ports:
      - target: 20009
        published: 20009
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - baikal_config:/config
      - baikal_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20009 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=baikal"
    #   - "homepage.description=Lightweight CalDAV and CardDAV server.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=baikal.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20009"
    #   - "homepage.server=localhost"

volumes:
  baikal_config:
  baikal_data:

networks:
  default:
    name: baikal_net
    driver: overlay
    attachable: true
