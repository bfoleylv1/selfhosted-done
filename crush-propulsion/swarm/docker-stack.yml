# crush-propulsion - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml crush-propulsion
# image verified to exist at generation time: alpine:3.20

services:
  crush-propulsion:
    image: alpine:3.20
    ports:
      - target: 20039
        published: 20039
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - crush-propulsion_config:/config
      - crush-propulsion_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20039 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=crush-propulsion"
    #   - "homepage.description=crush-propulsion self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=crush-propulsion.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20039"
    #   - "homepage.server=localhost"

volumes:
  crush-propulsion_config:
  crush-propulsion_data:

networks:
  default:
    name: crush-propulsion_net
    driver: overlay
    attachable: true
