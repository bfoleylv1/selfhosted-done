# tuwunel - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml tuwunel
# image verified to exist at generation time: ghcr.io/matrix-construct/tuwunel:latest

services:
  tuwunel:
    image: ghcr.io/matrix-construct/tuwunel:latest
    ports:
      - target: 20338
        published: 20338
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - tuwunel_config:/config
      - tuwunel_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20338 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tuwunel"
    #   - "homepage.description=tuwunel self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tuwunel.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20338"
    #   - "homepage.server=localhost"

volumes:
  tuwunel_config:
  tuwunel_data:

networks:
  default:
    name: tuwunel_net
    driver: overlay
    attachable: true
