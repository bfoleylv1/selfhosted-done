# tuwunel - docker compose (single host)
# image verified to exist at generation time: ghcr.io/matrix-construct/tuwunel:latest

services:
  tuwunel:
    image: ghcr.io/matrix-construct/tuwunel:latest
    container_name: tuwunel
    restart: unless-stopped
    ports:
      - "20338:20338"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20338 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tuwunel"
    #   - "homepage.description=Matrix homeserver written in Rust."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tuwunel.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20338"
    #   - "homepage.server=localhost"

networks:
  default:
    name: tuwunel_net
