# qm - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml qm
# image verified to exist at generation time: qm/qm:latest

services:
  qm:
    # image: qm/qm:latest  # UNVERIFIED
    ports:
      - target: 20498
        published: 20498
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - qm_config:/config
      - qm_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20498 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=qm"
    #   - "homepage.description=qm self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=qm.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20498"
    #   - "homepage.server=localhost"

volumes:
  qm_config:
  qm_data:

networks:
  default:
    name: qm_net
    driver: overlay
    attachable: true
