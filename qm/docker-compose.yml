# qm - docker compose (single host)
# image verified to exist at generation time: qm/qm:latest

services:
  qm:
    # image: qm/qm:latest  # UNVERIFIED
    container_name: qm
    restart: unless-stopped
    ports:
      - "20498:20498"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20498 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=qm"
    #   - "homepage.description=qm self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=qm.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20498"
    #   - "homepage.server=localhost"

networks:
  default:
    name: qm_net
