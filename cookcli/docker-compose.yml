services:
  cookcli:
    image: ghcr.io/cooklang/cookcli:latest
    container_name: cookcli
    restart: unless-stopped
    ports:
    - 20430:20430
    environment:
    - TZ=${TZ:-America/Los_Angeles}
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    volumes:
    - ./config:/config
    - ./data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 20430 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
networks:
  default:
    name: cookcli_net
