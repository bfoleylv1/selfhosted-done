# notion-clone - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml notion-clone
# image verified to exist at generation time: appflowyinc/appflowy_cloud:latest

services:
  notion-clone:
    image: appflowyinc/appflowy_cloud:latest
    ports:
      - target: 20170
        published: 20170
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - notion-clone_config:/config
      - notion-clone_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20170 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=notion-clone"
    #   - "homepage.description=Open-source Notion alternative for note-taking."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=notion-clone.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20170"
    #   - "homepage.server=localhost"

volumes:
  notion-clone_config:
  notion-clone_data:

networks:
  default:
    name: notion-clone_net
    driver: overlay
    attachable: true
