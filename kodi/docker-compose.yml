    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=kodi.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20131"
    #   - "homepage.server=localhost"

networks:
  default:
    name: kodi_net
