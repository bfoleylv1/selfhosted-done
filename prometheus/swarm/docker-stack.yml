# prometheus - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml prometheus
# image verified to exist at generation time: prom/prometheus:latest

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - target: 9090
        published: 20221
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - prometheus_config:/config
      - prometheus_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/-/healthy || wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=prometheus"
    #   - "homepage.description=prometheus self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=prometheus.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20221"
    #   - "homepage.server=localhost"

volumes:
  prometheus_config:
  prometheus_data:

networks:
  default:
    name: prometheus_net
    driver: overlay
    attachable: true
