# pgdog - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml pgdog
# image verified to exist at generation time: ghcr.io/pgdogdev/pgdog:latest

services:
  pgdog:
    image: ghcr.io/pgdogdev/pgdog:latest
    ports:
      - target: 20200
        published: 20200
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - pgdog_config:/config
      - pgdog_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pgdog"
    #   - "homepage.description=pgdog self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pgdog.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20200"
    #   - "homepage.server=localhost"

volumes:
  pgdog_config:
  pgdog_data:

networks:
  default:
    name: pgdog_net
    driver: overlay
    attachable: true
