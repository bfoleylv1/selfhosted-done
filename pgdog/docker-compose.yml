# pgdog - docker compose (single host)
# image verified to exist at generation time: ghcr.io/pgdogdev/pgdog:latest

services:
  pgdog:
    image: ghcr.io/pgdogdev/pgdog:latest
    container_name: pgdog
    restart: unless-stopped
    ports:
      - "20200:20200"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pgdog"
    #   - "homepage.description=PostgreSQL connection pooler and proxy."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pgdog.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20200"
    #   - "homepage.server=localhost"

networks:
  default:
    name: pgdog_net
