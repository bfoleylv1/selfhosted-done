# bar-assistant - docker compose (single host)
# image verified to exist at generation time: barassistant/server:v5

services:
  bar-assistant:
    image: barassistant/server:v5
    container_name: bar-assistant
    restart: unless-stopped
    ports:
      - "20010:8080"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosting Solutions"
    #   - "homepage.name=bar-assistant"
    #   - "homepage.description=bar-assistant self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=bar-assistant.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20010"
    #   - "homepage.server=localhost"

networks:
  default:
    name: bar-assistant_net
