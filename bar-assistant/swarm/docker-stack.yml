# bar-assistant - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml bar-assistant
# image verified to exist at generation time: barassistant/server:v5

services:
  bar-assistant:
    image: barassistant/server:v5
    ports:
      - target: 8080
        published: 20010
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - bar-assistant_config:/config
      - bar-assistant_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosting Solutions"
    #   - "homepage.name=bar-assistant"
    #   - "homepage.description=bar-assistant self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=bar-assistant.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20010"
    #   - "homepage.server=localhost"

volumes:
  bar-assistant_config:
  bar-assistant_data:

networks:
  default:
    name: bar-assistant_net
    driver: overlay
    attachable: true
