# bifrost - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml bifrost
# image verified to exist at generation time: alpine:3.20

services:
  bifrost:
    image: alpine:3.20
    ports:
      - target: 20012
        published: 20012
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - bifrost_config:/config
      - bifrost_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20012 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=bifrost"
    #   - "homepage.description=Media server with Jellyfin-like features; open source and self-hosted."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=bifrost.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20012"
    #   - "homepage.server=localhost"

volumes:
  bifrost_config:
  bifrost_data:

networks:
  default:
    name: bifrost_net
    driver: overlay
    attachable: true
