# geo2tz - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml geo2tz
# image verified to exist at generation time: noandrea/geo2tz:latest

services:
  geo2tz:
    image: noandrea/geo2tz:latest
    ports:
      - target: 20088
        published: 20088
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - geo2tz_config:/config
      - geo2tz_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20088 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=geo2tz"
    #   - "homepage.description=Convert geographic coordinates to a timezone."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=geo2tz.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20088"
    #   - "homepage.server=localhost"

volumes:
  geo2tz_config:
  geo2tz_data:

networks:
  default:
    name: geo2tz_net
    driver: overlay
    attachable: true
