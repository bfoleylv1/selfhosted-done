# geo2tz - docker compose (single host)
# image verified to exist at generation time: noandrea/geo2tz:latest

services:
  geo2tz:
    image: noandrea/geo2tz:latest
    container_name: geo2tz
    restart: unless-stopped
    ports:
      - "20088:20088"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20088 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=geo2tz"
    #   - "homepage.description=Convert geographic coordinates to a timezone."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=geo2tz.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20088"
    #   - "homepage.server=localhost"

networks:
  default:
    name: geo2tz_net
