# tileserver-gl - docker compose (single host)
# image verified to exist at generation time: maptiler/tileserver-gl:latest

services:
  tileserver-gl:
    image: maptiler/tileserver-gl:latest
    container_name: tileserver-gl
    restart: unless-stopped
    ports:
      - "20328:20328"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20328 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tileserver-gl"
    #   - "homepage.description=Serve vector and raster map tiles (Mapbox GL).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tileserver-gl.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20328"
    #   - "homepage.server=localhost"

networks:
  default:
    name: tileserver-gl_net
