# tileserver-gl - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml tileserver-gl
# image verified to exist at generation time: maptiler/tileserver-gl:latest

services:
  tileserver-gl:
    image: maptiler/tileserver-gl:latest
    ports:
      - target: 20328
        published: 20328
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - tileserver-gl_config:/config
      - tileserver-gl_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20328 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tileserver-gl"
    #   - "homepage.description=Serve vector and raster map tiles (Mapbox GL)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tileserver-gl.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20328"
    #   - "homepage.server=localhost"

volumes:
  tileserver-gl_config:
  tileserver-gl_data:

networks:
  default:
    name: tileserver-gl_net
    driver: overlay
    attachable: true
