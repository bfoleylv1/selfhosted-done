# icehound - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  icehound:
    image: alpine:3.20
    container_name: icehound
    restart: unless-stopped
    ports:
      - "20115:20115"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20115 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=icehound"
    #   - "homepage.description=AI-powered tool for incident response and system monitoring.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=icehound.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20115"
    #   - "homepage.server=localhost"

networks:
  default:
    name: icehound_net
