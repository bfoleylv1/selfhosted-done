# icehound - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml icehound
# image verified to exist at generation time: alpine:3.20

services:
  icehound:
    image: alpine:3.20
    ports:
      - target: 20115
        published: 20115
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - icehound_config:/config
      - icehound_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20115 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=icehound"
    #   - "homepage.description=icehound self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=icehound.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20115"
    #   - "homepage.server=localhost"

volumes:
  icehound_config:
  icehound_data:

networks:
  default:
    name: icehound_net
    driver: overlay
    attachable: true
