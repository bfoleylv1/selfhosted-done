# voltius - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml voltius
# image verified to exist at generation time: voltius/voltius:latest

services:
  voltius:
    # image: voltius/voltius:latest  # UNVERIFIED
    ports:
      - target: 20551
        published: 20551
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - voltius_config:/config
      - voltius_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20551 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=voltius"
    #   - "homepage.description=voltius self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=voltius.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20551"
    #   - "homepage.server=localhost"

volumes:
  voltius_config:
  voltius_data:

networks:
  default:
    name: voltius_net
    driver: overlay
    attachable: true
