# pinboard - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml pinboard
# image verified to exist at generation time: alpine:3.20

services:
  pinboard:
    image: alpine:3.20
    ports:
      - target: 20205
        published: 20205
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - pinboard_config:/config
      - pinboard_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20205 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pinboard"
    #   - "homepage.description=Social bookmarking service; save and share links."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pinboard.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20205"
    #   - "homepage.server=localhost"

volumes:
  pinboard_config:
  pinboard_data:

networks:
  default:
    name: pinboard_net
    driver: overlay
    attachable: true
