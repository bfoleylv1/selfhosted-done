# societies - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml societies
# image verified to exist at generation time: alpine:3.20

services:
  societies:
    image: alpine:3.20
    ports:
      - target: 20289
        published: 20289
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - societies_config:/config
      - societies_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20289 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=societies"
    #   - "homepage.description=Social login provider; bridges social accounts with local accounts."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=societies.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20289"
    #   - "homepage.server=localhost"

volumes:
  societies_config:
  societies_data:

networks:
  default:
    name: societies_net
    driver: overlay
    attachable: true
