# societies - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  societies:
    image: alpine:3.20
    container_name: societies
    restart: unless-stopped
    ports:
      - "20289:20289"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20289 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=societies"
    #   - "homepage.description=Social login provider; bridges social accounts with local accounts.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=societies.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20289"
    #   - "homepage.server=localhost"

networks:
  default:
    name: societies_net
