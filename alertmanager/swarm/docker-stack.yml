# alertmanager - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml alertmanager
# image verified to exist at generation time: prom/alertmanager:latest

services:
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - target: 9093
        published: 9093
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - alertmanager_config:/config
      - alertmanager_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9093/-/ready || wget -qO- http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=alertmanager"
    #   - "homepage.description=Alert handler for Prometheus; route and silencing alerts."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=alertmanager.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9093"
    #   - "homepage.server=localhost"

volumes:
  alertmanager_config:
  alertmanager_data:

networks:
  default:
    name: alertmanager_net
    driver: overlay
    attachable: true
