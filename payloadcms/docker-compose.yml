# payloadcms - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  payloadcms:
    image: node:20-alpine
    container_name: payloadcms
    restart: unless-stopped
    ports:
      - "20194:20194"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20194 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=payloadcms"
    #   - "homepage.description=payloadcms self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=payloadcms.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20194"
    #   - "homepage.server=localhost"

networks:
  default:
    name: payloadcms_net
