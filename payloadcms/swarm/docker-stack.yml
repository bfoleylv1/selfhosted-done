# payloadcms - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml payloadcms
# image verified to exist at generation time: node:20-alpine

services:
  payloadcms:
    image: node:20-alpine
    ports:
      - target: 20194
        published: 20194
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - payloadcms_config:/config
      - payloadcms_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20194 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=payloadcms"
    #   - "homepage.description=React-powered Node.js CMS; modern and customizable."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=payloadcms.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20194"
    #   - "homepage.server=localhost"

volumes:
  payloadcms_config:
  payloadcms_data:

networks:
  default:
    name: payloadcms_net
    driver: overlay
    attachable: true
