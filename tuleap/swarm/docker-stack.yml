# tuleap - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml tuleap
# image verified to exist at generation time: tuleap/tuleap-community-edition:latest

services:
  tuleap:
    image: tuleap/tuleap-community-edition:latest
    ports:
      - target: 20336
        published: 20336
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - tuleap_config:/config
      - tuleap_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20336 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tuleap"
    #   - "homepage.description=Open-source ALM and project management (Agile + DevOps)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tuleap.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20336"
    #   - "homepage.server=localhost"

volumes:
  tuleap_config:
  tuleap_data:

networks:
  default:
    name: tuleap_net
    driver: overlay
    attachable: true
