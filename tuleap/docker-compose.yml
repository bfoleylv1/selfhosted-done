# tuleap - docker compose (single host)
# image verified to exist at generation time: tuleap/tuleap-community-edition:latest

services:
  tuleap:
    image: tuleap/tuleap-community-edition:latest
    container_name: tuleap
    restart: unless-stopped
    ports:
      - "20336:20336"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20336 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tuleap"
    #   - "homepage.description=Open-source ALM and project management (Agile + DevOps)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tuleap.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20336"
    #   - "homepage.server=localhost"

networks:
  default:
    name: tuleap_net
