# openvpn - docker compose (single host)
# image verified to exist at generation time: kylemanna/openvpn:latest

services:
  openvpn:
    image: kylemanna/openvpn:latest
    container_name: openvpn
    restart: unless-stopped
    ports:
      - "1194:1194"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1194 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=openvpn"
    #   - "homepage.description=SSL VPN solution; secure networking and remote access."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=openvpn.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:1194"
    #   - "homepage.server=localhost"

networks:
  default:
    name: openvpn_net
