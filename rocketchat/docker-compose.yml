# rocketchat - docker compose (single host)
# image verified to exist at generation time: rocket.chat:latest

services:
  rocketchat:
    image: rocket.chat:latest
    container_name: rocketchat
    restart: unless-stopped
    ports:
      - "20503:3000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/v1/health || wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rocketchat"
    #   - "homepage.description=Web chat platform for teams; built with Meteor.js framework."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rocketchat.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20503"
    #   - "homepage.server=localhost"

networks:
  default:
    name: rocketchat_net
