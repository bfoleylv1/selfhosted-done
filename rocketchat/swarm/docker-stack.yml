# rocketchat - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml rocketchat
# image verified to exist at generation time: rocket.chat:latest

services:
  rocketchat:
    image: rocket.chat:latest
    ports:
      - target: 3000
        published: 20503
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - rocketchat_config:/config
      - rocketchat_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/v1/health || wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rocketchat"
    #   - "homepage.description=Web chat platform for teams; built with Meteor.js framework."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rocketchat.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20503"
    #   - "homepage.server=localhost"

volumes:
  rocketchat_config:
  rocketchat_data:

networks:
  default:
    name: rocketchat_net
    driver: overlay
    attachable: true
