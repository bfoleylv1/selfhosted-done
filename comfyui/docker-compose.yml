# comfyui - docker compose (single host)
# image verified to exist at generation time: ghcr.io/ai-dock/comfyui:latest

services:
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest
    container_name: comfyui
    restart: unless-stopped
    ports:
      - "8188:8188"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      ## -- GPU env: remove the '#' on the lines for your hardware --
      ## NVIDIA CUDA:
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      ## Intel oneAPI / OpenVINO:
      # - ONEAPI_DEVICE_SELECTOR=level_zero:gpu
      ## AMD ROCm:
      # - HSA_OVERRIDE_GFX_VERSION=11.0.0   # match your card
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8188/ || wget -qO- http://127.0.0.1:8188/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ## -------------------------------------------------------------
    ## HARDWARE ACCELERATION (GPU compute) - uncomment ONE variant
    ## (single '#' = real config, remove it to enable)
    ## -------------------------------------------------------------
    ## --- NVIDIA CUDA (needs nvidia-container-toolkit) ---
    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    ##
    ## --- Intel oneAPI / OpenVINO (iGPU compute) ---
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "video"
    #   - "render"
    ##
    ## --- AMD ROCm ---
    # devices:
    #   - /dev/kfd:/dev/kfd
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "video"
    #   - "render"
    # security_opt:
    #   - seccomp:unconfined
    # labels:
    #   - "homepage.group=Self Hosting Solutions"
    #   - "homepage.name=comfyui"
    #   - "homepage.description=comfyui self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=comfyui.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8188"
    #   - "homepage.server=localhost"

networks:
  default:
    name: comfyui_net
