# comfyui - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml comfyui
# image verified to exist at generation time: ghcr.io/ai-dock/comfyui:latest

services:
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest
    ports:
      - target: 8188
        published: 8188
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      ## -- GPU env: remove the '#' on the lines for your hardware --
      ## NVIDIA CUDA:
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      ## Intel oneAPI / OpenVINO:
      # - ONEAPI_DEVICE_SELECTOR=level_zero:gpu
      ## AMD ROCm:
      # - HSA_OVERRIDE_GFX_VERSION=11.0.0   # match your card
    volumes:
      - comfyui_config:/config
      - comfyui_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8188/ || wget -qO- http://127.0.0.1:8188/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
          # - node.labels.gpu == true   ## docker node update --label-add gpu=true <node>
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
      ## -------------------------------------------------------------
      ## GPU under Swarm: `devices:`/`runtime:` are IGNORED. Advertise
      ## the GPU on the node in /etc/docker/daemon.json:
      ##   {"node-generic-resources": ["NVIDIA-GPU=GPU-<uuid>"]}
      ## then uncomment below + the node.labels.gpu constraint above.
      ## -------------------------------------------------------------
      # reservations:
      #   generic_resources:
      #     - discrete_resource_spec:
      #         kind: 'NVIDIA-GPU'
      #         value: 1
    # labels:
    #   - "homepage.group=Self Hosting Solutions"
    #   - "homepage.name=comfyui"
    #   - "homepage.description=comfyui self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=comfyui.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8188"
    #   - "homepage.server=localhost"

volumes:
  comfyui_config:
  comfyui_data:

networks:
  default:
    name: comfyui_net
    driver: overlay
    attachable: true
