# gitlab-ci - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml gitlab-ci
# image verified to exist at generation time: gitlab/gitlab-runner:latest

services:
  gitlab-ci:
    image: gitlab/gitlab-runner:latest
    ports:
      - target: 8093
        published: 8093
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - gitlab-ci_config:/config
      - gitlab-ci_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8093 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=gitlab-ci"
    #   - "homepage.description=gitlab-ci self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=gitlab-ci.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8093"
    #   - "homepage.server=localhost"

volumes:
  gitlab-ci_config:
  gitlab-ci_data:

networks:
  default:
    name: gitlab-ci_net
    driver: overlay
    attachable: true
