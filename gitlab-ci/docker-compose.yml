# gitlab-ci - docker compose (single host)
# image verified to exist at generation time: gitlab/gitlab-runner:latest

services:
  gitlab-ci:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-ci
    restart: unless-stopped
    ports:
      - "8093:8093"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8093 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=gitlab-ci"
    #   - "homepage.description=Built-in CI/CD for GitLab; automated testing and deployment.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=gitlab-ci.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8093"
    #   - "homepage.server=localhost"

networks:
  default:
    name: gitlab-ci_net
