# openconnect - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml openconnect
# image verified to exist at generation time: ubuntu:24.04

services:
  openconnect:
    image: ubuntu:24.04
    ports:
      - target: 20177
        published: 20177
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - openconnect_config:/config
      - openconnect_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20177 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=openconnect"
    #   - "homepage.description=SSL VPN solution; Cisco AnyConnect compatible.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=openconnect.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20177"
    #   - "homepage.server=localhost"

volumes:
  openconnect_config:
  openconnect_data:

networks:
  default:
    name: openconnect_net
    driver: overlay
    attachable: true
