# openconnect - docker compose (single host)
# image verified to exist at generation time: ubuntu:24.04

services:
  openconnect:
    image: ubuntu:24.04
    container_name: openconnect
    restart: unless-stopped
    ports:
      - "20177:20177"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20177 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=openconnect"
    #   - "homepage.description=SSL VPN solution; Cisco AnyConnect compatible."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=openconnect.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20177"
    #   - "homepage.server=localhost"

networks:
  default:
    name: openconnect_net
