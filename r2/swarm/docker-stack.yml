# r2 - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml r2
# image verified to exist at generation time: minio/minio:latest

services:
  r2:
    image: minio/minio:latest
    ports:
      - target: 20229
        published: 20229
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - r2_config:/config
      - r2_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20229 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=r2"
    #   - "homepage.description=Self-hosted proxy for Cloudflare R2 object storage."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=r2.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20229"
    #   - "homepage.server=localhost"

volumes:
  r2_config:
  r2_data:

networks:
  default:
    name: r2_net
    driver: overlay
    attachable: true
