# dumbdo - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml dumbdo
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: dumbwareio/dumbdo:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - dumbdo_dumbdo_data:/app/data
    ports:
    - target: 3000
      published: 20571
      protocol: tcp
      mode: ingress
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:3000/ || wget -qO- http://127.0.0.1:3000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=dumbdo"
    #   - "homepage.description=dumbdo self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=dumbdo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20571"
    #   - "homepage.server=localhost"
volumes:
  dumbdo_dumbdo_data: null
networks:
  default:
    name: dumbdo_net
    driver: overlay
    attachable: true
