# sure - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml sure
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  web:
    image: ghcr.io/we-promise/sure:stable
    volumes:
    - sure_app_storage:/rails/storage
    environment:
    - POSTGRES_USER=sure_user
    - POSTGRES_PASSWORD=sure_password
    - POSTGRES_DB=sure_production
    - SECRET_KEY_BASE=FtJ37sKlYVIExyIOlhFnIkR5_UxJPAwS
    - SELF_HOSTED=true
    - RAILS_FORCE_SSL=true
    - RAILS_ASSUME_SSL=true
    - DB_HOST=172.28.0.10
    - DB_PORT=5432
    - REDIS_URL=redis://172.28.0.11:6379/1
    - OPENAI_ACCESS_TOKEN=-r_thKXh3uRI8ywbPTiysD6isyjKC66D
    - OIDC_ISSUER=
    - OIDC_CLIENT_ID=
    - OIDC_CLIENT_SECRET=1TNxLz2rJ4Pj-Q4rSRTiLeaxoXyQ7wyH
    - OIDC_REDIRECT_URI=https://<your-domain>/auth/openid_connect/callback
    ports:
    - target: 3000
      published: 20611
      protocol: tcp
      mode: ingress
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:3000/ || wget -qO- http://127.0.0.1:3000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
  worker:
    image: ghcr.io/we-promise/sure:stable
    command: bundle exec sidekiq
    volumes:
    - sure_app_storage:/rails/storage
    environment:
    - POSTGRES_USER=sure_user
    - POSTGRES_PASSWORD=sure_password
    - POSTGRES_DB=sure_production
    - SECRET_KEY_BASE=FtJ37sKlYVIExyIOlhFnIkR5_UxJPAwS
    - SELF_HOSTED=true
    - RAILS_FORCE_SSL=true
    - RAILS_ASSUME_SSL=true
    - DB_HOST=172.28.0.10
    - DB_PORT=5432
    - REDIS_URL=redis://172.28.0.11:6379/1
    - OPENAI_ACCESS_TOKEN=-r_thKXh3uRI8ywbPTiysD6isyjKC66D
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
  db:
    image: postgres:16
    volumes:
    - sure_postgres_data:/var/lib/postgresql/data
    environment:
    - POSTGRES_USER=sure_user
    - POSTGRES_PASSWORD=sure_password
    - POSTGRES_DB=sure_production
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      sure_net:
        ipv4_address: 172.28.0.10
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
  backup:
    profiles:
    - backup
    image: prodrigestivill/postgres-backup-local:latest
    volumes:
    - sure_backups:/backups
    environment:
    - POSTGRES_HOST=db
    - POSTGRES_DB=sure_production
    - POSTGRES_USER=sure_user
    - POSTGRES_PASSWORD=sure_password
    - SCHEDULE=@daily
    - BACKUP_KEEP_DAYS=7
    - BACKUP_KEEP_WEEKS=4
    - BACKUP_KEEP_MONTHS=6
    networks:
    - sure_net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
  redis:
    image: redis:latest
    volumes:
    - sure_redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      sure_net:
        ipv4_address: 172.28.0.11
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sure"
    #   - "homepage.description=sure self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sure.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20611"
    #   - "homepage.server=localhost"
networks:
  default:
    name: sure_net
    driver: overlay
    attachable: true
  sure_net:
    driver: overlay
    attachable: true
volumes:
  sure_app_storage: null
  sure_postgres_data: null
  sure_backups: null
  sure_redis_data: null
