    #   - "homepage.description=mopidy self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mopidy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:6680"
    #   - "homepage.server=localhost"

networks:
  default:
    name: mopidy_net
