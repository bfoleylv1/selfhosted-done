services:
  echo:
    image: amir20/echo:latest
    ports:
    - target: 80
      published: 20534
      protocol: tcp
      mode: ingress
    environment:
    - TZ=${TZ:-America/Los_Angeles}
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    volumes:
    - echo_config:/config
    - echo_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
volumes:
  echo_config: null
  echo_data: null
networks:
  default:
    name: echo_net
    driver: overlay
    attachable: true
