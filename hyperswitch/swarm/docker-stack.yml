# hyperswitch - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml hyperswitch
# image verified to exist at generation time: juspaydotin/hyperswitch-router:latest

services:
  hyperswitch:
    image: juspaydotin/hyperswitch-router:latest
    ports:
      - target: 20113
        published: 20113
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - hyperswitch_config:/config
      - hyperswitch_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20113 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=hyperswitch"
    #   - "homepage.description=Open-source payments infrastructure; routing, retries, and reconciliation.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=hyperswitch.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20113"
    #   - "homepage.server=localhost"

volumes:
  hyperswitch_config:
  hyperswitch_data:

networks:
  default:
    name: hyperswitch_net
    driver: overlay
    attachable: true
