# sylius - docker compose (single host)
# image verified to exist at generation time: php:8.2-fpm

services:
  sylius:
    image: php:8.2-fpm
    container_name: sylius
    restart: unless-stopped
    ports:
      - "20317:20317"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20317 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sylius"
    #   - "homepage.description=sylius self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sylius.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20317"
    #   - "homepage.server=localhost"

networks:
  default:
    name: sylius_net
