# sylius - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml sylius
# image verified to exist at generation time: php:8.2-fpm

services:
  sylius:
    image: php:8.2-fpm
    ports:
      - target: 20317
        published: 20317
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - sylius_config:/config
      - sylius_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20317 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sylius"
    #   - "homepage.description=Symfony-based e-commerce solution; highly customizable."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sylius.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20317"
    #   - "homepage.server=localhost"

volumes:
  sylius_config:
  sylius_data:

networks:
  default:
    name: sylius_net
    driver: overlay
    attachable: true
