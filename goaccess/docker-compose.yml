# goaccess - docker compose (single host)
# image verified to exist at generation time: allinurl/goaccess:latest

services:
  goaccess:
    image: allinurl/goaccess:latest
    container_name: goaccess
    restart: unless-stopped
    ports:
      - "7890:7890"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7890 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=goaccess"
    #   - "homepage.description=Real-time web log analyzer; interactive HTML reports."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=goaccess.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:7890"
    #   - "homepage.server=localhost"

networks:
  default:
    name: goaccess_net
