# goaccess - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml goaccess
# image verified to exist at generation time: allinurl/goaccess:latest

services:
  goaccess:
    image: allinurl/goaccess:latest
    ports:
      - target: 7890
        published: 7890
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - goaccess_config:/config
      - goaccess_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7890 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=goaccess"
    #   - "homepage.description=Real-time web log analyzer; interactive HTML reports."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=goaccess.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:7890"
    #   - "homepage.server=localhost"

volumes:
  goaccess_config:
  goaccess_data:

networks:
  default:
    name: goaccess_net
    driver: overlay
    attachable: true
