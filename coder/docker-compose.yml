# coder - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: ghcr.io/coder/coder:latest
    container_name: app-coder
    environment:
      CODER_PG_CONNECTION_URL: postgresql://username:strongpassword@localhost/coder?sslmode=disable
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_ACCESS_URL: http://localhost:7080
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./coder-data/coder-home:/home/coder
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - coder
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 7080:7080
  database:
    container_name: app-coder-database
    image: postgres:17
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: coder
    volumes:
    - ./coder-data/coder-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U username -d coder
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
