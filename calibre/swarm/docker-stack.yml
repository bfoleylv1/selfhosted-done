# calibre - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml calibre
# image verified to exist at generation time: linuxserver/calibre:latest

services:
  calibre:
    image: linuxserver/calibre:latest
    ports:
      - target: 8083
        published: 8083
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - calibre_config:/config
      - calibre_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/ || wget -qO- http://127.0.0.1:8083/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=calibre"
    #   - "homepage.description=Calibre: open-source e-book management and conversion server (Calibre-Web companion)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=calibre.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8083"
    #   - "homepage.server=localhost"

volumes:
  calibre_config:
  calibre_data:

networks:
  default:
    name: calibre_net
    driver: overlay
    attachable: true
