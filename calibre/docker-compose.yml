# calibre - docker compose (single host)
# image verified to exist at generation time: linuxserver/calibre:latest

services:
  calibre:
    image: linuxserver/calibre:latest
    container_name: calibre
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/ || wget -qO- http://127.0.0.1:8083/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=calibre"
    #   - "homepage.description=Calibre: open-source e-book management and conversion server (Calibre-Web companion)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=calibre.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8083"
    #   - "homepage.server=localhost"

networks:
  default:
    name: calibre_net
