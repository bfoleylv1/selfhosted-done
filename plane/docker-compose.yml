# plane - docker compose (single host)
# image verified to exist at generation time: makeplane/plane-backend:latest

services:
  plane:
    image: makeplane/plane-backend:latest
    container_name: plane
    restart: unless-stopped
    ports:
      - "20207:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=plane"
    #   - "homepage.description=Open source alternative to Notion and Linear; team project management."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=plane.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20207"
    #   - "homepage.server=localhost"

networks:
  default:
    name: plane_net
