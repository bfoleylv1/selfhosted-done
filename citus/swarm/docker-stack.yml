# citus - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml citus
# image verified to exist at generation time: citusdata/citus:12

services:
  citus:
    image: citusdata/citus:12
    ports:
      - target: 20029
        published: 20029
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - citus_config:/config
      - citus_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20029 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=citus"
    #   - "homepage.description=Extension to PostgreSQL; real-time analytics and scaling."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=citus.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20029"
    #   - "homepage.server=localhost"

volumes:
  citus_config:
  citus_data:

networks:
  default:
    name: citus_net
    driver: overlay
    attachable: true
