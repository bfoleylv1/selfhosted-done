# supportpal - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  supportpal:
    image: php:8.2-apache
    container_name: supportpal
    restart: unless-stopped
    ports:
      - "20312:20312"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20312 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=supportpal"
    #   - "homepage.description=Self-hosted helpdesk / support desk software (commercial).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=supportpal.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20312"
    #   - "homepage.server=localhost"

networks:
  default:
    name: supportpal_net
