# pixelfed - docker compose (single host)
# image verified to exist at generation time: zknt/pixelfed:latest

services:
  pixelfed:
    image: zknt/pixelfed:latest
    container_name: pixelfed
    restart: unless-stopped
    ports:
      - "20206:20206"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20206 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pixelfed"
    #   - "homepage.description=pixelfed self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pixelfed.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20206"
    #   - "homepage.server=localhost"

networks:
  default:
    name: pixelfed_net
