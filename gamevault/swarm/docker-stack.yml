# gamevault - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml gamevault
# image verified to exist at generation time: phalcode/gamevault-backend:latest

services:
  gamevault:
    image: phalcode/gamevault-backend:latest
    ports:
      - target: 20086
        published: 20086
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - gamevault_config:/config
      - gamevault_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20086 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=gamevault"
    #   - "homepage.description=gamevault self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=gamevault.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20086"
    #   - "homepage.server=localhost"

volumes:
  gamevault_config:
  gamevault_data:

networks:
  default:
    name: gamevault_net
    driver: overlay
    attachable: true
