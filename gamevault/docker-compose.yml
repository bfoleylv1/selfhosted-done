# gamevault - docker compose (single host)
# image verified to exist at generation time: phalcode/gamevault-backend:latest

services:
  gamevault:
    image: phalcode/gamevault-backend:latest
    container_name: gamevault
    restart: unless-stopped
    ports:
      - "20086:20086"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20086 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=gamevault"
    #   - "homepage.description=Self-hosted video game library manager."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=gamevault.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20086"
    #   - "homepage.server=localhost"

networks:
  default:
    name: gamevault_net
