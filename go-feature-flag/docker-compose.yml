# go-feature-flag - docker compose (single host)
# image verified to exist at generation time: thomaspoignant/go-feature-flag:latest

services:
  go-feature-flag:
    image: thomaspoignant/go-feature-flag:latest
    container_name: go-feature-flag
    restart: unless-stopped
    ports:
      - "1031:1031"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1031 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=go-feature-flag"
    #   - "homepage.description=Feature flag management system (Go)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=go-feature-flag.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:1031"
    #   - "homepage.server=localhost"

networks:
  default:
    name: go-feature-flag_net
