# go-feature-flag - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml go-feature-flag
# image verified to exist at generation time: thomaspoignant/go-feature-flag:latest

services:
  go-feature-flag:
    image: thomaspoignant/go-feature-flag:latest
    ports:
      - target: 1031
        published: 1031
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - go-feature-flag_config:/config
      - go-feature-flag_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1031 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=go-feature-flag"
    #   - "homepage.description=go-feature-flag self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=go-feature-flag.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:1031"
    #   - "homepage.server=localhost"

volumes:
  go-feature-flag_config:
  go-feature-flag_data:

networks:
  default:
    name: go-feature-flag_net
    driver: overlay
    attachable: true
