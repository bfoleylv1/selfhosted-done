# splunk - docker compose (single host)
# image verified to exist at generation time: splunk/splunk:latest

services:
  splunk:
    image: splunk/splunk:latest
    container_name: splunk
    restart: unless-stopped
    ports:
      - "20292:8000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ || wget -qO- http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=splunk"
    #   - "homepage.description=splunk self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=splunk.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20292"
    #   - "homepage.server=localhost"

networks:
  default:
    name: splunk_net
