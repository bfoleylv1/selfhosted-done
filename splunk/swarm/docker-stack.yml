# splunk - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml splunk
# image verified to exist at generation time: splunk/splunk:latest

services:
  splunk:
    image: splunk/splunk:latest
    ports:
      - target: 8000
        published: 20292
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - splunk_config:/config
      - splunk_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ || wget -qO- http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=splunk"
    #   - "homepage.description=Enterprise SIEM platform; log analysis and monitoring."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=splunk.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20292"
    #   - "homepage.server=localhost"

volumes:
  splunk_config:
  splunk_data:

networks:
  default:
    name: splunk_net
    driver: overlay
    attachable: true
