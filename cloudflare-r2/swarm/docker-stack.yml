# cloudflare-r2 - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml cloudflare-r2
# image verified to exist at generation time: minio/minio:latest

services:
  cloudflare-r2:
    image: minio/minio:latest
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - cloudflare-r2_config:/config
      - cloudflare-r2_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cloudflare-r2"
    #   - "homepage.description=S3-compatible object storage alternative to S3 with no egress fees."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cloudflare-r2.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9000"
    #   - "homepage.server=localhost"

volumes:
  cloudflare-r2_config:
  cloudflare-r2_data:

networks:
  default:
    name: cloudflare-r2_net
    driver: overlay
    attachable: true
