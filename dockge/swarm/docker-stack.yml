# dockge - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml dockge
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: louislam/dockge:1
    environment:
    - DOCKGE_STACKS_DIR=/home/bfoleylv/homelab-plex
    - PUID=1000
    - PGID=1000
    volumes:
    - dockge_dockge_data_app_config:/app/data
    - /var/run/docker.sock:/var/run/docker.sock
    - dockge_home_bfoleylv_homelab_plex:/stacks
    ports:
    - target: 5001
      published: 20567
      protocol: tcp
      mode: ingress
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:5001/ || wget -qO- http://127.0.0.1:5001/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=dockge"
    #   - "homepage.description=dockge self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=dockge.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20567"
    #   - "homepage.server=localhost"
volumes:
  dockge_dockge_data_app_config: null
  dockge_home_bfoleylv_homelab_plex: null
networks:
  default:
    name: dockge_net
    driver: overlay
    attachable: true
