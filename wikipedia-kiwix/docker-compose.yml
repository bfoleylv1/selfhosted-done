# wikipedia-kiwix - docker compose (single host)
# image verified to exist at generation time: ghcr.io/kiwix/kiwix-serve:latest

services:
  wikipedia-kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: wikipedia-kiwix
    restart: unless-stopped
    ports:
      - "20364:20364"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20364 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wikipedia-kiwix"
    #   - "homepage.description=Offline Wikipedia mirror; search Wikimedia projects without internet.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wikipedia-kiwix.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20364"
    #   - "homepage.server=localhost"

networks:
  default:
    name: wikipedia-kiwix_net
