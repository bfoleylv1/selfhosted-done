# wikipedia-kiwix - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml wikipedia-kiwix
# image verified to exist at generation time: ghcr.io/kiwix/kiwix-serve:latest

services:
  wikipedia-kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    ports:
      - target: 20364
        published: 20364
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - wikipedia-kiwix_config:/config
      - wikipedia-kiwix_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20364 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wikipedia-kiwix"
    #   - "homepage.description=Offline Wikipedia mirror; search Wikimedia projects without internet."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wikipedia-kiwix.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20364"
    #   - "homepage.server=localhost"

volumes:
  wikipedia-kiwix_config:
  wikipedia-kiwix_data:

networks:
  default:
    name: wikipedia-kiwix_net
    driver: overlay
    attachable: true
