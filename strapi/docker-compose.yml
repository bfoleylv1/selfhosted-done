# strapi - docker compose (single host)
# image verified to exist at generation time: naskio/strapi:latest

services:
  strapi:
    image: naskio/strapi:latest
    container_name: strapi
    restart: unless-stopped
    ports:
      - "20303:1337"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1337/ || wget -qO- http://127.0.0.1:1337/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=strapi"
    #   - "homepage.description=Headless CMS; customizable and API-first.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=strapi.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20303"
    #   - "homepage.server=localhost"

networks:
  default:
    name: strapi_net
