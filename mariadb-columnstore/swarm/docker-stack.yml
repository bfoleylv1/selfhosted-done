# mariadb-columnstore - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml mariadb-columnstore
# image verified to exist at generation time: mariadb/columnstore:latest

services:
  mariadb-columnstore:
    image: mariadb/columnstore:latest
    ports:
      - target: 20150
        published: 20150
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - mariadb-columnstore_config:/config
      - mariadb-columnstore_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20150 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mariadb-columnstore"
    #   - "homepage.description=Columnar storage engine for MariaDB; optimized for analytics workloads."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mariadb-columnstore.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20150"
    #   - "homepage.server=localhost"

volumes:
  mariadb-columnstore_config:
  mariadb-columnstore_data:

networks:
  default:
    name: mariadb-columnstore_net
    driver: overlay
    attachable: true
