# mariadb-columnstore - docker compose (single host)
# image verified to exist at generation time: mariadb/columnstore:latest

services:
  mariadb-columnstore:
    image: mariadb/columnstore:latest
    container_name: mariadb-columnstore
    restart: unless-stopped
    ports:
      - "20150:20150"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20150 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mariadb-columnstore"
    #   - "homepage.description=Columnar storage engine for MariaDB; optimized for analytics workloads."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mariadb-columnstore.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20150"
    #   - "homepage.server=localhost"

networks:
  default:
    name: mariadb-columnstore_net
