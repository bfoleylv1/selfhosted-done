# mealie - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: app-mealie
    deploy:
      resources:
        limits:
          memory: 1000M
    environment:
      ALLOW_SIGNUP: 'false'
      PUID: '1000'
      PGID: '1000'
      TZ: Europe/Amsterdam
      BASE_URL: http://localhost:20590
    volumes:
    - ./mealie-data:/app/data/
    restart: always
    ports:
    - 20590:9000
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:9000/ || wget -qO- http://127.0.0.1:9000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
