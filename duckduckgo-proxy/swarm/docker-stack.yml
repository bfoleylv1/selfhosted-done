# duckduckgo-proxy - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml duckduckgo-proxy
# image verified to exist at generation time: benbusby/whoogle-search:latest

services:
  duckduckgo-proxy:
    image: benbusby/whoogle-search:latest
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - duckduckgo-proxy_config:/config
      - duckduckgo-proxy_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=duckduckgo-proxy"
    #   - "homepage.description=Self-hosted proxy for the DuckDuckGo search API.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=duckduckgo-proxy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5000"
    #   - "homepage.server=localhost"

volumes:
  duckduckgo-proxy_config:
  duckduckgo-proxy_data:

networks:
  default:
    name: duckduckgo-proxy_net
    driver: overlay
    attachable: true
