# swifty - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  swifty:
    image: alpine:3.20
    container_name: swifty
    restart: unless-stopped
    ports:
      - "20316:20316"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20316 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=swifty"
    #   - "homepage.description=Simple and fast music server; lightweight alternative to Airsonic."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=swifty.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20316"
    #   - "homepage.server=localhost"

networks:
  default:
    name: swifty_net
