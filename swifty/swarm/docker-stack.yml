# swifty - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml swifty
# image verified to exist at generation time: alpine:3.20

services:
  swifty:
    image: alpine:3.20
    ports:
      - target: 20316
        published: 20316
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - swifty_config:/config
      - swifty_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20316 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=swifty"
    #   - "homepage.description=Simple and fast music server; lightweight alternative to Airsonic."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=swifty.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20316"
    #   - "homepage.server=localhost"

volumes:
  swifty_config:
  swifty_data:

networks:
  default:
    name: swifty_net
    driver: overlay
    attachable: true
