# home-assistant - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml home-assistant
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: ghcr.io/home-assistant/home-assistant:stable
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - home-assistant_home_assistant_data_config:/config
    - home-assistant_etc_localtime:/etc/localtime:ro
    - home-assistant_run_dbus:/run/dbus:ro
    healthcheck:
      test: curl --fail http://localhost:8123/ || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 8123
      published: 20581
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=home-assistant"
    #   - "homepage.description=home-assistant self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=home-assistant.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20581"
    #   - "homepage.server=localhost"
volumes:
  home-assistant_home_assistant_data_config: null
  home-assistant_etc_localtime: null
  home-assistant_run_dbus: null
networks:
  default:
    name: home-assistant_net
    driver: overlay
    attachable: true
