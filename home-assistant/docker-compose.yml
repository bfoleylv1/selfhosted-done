# home-assistant - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: app-home-assistant
    privileged: true
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - ./home-assistant-data/config:/config
    - /etc/localtime:/etc/localtime:ro
    - /run/dbus:/run/dbus:ro
    healthcheck:
      test: curl --fail http://localhost:8123/ || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 20581:8123
