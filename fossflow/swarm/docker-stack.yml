# fossflow - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml fossflow
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: stnsmith/fossflow:latest
    build:
      context: https://github.com/stan-smith/FossFLOW.git
      dockerfile: Dockerfile
    environment:
    - PUBLIC_URL="http://localhost:20576"
    healthcheck:
      test:
      - CMD-SHELL
      - wget --spider -q http://127.0.0.1:3000 || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 3000
      published: 20576
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=fossflow"
    #   - "homepage.description=fossflow self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=fossflow.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20576"
    #   - "homepage.server=localhost"
networks:
  default:
    name: fossflow_net
    driver: overlay
    attachable: true
