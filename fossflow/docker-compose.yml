# fossflow - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: stnsmith/fossflow:latest
    container_name: app-fossflow
    build:
      context: https://github.com/stan-smith/FossFLOW.git
      dockerfile: Dockerfile
    environment:
    - PUBLIC_URL="http://localhost:20576"
    healthcheck:
      test:
      - CMD-SHELL
      - wget --spider -q http://127.0.0.1:3000 || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 20576:3000
