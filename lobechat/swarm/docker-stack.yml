# lobechat - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml lobechat
# image verified to exist at generation time: lobehub/lobe-chat:latest

services:
  lobechat:
    image: lobehub/lobe-chat:latest
    ports:
      - target: 20469
        published: 20469
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - lobechat_config:/config
      - lobechat_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20469 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=lobechat"
    #   - "homepage.description=LobeChat: open-source chatbot platform with multi-model support and plugin ecosystem."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=lobechat.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20469"
    #   - "homepage.server=localhost"

volumes:
  lobechat_config:
  lobechat_data:

networks:
  default:
    name: lobechat_net
    driver: overlay
    attachable: true
