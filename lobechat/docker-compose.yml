# lobechat - docker compose (single host)
# image verified to exist at generation time: lobehub/lobe-chat:latest

services:
  lobechat:
    image: lobehub/lobe-chat:latest
    container_name: lobechat
    restart: unless-stopped
    ports:
      - "20469:20469"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20469 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=lobechat"
    #   - "homepage.description=LobeChat: open-source chatbot platform with multi-model support and plugin ecosystem."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=lobechat.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20469"
    #   - "homepage.server=localhost"

networks:
  default:
    name: lobechat_net
