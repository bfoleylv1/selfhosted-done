# vespa - docker compose (single host)
# image verified to exist at generation time: vespaengine/vespa:latest

services:
  vespa:
    image: vespaengine/vespa:latest
    container_name: vespa
    restart: unless-stopped
    ports:
      - "20349:20349"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20349 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=vespa"
    #   - "homepage.description=vespa self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=vespa.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20349"
    #   - "homepage.server=localhost"

networks:
  default:
    name: vespa_net
