# salut-a-toi - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  salut-a-toi:
    image: alpine:3.20
    container_name: salut-a-toi
    restart: unless-stopped
    ports:
      - "20263:20263"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20263 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=salut-a-toi"
    #   - "homepage.description=salut-a-toi self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=salut-a-toi.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20263"
    #   - "homepage.server=localhost"

networks:
  default:
    name: salut-a-toi_net
