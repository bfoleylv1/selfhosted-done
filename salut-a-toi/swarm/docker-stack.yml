# salut-a-toi - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml salut-a-toi
# image verified to exist at generation time: alpine:3.20

services:
  salut-a-toi:
    image: alpine:3.20
    ports:
      - target: 20263
        published: 20263
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - salut-a-toi_config:/config
      - salut-a-toi_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20263 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=salut-a-toi"
    #   - "homepage.description=salut-a-toi self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=salut-a-toi.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20263"
    #   - "homepage.server=localhost"

volumes:
  salut-a-toi_config:
  salut-a-toi_data:

networks:
  default:
    name: salut-a-toi_net
    driver: overlay
    attachable: true
