# b1gMail - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  b1gMail:
    image: php:8.2-apache
    container_name: b1gMail
    restart: unless-stopped
    ports:
      - "20006:20006"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20006 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=b1gMail"
    #   - "homepage.description=Self-hosted webmail and mail server suite."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=b1gMail.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20006"
    #   - "homepage.server=localhost"

networks:
  default:
    name: b1gMail_net
