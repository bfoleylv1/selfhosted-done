# wallabag - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml wallabag
# image verified to exist at generation time: wallabag/wallabag:latest

services:
  wallabag:
    image: wallabag/wallabag:latest
    ports:
      - target: 80
        published: 20354
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - wallabag_config:/config
      - wallabag_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wallabag"
    #   - "homepage.description=Read it later; web article scraper and read-later application."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wallabag.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20354"
    #   - "homepage.server=localhost"

volumes:
  wallabag_config:
  wallabag_data:

networks:
  default:
    name: wallabag_net
    driver: overlay
    attachable: true
