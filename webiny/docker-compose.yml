# webiny - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  webiny:
    image: node:20-alpine
    container_name: webiny
    restart: unless-stopped
    ports:
      - "20360:20360"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20360 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=webiny"
    #   - "homepage.description=Open-source serverless CMS and application framework."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=webiny.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20360"
    #   - "homepage.server=localhost"

networks:
  default:
    name: webiny_net
