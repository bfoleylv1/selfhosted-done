# webiny - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml webiny
# image verified to exist at generation time: node:20-alpine

services:
  webiny:
    image: node:20-alpine
    ports:
      - target: 20360
        published: 20360
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - webiny_config:/config
      - webiny_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20360 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=webiny"
    #   - "homepage.description=Open-source serverless CMS and application framework."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=webiny.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20360"
    #   - "homepage.server=localhost"

volumes:
  webiny_config:
  webiny_data:

networks:
  default:
    name: webiny_net
    driver: overlay
    attachable: true
