# transmute - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml transmute
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: ghcr.io/transmute-app/transmute:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - transmute_transmute_data:/app/data
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - --tries=1
      - http://localhost:3313/api/health/ready
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 3313
      published: 3313
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=transmute"
    #   - "homepage.description=transmute self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=transmute.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:3313"
    #   - "homepage.server=localhost"
volumes:
  transmute_transmute_data: null
networks:
  default:
    name: transmute_net
    driver: overlay
    attachable: true
