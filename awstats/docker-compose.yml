# awstats - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  awstats:
    image: php:8.2-apache
    container_name: awstats
    restart: unless-stopped
    ports:
      - "20004:8080"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Analytics"
    #   - "homepage.name=awstats"
    #   - "homepage.description=Advanced web statistics; detailed reporting and log analysis."
    #   - "homepage.tags=Analytics,Monitoring"
    #   - "homepage.icon=awstats.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20004"
    #   - "homepage.server=localhost"

networks:
  default:
    name: awstats_net
