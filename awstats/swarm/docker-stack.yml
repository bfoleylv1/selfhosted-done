# awstats - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml awstats
# image verified to exist at generation time: php:8.2-apache

services:
  awstats:
    image: php:8.2-apache
    ports:
      - target: 20004
        published: 20004
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - awstats_config:/config
      - awstats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20004 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=awstats"
    #   - "homepage.description=awstats self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=awstats.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20004"
    #   - "homepage.server=localhost"

volumes:
  awstats_config:
  awstats_data:

networks:
  default:
    name: awstats_net
    driver: overlay
    attachable: true
