# hytale - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml hytale
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: deinfreu/hytale-server:experimental
    environment:
    - SERVER_IP=0.0.0.0
    - SERVER_PORT=5520
    - PROD=FALSE
    - DEBUG=FALSE
    - TZ=America/Los_Angeles
    volumes:
    - hytale_hytale_data:/home/container
    - hytale_etc_machine_id:/etc/machine-id:ro
    tty: true
    stdin_open: true
    ports:
    - target: 5520
      published: 5520
      protocol: tcp
      mode: ingress
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:5520/ || wget -qO- http://127.0.0.1:5520/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=hytale"
    #   - "homepage.description=hytale self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=hytale.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5520"
    #   - "homepage.server=localhost"
volumes:
  hytale_hytale_data: null
  hytale_etc_machine_id: null
networks:
  default:
    name: hytale_net
    driver: overlay
    attachable: true
