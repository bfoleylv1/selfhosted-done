# posting - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml posting
# image verified to exist at generation time: posting-app/posting:latest

services:
  posting:
    # image: posting-app/posting:latest  # UNVERIFIED
    ports:
      - target: 20496
        published: 20496
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - posting_config:/config
      - posting_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20496 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=posting"
    #   - "homepage.description=posting self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=posting.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20496"
    #   - "homepage.server=localhost"

volumes:
  posting_config:
  posting_data:

networks:
  default:
    name: posting_net
    driver: overlay
    attachable: true
