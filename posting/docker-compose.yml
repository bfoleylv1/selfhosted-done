# posting - docker compose (single host)
# image verified to exist at generation time: posting-app/posting:latest

services:
  posting:
    # image: posting-app/posting:latest  # UNVERIFIED
    container_name: posting
    restart: unless-stopped
    ports:
      - "20496:20496"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20496 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=posting"
    #   - "homepage.description=posting self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=posting.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20496"
    #   - "homepage.server=localhost"

networks:
  default:
    name: posting_net
