# zeroclaw - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml zeroclaw
# image verified to exist at generation time: zeroclaw/zeroclaw:latest

services:
  zeroclaw:
    # image: zeroclaw/zeroclaw:latest  # UNVERIFIED
    ports:
      - target: 20521
        published: 20521
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - zeroclaw_config:/config
      - zeroclaw_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20521 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zeroclaw"
    #   - "homepage.description=zeroclaw self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zeroclaw.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20521"
    #   - "homepage.server=localhost"

volumes:
  zeroclaw_config:
  zeroclaw_data:

networks:
  default:
    name: zeroclaw_net
    driver: overlay
    attachable: true
