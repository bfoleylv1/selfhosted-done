# zeroclaw - docker compose (single host)
# image verified to exist at generation time: zeroclaw/zeroclaw:latest

services:
  zeroclaw:
    # image: zeroclaw/zeroclaw:latest  # UNVERIFIED
    container_name: zeroclaw
    restart: unless-stopped
    ports:
      - "20521:20521"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20521 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zeroclaw"
    #   - "homepage.description=zeroclaw self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zeroclaw.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20521"
    #   - "homepage.server=localhost"

networks:
  default:
    name: zeroclaw_net
