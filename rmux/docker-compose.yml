# rmux - docker compose (single host)
# image verified to exist at generation time: rmux/rmux:latest

services:
  rmux:
    # image: rmux/rmux:latest  # UNVERIFIED
    container_name: rmux
    restart: unless-stopped
    ports:
      - "20502:20502"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20502 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rmux"
    #   - "homepage.description=rmux self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rmux.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20502"
    #   - "homepage.server=localhost"

networks:
  default:
    name: rmux_net
