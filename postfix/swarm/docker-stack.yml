# postfix - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml postfix
# image verified to exist at generation time: boky/postfix:latest

services:
  postfix:
    image: boky/postfix:latest
    ports:
      - target: 25
        published: 20216
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - postfix_config:/config
      - postfix_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 25 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=postfix"
    #   - "homepage.description=postfix self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=postfix.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20216"
    #   - "homepage.server=localhost"

volumes:
  postfix_config:
  postfix_data:

networks:
  default:
    name: postfix_net
    driver: overlay
    attachable: true
