# epicyon - docker compose (single host)
# image verified to exist at generation time: python:3.11-slim

services:
  epicyon:
    image: python:3.11-slim
    container_name: epicyon
    restart: unless-stopped
    ports:
      - "20062:20062"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20062 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=epicyon"
    #   - "homepage.description=epicyon self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=epicyon.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20062"
    #   - "homepage.server=localhost"

networks:
  default:
    name: epicyon_net
