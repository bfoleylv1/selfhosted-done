# epicyon - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml epicyon
# image verified to exist at generation time: python:3.11-slim

services:
  epicyon:
    image: python:3.11-slim
    ports:
      - target: 20062
        published: 20062
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - epicyon_config:/config
      - epicyon_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20062 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=epicyon"
    #   - "homepage.description=Self-hosted ActivityPub federated social server."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=epicyon.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20062"
    #   - "homepage.server=localhost"

volumes:
  epicyon_config:
  epicyon_data:

networks:
  default:
    name: epicyon_net
    driver: overlay
    attachable: true
