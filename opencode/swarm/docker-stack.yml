# opencode - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml opencode
# image verified to exist at generation time: node:20-alpine

services:
  opencode:
    image: node:20-alpine
    ports:
      - target: 20176
        published: 20176
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - opencode_config:/config
      - opencode_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20176 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=opencode"
    #   - "homepage.description=Open-source AI coding agent / assistant."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=opencode.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20176"
    #   - "homepage.server=localhost"

volumes:
  opencode_config:
  opencode_data:

networks:
  default:
    name: opencode_net
    driver: overlay
    attachable: true
