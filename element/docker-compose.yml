# element - docker compose (single host)
# image verified to exist at generation time: vectorim/element-web:latest

services:
  element:
    image: vectorim/element-web:latest
    container_name: element
    restart: unless-stopped
    ports:
      - "20438:8080"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=element"
    #   - "homepage.description=element self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=element.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20438"
    #   - "homepage.server=localhost"

networks:
  default:
    name: element_net
