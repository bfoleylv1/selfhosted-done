# rss-bridge - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml rss-bridge
# image verified to exist at generation time: rssbridge/rss-bridge:latest

services:
  rss-bridge:
    image: rssbridge/rss-bridge:latest
    ports:
      - target: 20256
        published: 20256
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - rss-bridge_config:/config
      - rss-bridge_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20256 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rss-bridge"
    #   - "homepage.description=Generate RSS feeds for websites that don't provide them."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rss-bridge.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20256"
    #   - "homepage.server=localhost"

volumes:
  rss-bridge_config:
  rss-bridge_data:

networks:
  default:
    name: rss-bridge_net
    driver: overlay
    attachable: true
