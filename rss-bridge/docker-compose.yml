# rss-bridge - docker compose (single host)
# image verified to exist at generation time: rssbridge/rss-bridge:latest

services:
  rss-bridge:
    image: rssbridge/rss-bridge:latest
    container_name: rss-bridge
    restart: unless-stopped
    ports:
      - "20256:20256"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20256 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rss-bridge"
    #   - "homepage.description=rss-bridge self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rss-bridge.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20256"
    #   - "homepage.server=localhost"

networks:
  default:
    name: rss-bridge_net
