# airsonic-advanced - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml airsonic-advanced
# image verified to exist at generation time: lscr.io/linuxserver/airsonic-advanced:latest

services:
  airsonic-advanced:
    image: lscr.io/linuxserver/airsonic-advanced:latest
    ports:
      - target: 20399
        published: 20399
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - airsonic-advanced_config:/config
      - airsonic-advanced_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20399 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=airsonic-advanced"
    #   - "homepage.description=airsonic-advanced self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=airsonic-advanced.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20399"
    #   - "homepage.server=localhost"

volumes:
  airsonic-advanced_config:
  airsonic-advanced_data:

networks:
  default:
    name: airsonic-advanced_net
    driver: overlay
    attachable: true
