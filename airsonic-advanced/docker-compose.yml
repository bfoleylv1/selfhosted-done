# airsonic-advanced - docker compose (single host)
# image verified to exist at generation time: lscr.io/linuxserver/airsonic-advanced:latest

services:
  airsonic-advanced:
    image: lscr.io/linuxserver/airsonic-advanced:latest
    container_name: airsonic-advanced
    restart: unless-stopped
    ports:
      - "20399:20399"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20399 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=airsonic-advanced"
    #   - "homepage.description=Music server with multi-user support; stream your music anywhere."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=airsonic-advanced.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20399"
    #   - "homepage.server=localhost"

networks:
  default:
    name: airsonic-advanced_net
