# mongodb - docker compose (single host)
# image verified to exist at generation time: mongo:7

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 27017 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mongodb"
    #   - "homepage.description=mongodb self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mongodb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:27017"
    #   - "homepage.server=localhost"

networks:
  default:
    name: mongodb_net
