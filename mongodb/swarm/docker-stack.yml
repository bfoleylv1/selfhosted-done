# mongodb - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml mongodb
# image verified to exist at generation time: mongo:7

services:
  mongodb:
    image: mongo:7
    ports:
      - target: 27017
        published: 27017
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - mongodb_config:/config
      - mongodb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 27017 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mongodb"
    #   - "homepage.description=Document-oriented NoSQL database; stores JSON-like documents with flexible schemas."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mongodb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:27017"
    #   - "homepage.server=localhost"

volumes:
  mongodb_config:
  mongodb_data:

networks:
  default:
    name: mongodb_net
    driver: overlay
    attachable: true
