# axigen - docker compose (single host)
# image verified to exist at generation time: axigen/axigen:latest

services:
  axigen:
    image: axigen/axigen:latest
    container_name: axigen
    restart: unless-stopped
    ports:
      - "20005:20005"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20005 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=axigen"
    #   - "homepage.description=axigen self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=axigen.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20005"
    #   - "homepage.server=localhost"

networks:
  default:
    name: axigen_net
