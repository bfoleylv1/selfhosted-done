# logstash - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml logstash
# image verified to exist at generation time: docker.elastic.co/logstash/logstash:8.15.0

services:
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    ports:
      - target: 9600
        published: 9600
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - logstash_config:/config
      - logstash_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9600/ || wget -qO- http://127.0.0.1:9600/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=logstash"
    #   - "homepage.description=Data processing pipeline; collect, transform, and forward data."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=logstash.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9600"
    #   - "homepage.server=localhost"

volumes:
  logstash_config:
  logstash_data:

networks:
  default:
    name: logstash_net
    driver: overlay
    attachable: true
