# ddns-updater - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: qmcgaw/ddns-updater:latest
    container_name: app-ddns-updater
    environment:
    - TZ=America/Los_Angeles
    - CONFIG=
    - PERIOD=5m
    - UPDATE_COOLDOWN_PERIOD=5m
    - PUBLICIP_FETCHERS=all
    - PUBLICIP_HTTP_PROVIDERS=all
    - PUBLICIPV4_HTTP_PROVIDERS=all
    - PUBLICIPV6_HTTP_PROVIDERS=all
    - PUBLICIP_DNS_PROVIDERS=all
    - PUBLICIP_DNS_TIMEOUT=3s
    - HTTP_TIMEOUT=10s
    - LISTENING_ADDRESS=:8000
    - ROOT_URL=/
    - BACKUP_PERIOD=0
    - BACKUP_DIRECTORY=/updater/data
    - LOG_LEVEL=info
    - LOG_CALLER=hidden
    volumes:
    - ./ddns-updater-data/data:/updater/data
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - ddns-updater
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 20566:8000
