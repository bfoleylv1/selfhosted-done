# portainer - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml portainer
# image verified to exist at generation time: portainer/portainer-ce:latest

services:
  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - target: 9443
        published: 9443
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - portainer_config:/config
      - portainer_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9443/api/health || wget -qO- http://127.0.0.1:9443/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=portainer"
    #   - "homepage.description=Lightweight web UI for managing Docker, Swarm and Kubernetes."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=portainer.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9443"
    #   - "homepage.server=localhost"

volumes:
  portainer_config:
  portainer_data:

networks:
  default:
    name: portainer_net
    driver: overlay
    attachable: true
