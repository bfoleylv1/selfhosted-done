# portainer - docker compose (single host)
# image verified to exist at generation time: portainer/portainer-ce:latest

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9443/api/health || wget -qO- http://127.0.0.1:9443/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=portainer"
    #   - "homepage.description=Lightweight web UI for managing Docker, Swarm and Kubernetes."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=portainer.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9443"
    #   - "homepage.server=localhost"

networks:
  default:
    name: portainer_net
