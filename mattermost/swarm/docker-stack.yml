# mattermost - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml mattermost
# image verified to exist at generation time: mattermost/mattermost-team-edition:latest

services:
  mattermost:
    image: mattermost/mattermost-team-edition:latest
    ports:
      - target: 8065
        published: 8065
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - mattermost_config:/config
      - mattermost_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8065/api/v4/system/ping || wget -qO- http://127.0.0.1:8065/api/v4/system/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mattermost"
    #   - "homepage.description=Open source Slack alternative; self-hosted team chat platform."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mattermost.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8065"
    #   - "homepage.server=localhost"

volumes:
  mattermost_config:
  mattermost_data:

networks:
  default:
    name: mattermost_net
    driver: overlay
    attachable: true
