# mattermost - docker compose (single host)
# image verified to exist at generation time: mattermost/mattermost-team-edition:latest

services:
  mattermost:
    image: mattermost/mattermost-team-edition:latest
    container_name: mattermost
    restart: unless-stopped
    ports:
      - "8065:8065"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8065/api/v4/system/ping || wget -qO- http://127.0.0.1:8065/api/v4/system/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mattermost"
    #   - "homepage.description=mattermost self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mattermost.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8065"
    #   - "homepage.server=localhost"

networks:
  default:
    name: mattermost_net
