# zza - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  zza:
    image: alpine:3.20
    container_name: zza
    restart: unless-stopped
    ports:
      - "20392:20392"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20392 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zza"
    #   - "homepage.description=zza self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zza.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20392"
    #   - "homepage.server=localhost"

networks:
  default:
    name: zza_net
