# zza - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml zza
# image verified to exist at generation time: alpine:3.20

services:
  zza:
    image: alpine:3.20
    ports:
      - target: 20392
        published: 20392
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - zza_config:/config
      - zza_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20392 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zza"
    #   - "homepage.description=Self-hosted link reader; read and save links for later."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zza.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20392"
    #   - "homepage.server=localhost"

volumes:
  zza_config:
  zza_data:

networks:
  default:
    name: zza_net
    driver: overlay
    attachable: true
