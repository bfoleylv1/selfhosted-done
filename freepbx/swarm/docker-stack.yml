# freepbx - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml freepbx
# image verified to exist at generation time: debian:12-slim

services:
  freepbx:
    image: debian:12-slim
    ports:
      - target: 20077
        published: 20077
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - freepbx_config:/config
      - freepbx_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20077 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=freepbx"
    #   - "homepage.description=Web-based open-source PBX built on Asterisk."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=freepbx.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20077"
    #   - "homepage.server=localhost"

volumes:
  freepbx_config:
  freepbx_data:

networks:
  default:
    name: freepbx_net
    driver: overlay
    attachable: true
