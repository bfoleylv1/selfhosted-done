# stirlingpdf - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml stirlingpdf
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: frooodle/s-pdf:latest
    environment:
    - DOCKER_ENABLE_SECURITY=false
    - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
    - LANGS=en_GB
    volumes:
    - stirlingpdf_stirlingpdf_data_trainingdata:/usr/share/tessdata
    - stirlingpdf_stirlingpdf_data_extraconfigs:/configs
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - app.jar
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 8080
      published: 20609
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=stirlingpdf"
    #   - "homepage.description=stirlingpdf self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=stirlingpdf.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20609"
    #   - "homepage.server=localhost"
volumes:
  stirlingpdf_stirlingpdf_data_trainingdata: null
  stirlingpdf_stirlingpdf_data_extraconfigs: null
networks:
  default:
    name: stirlingpdf_net
    driver: overlay
    attachable: true
