# wordpress - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml wordpress
# image verified to exist at generation time: wordpress:latest

services:
  wordpress:
    image: wordpress:latest
    ports:
      - target: 80
        published: 20369
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - wordpress_config:/config
      - wordpress_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wordpress"
    #   - "homepage.description=Web publishing platform; blogging and CMS with massive plugin ecosystem."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wordpress.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20369"
    #   - "homepage.server=localhost"

volumes:
  wordpress_config:
  wordpress_data:

networks:
  default:
    name: wordpress_net
    driver: overlay
    attachable: true
