# halo - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml halo
# image verified to exist at generation time: halohub/halo:latest

services:
  halo:
    image: halohub/halo:latest
    ports:
      - target: 20452
        published: 20452
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - halo_config:/config
      - halo_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20452 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=halo"
    #   - "homepage.description=Halo: open-source, extensible publish/CMS wiki platform (Java)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=halo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20452"
    #   - "homepage.server=localhost"

volumes:
  halo_config:
  halo_data:

networks:
  default:
    name: halo_net
    driver: overlay
    attachable: true
