# stripe-self-hosted - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml stripe-self-hosted
# image verified to exist at generation time: node:20-alpine

services:
  stripe-self-hosted:
    image: node:20-alpine
    ports:
      - target: 20308
        published: 20308
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - stripe-self-hosted_config:/config
      - stripe-self-hosted_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20308 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=stripe-self-hosted"
    #   - "homepage.description=stripe-self-hosted self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=stripe-self-hosted.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20308"
    #   - "homepage.server=localhost"

volumes:
  stripe-self-hosted_config:
  stripe-self-hosted_data:

networks:
  default:
    name: stripe-self-hosted_net
    driver: overlay
    attachable: true
