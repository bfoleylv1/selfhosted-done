# agent-vault - docker compose (single host)
# image verified to exist at generation time: hashicorp/vault:latest

services:
  agent-vault:
    image: hashicorp/vault:latest
    container_name: agent-vault
    restart: unless-stopped
    ports:
      - "20398:20398"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20398 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=agent-vault"
    #   - "homepage.description=agent-vault self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=agent-vault.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20398"
    #   - "homepage.server=localhost"

networks:
  default:
    name: agent-vault_net
