# wakapi - docker compose (single host)
# image verified to exist at generation time: ghcr.io/muety/wakapi:latest

services:
  wakapi:
    image: ghcr.io/muety/wakapi:latest
    container_name: wakapi
    restart: unless-stopped
    ports:
      - "20353:20353"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20353 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wakapi"
    #   - "homepage.description=Self-hosted coding time and activity tracker (WakaTime compatible)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wakapi.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20353"
    #   - "homepage.server=localhost"

networks:
  default:
    name: wakapi_net
