# wakapi - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml wakapi
# image verified to exist at generation time: ghcr.io/muety/wakapi:latest

services:
  wakapi:
    image: ghcr.io/muety/wakapi:latest
    ports:
      - target: 20353
        published: 20353
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - wakapi_config:/config
      - wakapi_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20353 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wakapi"
    #   - "homepage.description=Self-hosted coding time and activity tracker (WakaTime compatible).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wakapi.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20353"
    #   - "homepage.server=localhost"

volumes:
  wakapi_config:
  wakapi_data:

networks:
  default:
    name: wakapi_net
    driver: overlay
    attachable: true
