services:
  lila:
    image: ghcr.io/lichess-org/lila-docker:latest
    container_name: lila
    restart: unless-stopped
    ports:
    - 20466:20466
    environment:
    - TZ=${TZ:-America/Los_Angeles}
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    volumes:
    - ./config:/config
    - ./data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 20466 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
networks:
  default:
    name: lila_net
