# kbin - docker compose (single host)
# image verified to exist at generation time: php:8.2-fpm

services:
  kbin:
    image: php:8.2-fpm
    container_name: kbin
    restart: unless-stopped
    ports:
      - "20122:20122"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20122 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=kbin"
    #   - "homepage.description=kbin self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=kbin.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20122"
    #   - "homepage.server=localhost"

networks:
  default:
    name: kbin_net
