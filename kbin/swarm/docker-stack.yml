# kbin - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml kbin
# image verified to exist at generation time: php:8.2-fpm

services:
  kbin:
    image: php:8.2-fpm
    ports:
      - target: 20122
        published: 20122
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - kbin_config:/config
      - kbin_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20122 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=kbin"
    #   - "homepage.description=Another ActivityPub aggregator; alternative to Lemmy."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=kbin.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20122"
    #   - "homepage.server=localhost"

volumes:
  kbin_config:
  kbin_data:

networks:
  default:
    name: kbin_net
    driver: overlay
    attachable: true
