# radarr - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml radarr
# image verified to exist at generation time: lscr.io/linuxserver/radarr:latest

services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    ports:
      - target: 7878
        published: 20230
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - radarr_config:/config
      - radarr_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7878/ || wget -qO- http://127.0.0.1:7878/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=radarr"
    #   - "homepage.description=PVR for movie fans; manages and automatically downloads films."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=radarr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20230"
    #   - "homepage.server=localhost"

volumes:
  radarr_config:
  radarr_data:

networks:
  default:
    name: radarr_net
    driver: overlay
    attachable: true
