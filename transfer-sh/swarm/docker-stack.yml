# transfer-sh - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml transfer-sh
# image verified to exist at generation time: dutchcoders/transfer.sh:latest

services:
  transfer-sh:
    image: dutchcoders/transfer.sh:latest
    ports:
      - target: 20516
        published: 20516
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - transfer-sh_config:/config
      - transfer-sh_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20516 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=transfer-sh"
    #   - "homepage.description=transfer.sh: easy, self-hosted service for transferring files over the internet."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=transfer-sh.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20516"
    #   - "homepage.server=localhost"

volumes:
  transfer-sh_config:
  transfer-sh_data:

networks:
  default:
    name: transfer-sh_net
    driver: overlay
    attachable: true
