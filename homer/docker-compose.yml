# homer - docker compose (single host)
# image verified to exist at generation time: b4bz/homer:latest

services:
  homer:
    image: b4bz/homer:latest
    container_name: homer
    restart: unless-stopped
    ports:
      - "20112:8080"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=homer"
    #   - "homepage.description=Static dashboard / startpage for your homelab.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=homer.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20112"
    #   - "homepage.server=localhost"

networks:
  default:
    name: homer_net
