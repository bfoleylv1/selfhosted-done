# homer - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml homer
# image verified to exist at generation time: b4bz/homer:latest

services:
  homer:
    image: b4bz/homer:latest
    ports:
      - target: 8080
        published: 20112
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - homer_config:/config
      - homer_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=homer"
    #   - "homepage.description=Static dashboard / startpage for your homelab."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=homer.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20112"
    #   - "homepage.server=localhost"

volumes:
  homer_config:
  homer_data:

networks:
  default:
    name: homer_net
    driver: overlay
    attachable: true
