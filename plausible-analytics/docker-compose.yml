# plausible-analytics - docker compose (single host)
# image verified to exist at generation time: ghcr.io/plausible/community-edition:v2.1.4

services:
  plausible-analytics:
    image: ghcr.io/plausible/community-edition:v2.1.4
    container_name: plausible-analytics
    restart: unless-stopped
    ports:
      - "20209:20209"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20209 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=plausible-analytics"
    #   - "homepage.description=Simple, privacy-focused web analytics alternative to Google Analytics.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=plausible-analytics.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20209"
    #   - "homepage.server=localhost"

networks:
  default:
    name: plausible-analytics_net
