# plausible-analytics - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml plausible-analytics
# image verified to exist at generation time: ghcr.io/plausible/community-edition:v2.1.4

services:
  plausible-analytics:
    image: ghcr.io/plausible/community-edition:v2.1.4
    ports:
      - target: 20209
        published: 20209
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - plausible-analytics_config:/config
      - plausible-analytics_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20209 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=plausible-analytics"
    #   - "homepage.description=Simple, privacy-focused web analytics alternative to Google Analytics.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=plausible-analytics.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20209"
    #   - "homepage.server=localhost"

volumes:
  plausible-analytics_config:
  plausible-analytics_data:

networks:
  default:
    name: plausible-analytics_net
    driver: overlay
    attachable: true
