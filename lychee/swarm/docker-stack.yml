# lychee - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml lychee
# image verified to exist at generation time: lycheeorg/lychee:latest

services:
  lychee:
    image: lycheeorg/lychee:latest
    ports:
      - target: 80
        published: 20145
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - lychee_config:/config
      - lychee_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=lychee"
    #   - "homepage.description=Photo management web application; organizes and displays photos with user auth."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=lychee.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20145"
    #   - "homepage.server=localhost"

volumes:
  lychee_config:
  lychee_data:

networks:
  default:
    name: lychee_net
    driver: overlay
    attachable: true
