# jaeger - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml jaeger
# image verified to exist at generation time: jaegertracing/all-in-one:latest

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - target: 16686
        published: 16686
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - jaeger_config:/config
      - jaeger_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:16686/ || wget -qO- http://127.0.0.1:16686/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=jaeger"
    #   - "homepage.description=Distributed tracing; monitoring microservices performance.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=jaeger.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:16686"
    #   - "homepage.server=localhost"

volumes:
  jaeger_config:
  jaeger_data:

networks:
  default:
    name: jaeger_net
    driver: overlay
    attachable: true
