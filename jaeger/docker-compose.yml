# jaeger - docker compose (single host)
# image verified to exist at generation time: jaegertracing/all-in-one:latest

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:16686/ || wget -qO- http://127.0.0.1:16686/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=jaeger"
    #   - "homepage.description=Distributed tracing; monitoring microservices performance.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=jaeger.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:16686"
    #   - "homepage.server=localhost"

networks:
  default:
    name: jaeger_net
