# beszel-hub - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml beszel-hub
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: henrygd/beszel:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - beszel-hub_beszel_hub_data_beszel_data:/beszel_data
    healthcheck:
      test:
      - CMD
      - /beszel
      - health
      - --url
      - http://localhost:8090
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 8090
      published: 20561
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=beszel-hub"
    #   - "homepage.description=beszel-hub self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=beszel-hub.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20561"
    #   - "homepage.server=localhost"
volumes:
  beszel-hub_beszel_hub_data_beszel_data: null
networks:
  default:
    name: beszel-hub_net
    driver: overlay
    attachable: true
