# srs - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml srs
# image verified to exist at generation time: ossrs/srs:5

services:
  srs:
    image: ossrs/srs:5
    ports:
      - target: 1985
        published: 1985
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - NVIDIA_DRIVER_CAPABILITIES=all
      # - LIBVA_DRIVER_NAME=iHD            # Intel iGPU VAAPI/QSV
      # - VAAPI_DRIVER=iHD
    volumes:
      - srs_config:/config
      - srs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1985 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
          # - node.role == manager
          # GPU: add node-generic-resources to daemon.json and:
          #   - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
      # GPU: swarm ignores `devices:`/`runtime:`. Declare in
      #   /etc/docker/daemon.json: "node-generic-resources": ["gpu=1"]
      #   then use deploy.resources.reservations.generic_resources.
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=srs"
    #   - "homepage.description=srs self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=srs.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:1985"
    #   - "homepage.server=localhost"

volumes:
  srs_config:
  srs_data:

networks:
  default:
    name: srs_net
    driver: overlay
    attachable: true
