    #   - "homepage.description=srs self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=srs.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:1985"
    #   - "homepage.server=localhost"

networks:
  default:
    name: srs_net
