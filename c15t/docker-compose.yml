# c15t - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  c15t:
    image: node:20-alpine
    container_name: c15t
    restart: unless-stopped
    ports:
      - "20021:20021"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20021 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=c15t"
    #   - "homepage.description=c15t self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=c15t.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20021"
    #   - "homepage.server=localhost"

networks:
  default:
    name: c15t_net
