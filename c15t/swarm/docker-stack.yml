# c15t - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml c15t
# image verified to exist at generation time: node:20-alpine

services:
  c15t:
    image: node:20-alpine
    ports:
      - target: 20021
        published: 20021
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - c15t_config:/config
      - c15t_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20021 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=c15t"
    #   - "homepage.description=c15t self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=c15t.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20021"
    #   - "homepage.server=localhost"

volumes:
  c15t_config:
  c15t_data:

networks:
  default:
    name: c15t_net
    driver: overlay
    attachable: true
