# rgit - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  rgit:
    image: alpine:3.20
    container_name: rgit
    restart: unless-stopped
    ports:
      - "20248:20248"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20248 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rgit"
    #   - "homepage.description=Self-hosted Git repository manager / viewer."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rgit.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20248"
    #   - "homepage.server=localhost"

networks:
  default:
    name: rgit_net
