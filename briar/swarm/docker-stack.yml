# briar - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml briar
# image verified to exist at generation time: alpine:3.20

services:
  briar:
    image: alpine:3.20
    ports:
      - target: 8080
        published: 20018
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - briar_config:/config
      - briar_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Chat"
    #   - "homepage.name=briar"
    #   - "homepage.description=Peer-to-peer messaging app; works over Tor and Bluetooth."
    #   - "homepage.tags=Chat,Messaging"
    #   - "homepage.icon=briar.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20018"
    #   - "homepage.server=localhost"

volumes:
  briar_config:
  briar_data:

networks:
  default:
    name: briar_net
    driver: overlay
    attachable: true
