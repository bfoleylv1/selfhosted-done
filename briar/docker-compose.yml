# briar - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  briar:
    image: alpine:3.20
    container_name: briar
    restart: unless-stopped
    ports:
      - "20018:8080"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Chat"
    #   - "homepage.name=briar"
    #   - "homepage.description=Peer-to-peer messaging app; works over Tor and Bluetooth."
    #   - "homepage.tags=Chat,Messaging"
    #   - "homepage.icon=briar.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20018"
    #   - "homepage.server=localhost"

networks:
  default:
    name: briar_net
