# chef - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml chef
# image verified to exist at generation time: chef/chef:latest

services:
  chef:
    image: chef/chef:latest
    ports:
      - target: 443
        published: 20405
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - chef_config:/config
      - chef_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Automation"
    #   - "homepage.name=chef"
    #   - "homepage.description=Automation platform for the most demanding environments."
    #   - "homepage.tags=Automation,Infrastructure"
    #   - "homepage.icon=chef.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20405"
    #   - "homepage.server=localhost"

volumes:
  chef_config:
  chef_data:

networks:
  default:
    name: chef_net
    driver: overlay
    attachable: true
