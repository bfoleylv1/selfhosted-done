# chef - docker compose (single host)
# image verified to exist at generation time: chef/chef:latest

services:
  chef:
    image: chef/chef:latest
    container_name: chef
    restart: unless-stopped
    ports:
      - "20405:443"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Automation"
    #   - "homepage.name=chef"
    #   - "homepage.description=Automation platform for the most demanding environments."
    #   - "homepage.tags=Automation,Infrastructure"
    #   - "homepage.icon=chef.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20405"
    #   - "homepage.server=localhost"

networks:
  default:
    name: chef_net
