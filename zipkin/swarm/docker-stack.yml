# zipkin - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml zipkin
# image verified to exist at generation time: openzipkin/zipkin:latest

services:
  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - target: 9411
        published: 9411
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - zipkin_config:/config
      - zipkin_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9411/health || wget -qO- http://127.0.0.1:9411/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zipkin"
    #   - "homepage.description=Distributed tracing system; gather timing information.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zipkin.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9411"
    #   - "homepage.server=localhost"

volumes:
  zipkin_config:
  zipkin_data:

networks:
  default:
    name: zipkin_net
    driver: overlay
    attachable: true
