# subtitle-converter - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml subtitle-converter
# image verified to exist at generation time: lscr.io/linuxserver/ffmpeg:latest

services:
  subtitle-converter:
    image: lscr.io/linuxserver/ffmpeg:latest
    ports:
      - target: 20309
        published: 20309
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - subtitle-converter_config:/config
      - subtitle-converter_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20309 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=subtitle-converter"
    #   - "homepage.description=subtitle-converter self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=subtitle-converter.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20309"
    #   - "homepage.server=localhost"

volumes:
  subtitle-converter_config:
  subtitle-converter_data:

networks:
  default:
    name: subtitle-converter_net
    driver: overlay
    attachable: true
