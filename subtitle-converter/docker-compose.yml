# subtitle-converter - docker compose (single host)
# image verified to exist at generation time: lscr.io/linuxserver/ffmpeg:latest

services:
  subtitle-converter:
    image: lscr.io/linuxserver/ffmpeg:latest
    container_name: subtitle-converter
    restart: unless-stopped
    ports:
      - "20309:20309"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20309 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=subtitle-converter"
    #   - "homepage.description=Convert and translate subtitle file formats.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=subtitle-converter.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20309"
    #   - "homepage.server=localhost"

networks:
  default:
    name: subtitle-converter_net
