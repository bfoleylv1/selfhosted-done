# filebrowser - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml filebrowser
# image verified to exist at generation time: filebrowser/filebrowser:latest

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    ports:
      - target: 80
        published: 20069
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - filebrowser_config:/config
      - filebrowser_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=filebrowser"
    #   - "homepage.description=Web-based file manager with authentication; manages files and folders via browser.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=filebrowser.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20069"
    #   - "homepage.server=localhost"

volumes:
  filebrowser_config:
  filebrowser_data:

networks:
  default:
    name: filebrowser_net
    driver: overlay
    attachable: true
