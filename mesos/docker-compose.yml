# mesos - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  mesos:
    image: alpine:3.20
    container_name: mesos
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5050 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mesos"
    #   - "homepage.description=Distributed systems kernel; orchestrate containers and apps.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mesos.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5050"
    #   - "homepage.server=localhost"

networks:
  default:
    name: mesos_net
