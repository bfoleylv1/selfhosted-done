# mesos - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml mesos
# image verified to exist at generation time: alpine:3.20

services:
  mesos:
    image: alpine:3.20
    ports:
      - target: 5050
        published: 5050
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - mesos_config:/config
      - mesos_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5050 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mesos"
    #   - "homepage.description=Distributed systems kernel; orchestrate containers and apps."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mesos.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5050"
    #   - "homepage.server=localhost"

volumes:
  mesos_config:
  mesos_data:

networks:
  default:
    name: mesos_net
    driver: overlay
    attachable: true
