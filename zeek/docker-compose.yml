# zeek - docker compose (single host)
# image verified to exist at generation time: zeek/zeek:latest

services:
  zeek:
    image: zeek/zeek:latest
    container_name: zeek
    restart: unless-stopped
    ports:
      - "20382:20382"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20382 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
