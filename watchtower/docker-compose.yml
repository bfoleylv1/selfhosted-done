# watchtower - docker compose (single host)
# image verified to exist at generation time: containrrr/watchtower:latest

services:
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    ports:
      - "20356:20356"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20356 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=watchtower"
    #   - "homepage.description=Automatically update Docker containers to the latest images."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=watchtower.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20356"
    #   - "homepage.server=localhost"

networks:
  default:
    name: watchtower_net
