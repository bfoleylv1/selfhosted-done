# watchtower - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml watchtower
# image verified to exist at generation time: containrrr/watchtower:latest

services:
  watchtower:
    image: containrrr/watchtower:latest
    ports:
      - target: 20356
        published: 20356
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - watchtower_config:/config
      - watchtower_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20356 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=watchtower"
    #   - "homepage.description=watchtower self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=watchtower.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20356"
    #   - "homepage.server=localhost"

volumes:
  watchtower_config:
  watchtower_data:

networks:
  default:
    name: watchtower_net
    driver: overlay
    attachable: true
