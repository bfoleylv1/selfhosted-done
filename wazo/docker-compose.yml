# wazo - docker compose (single host)
# image verified to exist at generation time: debian:12-slim

services:
  wazo:
    image: debian:12-slim
    container_name: wazo
    restart: unless-stopped
    ports:
      - "20357:20357"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20357 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wazo"
    #   - "homepage.description=Open-source IP-PBX telephony platform."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wazo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20357"
    #   - "homepage.server=localhost"

networks:
  default:
    name: wazo_net
