# wazo - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml wazo
# image verified to exist at generation time: debian:12-slim

services:
  wazo:
    image: debian:12-slim
    ports:
      - target: 20357
        published: 20357
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - wazo_config:/config
      - wazo_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20357 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wazo"
    #   - "homepage.description=Open-source IP-PBX telephony platform."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wazo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20357"
    #   - "homepage.server=localhost"

volumes:
  wazo_config:
  wazo_data:

networks:
  default:
    name: wazo_net
    driver: overlay
    attachable: true
