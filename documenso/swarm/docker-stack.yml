# documenso - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml documenso
# image verified to exist at generation time: documenso/documenso:latest

services:
  documenso:
    image: documenso/documenso:latest
    ports:
      - target: 20047
        published: 20047
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - documenso_config:/config
      - documenso_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20047 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=documenso"
    #   - "homepage.description=documenso self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=documenso.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20047"
    #   - "homepage.server=localhost"

volumes:
  documenso_config:
  documenso_data:

networks:
  default:
    name: documenso_net
    driver: overlay
    attachable: true
