# documenso - docker compose (single host)
# image verified to exist at generation time: documenso/documenso:latest

services:
  documenso:
    image: documenso/documenso:latest
    container_name: documenso
    restart: unless-stopped
    ports:
      - "20047:20047"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20047 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=documenso"
    #   - "homepage.description=Open-source DocuSign alternative for electronic signatures."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=documenso.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20047"
    #   - "homepage.server=localhost"

networks:
  default:
    name: documenso_net
