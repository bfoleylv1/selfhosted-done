# partkeep-system - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml partkeep-system
# image verified to exist at generation time: php:8.2-apache

services:
  partkeep-system:
    image: php:8.2-apache
    ports:
      - target: 20191
        published: 20191
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - partkeep-system_config:/config
      - partkeep-system_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20191 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=partkeep-system"
    #   - "homepage.description=PHP/MySQL web application; organize and manage parts inventory."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=partkeep-system.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20191"
    #   - "homepage.server=localhost"

volumes:
  partkeep-system_config:
  partkeep-system_data:

networks:
  default:
    name: partkeep-system_net
    driver: overlay
    attachable: true
