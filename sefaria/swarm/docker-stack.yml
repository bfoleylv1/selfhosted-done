# sefaria - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml sefaria
# image verified to exist at generation time: python:3.11-slim

services:
  sefaria:
    image: python:3.11-slim
    ports:
      - target: 20268
        published: 20268
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - sefaria_config:/config
      - sefaria_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20268 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sefaria"
    #   - "homepage.description=Digital library of texts; Jewish texts with search and cross-references."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sefaria.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20268"
    #   - "homepage.server=localhost"

volumes:
  sefaria_config:
  sefaria_data:

networks:
  default:
    name: sefaria_net
    driver: overlay
    attachable: true
