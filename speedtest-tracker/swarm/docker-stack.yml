# speedtest-tracker - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml speedtest-tracker
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    environment:
    - PUID=1000
    - PGID=1000
    - APP_KEY=
    - DB_CONNECTION=sqlite
    - APP_URL=
    volumes:
    - speedtest-tracker_speedtest_tracker_data:/config
    - speedtest-tracker_nginx_default_conf:/config/nginx/site-confs/default.conf
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - speedtest-tracker
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 8888
      published: 20608
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=speedtest-tracker"
    #   - "homepage.description=speedtest-tracker self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=speedtest-tracker.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20608"
    #   - "homepage.server=localhost"
volumes:
  speedtest-tracker_speedtest_tracker_data: null
  speedtest-tracker_nginx_default_conf: null
networks:
  default:
    name: speedtest-tracker_net
    driver: overlay
    attachable: true
