# speedtest-tracker - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: app-speedtest-tracker
    environment:
    - PUID=1000
    - PGID=1000
    - APP_KEY=
    - DB_CONNECTION=sqlite
    - APP_URL=
    volumes:
    - ./speedtest-tracker-data:/config
    - ./nginx/default.conf:/config/nginx/site-confs/default.conf
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - speedtest-tracker
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 20608:8888
