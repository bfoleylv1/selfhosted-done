# seppo - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml seppo
# image verified to exist at generation time: alpine:3.20

services:
  seppo:
    image: alpine:3.20
    ports:
      - target: 20273
        published: 20273
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - seppo_config:/config
      - seppo_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20273 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=seppo"
    #   - "homepage.description=Self-hosted service.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=seppo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20273"
    #   - "homepage.server=localhost"

volumes:
  seppo_config:
  seppo_data:

networks:
  default:
    name: seppo_net
    driver: overlay
    attachable: true
