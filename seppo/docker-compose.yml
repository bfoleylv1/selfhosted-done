# seppo - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  seppo:
    image: alpine:3.20
    container_name: seppo
    restart: unless-stopped
    ports:
      - "20273:20273"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20273 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=seppo"
    #   - "homepage.description=Self-hosted service.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=seppo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20273"
    #   - "homepage.server=localhost"

networks:
  default:
    name: seppo_net
