# yetishare - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  yetishare:
    image: php:8.2-apache
    container_name: yetishare
    restart: unless-stopped
    ports:
      - "20378:20378"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20378 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=yetishare"
    #   - "homepage.description=Self-hosted file hosting and sharing script."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=yetishare.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20378"
    #   - "homepage.server=localhost"

networks:
  default:
    name: yetishare_net
