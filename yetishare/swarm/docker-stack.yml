# yetishare - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml yetishare
# image verified to exist at generation time: php:8.2-apache

services:
  yetishare:
    image: php:8.2-apache
    ports:
      - target: 20378
        published: 20378
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - yetishare_config:/config
      - yetishare_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20378 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=yetishare"
    #   - "homepage.description=Self-hosted file hosting and sharing script.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=yetishare.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20378"
    #   - "homepage.server=localhost"

volumes:
  yetishare_config:
  yetishare_data:

networks:
  default:
    name: yetishare_net
    driver: overlay
    attachable: true
