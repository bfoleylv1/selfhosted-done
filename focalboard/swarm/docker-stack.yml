# focalboard - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml focalboard
# image verified to exist at generation time: mattermost/focalboard:latest

services:
  focalboard:
    image: mattermost/focalboard:latest
    ports:
      - target: 80
        published: 20072
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - focalboard_config:/config
      - focalboard_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=focalboard"
    #   - "homepage.description=focalboard self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=focalboard.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20072"
    #   - "homepage.server=localhost"

volumes:
  focalboard_config:
  focalboard_data:

networks:
  default:
    name: focalboard_net
    driver: overlay
    attachable: true
