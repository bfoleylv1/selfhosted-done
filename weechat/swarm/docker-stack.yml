# weechat - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml weechat
# image verified to exist at generation time: weechat/weechat:latest

services:
  weechat:
    image: weechat/weechat:latest
    ports:
      - target: 20519
        published: 20519
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - weechat_config:/config
      - weechat_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20519 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=weechat"
    #   - "homepage.description=weechat self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=weechat.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20519"
    #   - "homepage.server=localhost"

volumes:
  weechat_config:
  weechat_data:

networks:
  default:
    name: weechat_net
    driver: overlay
    attachable: true
