# weechat - docker compose (single host)
# image verified to exist at generation time: weechat/weechat:latest

services:
  weechat:
    image: weechat/weechat:latest
    container_name: weechat
    restart: unless-stopped
    ports:
      - "20519:20519"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20519 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=weechat"
    #   - "homepage.description=weechat self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=weechat.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20519"
    #   - "homepage.server=localhost"

networks:
  default:
    name: weechat_net
