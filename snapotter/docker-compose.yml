# snapotter - docker compose (single host)
# image verified to exist at generation time: snapotter/snapotter:latest

services:
  snapotter:
    image: snapotter/snapotter:latest
    container_name: snapotter
    restart: unless-stopped
    ports:
      - "20548:20548"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20548 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=snapotter"
    #   - "homepage.description=Snapotter: self-hosted service for managing and viewing server snapshots/backups."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=snapotter.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20548"
    #   - "homepage.server=localhost"

networks:
  default:
    name: snapotter_net
