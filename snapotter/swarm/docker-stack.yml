# snapotter - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml snapotter
# image verified to exist at generation time: snapotter/snapotter:latest

services:
  snapotter:
    image: snapotter/snapotter:latest
    ports:
      - target: 20548
        published: 20548
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - snapotter_config:/config
      - snapotter_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20548 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=snapotter"
    #   - "homepage.description=Snapotter: self-hosted service for managing and viewing server snapshots/backups."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=snapotter.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20548"
    #   - "homepage.server=localhost"

volumes:
  snapotter_config:
  snapotter_data:

networks:
  default:
    name: snapotter_net
    driver: overlay
    attachable: true
