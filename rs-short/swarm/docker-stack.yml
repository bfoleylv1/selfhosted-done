# rs-short - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml rs-short
# image verified to exist at generation time: alpine:3.20

services:
  rs-short:
    image: alpine:3.20
    ports:
      - target: 20254
        published: 20254
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - rs-short_config:/config
      - rs-short_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20254 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rs-short"
    #   - "homepage.description=Self-hosted URL shortener."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rs-short.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20254"
    #   - "homepage.server=localhost"

volumes:
  rs-short_config:
  rs-short_data:

networks:
  default:
    name: rs-short_net
    driver: overlay
    attachable: true
