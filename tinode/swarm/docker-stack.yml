# tinode - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml tinode
# image verified to exist at generation time: tinode/tinode:latest

services:
  tinode:
    image: tinode/tinode:latest
    ports:
      - target: 20330
        published: 20330
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - tinode_config:/config
      - tinode_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20330 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tinode"
    #   - "homepage.description=tinode self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tinode.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20330"
    #   - "homepage.server=localhost"

volumes:
  tinode_config:
  tinode_data:

networks:
  default:
    name: tinode_net
    driver: overlay
    attachable: true
