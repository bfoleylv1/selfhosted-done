# tinode - docker compose (single host)
# image verified to exist at generation time: tinode/tinode:latest

services:
  tinode:
    image: tinode/tinode:latest
    container_name: tinode
    restart: unless-stopped
    ports:
      - "20330:20330"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20330 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tinode"
    #   - "homepage.description=Instant messaging server with REST and websocket APIs.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tinode.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20330"
    #   - "homepage.server=localhost"

networks:
  default:
    name: tinode_net
