# ergo - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml ergo
# image verified to exist at generation time: ergochat/ergo:latest

services:
  ergo:
    image: ergochat/ergo:latest
    ports:
      - target: 20441
        published: 20441
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ergo_config:/config
      - ergo_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20441 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ergo"
    #   - "homepage.description=Ergo (IRCd): modern, easy-to-run IRC server written in Go."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ergo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20441"
    #   - "homepage.server=localhost"

volumes:
  ergo_config:
  ergo_data:

networks:
  default:
    name: ergo_net
    driver: overlay
    attachable: true
