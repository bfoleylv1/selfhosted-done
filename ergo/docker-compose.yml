# ergo - docker compose (single host)
# image verified to exist at generation time: ergochat/ergo:latest

services:
  ergo:
    image: ergochat/ergo:latest
    container_name: ergo
    restart: unless-stopped
    ports:
      - "20441:20441"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20441 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ergo"
    #   - "homepage.description=Ergo (IRCd): modern, easy-to-run IRC server written in Go."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ergo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20441"
    #   - "homepage.server=localhost"

networks:
  default:
    name: ergo_net
