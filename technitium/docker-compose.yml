# technitium - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: technitium/dns-server:latest
    container_name: app-technitium
    environment:
    - DNS_SERVER_DOMAIN=technitium.local
    - DNS_SERVER_ADMIN_PASSWORD=ChangeME
    - DNS_SERVER_PREFER_IPV6=false
    - DNS_SERVER_RECURSION=Allow
    - DNS_SERVER_FORWARDERS=9.9.9.9,8.8.4.4
    volumes:
    - ./technitium-data/app/config:/config
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - technitium
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 5380:5380
