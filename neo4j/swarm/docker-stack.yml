# neo4j - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml neo4j
# image verified to exist at generation time: neo4j:5

services:
  neo4j:
    image: neo4j:5
    ports:
      - target: 7474
        published: 7474
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - neo4j_config:/config
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=neo4j"
    #   - "homepage.description=neo4j self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=neo4j.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:7474"
    #   - "homepage.server=localhost"

volumes:
  neo4j_config:
  neo4j_data:

networks:
  default:
    name: neo4j_net
    driver: overlay
    attachable: true
