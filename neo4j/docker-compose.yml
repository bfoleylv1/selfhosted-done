# neo4j - docker compose (single host)
# image verified to exist at generation time: neo4j:5

services:
  neo4j:
    image: neo4j:5
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=neo4j"
    #   - "homepage.description=Graph database optimized for storing and querying relationships between data."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=neo4j.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:7474"
    #   - "homepage.server=localhost"

networks:
  default:
    name: neo4j_net
