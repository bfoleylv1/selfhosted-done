# newwallpaperwhodis - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: ghcr.io/upioneer/newwallpaperwhodis:latest
    container_name: app-newwallpaperwhodis
    environment:
    - NODE_ENV=production
    volumes:
    - ./data:/app/data
    - ./wallpapers:/app/wallpapers
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:3000/favicon.svg
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 20594:6767
