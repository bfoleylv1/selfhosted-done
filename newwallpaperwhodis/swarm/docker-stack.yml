# newwallpaperwhodis - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml newwallpaperwhodis
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: ghcr.io/upioneer/newwallpaperwhodis:latest
    environment:
    - NODE_ENV=production
    volumes:
    - newwallpaperwhodis_data:/app/data
    - newwallpaperwhodis_wallpapers:/app/wallpapers
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:3000/favicon.svg
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 6767
      published: 20594
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=newwallpaperwhodis"
    #   - "homepage.description=newwallpaperwhodis self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=newwallpaperwhodis.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20594"
    #   - "homepage.server=localhost"
volumes:
  newwallpaperwhodis_data: null
  newwallpaperwhodis_wallpapers: null
networks:
  default:
    name: newwallpaperwhodis_net
    driver: overlay
    attachable: true
