# metube - docker compose (single host)
# image verified to exist at generation time: alexta69/metube:latest

services:
  metube:
    image: alexta69/metube:latest
    container_name: metube
    restart: unless-stopped
    ports:
      - "20475:20475"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20475 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=metube"
    #   - "homepage.description=metube self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=metube.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20475"
    #   - "homepage.server=localhost"

networks:
  default:
    name: metube_net
