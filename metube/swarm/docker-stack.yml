# metube - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml metube
# image verified to exist at generation time: alexta69/metube:latest

services:
  metube:
    image: alexta69/metube:latest
    ports:
      - target: 20475
        published: 20475
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - metube_config:/config
      - metube_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20475 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=metube"
    #   - "homepage.description=metube self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=metube.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20475"
    #   - "homepage.server=localhost"

volumes:
  metube_config:
  metube_data:

networks:
  default:
    name: metube_net
    driver: overlay
    attachable: true
