# prowlarr - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml prowlarr
# image verified to exist at generation time: lscr.io/linuxserver/prowlarr:latest

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    ports:
      - target: 9696
        published: 9696
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - prowlarr_config:/config
      - prowlarr_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ || wget -qO- http://127.0.0.1:9696/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=prowlarr"
    #   - "homepage.description=Indexing manager for Sonarr, Radarr, Lidarr, and Readarr; manages indexers."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=prowlarr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9696"
    #   - "homepage.server=localhost"

volumes:
  prowlarr_config:
  prowlarr_data:

networks:
  default:
    name: prowlarr_net
    driver: overlay
    attachable: true
