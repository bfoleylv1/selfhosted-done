# prowlarr - docker compose (single host)
# image verified to exist at generation time: lscr.io/linuxserver/prowlarr:latest

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ || wget -qO- http://127.0.0.1:9696/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=prowlarr"
    #   - "homepage.description=Indexing manager for Sonarr, Radarr, Lidarr, and Readarr; manages indexers."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=prowlarr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9696"
    #   - "homepage.server=localhost"

networks:
  default:
    name: prowlarr_net
