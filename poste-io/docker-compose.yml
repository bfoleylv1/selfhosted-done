# poste-io - docker compose (single host)
# image verified to exist at generation time: analogic/poste.io:latest

services:
  poste-io:
    image: analogic/poste.io:latest
    container_name: poste-io
    restart: unless-stopped
    ports:
      - "20215:20215"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20215 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=poste-io"
    #   - "homepage.description=poste-io self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=poste-io.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20215"
    #   - "homepage.server=localhost"

networks:
  default:
    name: poste-io_net
