# sitecore - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml sitecore
# image verified to exist at generation time: mcr.microsoft.com/dotnet/aspnet:8.0

services:
  sitecore:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    ports:
      - target: 20283
        published: 20283
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - sitecore_config:/config
      - sitecore_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20283 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sitecore"
    #   - "homepage.description=Enterprise CMS; .NET-based content management system.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sitecore.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20283"
    #   - "homepage.server=localhost"

volumes:
  sitecore_config:
  sitecore_data:

networks:
  default:
    name: sitecore_net
    driver: overlay
    attachable: true
