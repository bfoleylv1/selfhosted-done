# woocommerce - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml woocommerce
# image verified to exist at generation time: wordpress:latest

services:
  woocommerce:
    image: wordpress:latest
    ports:
      - target: 80
        published: 20367
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - woocommerce_config:/config
      - woocommerce_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=woocommerce"
    #   - "homepage.description=WordPress plugin for e-commerce; highly customizable storefront.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=woocommerce.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20367"
    #   - "homepage.server=localhost"

volumes:
  woocommerce_config:
  woocommerce_data:

networks:
  default:
    name: woocommerce_net
    driver: overlay
    attachable: true
