# squidex - docker compose (single host)
# image verified to exist at generation time: squidex/squidex:latest

services:
  squidex:
    image: squidex/squidex:latest
    container_name: squidex
    restart: unless-stopped
    ports:
      - "20296:20296"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20296 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=squidex"
    #   - "homepage.description=Open-source headless CMS."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=squidex.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20296"
    #   - "homepage.server=localhost"

networks:
  default:
    name: squidex_net
