# squidex - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml squidex
# image verified to exist at generation time: squidex/squidex:latest

services:
  squidex:
    image: squidex/squidex:latest
    ports:
      - target: 20296
        published: 20296
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - squidex_config:/config
      - squidex_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20296 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=squidex"
    #   - "homepage.description=Open-source headless CMS.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=squidex.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20296"
    #   - "homepage.server=localhost"

volumes:
  squidex_config:
  squidex_data:

networks:
  default:
    name: squidex_net
    driver: overlay
    attachable: true
