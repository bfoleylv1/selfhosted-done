# adguardhome-sync - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml adguardhome-sync
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: ghcr.io/bakito/adguardhome-sync:latest
    command: run
    environment:
    - TZ=America/Los_Angeles
    - ORIGIN_URL=http://192.168.1.1:3000
    - ORIGIN_USERNAME=username
    - ORIGIN_PASSWORD=password
    - REPLICA1_URL=http://192.168.1.2
    - REPLICA1_USERNAME=dbtech
    - REPLICA1_PASSWORD=password
    - CRON=*/1 * * * *
    - RUN_ON_START=true
    ports:
    - target: 8080
      published: 20558
      protocol: tcp
      mode: ingress
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/ || wget -qO- http://127.0.0.1:8080/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=adguardhome-sync"
    #   - "homepage.description=adguardhome-sync self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=adguardhome-sync.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20558"
    #   - "homepage.server=localhost"
networks:
  default:
    name: adguardhome-sync_net
    driver: overlay
    attachable: true
