# noco-db - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml noco-db
# image verified to exist at generation time: nocodb/nocodb:latest

services:
  noco-db:
    image: nocodb/nocodb:latest
    ports:
      - target: 20168
        published: 20168
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - noco-db_config:/config
      - noco-db_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20168 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=noco-db"
    #   - "homepage.description=Open-source Airtable alternative; turn databases into smart tables."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=noco-db.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20168"
    #   - "homepage.server=localhost"

volumes:
  noco-db_config:
  noco-db_data:

networks:
  default:
    name: noco-db_net
    driver: overlay
    attachable: true
