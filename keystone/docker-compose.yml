# keystone - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  keystone:
    image: node:20-alpine
    container_name: keystone
    restart: unless-stopped
    ports:
      - "20127:20127"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20127 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=keystone"
    #   - "homepage.description=Node.js GraphQL CMS; flexible and extensible."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=keystone.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20127"
    #   - "homepage.server=localhost"

networks:
  default:
    name: keystone_net
