# keystone - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml keystone
# image verified to exist at generation time: node:20-alpine

services:
  keystone:
    image: node:20-alpine
    ports:
      - target: 20127
        published: 20127
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - keystone_config:/config
      - keystone_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20127 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=keystone"
    #   - "homepage.description=Node.js GraphQL CMS; flexible and extensible.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=keystone.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20127"
    #   - "homepage.server=localhost"

volumes:
  keystone_config:
  keystone_data:

networks:
  default:
    name: keystone_net
    driver: overlay
    attachable: true
