# timescaledb - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml timescaledb
# image verified to exist at generation time: timescale/timescaledb:latest-pg16

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - target: 20329
        published: 20329
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - timescaledb_config:/config
      - timescaledb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20329 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=timescaledb"
    #   - "homepage.description=PostgreSQL extension for time-series data; SQL for time-series.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=timescaledb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20329"
    #   - "homepage.server=localhost"

volumes:
  timescaledb_config:
  timescaledb_data:

networks:
  default:
    name: timescaledb_net
    driver: overlay
    attachable: true
