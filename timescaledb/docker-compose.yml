# timescaledb - docker compose (single host)
# image verified to exist at generation time: timescale/timescaledb:latest-pg16

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: unless-stopped
    ports:
      - "20329:20329"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20329 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=timescaledb"
    #   - "homepage.description=PostgreSQL extension for time-series data; SQL for time-series.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=timescaledb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20329"
    #   - "homepage.server=localhost"

networks:
  default:
    name: timescaledb_net
