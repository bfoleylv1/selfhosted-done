# bentopdf - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml bentopdf
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: ghcr.io/alam00000/bentopdf:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - bentopdf_bentopdf_data_app_config:/config
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 3000
      published: 20560
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=bentopdf"
    #   - "homepage.description=bentopdf self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=bentopdf.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20560"
    #   - "homepage.server=localhost"
volumes:
  bentopdf_bentopdf_data_app_config: null
networks:
  default:
    name: bentopdf_net
    driver: overlay
    attachable: true
