# standard-notes - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml standard-notes
# image verified to exist at generation time: standardnotes/server:latest

services:
  standard-notes:
    image: standardnotes/server:latest
    ports:
      - target: 20300
        published: 20300
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - standard-notes_config:/config
      - standard-notes_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20300 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=standard-notes"
    #   - "homepage.description=standard-notes self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=standard-notes.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20300"
    #   - "homepage.server=localhost"

volumes:
  standard-notes_config:
  standard-notes_data:

networks:
  default:
    name: standard-notes_net
    driver: overlay
    attachable: true
