# standard-notes - docker compose (single host)
# image verified to exist at generation time: standardnotes/server:latest

services:
  standard-notes:
    image: standardnotes/server:latest
    container_name: standard-notes
    restart: unless-stopped
    ports:
      - "20300:20300"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20300 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=standard-notes"
    #   - "homepage.description=Encrypted notes app; focus on privacy and security."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=standard-notes.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20300"
    #   - "homepage.server=localhost"

networks:
  default:
    name: standard-notes_net
