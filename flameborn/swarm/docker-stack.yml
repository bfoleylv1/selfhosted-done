# flameborn - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml flameborn
# image verified to exist at generation time: alpine:3.20

services:
  flameborn:
    image: alpine:3.20
    ports:
      - target: 20070
        published: 20070
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - flameborn_config:/config
      - flameborn_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20070 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=flameborn"
    #   - "homepage.description=Open source media server; modern interface with advanced features."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=flameborn.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20070"
    #   - "homepage.server=localhost"

volumes:
  flameborn_config:
  flameborn_data:

networks:
  default:
    name: flameborn_net
    driver: overlay
    attachable: true
