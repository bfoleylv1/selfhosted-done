# ansible - docker compose (single host)
# image verified to exist at generation time: alpine/ansible:latest

services:
  ansible:
    image: alpine/ansible:latest
    container_name: ansible
    restart: unless-stopped
    ports:
      - "20001:8080"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Automation"
    #   - "homepage.name=ansible"
    #   - "homepage.description=Open source automation engine; IT automation and configuration management."
    #   - "homepage.tags=Automation,Infrastructure"
    #   - "homepage.icon=ansible.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20001"
    #   - "homepage.server=localhost"

networks:
  default:
    name: ansible_net
