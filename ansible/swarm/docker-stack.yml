# ansible - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml ansible
# image verified to exist at generation time: alpine/ansible:latest

services:
  ansible:
    image: alpine/ansible:latest
    ports:
      - target: 20001
        published: 20001
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ansible_config:/config
      - ansible_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ansible"
    #   - "homepage.description=Open source automation engine; IT automation and configuration management.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ansible.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20001"
    #   - "homepage.server=localhost"

volumes:
  ansible_config:
  ansible_data:

networks:
  default:
    name: ansible_net
    driver: overlay
    attachable: true
