# static-web-server - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml static-web-server
# image verified to exist at generation time: joseluisq/static-web-server:latest

services:
  static-web-server:
    image: joseluisq/static-web-server:latest
    ports:
      - target: 20512
        published: 20512
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - static-web-server_config:/config
      - static-web-server_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20512 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=static-web-server"
    #   - "homepage.description=static-web-server: tiny, fast, secure static file web server written in Rust."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=static-web-server.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20512"
    #   - "homepage.server=localhost"

volumes:
  static-web-server_config:
  static-web-server_data:

networks:
  default:
    name: static-web-server_net
    driver: overlay
    attachable: true
