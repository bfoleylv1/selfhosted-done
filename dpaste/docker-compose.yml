# dpaste - docker compose (single host)
# image verified to exist at generation time: python:3.11-slim

services:
  dpaste:
    image: python:3.11-slim
    container_name: dpaste
    restart: unless-stopped
    ports:
      - "20050:20050"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20050 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=dpaste"
    #   - "homepage.description=Self-hosted pastebin / code snippet service."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=dpaste.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20050"
    #   - "homepage.server=localhost"

networks:
  default:
    name: dpaste_net
