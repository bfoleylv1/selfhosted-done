# recyclarr - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: ghcr.io/recyclarr/recyclarr:7
    container_name: app-recyclarr
    volumes:
    - ./recyclarr-data/config:/config
    environment:
    - TZ=America/Los_Angeles
    - RECYCLARR_CREATE_CONFIG=true
    user: 1000:1000
    healthcheck:
      test:
      - CMD-SHELL
      - pgrep -f recyclarr || test -d /config
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
