# recyclarr - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml recyclarr
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: ghcr.io/recyclarr/recyclarr:7
    volumes:
    - recyclarr_recyclarr_data_config:/config
    environment:
    - TZ=America/Los_Angeles
    - RECYCLARR_CREATE_CONFIG=true
    user: 1000:1000
    healthcheck:
      test:
      - CMD-SHELL
      - pgrep -f recyclarr || test -d /config
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=recyclarr"
    #   - "homepage.description=recyclarr self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=recyclarr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20604"
    #   - "homepage.server=localhost"
volumes:
  recyclarr_recyclarr_data_config: null
networks:
  default:
    name: recyclarr_net
    driver: overlay
    attachable: true
