# dvvinyl - docker compose (single host)
# image verified to exist at generation time: dvvinyl/dvvinyl:latest

services:
  dvvinyl:
    # image: dvvinyl/dvvinyl:latest  # UNVERIFIED
    container_name: dvvinyl
    restart: unless-stopped
    ports:
      - "20533:20533"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20533 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=dvvinyl"
    #   - "homepage.description=dvvinyl self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=dvvinyl.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20533"
    #   - "homepage.server=localhost"

networks:
  default:
    name: dvvinyl_net
