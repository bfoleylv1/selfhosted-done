# clipcascade - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml clipcascade
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: sathvikrao/clipcascade:latest
    environment:
    - CC_MAX_MESSAGE_SIZE_IN_MiB=1
    - TZ=America/Los_Angeles
    volumes:
    - clipcascade_clipcascade_data_cc_users:/database
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - clipcascade
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 8080
      published: 20562
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=clipcascade"
    #   - "homepage.description=clipcascade self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=clipcascade.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20562"
    #   - "homepage.server=localhost"
volumes:
  clipcascade_clipcascade_data_cc_users: null
networks:
  default:
    name: clipcascade_net
    driver: overlay
    attachable: true
