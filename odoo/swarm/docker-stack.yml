# odoo - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml odoo
# image verified to exist at generation time: odoo:17

services:
  odoo:
    image: odoo:17
    ports:
      - target: 8069
        published: 8069
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - odoo_config:/config
      - odoo_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8069/ || wget -qO- http://127.0.0.1:8069/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=odoo"
    #   - "homepage.description=All-in-one business management suite; CRM, ERP, CMS, and more.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=odoo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8069"
    #   - "homepage.server=localhost"

volumes:
  odoo_config:
  odoo_data:

networks:
  default:
    name: odoo_net
    driver: overlay
    attachable: true
