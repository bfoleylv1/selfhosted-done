# odoo - docker compose (single host)
# image verified to exist at generation time: odoo:17

services:
  odoo:
    image: odoo:17
    container_name: odoo
    restart: unless-stopped
    ports:
      - "8069:8069"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8069/ || wget -qO- http://127.0.0.1:8069/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=odoo"
    #   - "homepage.description=All-in-one business management suite; CRM, ERP, CMS, and more."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=odoo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8069"
    #   - "homepage.server=localhost"

networks:
  default:
    name: odoo_net
