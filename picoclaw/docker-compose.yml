# picoclaw - docker compose (single host)
# image verified to exist at generation time: picoclaw/picoclaw:latest

services:
  picoclaw:
    # image: picoclaw/picoclaw:latest  # UNVERIFIED
    container_name: picoclaw
    restart: unless-stopped
    ports:
      - "20494:20494"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20494 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=picoclaw"
    #   - "homepage.description=picoclaw self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=picoclaw.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20494"
    #   - "homepage.server=localhost"

networks:
  default:
    name: picoclaw_net
