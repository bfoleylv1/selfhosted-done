# picoclaw - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml picoclaw
# image verified to exist at generation time: picoclaw/picoclaw:latest

services:
  picoclaw:
    # image: picoclaw/picoclaw:latest  # UNVERIFIED
    ports:
      - target: 20494
        published: 20494
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - picoclaw_config:/config
      - picoclaw_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20494 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=picoclaw"
    #   - "homepage.description=picoclaw self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=picoclaw.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20494"
    #   - "homepage.server=localhost"

volumes:
  picoclaw_config:
  picoclaw_data:

networks:
  default:
    name: picoclaw_net
    driver: overlay
    attachable: true
