# bookwyrm - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml bookwyrm
# image verified to exist at generation time: python:3.11-slim

services:
  bookwyrm:
    image: python:3.11-slim
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - bookwyrm_config:/config
      - bookwyrm_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=bookwyrm"
    #   - "homepage.description=Federated book social network; discover and discuss books.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=bookwyrm.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8000"
    #   - "homepage.server=localhost"

volumes:
  bookwyrm_config:
  bookwyrm_data:

networks:
  default:
    name: bookwyrm_net
    driver: overlay
    attachable: true
