# bookwyrm - docker compose (single host)
# image verified to exist at generation time: python:3.11-slim

services:
  bookwyrm:
    image: python:3.11-slim
    container_name: bookwyrm
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=bookwyrm"
    #   - "homepage.description=Federated book social network; discover and discuss books."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=bookwyrm.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8000"
    #   - "homepage.server=localhost"

networks:
  default:
    name: bookwyrm_net
