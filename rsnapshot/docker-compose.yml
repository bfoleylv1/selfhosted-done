# rsnapshot - docker compose (single host)
# image verified to exist at generation time: linuxserver/rsnapshot:latest

services:
  rsnapshot:
    image: linuxserver/rsnapshot:latest
    container_name: rsnapshot
    restart: unless-stopped
    ports:
      - "20255:20255"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20255 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rsnapshot"
    #   - "homepage.description=Filesystem snapshot utility; rsync-based backup tool."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rsnapshot.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20255"
    #   - "homepage.server=localhost"

networks:
  default:
    name: rsnapshot_net
