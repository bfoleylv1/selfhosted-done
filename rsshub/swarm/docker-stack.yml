# rsshub - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml rsshub
# image verified to exist at generation time: diygod/rsshub:latest

services:
  rsshub:
    image: diygod/rsshub:latest
    ports:
      - target: 1200
        published: 1200
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - rsshub_config:/config
      - rsshub_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1200/ || wget -qO- http://127.0.0.1:1200/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rsshub"
    #   - "homepage.description=rsshub self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rsshub.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:1200"
    #   - "homepage.server=localhost"

volumes:
  rsshub_config:
  rsshub_data:

networks:
  default:
    name: rsshub_net
    driver: overlay
    attachable: true
