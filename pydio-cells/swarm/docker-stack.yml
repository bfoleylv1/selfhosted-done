# pydio-cells - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml pydio-cells
# image verified to exist at generation time: linuxserver/pydio-cells:latest

services:
  pydio-cells:
    image: linuxserver/pydio-cells:latest
    ports:
      - target: 20226
        published: 20226
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - pydio-cells_config:/config
      - pydio-cells_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20226 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pydio-cells"
    #   - "homepage.description=Enterprise file sharing and sync platform; modern alternative to Nextcloud.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pydio-cells.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20226"
    #   - "homepage.server=localhost"

volumes:
  pydio-cells_config:
  pydio-cells_data:

networks:
  default:
    name: pydio-cells_net
    driver: overlay
    attachable: true
