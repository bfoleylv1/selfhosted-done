# outline - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml outline
# image verified to exist at generation time: outlinewiki/outline:latest

services:
  outline:
    image: outlinewiki/outline:latest
    ports:
      - target: 3000
        published: 20186
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - outline_config:/config
      - outline_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=outline"
    #   - "homepage.description=outline self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=outline.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20186"
    #   - "homepage.server=localhost"

volumes:
  outline_config:
  outline_data:

networks:
  default:
    name: outline_net
    driver: overlay
    attachable: true
