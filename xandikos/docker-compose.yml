# xandikos - docker compose (single host)
# image verified to exist at generation time: ghcr.io/jelmer/xandikos:latest

services:
  xandikos:
    image: ghcr.io/jelmer/xandikos:latest
    container_name: xandikos
    restart: unless-stopped
    ports:
      - "20372:20372"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20372 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=xandikos"
    #   - "homepage.description=CalDAV server written in Python."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=xandikos.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20372"
    #   - "homepage.server=localhost"

networks:
  default:
    name: xandikos_net
