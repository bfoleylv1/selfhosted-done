# kapacitor - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml kapacitor
# image verified to exist at generation time: kapacitor:latest

services:
  kapacitor:
    image: kapacitor:latest
    ports:
      - target: 9092
        published: 9092
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - kapacitor_config:/config
      - kapacitor_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=kapacitor"
    #   - "homepage.description=Data process and monitoring application; TICK stack component."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=kapacitor.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9092"
    #   - "homepage.server=localhost"

volumes:
  kapacitor_config:
  kapacitor_data:

networks:
  default:
    name: kapacitor_net
    driver: overlay
    attachable: true
