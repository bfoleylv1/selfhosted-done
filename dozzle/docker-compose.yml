# dozzle - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: amir20/dozzle:latest
    container_name: app-dozzle
    volumes:
    - ./dozzle-data/dozzle-data:/data
    - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
      - CMD
      - /dozzle
      - healthcheck
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 20570:8080
