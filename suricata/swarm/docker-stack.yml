# suricata - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml suricata
# image verified to exist at generation time: jasonish/suricata:latest

services:
  suricata:
    image: jasonish/suricata:latest
    ports:
      - target: 20315
        published: 20315
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - suricata_config:/config
      - suricata_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20315 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=suricata"
    #   - "homepage.description=Network threat detection engine; IDS/IPS/NSM.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=suricata.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20315"
    #   - "homepage.server=localhost"

volumes:
  suricata_config:
  suricata_data:

networks:
  default:
    name: suricata_net
    driver: overlay
    attachable: true
