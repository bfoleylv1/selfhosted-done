# dreamfactory - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml dreamfactory
# image verified to exist at generation time: dreamfactorysoftware/df-docker:latest

services:
  dreamfactory:
    image: dreamfactorysoftware/df-docker:latest
    ports:
      - target: 20051
        published: 20051
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - dreamfactory_config:/config
      - dreamfactory_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20051 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=dreamfactory"
    #   - "homepage.description=dreamfactory self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=dreamfactory.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20051"
    #   - "homepage.server=localhost"

volumes:
  dreamfactory_config:
  dreamfactory_data:

networks:
  default:
    name: dreamfactory_net
    driver: overlay
    attachable: true
