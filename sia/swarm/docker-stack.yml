# sia - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml sia
# image verified to exist at generation time: ghcr.io/siafoundation/renterd:latest

services:
  sia:
    image: ghcr.io/siafoundation/renterd:latest
    ports:
      - target: 20280
        published: 20280
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - sia_config:/config
      - sia_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20280 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sia"
    #   - "homepage.description=sia self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sia.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20280"
    #   - "homepage.server=localhost"

volumes:
  sia_config:
  sia_data:

networks:
  default:
    name: sia_net
    driver: overlay
    attachable: true
