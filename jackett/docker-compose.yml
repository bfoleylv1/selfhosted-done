# jackett - docker compose (single host)
# image verified to exist at generation time: lscr.io/linuxserver/jackett:latest

services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    restart: unless-stopped
    ports:
      - "9117:9117"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9117 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=jackett"
    #   - "homepage.description=API for torrent indexers; acts as a bridge between downloaders and indexers.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=jackett.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9117"
    #   - "homepage.server=localhost"

networks:
  default:
    name: jackett_net
