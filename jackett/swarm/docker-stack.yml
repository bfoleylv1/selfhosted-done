# jackett - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml jackett
# image verified to exist at generation time: lscr.io/linuxserver/jackett:latest

services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    ports:
      - target: 9117
        published: 9117
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - jackett_config:/config
      - jackett_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9117 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=jackett"
    #   - "homepage.description=API for torrent indexers; acts as a bridge between downloaders and indexers.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=jackett.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9117"
    #   - "homepage.server=localhost"

volumes:
  jackett_config:
  jackett_data:

networks:
  default:
    name: jackett_net
    driver: overlay
    attachable: true
