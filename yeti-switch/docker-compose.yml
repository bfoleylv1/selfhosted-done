# yeti-switch - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  yeti-switch:
    image: alpine:3.20
    container_name: yeti-switch
    restart: unless-stopped
    ports:
      - "20377:20377"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20377 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=yeti-switch"
    #   - "homepage.description=Yeti Switch - softswitch / SBC for VoIP."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=yeti-switch.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20377"
    #   - "homepage.server=localhost"

networks:
  default:
    name: yeti-switch_net
