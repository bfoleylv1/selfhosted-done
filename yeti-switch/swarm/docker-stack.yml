# yeti-switch - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml yeti-switch
# image verified to exist at generation time: alpine:3.20

services:
  yeti-switch:
    image: alpine:3.20
    ports:
      - target: 20377
        published: 20377
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - yeti-switch_config:/config
      - yeti-switch_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20377 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=yeti-switch"
    #   - "homepage.description=Yeti Switch - softswitch / SBC for VoIP.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=yeti-switch.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20377"
    #   - "homepage.server=localhost"

volumes:
  yeti-switch_config:
  yeti-switch_data:

networks:
  default:
    name: yeti-switch_net
    driver: overlay
    attachable: true
