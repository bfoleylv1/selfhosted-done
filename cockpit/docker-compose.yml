# cockpit - docker compose (single host)
# image verified to exist at generation time: quay.io/cockpit/ws:latest

services:
  cockpit:
    image: quay.io/cockpit/ws:latest
    container_name: cockpit
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/ || wget -qO- http://127.0.0.1:9090/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cockpit"
    #   - "homepage.description=cockpit self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cockpit.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9090"
    #   - "homepage.server=localhost"

networks:
  default:
    name: cockpit_net
