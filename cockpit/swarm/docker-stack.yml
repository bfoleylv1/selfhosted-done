# cockpit - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml cockpit
# image verified to exist at generation time: quay.io/cockpit/ws:latest

services:
  cockpit:
    image: quay.io/cockpit/ws:latest
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - cockpit_config:/config
      - cockpit_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/ || wget -qO- http://127.0.0.1:9090/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cockpit"
    #   - "homepage.description=Web-based Linux server administration dashboard.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cockpit.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9090"
    #   - "homepage.server=localhost"

volumes:
  cockpit_config:
  cockpit_data:

networks:
  default:
    name: cockpit_net
    driver: overlay
    attachable: true
