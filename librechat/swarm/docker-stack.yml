# librechat - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml librechat
# image verified to exist at generation time: librechat/librechat:latest

services:
  librechat:
    image: librechat/librechat:latest
    ports:
      - target: 20465
        published: 20465
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - librechat_config:/config
      - librechat_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20465 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=librechat"
    #   - "homepage.description=Librechat self-hosted service."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=librechat.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20465"
    #   - "homepage.server=localhost"

volumes:
  librechat_config:
  librechat_data:

networks:
  default:
    name: librechat_net
    driver: overlay
    attachable: true
