# wagmios - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  wagmios:
    image: alpine:3.20
    container_name: wagmios
    restart: unless-stopped
    ports:
      - "20352:20352"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20352 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wagmios"
    #   - "homepage.description=Wagmios: give your AI agent a homelab (self-hosted agent tooling).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wagmios.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20352"
    #   - "homepage.server=localhost"

networks:
  default:
    name: wagmios_net
