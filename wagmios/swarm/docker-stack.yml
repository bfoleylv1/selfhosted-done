# wagmios - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml wagmios
# image verified to exist at generation time: alpine:3.20

services:
  wagmios:
    image: alpine:3.20
    ports:
      - target: 20352
        published: 20352
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - wagmios_config:/config
      - wagmios_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20352 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wagmios"
    #   - "homepage.description=Wagmios: give your AI agent a homelab (self-hosted agent tooling).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wagmios.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20352"
    #   - "homepage.server=localhost"

volumes:
  wagmios_config:
  wagmios_data:

networks:
  default:
    name: wagmios_net
    driver: overlay
    attachable: true
