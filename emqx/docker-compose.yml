# emqx - docker compose (single host)
# image verified to exist at generation time: emqx/emqx:latest

services:
  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    restart: unless-stopped
    ports:
      - "18083:18083"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18083/status || wget -qO- http://127.0.0.1:18083/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=emqx"
    #   - "homepage.description=Scalable open-source MQTT broker for IoT.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=emqx.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:18083"
    #   - "homepage.server=localhost"

networks:
  default:
    name: emqx_net
