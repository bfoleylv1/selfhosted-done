# typo3 - docker compose (single host)
# image verified to exist at generation time: ghcr.io/typo3/core-testing-php82:latest

services:
  typo3:
    image: ghcr.io/typo3/core-testing-php82:latest
    container_name: typo3
    restart: unless-stopped
    ports:
      - "20341:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=typo3"
    #   - "homepage.description=Open-source CMS; enterprise-grade content management."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=typo3.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20341"
    #   - "homepage.server=localhost"

networks:
  default:
    name: typo3_net
