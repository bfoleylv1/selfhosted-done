# webdav - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml webdav
# image verified to exist at generation time: bytemark/webdav:latest

services:
  webdav:
    image: bytemark/webdav:latest
    ports:
      - target: 80
        published: 20359
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - webdav_config:/config
      - webdav_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=webdav"
    #   - "homepage.description=HTTP-based file management protocol; file sharing over HTTP.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=webdav.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20359"
    #   - "homepage.server=localhost"

volumes:
  webdav_config:
  webdav_data:

networks:
  default:
    name: webdav_net
    driver: overlay
    attachable: true
