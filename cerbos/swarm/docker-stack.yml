# cerbos - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml cerbos
# image verified to exist at generation time: ghcr.io/cerbos/cerbos:latest

services:
  cerbos:
    image: ghcr.io/cerbos/cerbos:latest
    ports:
      - target: 3592
        published: 3592
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - cerbos_config:/config
      - cerbos_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3592 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cerbos"
    #   - "homepage.description=Open-source fine-grained authorization / access-control engine.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cerbos.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:3592"
    #   - "homepage.server=localhost"

volumes:
  cerbos_config:
  cerbos_data:

networks:
  default:
    name: cerbos_net
    driver: overlay
    attachable: true
