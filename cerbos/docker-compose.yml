# cerbos - docker compose (single host)
# image verified to exist at generation time: ghcr.io/cerbos/cerbos:latest

services:
  cerbos:
    image: ghcr.io/cerbos/cerbos:latest
    container_name: cerbos
    restart: unless-stopped
    ports:
      - "3592:3592"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3592/_cerbos/health || wget -qO- http://127.0.0.1:3592/_cerbos/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosting Solutions"
    #   - "homepage.name=cerbos"
    #   - "homepage.description=cerbos self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cerbos.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:3592"
    #   - "homepage.server=localhost"

networks:
  default:
    name: cerbos_net
