# cloud-foundry - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  cloud-foundry:
    image: alpine:3.20
    container_name: cloud-foundry
    restart: unless-stopped
    ports:
      - "20031:20031"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20031 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cloud-foundry"
    #   - "homepage.description=Cloud-native platform; PaaS for app deployment.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cloud-foundry.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20031"
    #   - "homepage.server=localhost"

networks:
  default:
    name: cloud-foundry_net
