# cloud-foundry - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  cloud-foundry:
    image: alpine:3.20
    container_name: cloud-foundry
    restart: unless-stopped
    ports:
      - "20031:8080"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Monitoring"
    #   - "homepage.name=cloud-foundry"
    #   - "homepage.description=Cloud-native platform; PaaS for app deployment."
    #   - "homepage.tags=Monitoring,Observability"
    #   - "homepage.icon=cloud-foundry.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20031"
    #   - "homepage.server=localhost"

networks:
  default:
    name: cloud-foundry_net
