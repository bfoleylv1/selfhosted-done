# cloud-foundry - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml cloud-foundry
# image verified to exist at generation time: alpine:3.20

services:
  cloud-foundry:
    image: alpine:3.20
    ports:
      - target: 20031
        published: 20031
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - cloud-foundry_config:/config
      - cloud-foundry_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20031 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cloud-foundry"
    #   - "homepage.description=Cloud-native platform; PaaS for app deployment."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cloud-foundry.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20031"
    #   - "homepage.server=localhost"

volumes:
  cloud-foundry_config:
  cloud-foundry_data:

networks:
  default:
    name: cloud-foundry_net
    driver: overlay
    attachable: true
