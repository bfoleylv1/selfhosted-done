# txtdot - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  txtdot:
    image: node:20-alpine
    container_name: txtdot
    restart: unless-stopped
    ports:
      - "20339:20339"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20339 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=txtdot"
    #   - "homepage.description=txtdot: HTTP proxy that strips pages down to text, links and images to save bandwidth and block ads/scripts."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=txtdot.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20339"
    #   - "homepage.server=localhost"

networks:
  default:
    name: txtdot_net
