# txtdot - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml txtdot
# image verified to exist at generation time: node:20-alpine

services:
  txtdot:
    image: node:20-alpine
    ports:
      - target: 20339
        published: 20339
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - txtdot_config:/config
      - txtdot_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20339 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=txtdot"
    #   - "homepage.description=txtdot: HTTP proxy that strips pages down to text, links and images to save bandwidth and block ads/scripts.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=txtdot.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20339"
    #   - "homepage.server=localhost"

volumes:
  txtdot_config:
  txtdot_data:

networks:
  default:
    name: txtdot_net
    driver: overlay
    attachable: true
