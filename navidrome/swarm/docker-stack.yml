# navidrome - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml navidrome
# image verified to exist at generation time: deluan/navidrome:latest

services:
  navidrome:
    image: deluan/navidrome:latest
    ports:
      - target: 4533
        published: 4533
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - navidrome_config:/config
      - navidrome_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4533/ || wget -qO- http://127.0.0.1:4533/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=navidrome"
    #   - "homepage.description=Modern and lightweight Go/NodeJS music server; compatible with Subsonic API."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=navidrome.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:4533"
    #   - "homepage.server=localhost"

volumes:
  navidrome_config:
  navidrome_data:

networks:
  default:
    name: navidrome_net
    driver: overlay
    attachable: true
