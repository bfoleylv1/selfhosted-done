# navidrome - docker compose (single host)
# image verified to exist at generation time: deluan/navidrome:latest

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4533/ || wget -qO- http://127.0.0.1:4533/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=navidrome"
    #   - "homepage.description=Modern and lightweight Go/NodeJS music server; compatible with Subsonic API."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=navidrome.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:4533"
    #   - "homepage.server=localhost"

networks:
  default:
    name: navidrome_net
