# sourcehut - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml sourcehut
# image verified to exist at generation time: alpine:3.20

services:
  sourcehut:
    image: alpine:3.20
    ports:
      - target: 20290
        published: 20290
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - sourcehut_config:/config
      - sourcehut_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20290 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sourcehut"
    #   - "homepage.description=Hosting service for open source projects; git hosting and CI.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sourcehut.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20290"
    #   - "homepage.server=localhost"

volumes:
  sourcehut_config:
  sourcehut_data:

networks:
  default:
    name: sourcehut_net
    driver: overlay
    attachable: true
