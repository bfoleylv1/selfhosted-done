# squirrelmail - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  squirrelmail:
    image: php:8.2-apache
    container_name: squirrelmail
    restart: unless-stopped
    ports:
      - "20297:20297"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20297 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=squirrelmail"
    #   - "homepage.description=Web-based email client; traditional webmail interface."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=squirrelmail.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20297"
    #   - "homepage.server=localhost"

networks:
  default:
    name: squirrelmail_net
