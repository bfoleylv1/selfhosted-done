# pocketbase - docker compose (single host)
# image verified to exist at generation time: ghcr.io/muchobien/pocketbase:latest

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/api/health || wget -qO- http://127.0.0.1:8090/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pocketbase"
    #   - "homepage.description=Open-source backend (SQLite + realtime + auth) in a single file.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pocketbase.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8090"
    #   - "homepage.server=localhost"

networks:
  default:
    name: pocketbase_net
