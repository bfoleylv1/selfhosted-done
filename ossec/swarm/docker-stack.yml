# ossec - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml ossec
# image verified to exist at generation time: atomicorp/ossec-docker:latest

services:
  ossec:
    image: atomicorp/ossec-docker:latest
    ports:
      - target: 1514
        published: 1514
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ossec_config:/config
      - ossec_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1514 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ossec"
    #   - "homepage.description=Host-based intrusion detection system; log analysis and monitoring.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ossec.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:1514"
    #   - "homepage.server=localhost"

volumes:
  ossec_config:
  ossec_data:

networks:
  default:
    name: ossec_net
    driver: overlay
    attachable: true
