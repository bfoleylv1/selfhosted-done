# signoz - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml signoz
# image verified to exist at generation time: signoz/query-service:latest

services:
  signoz:
    image: signoz/query-service:latest
    ports:
      - target: 3301
        published: 20281
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - signoz_config:/config
      - signoz_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3301/ || wget -qO- http://127.0.0.1:3301/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=signoz"
    #   - "homepage.description=Open-source observability platform (traces, metrics, logs)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=signoz.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20281"
    #   - "homepage.server=localhost"

volumes:
  signoz_config:
  signoz_data:

networks:
  default:
    name: signoz_net
    driver: overlay
    attachable: true
