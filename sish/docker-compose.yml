# sish - docker compose (single host)
# image verified to exist at generation time: antoniomika/sish:latest

services:
  sish:
    image: antoniomika/sish:latest
    container_name: sish
    restart: unless-stopped
    ports:
      - "20508:20508"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20508 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sish"
    #   - "homepage.description=sish: open-source tunneled reverse proxy server (self-hosted ngrok/serveo alternative)."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sish.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20508"
    #   - "homepage.server=localhost"

networks:
  default:
    name: sish_net
