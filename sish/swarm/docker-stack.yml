# sish - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml sish
# image verified to exist at generation time: antoniomika/sish:latest

services:
  sish:
    image: antoniomika/sish:latest
    ports:
      - target: 20508
        published: 20508
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - sish_config:/config
      - sish_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20508 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sish"
    #   - "homepage.description=sish: open-source tunneled reverse proxy server (self-hosted ngrok/serveo alternative)."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sish.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20508"
    #   - "homepage.server=localhost"

volumes:
  sish_config:
  sish_data:

networks:
  default:
    name: sish_net
    driver: overlay
    attachable: true
