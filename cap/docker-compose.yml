# cap - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  cap:
    image: alpine:3.20
    container_name: cap
    restart: unless-stopped
    ports:
      - "20023:20023"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20023 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cap"
    #   - "homepage.description=Open-source screen recording and sharing tool."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cap.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20023"
    #   - "homepage.server=localhost"

networks:
  default:
    name: cap_net
