# fmd-server - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml fmd-server
# image verified to exist at generation time: golang:1.23-alpine

services:
  fmd-server:
    image: golang:1.23-alpine
    ports:
      - target: 20071
        published: 20071
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - fmd-server_config:/config
      - fmd-server_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20071 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=fmd-server"
    #   - "homepage.description=fmd-server self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=fmd-server.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20071"
    #   - "homepage.server=localhost"

volumes:
  fmd-server_config:
  fmd-server_data:

networks:
  default:
    name: fmd-server_net
    driver: overlay
    attachable: true
