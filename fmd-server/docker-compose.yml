# fmd-server - docker compose (single host)
# image verified to exist at generation time: golang:1.23-alpine

services:
  fmd-server:
    image: golang:1.23-alpine
    container_name: fmd-server
    restart: unless-stopped
    ports:
      - "20071:20071"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20071 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=fmd-server"
    #   - "homepage.description=fmd-server self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=fmd-server.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20071"
    #   - "homepage.server=localhost"

networks:
  default:
    name: fmd-server_net
