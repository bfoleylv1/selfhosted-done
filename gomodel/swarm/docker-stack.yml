# gomodel - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml gomodel
# image verified to exist at generation time: golang:1.23-alpine

services:
  gomodel:
    image: golang:1.23-alpine
    ports:
      - target: 20099
        published: 20099
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - gomodel_config:/config
      - gomodel_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20099 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=gomodel"
    #   - "homepage.description=gomodel self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=gomodel.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20099"
    #   - "homepage.server=localhost"

volumes:
  gomodel_config:
  gomodel_data:

networks:
  default:
    name: gomodel_net
    driver: overlay
    attachable: true
