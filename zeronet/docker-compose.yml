# zeronet - docker compose (single host)
# image verified to exist at generation time: nofish/zeronet:latest

services:
  zeronet:
    image: nofish/zeronet:latest
    container_name: zeronet
    restart: unless-stopped
    ports:
      - "20384:20384"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20384 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zeronet"
    #   - "homepage.description=Decentralized websites using Bitcoin crypto and BitTorrent swarm.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zeronet.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20384"
    #   - "homepage.server=localhost"

networks:
  default:
    name: zeronet_net
