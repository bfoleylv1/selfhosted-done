# zeronet - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml zeronet
# image verified to exist at generation time: nofish/zeronet:latest

services:
  zeronet:
    image: nofish/zeronet:latest
    ports:
      - target: 20384
        published: 20384
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - zeronet_config:/config
      - zeronet_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20384 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zeronet"
    #   - "homepage.description=Decentralized websites using Bitcoin crypto and BitTorrent swarm."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zeronet.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20384"
    #   - "homepage.server=localhost"

volumes:
  zeronet_config:
  zeronet_data:

networks:
  default:
    name: zeronet_net
    driver: overlay
    attachable: true
