# telebugs - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml telebugs
# image verified to exist at generation time: ruby:3.3-alpine

services:
  telebugs:
    image: ruby:3.3-alpine
    ports:
      - target: 20321
        published: 20321
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - telebugs_config:/config
      - telebugs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20321 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=telebugs"
    #   - "homepage.description=Self-hosted bug and error tracking service.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=telebugs.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20321"
    #   - "homepage.server=localhost"

volumes:
  telebugs_config:
  telebugs_data:

networks:
  default:
    name: telebugs_net
    driver: overlay
    attachable: true
