# mylar3 - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml mylar3
# image verified to exist at generation time: linuxserver/mylar3:latest

services:
  mylar3:
    image: linuxserver/mylar3:latest
    ports:
      - target: 20539
        published: 20539
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - mylar3_config:/config
      - mylar3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20539 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mylar3"
    #   - "homepage.description=Mylar3 self-hosted service."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mylar3.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20539"
    #   - "homepage.server=localhost"

volumes:
  mylar3_config:
  mylar3_data:

networks:
  default:
    name: mylar3_net
    driver: overlay
    attachable: true
