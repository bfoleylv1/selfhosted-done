# fablecut - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml fablecut
# image verified to exist at generation time: fablecut/fablecut:latest

services:
  fablecut:
    # image: fablecut/fablecut:latest  # UNVERIFIED
    ports:
      - target: 20442
        published: 20442
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - fablecut_config:/config
      - fablecut_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20442 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=fablecut"
    #   - "homepage.description=fablecut self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=fablecut.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20442"
    #   - "homepage.server=localhost"

volumes:
  fablecut_config:
  fablecut_data:

networks:
  default:
    name: fablecut_net
    driver: overlay
    attachable: true
