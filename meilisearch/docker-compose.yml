# meilisearch - docker compose (single host)
# image verified to exist at generation time: getmeili/meilisearch:latest

services:
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - NVIDIA_DRIVER_CAPABILITIES=all
      # - NVIDIA_VISIBLE_DEVICES=all
      # - ONEAPI_DEVICE_SELECTOR=*        # Intel iGPU/Arc OpenVINO
      # - ZES_ENABLE_SYSMAN=1
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health || wget -qO- http://127.0.0.1:7700/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
