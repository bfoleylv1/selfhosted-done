# openclaw - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml openclaw
# image verified to exist at generation time: ghcr.io/openclaw/openclaw:latest

services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    ports:
      - target: 20175
        published: 20175
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - openclaw_config:/config
      - openclaw_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20175 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=openclaw"
    #   - "homepage.description=OpenClaw: self-hosted personal AI assistant (cross-platform)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=openclaw.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20175"
    #   - "homepage.server=localhost"

volumes:
  openclaw_config:
  openclaw_data:

networks:
  default:
    name: openclaw_net
    driver: overlay
    attachable: true
