# openclaw - docker compose (single host)
# image verified to exist at generation time: ghcr.io/openclaw/openclaw:latest

services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    ports:
      - "20175:20175"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20175 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=openclaw"
    #   - "homepage.description=OpenClaw: self-hosted personal AI assistant (cross-platform)."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=openclaw.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20175"
    #   - "homepage.server=localhost"

networks:
  default:
    name: openclaw_net
