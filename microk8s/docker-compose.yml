# microk8s - docker compose (single host)
# image verified to exist at generation time: ubuntu:24.04

services:
  microk8s:
    image: ubuntu:24.04
    container_name: microk8s
    restart: unless-stopped
    ports:
      - "20154:20154"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20154 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=microk8s"
    #   - "homepage.description=Lightweight Kubernetes distribution; edge and IoT deployment.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=microk8s.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20154"
    #   - "homepage.server=localhost"

networks:
  default:
    name: microk8s_net
