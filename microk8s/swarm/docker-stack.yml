# microk8s - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml microk8s
# image verified to exist at generation time: ubuntu:24.04

services:
  microk8s:
    image: ubuntu:24.04
    ports:
      - target: 20154
        published: 20154
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - microk8s_config:/config
      - microk8s_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20154 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=microk8s"
    #   - "homepage.description=microk8s self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=microk8s.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20154"
    #   - "homepage.server=localhost"

volumes:
  microk8s_config:
  microk8s_data:

networks:
  default:
    name: microk8s_net
    driver: overlay
    attachable: true
