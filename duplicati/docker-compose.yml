# duplicati - docker compose (single host)
# image verified to exist at generation time: linuxserver/duplicati:latest

services:
  duplicati:
    image: linuxserver/duplicati:latest
    container_name: duplicati
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=duplicati"
    #   - "homepage.description=Backup tool; encrypt, compress and schedule backups."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=duplicati.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8200"
    #   - "homepage.server=localhost"

networks:
  default:
    name: duplicati_net
