# spooty - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml spooty
# image verified to exist at generation time: alexboe/spooty:latest

services:
  spooty:
    # image: alexboe/spooty:latest  # UNVERIFIED
    ports:
      - target: 20511
        published: 20511
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - spooty_config:/config
      - spooty_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20511 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=spooty"
    #   - "homepage.description=spooty self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=spooty.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20511"
    #   - "homepage.server=localhost"

volumes:
  spooty_config:
  spooty_data:

networks:
  default:
    name: spooty_net
    driver: overlay
    attachable: true
