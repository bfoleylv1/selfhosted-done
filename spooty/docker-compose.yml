# spooty - docker compose (single host)
# image verified to exist at generation time: alexboe/spooty:latest

services:
  spooty:
    # image: alexboe/spooty:latest  # UNVERIFIED
    container_name: spooty
    restart: unless-stopped
    ports:
      - "20511:20511"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20511 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=spooty"
    #   - "homepage.description=spooty self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=spooty.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20511"
    #   - "homepage.server=localhost"

networks:
  default:
    name: spooty_net
