# wiki-js - docker compose (single host)
# image verified to exist at generation time: ghcr.io/requarks/wiki:2

services:
  wiki-js:
    image: ghcr.io/requarks/wiki:2
    container_name: wiki-js
    restart: unless-stopped
    ports:
      - "20363:3000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wiki-js"
    #   - "homepage.description=wiki-js self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wiki-js.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20363"
    #   - "homepage.server=localhost"

networks:
  default:
    name: wiki-js_net
