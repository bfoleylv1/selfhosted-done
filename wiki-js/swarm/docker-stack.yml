# wiki-js - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml wiki-js
# image verified to exist at generation time: ghcr.io/requarks/wiki:2

services:
  wiki-js:
    image: ghcr.io/requarks/wiki:2
    ports:
      - target: 3000
        published: 20363
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - wiki-js_config:/config
      - wiki-js_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wiki-js"
    #   - "homepage.description=Modern and powerful wiki app; built on Node.js with Vue.js frontend."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=wiki-js.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20363"
    #   - "homepage.server=localhost"

volumes:
  wiki-js_config:
  wiki-js_data:

networks:
  default:
    name: wiki-js_net
    driver: overlay
    attachable: true
