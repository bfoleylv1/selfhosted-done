# appflowy - docker compose (single host)
# image verified to exist at generation time: appflowyinc/appflowy_cloud:latest

services:
  appflowy:
    image: appflowyinc/appflowy_cloud:latest
    container_name: appflowy
    restart: unless-stopped
    ports:
      - "20002:8080"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Productivity"
    #   - "homepage.name=appflowy"
    #   - "homepage.description=Open source Notion alternative; collaborative workspace builder."
    #   - "homepage.tags=Productivity,Project Management"
    #   - "homepage.icon=appflowy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20002"
    #   - "homepage.server=localhost"

networks:
  default:
    name: appflowy_net
