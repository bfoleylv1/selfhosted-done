# trigger-dev - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml trigger-dev
# image verified to exist at generation time: ghcr.io/triggerdotdev/trigger.dev:v3

services:
  trigger-dev:
    image: ghcr.io/triggerdotdev/trigger.dev:v3
    ports:
      - target: 20334
        published: 20334
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - trigger-dev_config:/config
      - trigger-dev_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20334 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=trigger-dev"
    #   - "homepage.description=trigger-dev self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=trigger-dev.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20334"
    #   - "homepage.server=localhost"

volumes:
  trigger-dev_config:
  trigger-dev_data:

networks:
  default:
    name: trigger-dev_net
    driver: overlay
    attachable: true
