# baserow - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml baserow
# image verified to exist at generation time: baserow/baserow:latest

services:
  baserow:
    image: baserow/baserow:latest
    ports:
      - target: 20011
        published: 20011
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - baserow_config:/config
      - baserow_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20011 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=baserow"
    #   - "homepage.description=Open source Notion alternative; database and form builder."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=baserow.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20011"
    #   - "homepage.server=localhost"

volumes:
  baserow_config:
  baserow_data:

networks:
  default:
    name: baserow_net
    driver: overlay
    attachable: true
