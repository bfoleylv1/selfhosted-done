# baserow - docker compose (single host)
# image verified to exist at generation time: baserow/baserow:latest

services:
  baserow:
    image: baserow/baserow:latest
    container_name: baserow
    restart: unless-stopped
    ports:
      - "20011:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/api/_health/ || wget -qO- http://127.0.0.1:80/api/_health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Email"
    #   - "homepage.name=baserow"
    #   - "homepage.description=Open source Notion alternative; database and form builder."
    #   - "homepage.tags=Email,Communication"
    #   - "homepage.icon=baserow.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20011"
    #   - "homepage.server=localhost"

networks:
  default:
    name: baserow_net
