# qemu - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml qemu
# image verified to exist at generation time: qemux/qemu:latest

services:
  qemu:
    image: qemux/qemu:latest
    ports:
      - target: 20228
        published: 20228
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - LIBVA_DRIVER_NAME=iHD
      # - INTEL_GPU=1
    volumes:
      - qemu_config:/config
      - qemu_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20228 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
          # - node.role == manager
          # GPU: add node-generic-resources to daemon.json and:
          #   - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
      # GPU: swarm ignores `devices:`/`runtime:`. Declare in
      #   /etc/docker/daemon.json: "node-generic-resources": ["gpu=1"]
      #   then use deploy.resources.reservations.generic_resources.
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=qemu"
    #   - "homepage.description=Open source emulator and virtualization; hardware emulation."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=qemu.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20228"
    #   - "homepage.server=localhost"

volumes:
  qemu_config:
  qemu_data:

networks:
  default:
    name: qemu_net
    driver: overlay
    attachable: true
