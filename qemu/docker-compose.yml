# qemu - docker compose (single host)
# image verified to exist at generation time: qemux/qemu:latest

services:
  qemu:
    image: qemux/qemu:latest
    container_name: qemu
    restart: unless-stopped
    ports:
      - "20228:20228"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - LIBVA_DRIVER_NAME=iHD
      # - INTEL_GPU=1
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20228 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # devices:
    #   - /dev/kvm:/dev/kvm
    #   - /dev/dri:/dev/dri
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=qemu"
    #   - "homepage.description=Open source emulator and virtualization; hardware emulation."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=qemu.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20228"
    #   - "homepage.server=localhost"

networks:
  default:
    name: qemu_net
