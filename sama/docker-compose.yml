# sama - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  sama:
    image: alpine:3.20
    container_name: sama
    restart: unless-stopped
    ports:
      - "20264:20264"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20264 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sama"
    #   - "homepage.description=Placeholder entry — no real upstream image configured (generic base image only); not yet implemented."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sama.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20264"
    #   - "homepage.server=localhost"

networks:
  default:
    name: sama_net
