# slash - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml slash
# image verified to exist at generation time: slash/slash:latest

services:
  slash:
    # image: slash/slash:latest  # UNVERIFIED
    ports:
      - target: 20510
        published: 20510
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - slash_config:/config
      - slash_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20510 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=slash"
    #   - "homepage.description=slash self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=slash.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20510"
    #   - "homepage.server=localhost"

volumes:
  slash_config:
  slash_data:

networks:
  default:
    name: slash_net
    driver: overlay
    attachable: true
