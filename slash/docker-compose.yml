# slash - docker compose (single host)
# image verified to exist at generation time: slash/slash:latest

services:
  slash:
    # image: slash/slash:latest  # UNVERIFIED
    container_name: slash
    restart: unless-stopped
    ports:
      - "20510:20510"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20510 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=slash"
    #   - "homepage.description=slash self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=slash.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20510"
    #   - "homepage.server=localhost"

networks:
  default:
    name: slash_net
