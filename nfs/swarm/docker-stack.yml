# nfs - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml nfs
# image verified to exist at generation time: itsthenetwork/nfs-server-alpine:latest

services:
  nfs:
    image: itsthenetwork/nfs-server-alpine:latest
    ports:
      - target: 2049
        published: 2049
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - nfs_config:/config
      - nfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2049 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=nfs"
    #   - "homepage.description=Network File System; share file systems on Unix/Linux."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=nfs.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:2049"
    #   - "homepage.server=localhost"

volumes:
  nfs_config:
  nfs_data:

networks:
  default:
    name: nfs_net
    driver: overlay
    attachable: true
