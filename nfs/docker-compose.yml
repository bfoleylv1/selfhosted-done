# nfs - docker compose (single host)
# image verified to exist at generation time: itsthenetwork/nfs-server-alpine:latest

services:
  nfs:
    image: itsthenetwork/nfs-server-alpine:latest
    container_name: nfs
    restart: unless-stopped
    ports:
      - "2049:2049"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2049 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=nfs"
    #   - "homepage.description=nfs self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=nfs.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:2049"
    #   - "homepage.server=localhost"

networks:
  default:
    name: nfs_net
