# trek - docker compose (single host)
# image verified to exist at generation time: trek/trek:latest

services:
  trek:
    # image: trek/trek:latest  # UNVERIFIED
    container_name: trek
    restart: unless-stopped
    ports:
      - "20550:20550"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20550 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=trek"
    #   - "homepage.description=trek self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=trek.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20550"
    #   - "homepage.server=localhost"

networks:
  default:
    name: trek_net
