# trek - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml trek
# image verified to exist at generation time: trek/trek:latest

services:
  trek:
    # image: trek/trek:latest  # UNVERIFIED
    ports:
      - target: 20550
        published: 20550
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - trek_config:/config
      - trek_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20550 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=trek"
    #   - "homepage.description=trek self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=trek.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20550"
    #   - "homepage.server=localhost"

volumes:
  trek_config:
  trek_data:

networks:
  default:
    name: trek_net
    driver: overlay
    attachable: true
