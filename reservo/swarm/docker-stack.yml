# reservo - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml reservo
# image verified to exist at generation time: reservo/reservo:latest

services:
  reservo:
    image: reservo/reservo:latest
    ports:
      - target: 20241
        published: 20241
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - reservo_config:/config
      - reservo_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20241 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=reservo"
    #   - "homepage.description=Self-hosted image hosting and sharing script.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=reservo.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20241"
    #   - "homepage.server=localhost"

volumes:
  reservo_config:
  reservo_data:

networks:
  default:
    name: reservo_net
    driver: overlay
    attachable: true
