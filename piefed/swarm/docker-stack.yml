# piefed - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml piefed
# image verified to exist at generation time: python:3.11-slim

services:
  piefed:
    image: python:3.11-slim
    ports:
      - target: 20204
        published: 20204
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - piefed_config:/config
      - piefed_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20204 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=piefed"
    #   - "homepage.description=piefed self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=piefed.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20204"
    #   - "homepage.server=localhost"

volumes:
  piefed_config:
  piefed_data:

networks:
  default:
    name: piefed_net
    driver: overlay
    attachable: true
