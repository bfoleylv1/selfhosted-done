# siyuan - docker compose (single host)
# image verified to exist at generation time: b3log/siyuan:latest

services:
  siyuan:
    image: b3log/siyuan:latest
    container_name: siyuan
    restart: unless-stopped
    ports:
      - "20509:20509"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20509 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=siyuan"
    #   - "homepage.description=SiYuan: open-source, privacy-first personal knowledge management and note-taking app."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=siyuan.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20509"
    #   - "homepage.server=localhost"

networks:
  default:
    name: siyuan_net
