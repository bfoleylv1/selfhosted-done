# siyuan - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml siyuan
# image verified to exist at generation time: b3log/siyuan:latest

services:
  siyuan:
    image: b3log/siyuan:latest
    ports:
      - target: 20509
        published: 20509
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - siyuan_config:/config
      - siyuan_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20509 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=siyuan"
    #   - "homepage.description=SiYuan: open-source, privacy-first personal knowledge management and note-taking app."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=siyuan.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20509"
    #   - "homepage.server=localhost"

volumes:
  siyuan_config:
  siyuan_data:

networks:
  default:
    name: siyuan_net
    driver: overlay
    attachable: true
