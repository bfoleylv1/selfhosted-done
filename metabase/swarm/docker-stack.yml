# metabase - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml metabase
# image verified to exist at generation time: metabase/metabase:latest

services:
  metabase:
    image: metabase/metabase:latest
    ports:
      - target: 3000
        published: 20553
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - metabase_config:/config
      - metabase_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=metabase"
    #   - "homepage.description=Metabase: open-source business intelligence and analytics dashboard tool."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=metabase.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20553"
    #   - "homepage.server=localhost"

volumes:
  metabase_config:
  metabase_data:

networks:
  default:
    name: metabase_net
    driver: overlay
    attachable: true
