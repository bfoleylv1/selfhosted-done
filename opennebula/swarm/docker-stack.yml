# opennebula - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml opennebula
# image verified to exist at generation time: opennebula/opennebula:latest

services:
  opennebula:
    image: opennebula/opennebula:latest
    ports:
      - target: 9869
        published: 9869
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - LIBVA_DRIVER_NAME=iHD
      # - INTEL_GPU=1
    volumes:
      - opennebula_config:/config
      - opennebula_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9869 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
          # - node.role == manager
          # GPU: add node-generic-resources to daemon.json and:
          #   - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
      # GPU: swarm ignores `devices:`/`runtime:`. Declare in
      #   /etc/docker/daemon.json: "node-generic-resources": ["gpu=1"]
      #   then use deploy.resources.reservations.generic_resources.
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=opennebula"
    #   - "homepage.description=Open source cloud management platform; IaaS solution.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=opennebula.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9869"
    #   - "homepage.server=localhost"

volumes:
  opennebula_config:
  opennebula_data:

networks:
  default:
    name: opennebula_net
    driver: overlay
    attachable: true
