# opennebula - docker compose (single host)
# image verified to exist at generation time: opennebula/opennebula:latest

services:
  opennebula:
    image: opennebula/opennebula:latest
    container_name: opennebula
    restart: unless-stopped
    ports:
      - "9869:9869"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - LIBVA_DRIVER_NAME=iHD
      # - INTEL_GPU=1
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9869 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # devices:
    #   - /dev/kvm:/dev/kvm
    #   - /dev/dri:/dev/dri
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=opennebula"
    #   - "homepage.description=Open source cloud management platform; IaaS solution."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=opennebula.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9869"
    #   - "homepage.server=localhost"

networks:
  default:
    name: opennebula_net
