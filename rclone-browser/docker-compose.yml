# rclone-browser - docker compose (single host)
# image verified to exist at generation time: rclone/rclone:latest

services:
  rclone-browser:
    image: rclone/rclone:latest
    container_name: rclone-browser
    restart: unless-stopped
    ports:
      - "20234:20234"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20234 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rclone-browser"
    #   - "homepage.description=GUI for Rclone; manage cloud storage with local file browser interface."""""
    #   - "homepage.tags=Self Hosting Solutions"
