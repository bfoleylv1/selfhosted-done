# rclone-browser - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml rclone-browser
# image verified to exist at generation time: rclone/rclone:latest

services:
  rclone-browser:
    image: rclone/rclone:latest
    ports:
      - target: 20234
        published: 20234
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - rclone-browser_config:/config
      - rclone-browser_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20234 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rclone-browser"
    #   - "homepage.description=GUI for Rclone; manage cloud storage with local file browser interface."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rclone-browser.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20234"
    #   - "homepage.server=localhost"

volumes:
  rclone-browser_config:
  rclone-browser_data:

networks:
  default:
    name: rclone-browser_net
    driver: overlay
    attachable: true
