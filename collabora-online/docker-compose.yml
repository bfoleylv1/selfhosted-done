# collabora-online - docker compose (single host)
# image verified to exist at generation time: collabora/code:latest

services:
  collabora-online:
    image: collabora/code:latest
    container_name: collabora-online
    restart: unless-stopped
    ports:
      - "9980:9980"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9980 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=collabora-online"
    #   - "homepage.description=Self-hosted LibreOffice-based online office suite."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=collabora-online.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9980"
    #   - "homepage.server=localhost"

networks:
  default:
    name: collabora-online_net
