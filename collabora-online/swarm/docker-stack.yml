# collabora-online - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml collabora-online
# image verified to exist at generation time: collabora/code:latest

services:
  collabora-online:
    image: collabora/code:latest
    ports:
      - target: 9980
        published: 9980
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - collabora-online_config:/config
      - collabora-online_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9980 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=collabora-online"
    #   - "homepage.description=Self-hosted LibreOffice-based online office suite."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=collabora-online.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:9980"
    #   - "homepage.server=localhost"

volumes:
  collabora-online_config:
  collabora-online_data:

networks:
  default:
    name: collabora-online_net
    driver: overlay
    attachable: true
