# nextcloud - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml nextcloud
# image verified to exist at generation time: nextcloud:stable

services:
  nextcloud:
    image: nextcloud:stable
    ports:
      - target: 80
        published: 20165
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - nextcloud_config:/config
      - nextcloud_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=nextcloud"
    #   - "homepage.description=Suite of client-server software for file syncing, collaboration, and video conferencing."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=nextcloud.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20165"
    #   - "homepage.server=localhost"

volumes:
  nextcloud_config:
  nextcloud_data:

networks:
  default:
    name: nextcloud_net
    driver: overlay
    attachable: true
