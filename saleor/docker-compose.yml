# saleor - docker compose (single host)
# image verified to exist at generation time: ghcr.io/saleor/saleor:3.20

services:
  saleor:
    image: ghcr.io/saleor/saleor:3.20
    container_name: saleor
    restart: unless-stopped
    ports:
      - "20261:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/graphql/ || wget -qO- http://127.0.0.1:80/graphql/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=saleor"
    #   - "homepage.description=saleor self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=saleor.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20261"
    #   - "homepage.server=localhost"

networks:
  default:
    name: saleor_net
