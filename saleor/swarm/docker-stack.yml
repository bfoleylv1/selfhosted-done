# saleor - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml saleor
# image verified to exist at generation time: ghcr.io/saleor/saleor:3.20

services:
  saleor:
    image: ghcr.io/saleor/saleor:3.20
    ports:
      - target: 80
        published: 20261
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - saleor_config:/config
      - saleor_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/graphql/ || wget -qO- http://127.0.0.1:80/graphql/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=saleor"
    #   - "homepage.description=saleor self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=saleor.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20261"
    #   - "homepage.server=localhost"

volumes:
  saleor_config:
  saleor_data:

networks:
  default:
    name: saleor_net
    driver: overlay
    attachable: true
