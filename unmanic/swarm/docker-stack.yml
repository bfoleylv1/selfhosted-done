# unmanic - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml unmanic
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: josh5/unmanic:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - unmanic_config_unmanic:/config
    - unmanic_mnt_ramdisk:/tmp/unmanic
    - unmanic_mnt_tvshows:/tvshows
    - unmanic_mnt_movies:/library
    - unmanic_mnt_backup:/backup
    - unmanic_mnt_metadata:/metadata
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - unmanic
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 80
      published: 20613
      protocol: tcp
      mode: ingress
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=unmanic"
    #   - "homepage.description=unmanic self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=unmanic.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20613"
    #   - "homepage.server=localhost"
volumes:
  unmanic_config_unmanic: null
  unmanic_mnt_ramdisk: null
  unmanic_mnt_tvshows: null
  unmanic_mnt_movies: null
  unmanic_mnt_backup: null
  unmanic_mnt_metadata: null
networks:
  default:
    name: unmanic_net
    driver: overlay
    attachable: true
