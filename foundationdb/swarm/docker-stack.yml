# foundationdb - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml foundationdb
# image verified to exist at generation time: foundationdb/foundationdb:7.3.27

services:
  foundationdb:
    image: foundationdb/foundationdb:7.3.27
    ports:
      - target: 4500
        published: 4500
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - foundationdb_config:/config
      - foundationdb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4500 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=foundationdb"
    #   - "homepage.description=Ordered key-value database; transactions and scalability.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=foundationdb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:4500"
    #   - "homepage.server=localhost"

volumes:
  foundationdb_config:
  foundationdb_data:

networks:
  default:
    name: foundationdb_net
    driver: overlay
    attachable: true
