# foundationdb - docker compose (single host)
# image verified to exist at generation time: foundationdb/foundationdb:7.3.27

services:
  foundationdb:
    image: foundationdb/foundationdb:7.3.27
    container_name: foundationdb
    restart: unless-stopped
    ports:
      - "4500:4500"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4500 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=foundationdb"
    #   - "homepage.description=foundationdb self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=foundationdb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:4500"
    #   - "homepage.server=localhost"

networks:
  default:
    name: foundationdb_net
