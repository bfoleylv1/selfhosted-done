# simplement - docker compose (single host)
# image verified to exist at generation time: simplement/go-simplext:dev

services:
  simplement:
    # image: simplement/go-simplext:dev  # UNVERIFIED
    container_name: simplement
    restart: unless-stopped
    ports:
      - "20506:20506"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20506 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=simplement"
    #   - "homepage.description=simplement self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=simplement.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20506"
    #   - "homepage.server=localhost"

networks:
  default:
    name: simplement_net
