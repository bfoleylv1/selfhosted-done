# simplement - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml simplement
# image verified to exist at generation time: simplement/go-simplext:dev

services:
  simplement:
    # image: simplement/go-simplext:dev  # UNVERIFIED
    ports:
      - target: 20506
        published: 20506
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - simplement_config:/config
      - simplement_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20506 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=simplement"
    #   - "homepage.description=simplement self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=simplement.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20506"
    #   - "homepage.server=localhost"

volumes:
  simplement_config:
  simplement_data:

networks:
  default:
    name: simplement_net
    driver: overlay
    attachable: true
