# saltstack - docker compose (single host)
# image verified to exist at generation time: saltstack/salt:latest

services:
  saltstack:
    image: saltstack/salt:latest
    container_name: saltstack
    restart: unless-stopped
    ports:
      - "20262:20262"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20262 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=saltstack"
    #   - "homepage.description=Event-driven automation engine; configuration management and orchestration."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=saltstack.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20262"
    #   - "homepage.server=localhost"

networks:
  default:
    name: saltstack_net
