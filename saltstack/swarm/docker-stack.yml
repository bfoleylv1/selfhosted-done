# saltstack - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml saltstack
# image verified to exist at generation time: saltstack/salt:latest

services:
  saltstack:
    image: saltstack/salt:latest
    ports:
      - target: 20262
        published: 20262
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - saltstack_config:/config
      - saltstack_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20262 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=saltstack"
    #   - "homepage.description=Event-driven automation engine; configuration management and orchestration."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=saltstack.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20262"
    #   - "homepage.server=localhost"

volumes:
  saltstack_config:
  saltstack_data:

networks:
  default:
    name: saltstack_net
    driver: overlay
    attachable: true
