# resourcespace - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml resourcespace
# image verified to exist at generation time: php:8.2-apache

services:
  resourcespace:
    image: php:8.2-apache
    ports:
      - target: 20242
        published: 20242
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - resourcespace_config:/config
      - resourcespace_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20242 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=resourcespace"
    #   - "homepage.description=Open-source digital asset management (DAM)."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=resourcespace.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20242"
    #   - "homepage.server=localhost"

volumes:
  resourcespace_config:
  resourcespace_data:

networks:
  default:
    name: resourcespace_net
    driver: overlay
    attachable: true
