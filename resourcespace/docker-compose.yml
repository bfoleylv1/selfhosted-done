# resourcespace - docker compose (single host)
# image verified to exist at generation time: php:8.2-apache

services:
  resourcespace:
    image: php:8.2-apache
    container_name: resourcespace
    restart: unless-stopped
    ports:
      - "20242:20242"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20242 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=resourcespace"
    #   - "homepage.description=Open-source digital asset management (DAM)."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=resourcespace.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20242"
    #   - "homepage.server=localhost"

networks:
  default:
    name: resourcespace_net
