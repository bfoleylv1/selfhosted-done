# docmost - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml docmost
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: docmost/docmost:latest
    environment:
      APP_URL: http://localhost:3000
      APP_SECRET: CaZ8r3ibx5rWCWosKEcXH5pfIG9vJ4WN
      DATABASE_URL: postgresql://docmost:STRONG_DB_PASSWORD@localhost:5432/docmost?schema=public
      REDIS_URL: redis://localhost:6379
    volumes:
    - docmost_docmost_data_docmost:/app/data/storage
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - docmost
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 3000
      published: 20569
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD
    volumes:
    - docmost_docmost_data_db_data:/var/lib/postgresql/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
  redis:
    image: redis:7.2-alpine
    volumes:
    - docmost_docmost_data_redis_data:/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=docmost"
    #   - "homepage.description=docmost self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=docmost.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20569"
    #   - "homepage.server=localhost"
volumes:
  docmost_docmost_data_docmost: null
  docmost_docmost_data_db_data: null
  docmost_docmost_data_redis_data: null
networks:
  default:
    name: docmost_net
    driver: overlay
    attachable: true
