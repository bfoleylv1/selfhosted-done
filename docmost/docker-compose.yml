# docmost - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: docmost/docmost:latest
    container_name: app-docmost
    environment:
      APP_URL: http://localhost:3000
      APP_SECRET: CaZ8r3ibx5rWCWosKEcXH5pfIG9vJ4WN
      DATABASE_URL: postgresql://docmost:STRONG_DB_PASSWORD@localhost:5432/docmost?schema=public
      REDIS_URL: redis://localhost:6379
    volumes:
    - ./docmost-data/docmost:/app/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - docmost
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 20569:3000
  db:
    image: postgres:16-alpine
    container_name: app-docmost-database
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD
    restart: always
    volumes:
    - ./docmost-data/db-data:/var/lib/postgresql/data
  redis:
    image: redis:7.2-alpine
    container_name: app-docmost-redis
    restart: always
    volumes:
    - ./docmost-data/redis-data:/data
