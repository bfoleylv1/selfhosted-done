# cyberchef - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml cyberchef
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: ghcr.io/gchq/cyberchef:latest
    environment:
    - TZ=America/Los_Angeles
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - nginx
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 8080
      published: 20565
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cyberchef"
    #   - "homepage.description=cyberchef self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cyberchef.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20565"
    #   - "homepage.server=localhost"
networks:
  default:
    name: cyberchef_net
    driver: overlay
    attachable: true
