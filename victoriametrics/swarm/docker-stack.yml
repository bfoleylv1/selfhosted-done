# victoriametrics - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml victoriametrics
# image verified to exist at generation time: victoriametrics/victoria-metrics:latest

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    ports:
      - target: 8428
        published: 8428
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - victoriametrics_config:/config
      - victoriametrics_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8428/health || wget -qO- http://127.0.0.1:8428/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=victoriametrics"
    #   - "homepage.description=Ultra-high performing time series database; Prometheus compatible."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=victoriametrics.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8428"
    #   - "homepage.server=localhost"

volumes:
  victoriametrics_config:
  victoriametrics_data:

networks:
  default:
    name: victoriametrics_net
    driver: overlay
    attachable: true
