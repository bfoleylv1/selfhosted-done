# n8n - docker compose (single host)
# image verified to exist at generation time: n8nio/n8n:latest

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5678/ || wget -qO- http://127.0.0.1:5678/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=n8n"
    #   - "homepage.description=n8n self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=n8n.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5678"
    #   - "homepage.server=localhost"

networks:
  default:
    name: n8n_net
