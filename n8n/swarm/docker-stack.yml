# n8n - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml n8n
# image verified to exist at generation time: n8nio/n8n:latest

services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - target: 5678
        published: 5678
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - n8n_config:/config
      - n8n_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5678/ || wget -qO- http://127.0.0.1:5678/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=n8n"
    #   - "homepage.description=n8n: open-source workflow automation tool with 400+ integrations."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=n8n.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5678"
    #   - "homepage.server=localhost"

volumes:
  n8n_config:
  n8n_data:

networks:
  default:
    name: n8n_net
    driver: overlay
    attachable: true
