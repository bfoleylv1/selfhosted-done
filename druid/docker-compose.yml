# druid - docker compose (single host)
# image verified to exist at generation time: apache/druid:31.0.0

services:
  druid:
    image: apache/druid:31.0.0
    container_name: druid
    restart: unless-stopped
    ports:
      - "20053:20053"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20053 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=druid"
    #   - "homepage.description=druid self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=druid.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20053"
    #   - "homepage.server=localhost"

networks:
  default:
    name: druid_net
