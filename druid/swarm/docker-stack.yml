# druid - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml druid
# image verified to exist at generation time: apache/druid:31.0.0

services:
  druid:
    image: apache/druid:31.0.0
    ports:
      - target: 20053
        published: 20053
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - druid_config:/config
      - druid_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20053 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=druid"
    #   - "homepage.description=Real-time analytics database (OLAP).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=druid.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20053"
    #   - "homepage.server=localhost"

volumes:
  druid_config:
  druid_data:

networks:
  default:
    name: druid_net
    driver: overlay
    attachable: true
