# medusa - docker compose (single host)
# image verified to exist at generation time: lscr.io/linuxserver/medusa:latest

services:
  medusa:
    image: lscr.io/linuxserver/medusa:latest
    container_name: medusa
    restart: unless-stopped
    ports:
      - "8081:9000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || wget -qO- http://127.0.0.1:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=medusa"
    #   - "homepage.description=Alternative to Sonarr; PVR for TV shows with extensive customization.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=medusa.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8081"
    #   - "homepage.server=localhost"

networks:
  default:
    name: medusa_net
