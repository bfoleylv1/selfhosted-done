# radicale - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml radicale
# image verified to exist at generation time: tomsquest/docker-radicale:latest

services:
  radicale:
    image: tomsquest/docker-radicale:latest
    ports:
      - target: 5232
        published: 5232
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - radicale_config:/config
      - radicale_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5232 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=radicale"
    #   - "homepage.description=Simple CalDAV and CardDAV server.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=radicale.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5232"
    #   - "homepage.server=localhost"

volumes:
  radicale_config:
  radicale_data:

networks:
  default:
    name: radicale_net
    driver: overlay
    attachable: true
