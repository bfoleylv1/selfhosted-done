# radicale - docker compose (single host)
# image verified to exist at generation time: tomsquest/docker-radicale:latest

services:
  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: radicale
    restart: unless-stopped
    ports:
      - "5232:5232"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5232 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=radicale"
    #   - "homepage.description=Simple CalDAV and CardDAV server."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=radicale.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5232"
    #   - "homepage.server=localhost"

networks:
  default:
    name: radicale_net
