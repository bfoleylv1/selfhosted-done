# storj - docker compose (single host)
# image verified to exist at generation time: storjlabs/storagenode:latest

services:
  storj:
    image: storjlabs/storagenode:latest
    container_name: storj
    restart: unless-stopped
    ports:
      - "14002:14002"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 14002 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=storj"
    #   - "homepage.description=Decentralized cloud storage; peer-to-peer storage network.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=storj.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:14002"
    #   - "homepage.server=localhost"

networks:
  default:
    name: storj_net
