# storj - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml storj
# image verified to exist at generation time: storjlabs/storagenode:latest

services:
  storj:
    image: storjlabs/storagenode:latest
    ports:
      - target: 14002
        published: 14002
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - storj_config:/config
      - storj_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 14002 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=storj"
    #   - "homepage.description=storj self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=storj.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:14002"
    #   - "homepage.server=localhost"

volumes:
  storj_config:
  storj_data:

networks:
  default:
    name: storj_net
    driver: overlay
    attachable: true
