# svix - docker compose (single host)
# image verified to exist at generation time: svix/svix-server:latest

services:
  svix:
    image: svix/svix-server:latest
    container_name: svix
    restart: unless-stopped
    ports:
      - "8071:8071"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8071 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=svix"
    #   - "homepage.description=svix self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=svix.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8071"
    #   - "homepage.server=localhost"

networks:
  default:
    name: svix_net
