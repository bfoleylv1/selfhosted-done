# pgadmin - docker compose (single host)
# image verified to exist at generation time: dpage/pgadmin4:latest

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "20199:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pgadmin"
    #   - "homepage.description=Web-based PostgreSQL database management tool; GUI for PostgreSQL.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pgadmin.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20199"
    #   - "homepage.server=localhost"

networks:
  default:
    name: pgadmin_net
