# pgadmin - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml pgadmin
# image verified to exist at generation time: dpage/pgadmin4:latest

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - target: 80
        published: 20199
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - pgadmin_config:/config
      - pgadmin_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pgadmin"
    #   - "homepage.description=Web-based PostgreSQL database management tool; GUI for PostgreSQL.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pgadmin.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20199"
    #   - "homepage.server=localhost"

volumes:
  pgadmin_config:
  pgadmin_data:

networks:
  default:
    name: pgadmin_net
    driver: overlay
    attachable: true
