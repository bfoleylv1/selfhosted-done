# zomboyin - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  zomboyin:
    image: alpine:3.20
    container_name: zomboyin
    restart: unless-stopped
    ports:
      - "20389:20389"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20389 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zomboyin"
    #   - "homepage.description=zomboyin self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zomboyin.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20389"
    #   - "homepage.server=localhost"

networks:
  default:
    name: zomboyin_net
