# rclone - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml rclone
# image verified to exist at generation time: rclone/rclone:latest

services:
  rclone:
    image: rclone/rclone:latest
    ports:
      - target: 5572
        published: 5572
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - rclone_config:/config
      - rclone_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5572 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rclone"
    #   - "homepage.description=Command-line program for syncing files and directories to cloud storage."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rclone.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5572"
    #   - "homepage.server=localhost"

volumes:
  rclone_config:
  rclone_data:

networks:
  default:
    name: rclone_net
    driver: overlay
    attachable: true
