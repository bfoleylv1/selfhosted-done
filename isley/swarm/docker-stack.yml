# isley - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml isley
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: dwot/isley:latest
    environment:
    - TZ=America/Los_Angeles
    volumes:
    - isley_isley_data_isley_db:/app/data
    - isley_isley_data_isley_uploads:/app/uploads
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - isley
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 8080
      published: 20583
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=isley"
    #   - "homepage.description=isley self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=isley.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20583"
    #   - "homepage.server=localhost"
volumes:
  isley_isley_data_isley_db: null
  isley_isley_data_isley_uploads: null
networks:
  default:
    name: isley_net
    driver: overlay
    attachable: true
