# pihole - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml pihole
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: pihole/pihole:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - pihole_pihole_data_etc_pihole:/etc/pihole
    - pihole_pihole_data_etc_dnsmasq_d:/etc/dnsmasq.d
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - pihole-FTL
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 80
      published: 20600
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pihole"
    #   - "homepage.description=pihole self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pihole.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20600"
    #   - "homepage.server=localhost"
volumes:
  pihole_pihole_data_etc_pihole: null
  pihole_pihole_data_etc_dnsmasq_d: null
networks:
  default:
    name: pihole_net
    driver: overlay
    attachable: true
