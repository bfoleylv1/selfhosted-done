# health-checker - docker compose (single host)
# image verified to exist at generation time: lscr.io/linuxserver/healthchecks:latest

services:
  health-checker:
    image: lscr.io/linuxserver/healthchecks:latest
    container_name: health-checker
    restart: unless-stopped
    ports:
      - "20110:20110"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20110 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
