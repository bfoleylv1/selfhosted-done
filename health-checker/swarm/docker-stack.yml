# health-checker - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml health-checker
# image verified to exist at generation time: lscr.io/linuxserver/healthchecks:latest

services:
  health-checker:
    image: lscr.io/linuxserver/healthchecks:latest
    ports:
      - target: 20110
        published: 20110
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - health-checker_config:/config
      - health-checker_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20110 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=health-checker"
    #   - "homepage.description=health-checker self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=health-checker.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20110"
    #   - "homepage.server=localhost"

volumes:
  health-checker_config:
  health-checker_data:

networks:
  default:
    name: health-checker_net
    driver: overlay
    attachable: true
