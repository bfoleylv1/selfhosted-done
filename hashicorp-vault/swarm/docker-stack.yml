# hashicorp-vault - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml hashicorp-vault
# image verified to exist at generation time: hashicorp/vault:latest

services:
  hashicorp-vault:
    image: hashicorp/vault:latest
    ports:
      - target: 20109
        published: 20109
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - hashicorp-vault_config:/config
      - hashicorp-vault_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20109 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=hashicorp-vault"
    #   - "homepage.description=Secrets management and encryption; secure key storage.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=hashicorp-vault.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20109"
    #   - "homepage.server=localhost"

volumes:
  hashicorp-vault_config:
  hashicorp-vault_data:

networks:
  default:
    name: hashicorp-vault_net
    driver: overlay
    attachable: true
