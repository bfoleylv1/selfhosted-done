# hashicorp-vault - docker compose (single host)
# image verified to exist at generation time: hashicorp/vault:latest

services:
  hashicorp-vault:
    image: hashicorp/vault:latest
    container_name: hashicorp-vault
    restart: unless-stopped
    ports:
      - "20109:20109"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20109 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=hashicorp-vault"
    #   - "homepage.description=Secrets management and encryption; secure key storage."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=hashicorp-vault.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20109"
    #   - "homepage.server=localhost"

networks:
  default:
    name: hashicorp-vault_net
