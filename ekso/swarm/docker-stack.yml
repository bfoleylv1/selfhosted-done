# ekso - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml ekso
# image verified to exist at generation time: alpine:3.20

services:
  ekso:
    image: alpine:3.20
    ports:
      - target: 20057
        published: 20057
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ekso_config:/config
      - ekso_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20057 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=ekso"
    #   - "homepage.description=Self-hosted service."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=ekso.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20057"
    #   - "homepage.server=localhost"

volumes:
  ekso_config:
  ekso_data:

networks:
  default:
    name: ekso_net
    driver: overlay
    attachable: true
