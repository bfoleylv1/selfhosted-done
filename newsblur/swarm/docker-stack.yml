# newsblur - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml newsblur
# image verified to exist at generation time: python:3.11-slim

services:
  newsblur:
    image: python:3.11-slim
    ports:
      - target: 20163
        published: 20163
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - newsblur_config:/config
      - newsblur_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20163 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=newsblur"
    #   - "homepage.description=News reader with smart filtering; self-hosted version for news aggregation."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=newsblur.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20163"
    #   - "homepage.server=localhost"

volumes:
  newsblur_config:
  newsblur_data:

networks:
  default:
    name: newsblur_net
    driver: overlay
    attachable: true
