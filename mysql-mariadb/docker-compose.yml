# mysql-mariadb - docker compose (single host)
# image verified to exist at generation time: mariadb:11

services:
  mysql-mariadb:
    image: mariadb:11
    container_name: mysql-mariadb
    restart: unless-stopped
    ports:
      - "20161:20161"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20161 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mysql-mariadb"
    #   - "homepage.description=mysql-mariadb self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mysql-mariadb.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20161"
    #   - "homepage.server=localhost"

networks:
  default:
    name: mysql-mariadb_net
