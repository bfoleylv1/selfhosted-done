# tyk - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml tyk
# image verified to exist at generation time: tykio/tyk-gateway:latest

services:
  tyk:
    image: tykio/tyk-gateway:latest
    ports:
      - target: 20340
        published: 20340
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - tyk_config:/config
      - tyk_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20340 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=tyk"
    #   - "homepage.description=Open source API gateway; full lifecycle API management."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=tyk.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20340"
    #   - "homepage.server=localhost"

volumes:
  tyk_config:
  tyk_data:

networks:
  default:
    name: tyk_net
    driver: overlay
    attachable: true
