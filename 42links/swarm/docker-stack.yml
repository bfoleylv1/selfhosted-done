# 42links - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml 42links
# image verified to exist at generation time: node:20-alpine

services:
  42links:
    image: node:20-alpine
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - 42links_config:/config
      - 42links_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=42links"
    #   - "homepage.description=42links self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=42links.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8080"
    #   - "homepage.server=localhost"

volumes:
  42links_config:
  42links_data:

networks:
  default:
    name: 42links_net
    driver: overlay
    attachable: true
