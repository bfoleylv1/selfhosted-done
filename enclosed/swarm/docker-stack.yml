# enclosed - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml enclosed
# image verified to exist at generation time: ghcr.io/corentinth/enclosed:latest

services:
  enclosed:
    image: ghcr.io/corentinth/enclosed:latest
    ports:
      - target: 8787
        published: 8787
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - enclosed_config:/config
      - enclosed_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8787 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=enclosed"
    #   - "homepage.description=Self-hosted tool for sharing secrets and files securely."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=enclosed.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8787"
    #   - "homepage.server=localhost"

volumes:
  enclosed_config:
  enclosed_data:

networks:
  default:
    name: enclosed_net
    driver: overlay
    attachable: true
