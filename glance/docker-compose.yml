# glance - docker compose (single host)
# image verified to exist at generation time: glanceapp/glance:latest

services:
  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    ports:
      - "20094:20094"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20094 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=glance"
    #   - "homepage.description=glance self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=glance.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20094"
    #   - "homepage.server=localhost"

networks:
  default:
    name: glance_net
