# glance - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml glance
# image verified to exist at generation time: glanceapp/glance:latest

services:
  glance:
    image: glanceapp/glance:latest
    ports:
      - target: 20094
        published: 20094
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - glance_config:/config
      - glance_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20094 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=glance"
    #   - "homepage.description=Self-hosted dashboard for your homelab and services.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=glance.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20094"
    #   - "homepage.server=localhost"

volumes:
  glance_config:
  glance_data:

networks:
  default:
    name: glance_net
    driver: overlay
    attachable: true
