# lms - docker compose (single host)
# image verified to exist at generation time: lmscommunity/lyrionmusicserver:latest

services:
  lms:
    image: lmscommunity/lyrionmusicserver:latest
    container_name: lms
    restart: unless-stopped
    ports:
      - "20142:20142"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20142 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
