# lms - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml lms
# image verified to exist at generation time: lmscommunity/lyrionmusicserver:latest

services:
  lms:
    image: lmscommunity/lyrionmusicserver:latest
    ports:
      - target: 20142
        published: 20142
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - lms_config:/config
      - lms_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20142 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=lms"
    #   - "homepage.description=Frappe LMS: 100% open-source learning management system.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=lms.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20142"
    #   - "homepage.server=localhost"

volumes:
  lms_config:
  lms_data:

networks:
  default:
    name: lms_net
    driver: overlay
    attachable: true
