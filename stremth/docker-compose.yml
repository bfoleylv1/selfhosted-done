# stremth - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  stremth:
    image: alpine:3.20
    container_name: stremth
    restart: unless-stopped
    ports:
      - "20306:20306"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20306 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=stremth"
    #   - "homepage.description=Stream management and organization tool; acts as a media hub.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=stremth.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20306"
    #   - "homepage.server=localhost"

networks:
  default:
    name: stremth_net
