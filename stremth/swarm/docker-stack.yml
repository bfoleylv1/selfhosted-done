# stremth - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml stremth
# image verified to exist at generation time: alpine:3.20

services:
  stremth:
    image: alpine:3.20
    ports:
      - target: 20306
        published: 20306
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - stremth_config:/config
      - stremth_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20306 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=stremth"
    #   - "homepage.description=Stream management and organization tool; acts as a media hub."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=stremth.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20306"
    #   - "homepage.server=localhost"

volumes:
  stremth_config:
  stremth_data:

networks:
  default:
    name: stremth_net
    driver: overlay
    attachable: true
