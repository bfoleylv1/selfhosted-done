# trailbase - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml trailbase
# image verified to exist at generation time: trailbase/trailbase:latest

services:
  trailbase:
    image: trailbase/trailbase:latest
    ports:
      - target: 20333
        published: 20333
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - trailbase_config:/config
      - trailbase_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20333 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=trailbase"
    #   - "homepage.description=Open-source backend (auth + DB + API) written in Rust."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=trailbase.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20333"
    #   - "homepage.server=localhost"

volumes:
  trailbase_config:
  trailbase_data:

networks:
  default:
    name: trailbase_net
    driver: overlay
    attachable: true
