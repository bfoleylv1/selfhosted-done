# outline-vpn - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml outline-vpn
# image verified to exist at generation time: quay.io/outline/shadowbox:stable

services:
  outline-vpn:
    image: quay.io/outline/shadowbox:stable
    ports:
      - target: 20187
        published: 20187
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - outline-vpn_config:/config
      - outline-vpn_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20187 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=outline-vpn"
    #   - "homepage.description=outline-vpn self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=outline-vpn.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20187"
    #   - "homepage.server=localhost"

volumes:
  outline-vpn_config:
  outline-vpn_data:

networks:
  default:
    name: outline-vpn_net
    driver: overlay
    attachable: true
