# mailcow - docker compose (single host)
# image verified to exist at generation time: mailcow/rspamd:1.99

services:
  mailcow:
    image: mailcow/rspamd:1.99
    container_name: mailcow
    restart: unless-stopped
    ports:
      - "20147:80"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mailcow"
    #   - "homepage.description=Email solution; complete mail server suite."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mailcow.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20147"
    #   - "homepage.server=localhost"

networks:
  default:
    name: mailcow_net
