# library-genesis - docker compose (single host)
# image verified to exist at generation time: nginx:alpine

services:
  library-genesis:
    image: nginx:alpine
    container_name: library-genesis
    restart: unless-stopped
    ports:
      - "20140:20140"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20140 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=library-genesis"
    #   - "homepage.description=library-genesis self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=library-genesis.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20140"
    #   - "homepage.server=localhost"

networks:
  default:
    name: library-genesis_net
