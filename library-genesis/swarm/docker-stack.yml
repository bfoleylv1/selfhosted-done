# library-genesis - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml library-genesis
# image verified to exist at generation time: nginx:alpine

services:
  library-genesis:
    image: nginx:alpine
    ports:
      - target: 20140
        published: 20140
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - library-genesis_config:/config
      - library-genesis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20140 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=library-genesis"
    #   - "homepage.description=Digital library of books, articles, and academic papers."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=library-genesis.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20140"
    #   - "homepage.server=localhost"

volumes:
  library-genesis_config:
  library-genesis_data:

networks:
  default:
    name: library-genesis_net
    driver: overlay
    attachable: true
