# the-old-reader - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  the-old-reader:
    image: alpine:3.20
    container_name: the-old-reader
    restart: unless-stopped
    ports:
      - "20324:20324"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20324 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=the-old-reader"
    #   - "homepage.description=the-old-reader self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=the-old-reader.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20324"
    #   - "homepage.server=localhost"

networks:
  default:
    name: the-old-reader_net
