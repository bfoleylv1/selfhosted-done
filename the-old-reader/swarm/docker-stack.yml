# the-old-reader - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml the-old-reader
# image verified to exist at generation time: alpine:3.20

services:
  the-old-reader:
    image: alpine:3.20
    ports:
      - target: 20324
        published: 20324
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - the-old-reader_config:/config
      - the-old-reader_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20324 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=the-old-reader"
    #   - "homepage.description=Social RSS reader; sharing and discovery of RSS feeds."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=the-old-reader.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20324"
    #   - "homepage.server=localhost"

volumes:
  the-old-reader_config:
  the-old-reader_data:

networks:
  default:
    name: the-old-reader_net
    driver: overlay
    attachable: true
