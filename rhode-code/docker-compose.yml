# rhode-code - docker compose (single host)
# image verified to exist at generation time: python:3.11-slim

services:
  rhode-code:
    image: python:3.11-slim
    container_name: rhode-code
    restart: unless-stopped
    ports:
      - "20249:20249"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20249 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
