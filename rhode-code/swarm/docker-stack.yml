# rhode-code - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml rhode-code
# image verified to exist at generation time: python:3.11-slim

services:
  rhode-code:
    image: python:3.11-slim
    ports:
      - target: 20249
        published: 20249
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - rhode-code_config:/config
      - rhode-code_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20249 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=rhode-code"
    #   - "homepage.description=Source code management platform (Git/Mercurial/SVN)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=rhode-code.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20249"
    #   - "homepage.server=localhost"

volumes:
  rhode-code_config:
  rhode-code_data:

networks:
  default:
    name: rhode-code_net
    driver: overlay
    attachable: true
