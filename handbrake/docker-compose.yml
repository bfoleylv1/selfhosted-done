    #   - "homepage.description=Video transcoder; convert videos to optimized formats."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=handbrake.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:5800"
    #   - "homepage.server=localhost"

networks:
  default:
    name: handbrake_net
