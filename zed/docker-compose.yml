# zed - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  zed:
    image: alpine:3.20
    container_name: zed
    restart: unless-stopped
    ports:
      - "20381:20381"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20381 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zed"
    #   - "homepage.description=High-performance multiplayer code editor (server component).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zed.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20381"
    #   - "homepage.server=localhost"

networks:
  default:
    name: zed_net
