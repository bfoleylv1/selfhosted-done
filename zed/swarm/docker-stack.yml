# zed - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml zed
# image verified to exist at generation time: alpine:3.20

services:
  zed:
    image: alpine:3.20
    ports:
      - target: 20381
        published: 20381
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - zed_config:/config
      - zed_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20381 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=zed"
    #   - "homepage.description=High-performance multiplayer code editor (server component)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=zed.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20381"
    #   - "homepage.server=localhost"

volumes:
  zed_config:
  zed_data:

networks:
  default:
    name: zed_net
    driver: overlay
    attachable: true
