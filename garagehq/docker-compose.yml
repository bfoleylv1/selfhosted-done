# garagehq - docker compose (single host)
# image verified to exist at generation time: dxflrs/garage:v1.0.1

services:
  garagehq:
    image: dxflrs/garage:v1.0.1
    container_name: garagehq
    restart: unless-stopped
    ports:
      - "3900:3900"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3900 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=garagehq"
    #   - "homepage.description=Lightweight S3-compatible distributed object storage.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=garagehq.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:3900"
    #   - "homepage.server=localhost"

networks:
  default:
    name: garagehq_net
