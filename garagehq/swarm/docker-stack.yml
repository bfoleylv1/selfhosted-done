# garagehq - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml garagehq
# image verified to exist at generation time: dxflrs/garage:v1.0.1

services:
  garagehq:
    image: dxflrs/garage:v1.0.1
    ports:
      - target: 3900
        published: 3900
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - garagehq_config:/config
      - garagehq_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3900 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=garagehq"
    #   - "homepage.description=Lightweight S3-compatible distributed object storage.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=garagehq.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:3900"
    #   - "homepage.server=localhost"

volumes:
  garagehq_config:
  garagehq_data:

networks:
  default:
    name: garagehq_net
    driver: overlay
    attachable: true
