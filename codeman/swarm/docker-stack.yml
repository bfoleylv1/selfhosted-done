services:
  codeman:
    image: daicon001/codeman:latest
    ports:
    - target: 20426
      published: 20426
      protocol: tcp
      mode: ingress
    environment:
    - TZ=${TZ:-America/Los_Angeles}
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    volumes:
    - codeman_config:/config
    - codeman_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 20426 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
volumes:
  codeman_config: null
  codeman_data: null
networks:
  default:
    name: codeman_net
    driver: overlay
    attachable: true
