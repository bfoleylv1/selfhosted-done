# phpmyadmin - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml phpmyadmin
# image verified to exist at generation time: phpmyadmin:latest

services:
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - target: 80
        published: 20203
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - phpmyadmin_config:/config
      - phpmyadmin_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=phpmyadmin"
    #   - "homepage.description=Web interface for MySQL database management."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=phpmyadmin.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20203"
    #   - "homepage.server=localhost"

volumes:
  phpmyadmin_config:
  phpmyadmin_data:

networks:
  default:
    name: phpmyadmin_net
    driver: overlay
    attachable: true
