# audiobookshelf - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: app-audiobookshelf
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - ./audiobookshelf-data/app/config:/config
    - ./audiobookshelf-data/app/audiobooks:/audiobooks
    - ./audiobookshelf-data/app/podcasts:/podcasts
    - ./audiobookshelf-data/app/metadata:/metadata
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - audiobookshelf
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 20559:80
