# pingvin-share - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml pingvin-share
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: stonith404/pingvin-share:latest
    environment:
    - TRUST_PROXY=false
    - TZ=America/Los_Angeles
    volumes:
    - pingvin-share_pingvin_share_data_data:/opt/app/backend/data
    - pingvin-share_pingvin_share_data_images:/opt/app/frontend/public/img
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - caddy
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 3000
      published: 20601
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=pingvin-share"
    #   - "homepage.description=pingvin-share self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=pingvin-share.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20601"
    #   - "homepage.server=localhost"
volumes:
  pingvin-share_pingvin_share_data_data: null
  pingvin-share_pingvin_share_data_images: null
networks:
  default:
    name: pingvin-share_net
    driver: overlay
    attachable: true
