# metager - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml metager
# image verified to exist at generation time: php:8.2-fpm

services:
  metager:
    image: php:8.2-fpm
    ports:
      - target: 20153
        published: 20153
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - metager_config:/config
      - metager_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20153 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=metager"
    #   - "homepage.description=German metasearch engine; privacy-focused search results.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=metager.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20153"
    #   - "homepage.server=localhost"

volumes:
  metager_config:
  metager_data:

networks:
  default:
    name: metager_net
    driver: overlay
    attachable: true
