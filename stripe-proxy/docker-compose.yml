# stripe-proxy - docker compose (single host)
# image verified to exist at generation time: node:20-alpine

services:
  stripe-proxy:
    image: node:20-alpine
    container_name: stripe-proxy
    restart: unless-stopped
    ports:
      - "20307:20307"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20307 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=stripe-proxy"
    #   - "homepage.description=Proxy for the Stripe payment API.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=stripe-proxy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20307"
    #   - "homepage.server=localhost"

networks:
  default:
    name: stripe-proxy_net
