# kentico - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml kentico
# image verified to exist at generation time: mcr.microsoft.com/dotnet/aspnet:8.0

services:
  kentico:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    ports:
      - target: 20124
        published: 20124
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - kentico_config:/config
      - kentico_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20124 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=kentico"
    #   - "homepage.description=All-in-one CMS; e-commerce and online marketing platform.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=kentico.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20124"
    #   - "homepage.server=localhost"

volumes:
  kentico_config:
  kentico_data:

networks:
  default:
    name: kentico_net
    driver: overlay
    attachable: true
