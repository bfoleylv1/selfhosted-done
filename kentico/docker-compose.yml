# kentico - docker compose (single host)
# image verified to exist at generation time: mcr.microsoft.com/dotnet/aspnet:8.0

services:
  kentico:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: kentico
    restart: unless-stopped
    ports:
      - "20124:20124"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20124 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=kentico"
    #   - "homepage.description=kentico self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=kentico.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20124"
    #   - "homepage.server=localhost"

networks:
  default:
    name: kentico_net
