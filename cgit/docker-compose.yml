# cgit - docker compose (single host)
# image verified to exist at generation time: alpine:3.20

services:
  cgit:
    image: alpine:3.20
    container_name: cgit
    restart: unless-stopped
    ports:
      - "20027:20027"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20027 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=cgit"
    #   - "homepage.description=Lightweight web frontend for Git repositories."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=cgit.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20027"
    #   - "homepage.server=localhost"

networks:
  default:
    name: cgit_net
