# smederee - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml smederee
# image verified to exist at generation time: alpine:3.20

services:
  smederee:
    image: alpine:3.20
    ports:
      - target: 20284
        published: 20284
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - smederee_config:/config
      - smederee_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20284 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=smederee"
    #   - "homepage.description=Placeholder entry — no real upstream image configured (generic base image only); not yet implemented."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=smederee.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20284"
    #   - "homepage.server=localhost"

volumes:
  smederee_config:
  smederee_data:

networks:
  default:
    name: smederee_net
    driver: overlay
    attachable: true
