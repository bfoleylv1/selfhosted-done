services:
  enigma-bbs:
    image: davestephens/enigma-bbs:latest
    ports:
    - target: 20439
      published: 20439
      protocol: tcp
      mode: ingress
    environment:
    - TZ=${TZ:-America/Los_Angeles}
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    volumes:
    - enigma-bbs_config:/config
    - enigma-bbs_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 20439 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
volumes:
  enigma-bbs_config: null
  enigma-bbs_data: null
networks:
  default:
    name: enigma-bbs_net
    driver: overlay
    attachable: true
