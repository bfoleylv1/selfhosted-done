# minio - docker compose (single host)
# image verified to exist at generation time: quay.io/minio/minio:latest

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "20157:9000"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || wget -qO- http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=minio"
    #   - "homepage.description=High-performance object storage; S3-compatible.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=minio.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20157"
    #   - "homepage.server=localhost"

networks:
  default:
    name: minio_net
