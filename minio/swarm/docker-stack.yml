# minio - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml minio
# image verified to exist at generation time: quay.io/minio/minio:latest

services:
  minio:
    image: quay.io/minio/minio:latest
    ports:
      - target: 9000
        published: 20157
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - minio_config:/config
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || wget -qO- http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=minio"
    #   - "homepage.description=High-performance object storage; S3-compatible."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=minio.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20157"
    #   - "homepage.server=localhost"

volumes:
  minio_config:
  minio_data:

networks:
  default:
    name: minio_net
    driver: overlay
    attachable: true
