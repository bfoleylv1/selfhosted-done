# text-gen-inference - docker compose (single host)
# image verified to exist at generation time: ghcr.io/huggingface/text-generation-inference:latest

services:
  text-gen-inference:
    image: ghcr.io/huggingface/text-generation-inference:latest
    container_name: text-gen-inference
    restart: unless-stopped
    ports:
      - "20323:20323"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20323 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=text-gen-inference"
    #   - "homepage.description=Text generation inference server for LLMs (HuggingFace TGI).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=text-gen-inference.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20323"
    #   - "homepage.server=localhost"

networks:
  default:
    name: text-gen-inference_net
