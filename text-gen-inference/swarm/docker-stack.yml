# text-gen-inference - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml text-gen-inference
# image verified to exist at generation time: ghcr.io/huggingface/text-generation-inference:latest

services:
  text-gen-inference:
    image: ghcr.io/huggingface/text-generation-inference:latest
    ports:
      - target: 20323
        published: 20323
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - text-gen-inference_config:/config
      - text-gen-inference_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20323 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=text-gen-inference"
    #   - "homepage.description=Text generation inference server for LLMs (HuggingFace TGI).""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=text-gen-inference.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20323"
    #   - "homepage.server=localhost"

volumes:
  text-gen-inference_config:
  text-gen-inference_data:

networks:
  default:
    name: text-gen-inference_net
    driver: overlay
    attachable: true
