# homepage - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml homepage
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: ghcr.io/gethomepage/homepage:latest
    environment:
    - HOMEPAGE_ALLOWED_HOSTS=localhost
    volumes:
    - homepage_homepage_data_config:/app/config
    - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - next-server
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 3000
      published: 20582
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=homepage"
    #   - "homepage.description=homepage self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=homepage.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20582"
    #   - "homepage.server=localhost"
volumes:
  homepage_homepage_data_config: null
networks:
  default:
    name: homepage_net
    driver: overlay
    attachable: true
