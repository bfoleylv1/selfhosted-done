# prime-agent - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml prime-agent
# image verified to exist at generation time: prime-agent/prime-agent:latest

services:
  prime-agent:
    # image: prime-agent/prime-agent:latest  # UNVERIFIED
    ports:
      - target: 20523
        published: 20523
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - prime-agent_config:/config
      - prime-agent_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20523 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=prime-agent"
    #   - "homepage.description=prime-agent self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=prime-agent.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20523"
    #   - "homepage.server=localhost"

volumes:
  prime-agent_config:
  prime-agent_data:

networks:
  default:
    name: prime-agent_net
    driver: overlay
    attachable: true
