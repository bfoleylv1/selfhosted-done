# caddy - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml caddy
# image verified to exist at generation time: caddy:alpine

services:
  caddy:
    image: caddy:alpine
    ports:
      - target: 80
        published: 20022
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - caddy_config:/config
      - caddy_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=caddy"
    #   - "homepage.description=Easy to run HTTP web server; automatic HTTPS and simple configuration."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=caddy.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20022"
    #   - "homepage.server=localhost"

volumes:
  caddy_config:
  caddy_data:

networks:
  default:
    name: caddy_net
    driver: overlay
    attachable: true
