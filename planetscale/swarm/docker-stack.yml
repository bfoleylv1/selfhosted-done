# planetscale - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml planetscale
# image verified to exist at generation time: vitess/lite:latest

services:
  planetscale:
    image: vitess/lite:latest
    ports:
      - target: 15000
        published: 15000
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - planetscale_config:/config
      - planetscale_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 15000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=planetscale"
    #   - "homepage.description=Serverless MySQL platform; branchable databases."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=planetscale.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:15000"
    #   - "homepage.server=localhost"

volumes:
  planetscale_config:
  planetscale_data:

networks:
  default:
    name: planetscale_net
    driver: overlay
    attachable: true
