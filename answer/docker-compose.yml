# answer - docker compose (single host)
# image verified to exist at generation time: answerdev/answer:latest

services:
  answer:
    image: answerdev/answer:latest
    container_name: answer
    restart: unless-stopped
    ports:
      - "20411:20411"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20411 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=answer"
    #   - "homepage.description=Answer: open-source knowledge management and Q&A platform (Stack Overflow alternative)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=answer.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20411"
    #   - "homepage.server=localhost"

networks:
  default:
    name: answer_net
