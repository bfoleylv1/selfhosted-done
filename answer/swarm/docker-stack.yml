# answer - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml answer
# image verified to exist at generation time: answerdev/answer:latest

services:
  answer:
    image: answerdev/answer:latest
    ports:
      - target: 20411
        published: 20411
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - answer_config:/config
      - answer_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20411 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=answer"
    #   - "homepage.description=Answer: open-source knowledge management and Q&A platform (Stack Overflow alternative)."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=answer.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20411"
    #   - "homepage.server=localhost"

volumes:
  answer_config:
  answer_data:

networks:
  default:
    name: answer_net
    driver: overlay
    attachable: true
