# next-explorer - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml next-explorer
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: nxzai/explorer:latest
    dns:
    - 9.9.9.9
    environment:
    - NODE_ENV=production
    - PUBLIC_URL=http://localhost:20595
    - SESSION_SECRET=your-super-secret
    - PUID=1000
    - PGID=1000
    volumes:
    - next-explorer_config:/config
    - next-explorer_cache:/cache
    - next-explorer_home_root_data:/mnt/Files
    ports:
    - target: 3000
      published: 20595
      protocol: tcp
      mode: ingress
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:3000/ || wget -qO- http://127.0.0.1:3000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=next-explorer"
    #   - "homepage.description=next-explorer self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=next-explorer.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20595"
    #   - "homepage.server=localhost"
volumes:
  next-explorer_config: null
  next-explorer_cache: null
  next-explorer_home_root_data: null
networks:
  default:
    name: next-explorer_net
    driver: overlay
    attachable: true
