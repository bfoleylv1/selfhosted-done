# private-gpt - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml private-gpt
# image verified to exist at generation time: 3x3cut0r/privategpt:latest

services:
  private-gpt:
    image: 3x3cut0r/privategpt:latest
    ports:
      - target: 20220
        published: 20220
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - private-gpt_config:/config
      - private-gpt_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20220 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=private-gpt"
    #   - "homepage.description=private-gpt self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=private-gpt.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20220"
    #   - "homepage.server=localhost"

volumes:
  private-gpt_config:
  private-gpt_data:

networks:
  default:
    name: private-gpt_net
    driver: overlay
    attachable: true
