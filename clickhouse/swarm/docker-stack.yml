# clickhouse - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml clickhouse
# image verified to exist at generation time: clickhouse/clickhouse-server:latest

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - target: 8123
        published: 8123
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # - NVIDIA_DRIVER_CAPABILITIES=all
      # - NVIDIA_VISIBLE_DEVICES=all
      # - ONEAPI_DEVICE_SELECTOR=*        # Intel iGPU/Arc OpenVINO
      # - ZES_ENABLE_SYSMAN=1
    volumes:
      - clickhouse_config:/config
      - clickhouse_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8123/ping || wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
          # - node.role == manager
          # GPU: add node-generic-resources to daemon.json and:
          #   - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
      # GPU: swarm ignores `devices:`/`runtime:`. Declare in
      #   /etc/docker/daemon.json: "node-generic-resources": ["gpu=1"]
      #   then use deploy.resources.reservations.generic_resources.
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=clickhouse"
    #   - "homepage.description=Column-oriented database management system for OLAP and analytical workloads.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=clickhouse.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8123"
    #   - "homepage.server=localhost"

volumes:
  clickhouse_config:
  clickhouse_data:

networks:
  default:
    name: clickhouse_net
    driver: overlay
    attachable: true
