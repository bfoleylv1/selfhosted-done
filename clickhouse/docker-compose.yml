# clickhouse - docker compose (single host)
# image verified to exist at generation time: clickhouse/clickhouse-server:latest

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8123/ping || wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Database Management"
    #   - "homepage.name=clickhouse"
    #   - "homepage.description=Column-oriented database management system for OLAP and analytical workloads."
    #   - "homepage.tags=Database Management"
    #   - "homepage.icon=clickhouse.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8123"
    #   - "homepage.server=localhost"

networks:
  default:
    name: clickhouse_net
