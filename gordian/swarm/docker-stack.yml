# gordian - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml gordian
# image verified to exist at generation time: alpine:3.20

services:
  gordian:
    image: alpine:3.20
    ports:
      - target: 20101
        published: 20101
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - gordian_config:/config
      - gordian_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20101 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=gordian"
    #   - "homepage.description=Self-hosted service."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=gordian.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20101"
    #   - "homepage.server=localhost"

volumes:
  gordian_config:
  gordian_data:

networks:
  default:
    name: gordian_net
    driver: overlay
    attachable: true
