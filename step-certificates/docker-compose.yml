# step-certificates - docker compose (single host)
# image verified to exist at generation time: smallstep/step-ca:latest

services:
  step-certificates:
    image: smallstep/step-ca:latest
    container_name: step-certificates
    restart: unless-stopped
    ports:
      - "20301:20301"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20301 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=step-certificates"
    #   - "homepage.description=Private CA; X.509 PKI and ACME server."""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=step-certificates.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20301"
    #   - "homepage.server=localhost"

networks:
  default:
    name: step-certificates_net
