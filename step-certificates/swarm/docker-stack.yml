# step-certificates - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml step-certificates
# image verified to exist at generation time: smallstep/step-ca:latest

services:
  step-certificates:
    image: smallstep/step-ca:latest
    ports:
      - target: 20301
        published: 20301
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - step-certificates_config:/config
      - step-certificates_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20301 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=step-certificates"
    #   - "homepage.description=step-certificates self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=step-certificates.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20301"
    #   - "homepage.server=localhost"

volumes:
  step-certificates_config:
  step-certificates_data:

networks:
  default:
    name: step-certificates_net
    driver: overlay
    attachable: true
