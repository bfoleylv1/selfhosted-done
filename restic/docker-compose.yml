# restic - docker compose (single host)
# image verified to exist at generation time: restic/restic:latest

services:
  restic:
    image: restic/restic:latest
    container_name: restic
    restart: unless-stopped
    ports:
      - "20243:20243"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20243 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=restic"
    #   - "homepage.description=restic self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=restic.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20243"
    #   - "homepage.server=localhost"

networks:
  default:
    name: restic_net
