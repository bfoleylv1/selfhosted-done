# restic - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml restic
# image verified to exist at generation time: restic/restic:latest

services:
  restic:
    image: restic/restic:latest
    ports:
      - target: 20243
        published: 20243
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - restic_config:/config
      - restic_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20243 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=restic"
    #   - "homepage.description=restic self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=restic.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20243"
    #   - "homepage.server=localhost"

volumes:
  restic_config:
  restic_data:

networks:
  default:
    name: restic_net
    driver: overlay
    attachable: true
