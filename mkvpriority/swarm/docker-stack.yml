# mkvpriority - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml mkvpriority
# image verified to exist at generation time: hacdiaz/mkvprofile:latest

services:
  mkvpriority:
    # image: hacdiaz/mkvprofile:latest  # UNVERIFIED
    ports:
      - target: 20479
        published: 20479
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - mkvpriority_config:/config
      - mkvpriority_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20479 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mkvpriority"
    #   - "homepage.description=mkvpriority self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mkvpriority.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20479"
    #   - "homepage.server=localhost"

volumes:
  mkvpriority_config:
  mkvpriority_data:

networks:
  default:
    name: mkvpriority_net
    driver: overlay
    attachable: true
