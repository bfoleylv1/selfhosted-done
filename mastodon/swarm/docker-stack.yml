# mastodon - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml mastodon
# image verified to exist at generation time: ghcr.io/mastodon/mastodon:latest

services:
  mastodon:
    image: ghcr.io/mastodon/mastodon:latest
    ports:
      - target: 3000
        published: 20151
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - mastodon_config:/config
      - mastodon_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/v1/instance || wget -qO- http://127.0.0.1:3000/api/v1/instance || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=mastodon"
    #   - "homepage.description=Server for Twitter-like microblogging; federated social network."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=mastodon.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20151"
    #   - "homepage.server=localhost"

volumes:
  mastodon_config:
  mastodon_data:

networks:
  default:
    name: mastodon_net
    driver: overlay
    attachable: true
