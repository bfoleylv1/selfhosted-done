# sonarr - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml sonarr
# image verified to exist at generation time: lscr.io/linuxserver/sonarr:latest

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    ports:
      - target: 8989
        published: 8989
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - sonarr_config:/config
      - sonarr_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/ || wget -qO- http://127.0.0.1:8989/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=sonarr"
    #   - "homepage.description=PVR for TV shows; manages and automatically downloads series episodes.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=sonarr.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8989"
    #   - "homepage.server=localhost"

volumes:
  sonarr_config:
  sonarr_data:

networks:
  default:
    name: sonarr_net
    driver: overlay
    attachable: true
