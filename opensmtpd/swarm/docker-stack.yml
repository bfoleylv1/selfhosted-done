# opensmtpd - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml opensmtpd
# image verified to exist at generation time: debian:12-slim

services:
  opensmtpd:
    image: debian:12-slim
    ports:
      - target: 20182
        published: 20182
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - opensmtpd_config:/config
      - opensmtpd_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20182 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=opensmtpd"
    #   - "homepage.description=SMTP server; OpenBSD's mail server."""""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=opensmtpd.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20182"
    #   - "homepage.server=localhost"

volumes:
  opensmtpd_config:
  opensmtpd_data:

networks:
  default:
    name: opensmtpd_net
    driver: overlay
    attachable: true
