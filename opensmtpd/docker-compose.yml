# opensmtpd - docker compose (single host)
# image verified to exist at generation time: debian:12-slim

services:
  opensmtpd:
    image: debian:12-slim
    container_name: opensmtpd
    restart: unless-stopped
    ports:
      - "20182:20182"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20182 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=opensmtpd"
    #   - "homepage.description=SMTP server; OpenBSD's mail server.""
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=opensmtpd.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20182"
    #   - "homepage.server=localhost"

networks:
  default:
    name: opensmtpd_net
