# directus - docker compose (single host)
# image verified to exist at generation time: directus/directus:latest

services:
  directus:
    image: directus/directus:latest
    container_name: directus
    restart: unless-stopped
    ports:
      - "8055:8055"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8055/server/health || wget -qO- http://127.0.0.1:8055/server/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=directus"
    #   - "homepage.description=directus self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=directus.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8055"
    #   - "homepage.server=localhost"

networks:
  default:
    name: directus_net
