# directus - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml directus
# image verified to exist at generation time: directus/directus:latest

services:
  directus:
    image: directus/directus:latest
    ports:
      - target: 8055
        published: 8055
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - directus_config:/config
      - directus_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8055/server/health || wget -qO- http://127.0.0.1:8055/server/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=directus"
    #   - "homepage.description=directus self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=directus.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:8055"
    #   - "homepage.server=localhost"

volumes:
  directus_config:
  directus_data:

networks:
  default:
    name: directus_net
    driver: overlay
    attachable: true
