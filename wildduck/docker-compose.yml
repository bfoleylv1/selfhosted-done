# wildduck - docker compose (single host)
# image verified to exist at generation time: nodemailer/wildduck:latest

services:
  wildduck:
    image: nodemailer/wildduck:latest
    container_name: wildduck
    restart: unless-stopped
    ports:
      - "20365:20365"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20365 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=wildduck"
    #   - "homepage.description=IMAP/POP3 mail server written in Node.js."""""
    #   - "homepage.tags=Self Hosting Solutions"
