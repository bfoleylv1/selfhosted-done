# swingmx - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml swingmx
# ported from the upstream ScaleTail definition; tailscale sidecar removed

services:
  application:
    image: ghcr.io/swingmx/swingmusic:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - swingmx_swingmusic_data_app_config:/config
    - swingmx_path_to_music:/music
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - swingmusic
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 1970
      published: 1970
      protocol: tcp
      mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=swingmx"
    #   - "homepage.description=swingmx self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=swingmx.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:1970"
    #   - "homepage.server=localhost"
volumes:
  swingmx_swingmusic_data_app_config: null
  swingmx_path_to_music: null
networks:
  default:
    name: swingmx_net
    driver: overlay
    attachable: true
