# swingmx - docker compose (single host)
# ported from the upstream ScaleTail definition; tailscale sidecar removed
# image verified against its registry at generation time

services:
  application:
    image: ghcr.io/swingmx/swingmusic:latest
    container_name: app-swingmusic
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Los_Angeles
    volumes:
    - ./swingmusic-data/app/config:/config
    - /path/to/music:/music
    healthcheck:
      test:
      - CMD
      - pgrep
      - -f
      - swingmusic
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    ports:
    - 1970:1970
