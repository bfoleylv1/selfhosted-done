# samba - docker compose (single host)
# image verified to exist at generation time: dperson/samba:latest

services:
  samba:
    image: dperson/samba:latest
    container_name: samba
    restart: unless-stopped
    ports:
      - "20265:445"
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 445 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=samba"
    #   - "homepage.description=samba self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=samba.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20265"
    #   - "homepage.server=localhost"

networks:
  default:
    name: samba_net
