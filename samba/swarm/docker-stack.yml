# samba - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml samba
# image verified to exist at generation time: dperson/samba:latest

services:
  samba:
    image: dperson/samba:latest
    ports:
      - target: 445
        published: 20265
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - samba_config:/config
      - samba_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 445 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=samba"
    #   - "homepage.description=samba self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=samba.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20265"
    #   - "homepage.server=localhost"

volumes:
  samba_config:
  samba_data:

networks:
  default:
    name: samba_net
    driver: overlay
    attachable: true
