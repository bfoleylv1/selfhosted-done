# octobox - docker swarm stack
# deploy: docker stack deploy -c docker-stack.yml octobox
# image verified to exist at generation time: octobox/octobox:latest

services:
  octobox:
    # image: octobox/octobox:latest  # UNVERIFIED
    ports:
      - target: 20484
        published: 20484
        protocol: tcp
        mode: ingress
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - octobox_config:/config
      - octobox_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 20484 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.os == linux
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 2G
    # labels:
    #   - "homepage.group=Self Hosted"
    #   - "homepage.name=octobox"
    #   - "homepage.description=octobox self-hosted service."
    #   - "homepage.tags=Self Hosting Solutions"
    #   - "homepage.icon=octobox.png"
    #   - "homepage.href=http://${HOST_IP:-localhost}:20484"
    #   - "homepage.server=localhost"

volumes:
  octobox_config:
  octobox_data:

networks:
  default:
    name: octobox_net
    driver: overlay
    attachable: true
